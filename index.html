function W(){ return (meta.lang && meta.lang!=="ru" && WHY[meta.lang]) ? WHY[meta.lang] : (meta.lang && meta.lang!=="ru" ? WHY.en : WHY.ru); }

function classifyPair(uw,cw,cArr,j){
  const L=W();
  // «i gå» вместо «i går» — это другая форма слова; «i morgn» — просто опечатка
  if(cArr && j>0 && cArr[j-1]==="i" && TIMEW.has(cw) && (VERB_FORM[uw] || lev(uw,cw)>1))
    return {order:false, text:L.fixed_ph(uw,cw,"i "+cw)};
  if(PRON_CASE[uw]===cw) return {order:false, text:(SUBJ_PRON.has(cw)?L.pron_subj:L.pron_obj)(uw,cw)};
  const vu=VERB_FORM[uw],vc=VERB_FORM[cw];
  if(vu&&vc){
    if(vu[0]===vc[0]) return {order:false, text:L.verb_form(uw,cw,L.vt[vu[1]],L.vt[vc[1]],L.vtail[vc[1]])};
    return {order:false, text:L.verb_other(uw,cw)};
  }
  // «Hører!» вместо «Hør!»: разбор принимал это за множественное число существительного,
  // потому что повелительной формы нет в таблице глаголов. Ловим до разбора существительных.
  if(VERB_FORM[uw] && !VERB_FORM[cw] && (uw === cw + "r" || uw === cw + "er"))
    return {order:false, text:L.imper_form(uw,cw)};
  const nr=nounRel(uw,cw);
  if(nr) return {order:false, text:L[nr](uw,cw), noun:{got:uw, need:cw, kind:nr}};
  const au=ADJ_FORM[uw],ac=ADJ_FORM[cw];
  if(au&&ac&&au[0]===ac[0]) return {order:false, text:L.adj_form(uw,cw)};
  const du=DEG_FORM[uw],dc=DEG_FORM[cw];
  if(du&&dc&&du[0]===dc[0]) return {order:false, text:L.adj_degree(uw,cw)};
  if(ART.has(uw)&&ART.has(cw)) return {order:false, text:L.art_gender(uw,cw)};
  if(deAccent(uw)===deAccent(cw)) return {order:false, text:L.letter(uw,cw)};
  if(lev(uw,cw)<=1 && Math.max(uw.length,cw.length)>3) return {order:false, text:L.typo(uw,cw)};
  return {order:false, text:L.word(uw,cw)};
}
function classifyMiss(cw){
  const L=W();
  if(cw==="ikke") return {order:false, text:L.miss_ikke};
  if(cw==="skal") return {order:false, text:L.miss_skal};
  if(cw==="har") return {order:false, text:L.miss_har};
  if(cw==="å")   return {order:false, text:L.miss_aa};
  if(MODALS.has(cw)||FINITE.has(cw)) return {order:false, text:L.miss_aux(cw)};
  if(ART.has(cw)) return {order:false, text:L.miss_art(cw), art:true};
  return {order:false, text:L.miss_word(cw)};
}
function classifyExtra(uw,c){
  const L=W();
  if(uw==="ikke") return {order:false, text:(c&&c.indexOf("ikke")>=0)?L.dup_ikke:L.extra_ikke};
  if(uw==="å")    return {order:false, text:L.extra_aa};
  if(MODALS.has(uw)||FINITE.has(uw)) return {order:false, text:L.extra_aux(uw)};
  if(ART.has(uw)) return {order:false, text:L.extra_art(uw), art:true};
  return {order:false, text:L.extra_word(uw)};
}

function orderDiag(u,c){
  const L=W();
  const ui=u.indexOf("ikke"), ci=c.indexOf("ikke");
  if(ui>=0&&ci>=0&&ui!==ci){
    const nu=u.filter(function(w){return w!=="ikke";}).join(" ");
    const nc=c.filter(function(w){return w!=="ikke";}).join(" ");
    if(nu===nc) return {order:true, title:L.t_ikke, text:L.order_ikke(c[ci-1], c[ci+1])};
  }
  for(let i=0;i<c.length-1;i++){
    if(POSS.has(c[i+1]) && !POSS.has(c[i])){
      const pi=u.indexOf(c[i+1]);
      if(pi>=0 && pi<u.length-1 && pairRelated(u[pi+1],c[i]))
        return {order:true, title:L.t_ord, text:L.order_poss(c[i],c[i+1])};
    }
  }
  const vc=finiteIdx(c), vu=finiteIdx(u);
  if(vc>=1 && vu!==vc){
    const front=c.slice(0,vc).join(" ");
    if(c.length>vc+1 && SUBJ_ALL.has(c[vc+1])){
      const txt = QWORD.has(c[0]) ? L.order_qw(front,c[vc],c[vc+1]) : L.order_v2(front,c[vc],c[vc+1]);
      return {order:true, title:L.t_v2, text:txt, rule:true};
    }
    if(SUBJ_ALL.has(c[0])) return {order:true, title:L.t_ord, text:L.order_svo(c[0],c[vc]), rule:true};
  }
  if(vc===0&&vu!==0&&c.length>1) return {order:true, title:L.t_v2, text:L.order_q0(c[0],c[1]), rule:true};
  return {order:true, title:L.t_ord, text:L.order_gen, rule:true};
}

// полное соответствие слово-в-слово: те же слова, но другой порядок и/или формы
function bijection(u,c){
  if(u.length!==c.length) return null;
  const used=new Array(c.length).fill(false), pairs=[], left=[];
  u.forEach(function(w,i){
    let j=-1;
    for(let k=0;k<c.length;k++) if(!used[k]&&c[k]===w){ j=k; break; }
    if(j>=0){ used[j]=true; pairs.push([i,j]); } else left.push(i);
  });
  for(const i of left){
    let j=-1;
    for(let k=0;k<c.length;k++) if(!used[k]&&pairRelated(u[i],c[k])){ j=k; break; }
    if(j<0) return null;
    used[j]=true; pairs.push([i,j]);
  }
  return pairs.sort(function(a,b){ return a[0]-b[0]; });
}
function packItems(items,L){
  if(items.length===1) return items[0].text;
  if(items.length>3) return L.toomany;
  return L.many+'<ul class="why-list">'+items.map(function(i){return "<li>"+i.text+"</li>";}).join("")+"</ul>";
}

// Ошибку в форме существительного (en film / filmen) из русского не выведешь —
// поэтому в разборе объясняем не «какая форма», а почему именно эта: по роли слова.
// «Артикль en лишний» и «film — неопределённая форма» — одна ошибка, названная дважды.
// Если есть разбор формы слова, заметку про артикль убираем.
function dedupeArt(list){
  return list.some(function(x){ return x && x.noun; })
    ? list.filter(function(x){ return !(x && x.art); })
    : list;
}
function pickNoun(list){
  for(let i=0;i<list.length;i++) if(list[i] && list[i].noun) return list[i].noun;
  return null;
}
function nounRoleOf(sentence, word){
  const w = tokz(sentence);
  let idx = w.indexOf(word);
  if(idx < 0) return null;
  let k = idx - 1;
  while(k >= 0 && /^(det|den|de|hele|gamle|nye|store|lille|ny|nytt|gammel|stor|liten|lita)$/.test(w[k])) k--;
  if(k >= 0 && /^(i|pa|på|til|fra|med|om|under|over|ved|hos|etter|før|mellom|gjennom|uten|mot|av|innom)$/.test(w[k]))
    return 'prep';
  let vi = -1;
  for(let i=0;i<w.length;i++) if(isFiniteTok(w,i)){ vi = i; break; }
  if(vi < 0) return 'obj';
  if(idx < vi) return 'subj';
  const before = w.slice(0, vi);
  const between = w.slice(vi+1, idx);
  const subjBefore = before.some(function(x){ return /^(jeg|du|han|hun|vi|dere|de|det|man)$/.test(x); });
  if(!subjBefore && between.length === 0) return 'subj';
  return 'obj';
}

function diagnose(userRaw, correctRaw){
  const u=tokz(userRaw), c=tokz(correctRaw);
  if(!u.length||!c.length||u.join(" ")===c.join(" ")) return null;
  const L=W();

  const pairs=bijection(u,c);
  if(pairs){
    let ident=true;
    for(let k=1;k<pairs.length;k++) if(pairs[k][1]<pairs[k-1][1]) ident=false;
    const notes=[];
    pairs.forEach(function(p){ if(u[p[0]]!==c[p[1]]) notes.push(classifyPair(u[p[0]],c[p[1]],c,p[1])); });
    if(!ident){
      const d=orderDiag(u,c);
      d.noun = pickNoun(notes);
      const nts = dedupeArt(notes);
      if(nts.length) d.text += '<div class="why-also">'+packItems(nts,L)+'</div>';
      return d;
    }
    if(notes.length) return {order:false, title:L.t_err, text:packItems(dedupeArt(notes),L), noun:pickNoun(notes)};
  }

  const ops=alignOps(u,c);
  const missAt={}, extraAt={};
  ops.forEach(function(o,i){
    if(o.op==="miss"){ (missAt[o.c]=missAt[o.c]||[]).push(i); }
    if(o.op==="extra"){ (extraAt[o.u]=extraAt[o.u]||[]).push(i); }
  });
  Object.keys(missAt).forEach(function(w){
    if(!extraAt[w]) return;
    const n=Math.min(missAt[w].length, extraAt[w].length);
    for(let k=0;k<n;k++){ ops[missAt[w][k]].op="moved"; ops[extraAt[w][k]].op="drop"; }
  });

  const items=[]; let allOrder=true;
  ops.forEach(function(o){
    if(o.op==="eq"||o.op==="drop") return;
    if(o.op==="moved"){ items.push({order:true, text:L.moved(o.c)}); return; }
    let it;
    if(o.op==="sub") it=classifyPair(o.u,o.c,c,c.indexOf(o.c));
    else if(o.op==="miss") it=classifyMiss(o.c);
    else it=classifyExtra(o.u,c);
    items.push(it); allOrder=false;
  });
  if(!items.length) return null;

  if(allOrder){
    const d=orderDiag(u,c);
    if(items.length===1) d.text=items[0].text;
    d.noun = pickNoun(items);
    return d;
  }
  return {order:false, title:L.t_err, text:packItems(dedupeArt(items),L), noun:pickNoun(items)};
}

function escHT(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function icp(s){
  return s.replace(/<(CH|KB|HD|SD|MC|RD|BK|FL|CL|GL|SH|GC|TR|OK|NO|BT|RL|ER|CK|CD|FR|TG)>/g,
    function(m){ return ic(ICP[m]) + ' '; });
}
function ruleText(type){
  return (meta.lang && meta.lang!=="ru" && TYPE_RULES_EN[type]) ? TYPE_RULES_EN[type] : (TYPE_RULES[type]||"");
}
function explainHTML(qn){
  const d = state.feedback && state.feedback.diag;
  if(!d) return getRuleHTML(qn.type);
  const L=W();
  let inner = icp(L.lbl) + d.text;
  inner += '<div class="why-cmp"><span>'+L.you+':</span> <code>'+escHT(state.lastAnswer||"")+'</code><br>'+
           '<span>'+L.need+':</span> <code>'+escHT(state.target||qn.no)+'</code></div>';
  if(d.noun){
    const role = nounRoleOf(state.target || qn.no, d.noun.need);
    const rt = role && L['noun_role_'+role];
    if(rt) inner += '<div class="why-rule">' + rt(d.noun.need) + '</div>';
  }
  if(d.rule){
    const r = ruleText(qn.type);
    if(r) inner += '<div class="why-rule">' + t('rule') + r + '</div>';
  }
  return '<div class="rule-box">' + inner + '</div>';
}

const TIME_ADV = new Set(["i dag","i går","i morgen","nå","snart","senere","før","alltid","aldri","ofte","sjelden","allerede"]);
const SUBJECTS = new Set(["jeg","du","han","hun","vi","dere","de","det","man"]);
const VERBS = new Set(["jobber","jobbet","snakker","snakket","spiser","spiste","ser","så","kjøper","kjøpte","bor","bodde","er","var","skal","vil","kan","må","har","hadde","blir","ble","drikker","drakk","går","gikk","kommer","kom"]);

function checkV2(user) {
  const tokens = user.trim().toLowerCase().replace(/[?!,]/g,"").split(/\s+/);
  let advEnd = -1;
  for (let i = 0; i < tokens.length - 1; i++) {
    if (TIME_ADV.has(tokens[i]+" "+tokens[i+1])) { advEnd = i+1; break; }
    if (TIME_ADV.has(tokens[i])) { advEnd = i; break; }
  }
  if (advEnd < 0) return null;
  const after = tokens.slice(advEnd+1);
  if (after.length < 2) return null;
  if (SUBJECTS.has(after[0]) && VERBS.has(after[1])) {
    return "<BT>Правило V2: после «" + tokens.slice(0,advEnd+1).join(" ") + "» глагол должен стоять 2-м — сразу после обстоятельства. Подлежащее идёт после глагола.";
  }
  return null;
}


// ─── РАВНОЦЕННЫЕ ВАРИАНТЫ ПОРЯДКА СЛОВ ────────────────
// «I morgen skal hun se deg» = «Hun skal se deg i morgen»: время можно поставить в начало (V2) или в конец.
const TIME_EXPR = (function(){
  const L = ['nå','snart','senere','i dag tidlig','i morgen tidlig','ved middagstid',
    'neste uke','neste år','neste måned','forrige uke','forrige år','denne uka','denne uken',
    'hver dag','hver morgen','hver kveld','hver uke','om en time','om to dager','om en uke','om et år'];
  ['går','dag','morgen','kveld','natt','morges','fjor','år','sommer','vinter','høst','vår','helgen','helga',
   'ettermiddag','overmorgen','forgårs','januar','februar','mars','april','mai','juni','juli','august',
   'september','oktober','november','desember'].forEach(function(x){ L.push('i '+x); });
  ['mandag','tirsdag','onsdag','torsdag','fredag','lørdag','søndag'].forEach(function(x){ L.push('på '+x); L.push('på '+x+'er'); });
  ['sommeren','vinteren','høsten','våren','morgenen','kvelden','natta','natten','dagen','helgene'].forEach(function(x){ L.push('om '+x); });
  return L.map(function(x){ return x.split(' '); }).sort(function(a,b){ return b.length-a.length; });
})();
function timeAt(w, from){                 // длина выражения времени, начинающегося с позиции from
  for(const t of TIME_EXPR){
    let ok = from + t.length <= w.length;
    for(let k=0; ok && k<t.length; k++) if(w[from+k] !== t[k]) ok = false;
    if(ok) return t.length;
  }
  return 0;
}
function isFiniteTok(w, i){
  if(i>0 && w[i-1]==='i' && (w[i]==='går'||w[i]==='fjor')) return false;
  if(FINITE.has(w[i])) return true;
  const v = VERB_FORM[w[i]]; return !!(v && (v[1]===1 || v[1]===2));
}
function onlyFiniteAt(w, idx, skipFrom, skipLen){ // в предложении ровно один спрягаемый глагол
  for(let i=0;i<w.length;i++){
    if(i===idx || (i>=skipFrom && i<skipFrom+skipLen)) continue;
    if(isFiniteTok(w,i)) return false;
  }
  return true;
}
function capFirst(a){
  if(!a.length) return a;
  const b = a.slice();
  b[0] = b[0].charAt(0).toUpperCase() + b[0].slice(1);
  return b;
}
function altForms(no){
  if(/\?/.test(no)) return [];                            // вопросы не трогаем
  const trail = (no.match(/[.!]+\s*$/)||[''])[0];
  const orig = no.replace(/[.!,]+/g,'').trim().split(/\s+/);
  const w = orig.map(function(x){ return x.toLowerCase(); });

const PROPER = new Set(["Amerika","Bergen","Danmark","Mars","Norge","Oslo","Polen","Spania","Sverige","TV","Ukraina"]);

function makePool(sentence){
  const words = sentence.replace(/[?!,.]/g,"").split(/\s+/).filter(Boolean);
  if(words.length && !PROPER.has(words[0])) words[0] = words[0].charAt(0).toLowerCase() + words[0].slice(1);
  const have = new Set(words.map(w=>w.toLowerCase()));
  const noise = [];
  for(const w of shuffle(words.slice())){
    const alts = FORM_OF[w.toLowerCase()];
    if(!alts) continue;
    const pick = shuffle(alts.slice()).find(a => !have.has(a) && noise.indexOf(a)===-1);
    if(pick){ noise.push(pick); if(noise.length===2) break; }
  }
  return shuffle(words.concat(noise));
}

const SR = (typeof window!=="undefined") && (window.SpeechRecognition || window.webkitSpeechRecognition);

function pronounce(){
  if(!SR) return;
  const target = state.questions[state.idx].no;
  const btn = document.getElementById('mic-btn');
  if(btn) btn.textContent = '<MC>Слушаю…';
  try{
    const rec = new SR();
    rec.lang = 'nb-NO';
    rec.interimResults = false;
    rec.maxAlternatives = 5;
    rec.onresult = function(e){
      let ok = false, heard = '';
      const res = e.results[0];
      for(let i=0;i<res.length;i++){
        if(!heard) heard = res[i].transcript;
        if(isCorrect(res[i].transcript, target)) ok = true;
      }
      const box = document.getElementById('pron-res');
      if(box) box.innerHTML = ok
        ? '<OK>Отличное произношение! Bra uttale!'
        : '<ER>Услышал: «' + heard + '»<br>Послушай образец и попробуй ещё раз';
      const b = document.getElementById('mic-btn');
      if(b) b.textContent = '<MC>Ещё раз';
    };
    rec.onerror = function(){
      const b = document.getElementById('mic-btn');
      if(b) b.textContent = '<MC>Произнести';
      const box = document.getElementById('pron-res');
      if(box) box.innerHTML = 'Микрофон недоступен — проверь разрешения браузера';
    };
    rec.onend = function(){
      const b = document.getElementById('mic-btn');
      if(b && b.textContent.indexOf('Слушаю')>=0) b.textContent = '<MC>Произнести';
    };
    rec.start();
  }catch(e){}
}

// ─── ГОЛОС ─────────────────────────────────────────────────────────
// Браузер сам выбирает голос для nb-NO и почти всегда берёт самый
// простой встроенный — отсюда «робот». Выбираем лучший доступный сами.
let voicePick = null;                 // {v: SpeechSynthesisVoice, s: оценка}
function voiceScore(v){
  const id = ((v.name||'') + ' ' + (v.voiceURI||'')).toLowerCase();
  const lang = (v.lang||'').toLowerCase().replace('_','-');
  if(!/^(nb|nn|no)(-|$)/.test(lang)) return null;      // не норвежский — мимо
  let s = 10;
  if(/premium/.test(id)) s += 60;                      // iOS/macOS, лучшее качество
  else if(/neural|natural/.test(id)) s += 55;          // Windows, Edge
  else if(/enhanced/.test(id)) s += 50;                // iOS/macOS, «улучшенный»
  else if(/siri/.test(id)) s += 45;
  else if(/google/.test(id)) s += 40;                  // Android, Chrome
  else if(/microsoft/.test(id)) s += 20;
  if(/compact/.test(id)) s -= 25;                      // сжатый — самый роботный
  if(/espeak|mbrola|\bmb-/.test(id)) s -= 40;
  if(v.localService === false) s += 8;                 // сетевые голоса звучат живее
  if(/^nb/.test(lang)) s += 4;                         // букмол впереди нюнорска
  return s;
}
function pickVoice(){
  let list = [];
  try{ list = window.speechSynthesis.getVoices() || []; }catch(e){}
  let best = null, bs = -Infinity;
  list.forEach(function(v){
    const sc = voiceScore(v);
    if(sc === null) return;                            // не норвежский голос не берём вовсе
    if(sc > bs){ bs = sc; best = v; }
  });
  voicePick = best ? {v:best, s:bs} : null;
  return voicePick;
}
function voiceWeak(){ return !voicePick || voicePick.s < 40; }
try{
  if(typeof window !== 'undefined' && 'speechSynthesis' in window){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = function(){ pickVoice(); };
    setTimeout(pickVoice, 400);          // список голосов приезжает не сразу
    setTimeout(pickVoice, 1800);
  }
}catch(e){}

function sndHash(text){
  const t = (text||'').replace(/\s+/g,' ').trim();
  let b;
  try{ b = new TextEncoder().encode(t); }catch(e){ return ''; }
  const one = function(seed){
    let h = seed >>> 0;
    for(let i=0;i<b.length;i++){ h ^= b[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    return ('0000000' + h.toString(16)).slice(-8);
  };
  return one(0x811c9dc5) + one(0x7f4a7c15);
}

  };
  setTimeout(function(){ done(null); }, 3000);          // нет ответа — просто читаем сами
  try{
    fetch(SND_BASE + 'index.json')
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(!j || !j.ids || !j.ids.length){ done(null); return; }
        const set = {};
        for(let i=0;i<j.ids.length;i++) set[j.ids[i]] = 1;
        done({has:set, ext:j.ext || 'mp3'});
      })
      .catch(function(){ done(null); });
  }catch(e){ done(null); }
}
function sndStop(){
  try{ if(sndEl){ sndEl.pause(); sndEl.currentTime = 0; } }catch(e){}
  try{ window.speechSynthesis.cancel(); }catch(e){}
}
function sndPlay(text, slow, onFail){
  const id = sndHash(text);
  if(!id || !sndIdx || !sndIdx.has[id]) return false;
  let failed = false;
  const fail = function(){ if(failed) return; failed = true; onFail(); };
  try{
    if(!sndEl){ sndEl = new Audio(); sndEl.preload = 'auto'; }
    sndEl.onerror = null;
    try{ sndEl.pause(); }catch(e){}
    sndEl.src = SND_BASE + id + '.' + sndIdx.ext;
    sndEl.playbackRate = slow ? 0.75 : 1;
    sndEl.onerror = fail;
    const pr = sndEl.play();
    if(pr && pr.catch) pr.catch(fail);
  }catch(e){ fail(); }
  return true;
}

let lastSpoke = {t:'', at:0};
function speakText(text, rate){
  if(!(typeof window !== 'undefined' && 'speechSynthesis' in window)) return;
  let str = (text||'').replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
  if(!str) return;
  if(!/[.!?…]$/.test(str)) str += '.';   // точка в конце даёт живую интонацию вместо плоской
  const synth = window.speechSynthesis;
  if(!voicePick) pickVoice();
  const go = function(){
    const utt = new SpeechSynthesisUtterance(str);
    if(voicePick && voicePick.v){ utt.voice = voicePick.v; utt.lang = voicePick.v.lang; }
    else utt.lang = 'nb-NO';
    utt.rate = rate; utt.pitch = 1; utt.volume = 1;
    try{ synth.speak(utt); }catch(e){}
  };
  let busy = false;
  try{ busy = synth.speaking || synth.pending; synth.cancel(); }catch(e){}
  if(busy) setTimeout(go, 90); else go();   // Chrome глотает реплику сразу после cancel
}
function speak(text){
  const now = Date.now();
  const again = text === lastSpoke.t && now - lastSpoke.at < 4000;   // повтор — медленнее
  lastSpoke = {t:text, at:now};
  sndStop();
  const synth = function(){ speakText(text, again ? 0.72 : 0.95); };
  // Опись уже в руках — играем сразу, не разрывая жест пользователя:
  // iOS разрешает звук только внутри обработчика нажатия.
  if(sndIdx !== undefined){
    if(!sndIdx || !sndPlay(text, again, synth)) synth();
    return;
  }
  sndLoad(function(){ if(!sndIdx || !sndPlay(text, again, synth)) synth(); });
}
// Как доставить на устройство голос получше — путь свой на каждой системе.
function voiceTip(){
  const ua = (typeof navigator !== 'undefined' ? navigator.userAgent : '') || '';
  const pf = (TG && TG.platform) || '';
  const en = enLang();
  if(pf === 'ios' || /iPhone|iPad|iPod/i.test(ua))
    return en ? 'Settings → Accessibility → Spoken Content → Voices → Norwegian → Nora, pick the Enhanced version.'
              : 'Настройки → Универсальный доступ → Устный контент → Голоса → Норвежский → Nora, вариант «Улучшенный».';
  if(pf === 'android' || /Android/i.test(ua))
    return en ? 'Settings → Accessibility → Text-to-speech → Google → install Norwegian.'
              : 'Настройки → Спец. возможности → Синтез речи → Google → установить норвежский.';
  if(/Macintosh|Mac OS X/i.test(ua))
    return en ? 'System Settings → Accessibility → Spoken Content → System Voice → Manage Voices → Norwegian.'
              : 'Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управление голосами → норвежский.';
  if(/Windows/i.test(ua))
    return en ? 'Settings → Time & language → Speech → Add voices → Norwegian.'
              : 'Параметры → Время и язык → Речь → Добавить голоса → норвежский.';
  return en ? 'Install a Norwegian voice in your system speech settings.'
            : 'Поставь норвежский голос в системных настройках речи.';
}
function sndHas(text){ try{ return !!(sndIdx && sndIdx.has && sndIdx.has[sndHash(text)]); }catch(e){ return false; } }
function voiceNoteHTML(text){
  // Для фразы есть запись — её читает живой голос, жаловаться не на что.
  if(text && sndHas(text)) return '';
  if(!voiceWeak() || (meta && meta.vtip)) return '';
  const en = enLang();
  return '<div class="voice-note" id="voice-note">' +
    '<button class="voice-x" onclick="hideVoiceNote()" aria-label="' + (en?'Close':'Закрыть') + '">×</button>' +
    '<b>' + (en ? 'The voice sounds robotic?' : 'Голос звучит роботом?') + '</b> ' +
    (en ? 'The system is using its simplest Norwegian voice. A better one is a one-time download: '
        : 'Система взяла самый простой норвежский голос. Получше ставится один раз: ') +
    voiceTip() + '</div>';
}
function hideVoiceNote(){
  meta.vtip = 1; saveMeta();
  const el = document.getElementById('voice-note');
  if(el) el.parentNode.removeChild(el);
}

aving dinner at some friends' place."},{"t":16,"no":"De er norske. Jeg gleder meg til å smake norsk mat.","ru":"Они норвежцы. Мне не терпится попробовать норвежскую кухню.","en":"They're Norwegian. I'm looking forward to tasting Norwegian food."},{"t":21,"no":"Franco: Hva er norsk mat? Fisk? Laks kanskje?","ru":"Франко: А что представляет из себя норвежская кухня? Рыба? Может быть, лосось?","en":"Franco: What is Norwegian food? Fish? Salmon, maybe?"},{"t":26,"no":"Indira: Jeg vet ikke. Men jeg gleder meg til å smake.","ru":"Индира: Я не знаю. Самой не терпится узнать.","en":"Indira: I don't know. But I'm looking forward to trying it."},{"t":30,"no":"Hjemme spiser vi bare indisk mat.","ru":"Дома мы едим только индийские блюда.","en":"At home we only eat Indian food."},{"t":33,"no":"Her har de blomster. Jeg kan ta med meg noen blomster.","ru":"Вот цветы. Можно захватить с собой букет.","en":"They've got flowers here. I could take some flowers with me."}],"title_en":"At the supermarket - 2","sub_en":"At the supermarket - 2 · En-To-Tre"},{"id":"04nor","file":"04nor.mp3","title":"Indira besøker Svein og Grete","sub":"Индира гостит у Свайна и Греты · En-To-Tre","lines":[{"t":0,"no":"Svein: Hei, Indira. Velkommen. Lenge siden sist!","ru":"Свайн: Привет, Индира. Добро пожаловать. Давно не виделись!","en":"Svein: Hi, Indira. Welcome. Long time since last time!"},{"t":4,"no":"Grete: Så hyggelig å se deg.","ru":"Грета: Рада тебя видеть.","en":"Grete: How nice to see you."},{"t":6,"no":"Indira: I like måte. Takk for invitasjonen.","ru":"Индира: И я. Спасибо за приглашение.","en":"Indira: You too. Thanks for the invitation."},{"t":10,"no":"Vær så god. Her er noen blomster til dere.","ru":"Вот, вам цветы.","en":"Here you are. Here are some flowers for you."},{"t":13,"no":"Grete: Å tusen takk. Så nydelige de er!","ru":"Грета: Спасибо. Какие красивые!","en":"Grete: Oh, thank you so much. How lovely they are!"},{"t":16,"no":"Svein: Vil du ha et glass sherry?","ru":"Свайн: Выпьешь хе
