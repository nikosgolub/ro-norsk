let impRows = [];

function parseWords(text){
  const rows = [], bad = [];
  const lines = (text||'').split(/\r?\n/);
  for(const raw of lines){
    const line = raw.trim();
    if(!line || line.charAt(0)==='#') continue;
    let parts = null;
    if(line.indexOf('\t')>=0) parts = line.split('\t');
    else if(line.indexOf(' — ')>=0) parts = line.split(' — ');
    else if(line.indexOf(' – ')>=0) parts = line.split(' – ');
    else if(line.indexOf(' - ')>=0) parts = line.split(' - ');
    else if(line.indexOf(';')>=0) parts = line.split(';');
    else if(line.indexOf(':')>=0) parts = line.split(':');
    else if(line.indexOf(',')>=0) parts = line.split(',');
    if(!parts || parts.length < 2){ bad.push(line); continue; }
    const n = parts[0].replace(/^["']|["']$/g,'').replace(/[<>&]/g,'').trim().slice(0,60);
    const r = parts.slice(1).join(' ').replace(/^["']|["']$/g,'').replace(/[<>&]/g,'').trim().slice(0,80);
    if(!n || !r){ bad.push(line); continue; }
    rows.push({n:n, r:r});
  }
  return {rows:rows, bad:bad};
}

function exportWords(){
  const list = myList();
  if(!list.length){ alert('Словарь пуст'); return; }
  const byId = {};
  for(const s of mySets()) byId[s.id] = s.name;
  let txt = '';
  const groups = {};
  for(const w of list){
    const g = w.set ? byId[w.set] || 'Без раздела' : 'Без раздела';
    if(!groups[g]) groups[g] = [];
    groups[g].push(w.n + ' — ' + w.r);
  }
  for(const g in groups) txt += '# ' + g + '\n' + groups[g].join('\n') + '\n\n';
  try{
    const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ro-словарь.txt';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
  }catch(e){ alert('Не удалось выгрузить файл'); }
}

function myDelSet(id){

    meta.mysets = mySets().filter(function(s){ return s.id!==id; });
    myList().forEach(function(w){ if(w.set===id) delete w.set; });
    saveMeta();
    renderMyDecks();
  });
}
function myPick(id){ myCur = id; renderMyWords(); }

function myAdd(){
  const a = document.getElementById('my-no'), b = document.getElementById('my-ru');
  const n = (a && a.value ? a.value : '').replace(/[<>&"]/g,'').trim().slice(0,60);
  const r = (b && b.value ? b.value : '').replace(/[<>&"]/g,'').trim().slice(0,60);
  if(!n || !r) return;
  const w = { n:n, r:r, s:0, d:dnum() };
  if(myCur!=='all' && myCur!=='none') w.set = myCur;
  myList().unshift(w);
  saveMeta();
  renderMyWords();
}
function myDel(i){
  const w = myFiltered()[i];
  const ix = myList().indexOf(w);
  if(ix>=0) myList().splice(ix,1);
  saveMeta();
  renderMyWords();
}
function myMove(i){
  const w = myFiltered()[i];
  const sets = mySets();
  const opts = sets.map(function(s){ return { label:s.name, value:s.id }; });
  opts.push({ label:'Без раздела', value:null });
  askPick('Перенести «' + w.n + '»', opts, function(v){
    if(v===undefined) return;
    if(v===null) delete w.set; else w.set = v;
    saveMeta();
    renderMyWords();
  });
}

function deckWords(id){
  const all = myList();
  if(id==='all') return all;
  if(id==='none') return all.filter(function(w){ return !w.set; });
  return all.filter(function(w){ return w.set===id; });
}
function deckLearned(id){ return deckWords(id).filter(function(w){ return (w.s||0) >= 3; }).length; }

function renderMyDecks(){
  screen = 'mydecks';
  const all = myList();
  const sets = mySets();
  const noneN = deckWords('none').length;

  const card = function(id, name){
    const ws = deckWords(id);
    const due = myDue(ws).length;
    const learned = deckLearned(id);
    const pct = ws.length ? Math.round(learned/ws.length*100) : 0;
    return '<div class="lesson-card" onclick="openDeck(\'' + id + '\')">' +
      '<div class="lesson-num">' + ic('cards',16) + '</div>' +
      '<div class="lesson-info">' +
        '<div class="lesson-title">' + name + '</div>' +
        '<div class="lesson-sub">' + ws.length + ' слов' + (due ? ' · ' + due + ' к повтору' : ' · всё повторено') + '</div>' +
      '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="lesson-mini-pct">' + pct + '%</div>' +
      '</div>' +
    '</div>';
  };

  const decks = sets.map(function(s){ return card(s.id, s.name); }).join('') +
    (noneN ? card('none', 'Без раздела') : '');
  const dueAll = myDue(all).length;

  document.getElementById('app').innerHTML =
    '<div class="header">' +
      '<button class="back-btn" onclick="renderCourses()">' + t('back_h') + '</button>' +
      '<div class="header-right"><div class="score-chip">' + ic('cards',14) + ' ' + all.length + '</div></div>' +
    '</div>' +
    '<div class="lessons-title">Мои карточки</div>' +
    '<div class="lessons-sub">Разделы со своими словами и повторениями</div>' +
    (all.length ? '<button class="continue-btn" onclick="openDeck(\'all\')">' + ic('cards',16) + ' Учить всё' + (dueAll ? ' · ' + dueAll + ' к повтору' : '') + '</button>' : '') +
    '<div class="lesson-list">' + decks +
      '<div class="lesson-card" style="border-style:dashed;opacity:.75" onclick="myAddSet()">' +
        '<div class="lesson-num">+</div>' +
        '<div class="lesson-info"><div class="lesson-title">Новый раздел</div>' +
        '<div class="lesson-sub">Например: урок 5, еда, работа</div></div>' +
      '</div>' +
    '</div>' +
    (all.length ? '' : '<div class="deck-count" style="margin-top:1.25rem">Создай раздел и добавь первые слова</div>');
}

function startMyWords(){
  const list = myFiltered();
  const due = myDue(list);
  const deck = (due.length ? due : list).map(function(w){ return { my:true, w:w }; });
  if(!deck.length){ renderMyWords(); return; }
  screen = 'words';
  wordsState.deck = shuffle(deck);
  wordsState.flipped = false;
  wordsState.review = false;
  wordsState.my = true;
  renderWords();
}

let statPeriod = 'week';

function renderStats(){
  screen = 'stats';
  const P = statPeriod;
  const days = P==='week' ? weekDays() : daysBack(P==='month'?30:365);
  const ph = sumRange(days,'p'), au = sumRange(days,'a'), wd = sumRange(days,'w');
  const act = activeDays(days);
  const avg = act ? Math.round(ph/act) : 0;

  let chart = '';
  if(P==='week'){
    const vals = days.map(function(d){ return logOf(d).p||0; });
    const mx = Math.max(DAILY_GOAL, Math.max.apply(null, vals));
    const wl = t('wd');
    chart = '<div class="week-strip" style="border:none;padding:0;margin:0;gap:8px">' + days.map(function(d,i){
      const h = Math.max(4, Math.round(vals[i]/mx*100));
      const today = dstrOf(d) === dstr(0);
      return '<div class="wk-col' + (isFuture(d)?' future':'') + '"><div class="wk-bar-bg" style="height:100px"><div class="wk-bar' + (vals[i]>=DAILY_GOAL?' hit':'') + (today?' today':'') + '" style="height:' + h + 'px"></div></div>' +
        '<div class="wk-lbl' + (today?' today':'') + '">' + wl[i] + '</div>' +
        '<div class="wk-lbl" style="color:var(--ink2);font-weight:600">' + (vals[i]||'') + '</div></div>';
    }).join('') + '</div>';
  } else if(P==='month'){
    chart = '<div class="heat">' + days.map(function(d){
      const v = logOf(d).p||0;
      const lvl = v===0?0 : v<DAILY_GOAL*0.34?1 : v<DAILY_GOAL*0.67?2 : v<DAILY_GOAL?3 : 4;
      return '<div class="ht l' + lvl + '" title="' + d.getDate() + '"></div>';
    }).join('') + '</div>' +
    '<div class="heat-legend"><span>меньше</span><div class="ht l0"></div><div class="ht l1"></div><div class="ht l2"></div><div class="ht l3"></div><div class="ht l4"></div><span>больше</span></div>';
  } else {
    const mo = [];
    for(let m=11;m>=0;m--){
      const d = new Date(); d.setMonth(d.getMonth()-m);
      let s = 0;
      const y = d.getFullYear(), mm = d.getMonth();
      const last = new Date(y, mm+1, 0).getDate();
      for(let day=1; day<=last; day++) s += ((meta.log||{})[y+'-'+(mm+1)+'-'+day]||{}).p||0;
      mo.push({ n: t('mo')[mm].slice(0,3), v: s });
    }
    const mx = Math.max(1, Math.max.apply(null, mo.map(function(x){return x.v;})));
    chart = '<div class="year-row">' + mo.map(function(x){
      return '<div class="yr-col"><div class="yr-bar-bg"><div class="yr-bar" style="height:' + Math.max(3, Math.round(x.v/mx*90)) + 'px"></div></div>' +
        '<div class="wk-lbl">' + x.n + '</div></div>';
    }).join('') + '</div>';
  }

  document.getElementById('app').innerHTML =
    '<div class="header">' +
      '<button class="back-btn" onclick="renderCourses()">' + t('back_h') + '</button>' +
      '<div class="header-right"><div class="score-chip">' + ic('fire',14) + ' ' + streakCount() + '</div></div>' +
    '</div>' +
    '<div class="detail-title">Статистика</div>' +
    '<div class="detail-sub">Ритм важнее объёма — смотри на регулярность</div>' +
    '<div class="mode-toggle" style="margin:1rem 0">' +
      '<button class="mode-btn' + (P==='week'?' active':'') + '" onclick="setStatPeriod(\'week\')">Неделя</button>' +
      '<button class="mode-btn' + (P==='month'?' active':'') + '" onclick="setStatPeriod(\'month\')">Месяц</button>' +
      '<button class="mode-btn' + (P==='year'?' active':'') + '" onclick="setStatPeriod(\'year\')">Год</button>' +
    '</div>' +
    '<div class="card">' + chart + '</div>' +
    '<div class="stat-grid">' +
      '<div class="sg"><div class="sg-v">' + ph + '</div><div class="sg-l">фраз</div></div>' +
      '<div class="sg"><div class="sg-v">' + Math.round(au/60) + '</div><div class="sg-l">минут аудио</div></div>' +
      '<div class="sg"><div class="sg-v">' + wd + '</div><div class="sg-l">слов</div></div>' +
      '<div class="sg"><div class="sg-v">' + act + '</div><div class="sg-l">дней занятий</div></div>' +
      '<div class="sg"><div class="sg-v">' + avg + '</div><div class="sg-l">фраз в день</div></div>' +
      '<div class="sg"><div class="sg-v">' + bestWeek() + '</div><div class="sg-l">лучшая неделя</div></div>' +
    '</div>' +
    '<div class="section-label" style="margin-top:24px">Всего за курс</div>' +
    '<div class="stat-grid" style="margin-top:10px">' +
      (function(){
        const sL=LESSONS, sW=WORDS, sc2=ci;
        ci=0; LESSONS=COURSES[0].L; WORDS=COURSES[0].W;
        let p=0,pt=0,w=0,wt=0;
        for(let l=0;l<LESSONS.length;l++){ p+=lessonSolved(l); pt+=lessonTotal(l); w+=Math.min(wordsKnown(l).length,WORDS[l].length); wt+=WORDS[l].length; }
        ci=sc2; LESSONS=sL; WORDS=sW;
        let hrs=0; for(const d of DIALOGS) hrs += dlgStat(d.id).sec||0;
        return '<div class="sg"><div class="sg-v">' + Math.round(p/pt*100) + '%</div><div class="sg-l">фраз курса</div></div>' +
          '<div class="sg"><div class="sg-v">' + Math.round(w/wt*100) + '%</div><div class="sg-l">слов курса</div></div>' +
          '<div class="sg"><div class="sg-v">' + (hrs/3600).toFixed(1) + '</div><div class="sg-l">часов аудио</div></div>';
      })() +
    '</div>';
  try{ window.scrollTo(0,0); }catch(e){}
}

];
let tourStep = 0;

function startTour(){
  if(screen!=='courses') renderCourses();
  try{ window.scrollTo(0,0); }catch(e){}
  tourStep = 0;
  const m = document.createElement('div');
  m.className = 'tour-mask';
  m.id = 'tour-mask';
  m.innerHTML = '<div class="tour-hole" id="tour-hole"></div><div class="tour-tip" id="tour-tip"></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function(e){ if(e.target===m) tourNext(); });
  tourShow();
}

function tourShow(){
  const s = TOUR[tourStep];
  const hole = document.getElementById('tour-hole');
  const tip = document.getElementById('tour-tip');
  if(!hole || !tip) return;
  const el = document.querySelector(s.sel);
  if(!el){ tourNext(); return; }

  // подводим элемент в центр экрана, затем позиционируем подсветку
  try{ el.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){ el.scrollIntoView(); }

  const place = function(){
    const r = el.getBoundingClientRect();
    const pad = 8;
    hole.style.top = (r.top - pad) + 'px';
    hole.style.left = (r.left - pad) + 'px';
    hole.style.width = (r.width + pad*2) + 'px';
    hole.style.height = (r.height + pad*2) + 'px';

    const last = tourStep === TOUR.length-1;
    tip.innerHTML =
      '<div class="tour-step">' + (tourStep+1) + ' / ' + TOUR.length + '</div>' +
      '<div class="tour-title">' + s.t + '</div>' +
      '<div class="tour-text">' + s.d + '</div>' +
      '<div class="tour-nav">' +
        '<button class="tour-next" onclick="tourNext()">' + (last ? 'Понятно' : 'Далее') + '</button>' +
        (last ? '' : '<button class="tour-skip" onclick="tourEnd()">Пропустить</button>') +
      '</div>';

    const tipH = tip.offsetHeight || 200;
    const vh = window.innerHeight;
    let top = r.bottom + 16;
    if(top + tipH > vh - 12) top = r.top - tipH - 16;      // не влезает снизу — ставим сверху
    if(top < 12) top = Math.min(vh - tipH - 12, r.bottom + 16); // не влезает сверху — возвращаем вниз
    tip.style.top = Math.max(12, Math.min(top, vh - tipH - 12)) + 'px';
  };

  place();
  setTimeout(place, 320);   // пересчёт после плавной прокрутки
}

function tourNext(){
  tourStep++;
  if(tourStep >= TOUR.length){ tourEnd(); return; }
  tourShow();
}

function tourEnd(){
  meta.tour = 1; saveMeta();
  const m = document.getElementById('tour-mask');
  if(m) m.remove();
}

// ─── FIREWORKS ──────────────────────────────────────
function launchFireworks(cid){
  const cv = document.getElementById(cid || 'fw');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  let parts = [];
  let bursts = 0;
  const MAX_BURSTS = 7;
  function burst(){
    const x = cv.width*(0.2+Math.random()*0.6);
    const y = cv.height*(0.12+Math.random()*0.38);
    const hue = Math.floor(Math.random()*360);
    for(let i=0;i<64;i++){
      const a = Math.PI*2*i/64;
      const sp = 2 + Math.random()*3.8;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:hue+Math.random()*40-20});
    }
    bursts++;
  }
  burst();
  const iv = setInterval(()=>{ if(bursts<MAX_BURSTS) burst(); else clearInterval(iv); }, 430);
  function frame(){
    if(!document.getElementById('fw')){ clearInterval(iv); return; }
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.vy+=0.045; p.vx*=0.985; p.vy*=0.985;
      p.life-=0.011;
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = 'hsl(' + p.hue + ',92%,66%)';
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.3,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    parts = parts.filter(p=>p.life>0);
    if(parts.length>0 || bursts<MAX_BURSTS){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,cv.width,cv.height); }
  }
  requestAnimationFrame(frame);
}

// ─── ВОССТАНОВЛЕНИЕ ИЗ ОБЛАКА TELEGRAM ───
function cloudGet(keys, cb){
  if(!(TG && TG.CloudStorage && TG.CloudStorage.getItems)){ cb(null); return; }
  let done = false;
  const finish = function(v){ if(!done){ done = true; cb(v); } };
  setTimeout(function(){ finish(null); }, 2500);   // не ждём вечно
  try{
    TG.CloudStorage.getItems(keys, function(err, res){
      if(err || !res){ finish(null); return; }
      finish(res);
    });
  }catch(e){ finish(null); }
}

// ─── ЧАТ С АГЕНТОМ ЯЗЫКА ──────────────────────────────
let chatLog = [];
try{ chatLog = JSON.parse(localStorage.getItem('ro_chat') || '[]') || []; }catch(e){ chatLog = []; }
let chatBusy = false;
let chatDraft = '';
let lastScreen = null;

function plainDiag(d){
  if(!d || !d.text) return '';
  return d.text.replace(/<li>/g,' • ').replace(/<[^>]+>/g,' ')
               .replace(/\s+/g,' ').replace(/\s+([.,;:])/g,'$1')
               .replace(/«\s+/g,'«').replace(/\s+»/g,'»').trim().replace(/\.+$/,'');
}
function chatMode(){ return meta.chatmode === 'talk' ? 'talk' : 'teach'; }
function chatSaveLog(){
  if(chatLog.length > 60) chatLog = chatLog.slice(-60);
  try{ localStorage.setItem('ro_chat', JSON.stringify(chatLog)); }catch(e){}
}
function chatClear(){
  askConfirm(t2('clear'), t2('ch_clr_q'), function(){
    chatLog = []; chatSaveLog(); renderChat();
  });
}

const CHAT_T = {
ru:{ title:'Спросить', teach:'Объяснить', talk:'Поговорим',
  ph_teach:'Спроси про правило или ошибку…',
  ph_talk:'Skriv på norsk…',
  hi_teach:'Спроси что угодно про норвежский. Я вижу, на каком ты уроке, какие фразы заваливаешь и что лежит в твоём словаре — так что можно спрашивать коротко: «почему тут huset?»',
  hi_talk:'Nå snakker vi norsk. Jeg skriver enkelt, og retter deg underveis.\n\nHva gjorde du i dag?',
  send:'Отправить', clear:'Очистить', thinking:'Печатает…',
  ch_clr_q:'Очистить всю переписку?', listen:'Послушать',
  ctx_on:'вижу твой прогресс' },
en:{ title:'Ask', teach:'Explain', talk:'Let\'s talk',
  ph_teach:'Ask about a rule or a mistake…',
  ph_talk:'Skriv på norsk…',
  hi_teach:'Ask me anything about Norwegian. I can see which lesson you are on, which phrases you keep failing and what is in your vocabulary — so short questions work: "why huset here?"',
  hi_talk:'Nå snakker vi norsk. Jeg skriver enkelt, og retter deg underveis.\n\nHva gjorde du i dag?',
  send:'Send', clear:'Clear', thinking:'Typing…',
  ch_clr_q:'Clear the whole conversation?', listen:'Listen',
  ctx_on:'I can see your progress' }
};
function t2(k){
  const d = (meta.lang && meta.lang!=='ru' && CHAT_T[meta.lang]) ? CHAT_T[meta.lang]
          : (meta.lang && meta.lang!=='ru' ? CHAT_T.en : CHAT_T.ru);
  return d[k] !== undefined ? d[k] : CHAT_T.ru[k];
}
const LANG_NAME = {ru:'русском', en:'английском', uk:'украинском', pl:'польском', es:'испанском'};

// ─── контекст: что агент знает про ученика ───
function chatContext(){
  const L = [];
  const nm = (meta.name || '').trim();
  const parts = [];
  if(nm) parts.push('имя ' + nm);
  const st = streakCount(); if(st) parts.push('занимается ' + st + ' дней подряд');
  const ts = totalSolved(); if(ts) parts.push('пройдено фраз: ' + ts);
  if(parts.length) L.push('Ученик: ' + parts.join('; ') + '.');

  try{
    const co = COURSES[ci];
    if(co && !co.audio && LESSONS[currentLessonIdx]){
      const les = LESSONS[currentLessonIdx];
      let s = 'Сейчас: курс «' + co.title + '», урок ' + (currentLessonIdx+1) + ' «' + les.title + '»';
      if(les.parts && les.parts[currentPartIdx]) s += ', блок «' + les.parts[currentPartIdx].t + '»';
      L.push(s + '.');
    }
  }catch(e){}

  try{
    if(state && state.questions && state.questions[state.idx] && state.phase){
      const q = state.questions[state.idx];
      let s = 'Фраза на экране: «' + srcText(q) + '» → «' + q.no + '»';
      if(state.phase === 'revealed' && state.lastAnswer) s += '. Ученик ответил: «' + state.lastAnswer + '»';
      if(state.feedback && state.feedback.diag) s += '. Тренажёр определил ошибку: ' + plainDiag(state.feedback.diag);
      L.push(s + '.');
    }
  }catch(e){}

  try{
    const ms = (meta.mistakes || []).slice(-6);
    if(ms.length) L.push('Фразы, на которых он спотыкается: ' + ms.map(function(m){ return '«' + m.no + '»'; }).join(', ') + '.');
  }catch(e){}

  try{
    const my = (meta.my || []).slice(-14);
    if(my.length) L.push('В личном словаре: ' + my.map(function(w){ return w.no; }).filter(Boolean).join(', ') + '.');
  }catch(e){}

  if(!L.length) return '';
  return 'КОНТЕКСТ (используй, только если он относится к вопросу; не пересказывай его просто так):\n' + L.join('\n');
}

function chatSystem(){
  const lang = LANG_NAME[meta.lang || 'ru'] || 'русском';
  if(chatMode() === 'talk'){
    return 'Ты — норвежский собеседник в тренажёре Ro!. Ученик уровня A1–A2.\n' +
      'Пиши ТОЛЬКО по-норвежски (bokmål), простыми короткими предложениями уровня A1–A2.\n' +
      '— 1–3 предложения, и заканчивай вопросом, чтобы разговор продолжался.\n' +
      '— Если в сообщении ученика есть ошибка, первой строкой дай исправленный вариант в виде «✓ правильный вариант», а потом отвечай по теме.\n' +
      '— Не используй сложные времена и редкие слова.\n' +
      '— Если ученик прямо просит объяснить на ' + lang + ' языке — объясни одним предложением и снова перейди на норвежский.\n' +
      '— Без приветствий в каждом сообщении и без списков.';
  }
  return 'Ты — преподаватель норвежского (bokmål) в тренажёре Ro!. Ученик уровня A1–A2.\n' +
    'Отвечай на ' + lang + ' языке, примеры давай по-норвежски.\n' +
    '— Коротко: 2–5 предложений. Без приветствий, без вступлений, без списков.\n' +
    '— Объясняя правило, дай один-два примера с переводом.\n' +
    '— Норвежские слова и фразы оборачивай в обратные кавычки: `huset`.\n' +
    '— Не выдумывай слов и форм, которых нет в норвежском. Если не уверен — так и скажи.\n' +
    '— Если вопрос не про норвежский язык или учёбу, одной фразой верни к теме.';
}

function chatPrompt(question){
  const sys = chatSystem();
  const ctx = chatContext();
  const hist = chatLog.slice();
  function build(h){
    let s = sys + '\n\n';
    if(ctx) s += ctx + '\n\n';
    if(h.length){
      s += 'ПЕРЕПИСКА:\n' + h.map(function(m){
        return (m.r === 'u' ? 'Ученик: ' : 'Ты: ') + m.t;
      }).join('\n') + '\n\n';
    }
    return s + 'Ученик: ' + question + '\nТы:';
  }
  let h = hist;
  let out = build(h);
  while(out.length > 9500 && h.length > 2){ h = h.slice(2); out = build(h); }
  if(out.length > 11000) out = out.slice(0, 11000);
  return out;
}

// ─── разметка сообщений ───
function chatEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function chatFmt(s){
  let h = chatEsc(s);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^✓\s*(.+)$/gm, '<span class="ch-fix">✓ $1</span>');
  return h.replace(/\n/g, '<br>');
}

function chatSetMode(m){
  meta.chatmode = m; saveMeta();
  renderChat();
}

function openChat(){
  const back = lastScreen;
  chatBack = (typeof back === 'function') ? back : function(){ renderCourses(); };
  renderChat();
}
let chatBack = null;

function renderChat(){
  const mode = chatMode();
  const greet = mode === 'talk' ? t2('hi_talk') : t2('hi_teach');
  const msgs = chatLog.length
    ? chatLog.map(function(m, i){
        const cls = m.r === 'u' ? 'ch-msg me' : 'ch-msg ai';
        const say = (m.r === 'a' && mode === 'talk')
          ? '<button class="ch-say" onclick="speak(chatLog[' + i + '].t.replace(/[✓`*]/g,\'\'))">' + ic('sound',13) + '</button>'
          : '';
        return '<div class="' + cls + '">' + chatFmt(m.t) + say + '</div>';
      }).join('')
    : '<div class="ch-msg ai ch-greet">' + chatFmt(greet) + '</div>';

  document.getElementById('app').innerHTML =
    '<div id="chat-screen">' +
      '<div class="header">' +
        '<div class="logo" onclick="renderCourses()">Ro!</div>' +
        '<div class="header-right">' +
          (chatLog.length ? '<button class="back-btn" onclick="chatClear()">' + t2('clear') + '</button>' : '') +
          '<button class="back-btn" onclick="chatBack()">←</button>' +
        '</div>' +
      '</div>' +
      '<div class="ch-modes">' +
        '<button class="ch-mode' + (mode==='teach'?' on':'') + '" onclick="chatSetMode(\'teach\')">' + t2('teach') + '</button>' +
        '<button class="ch-mode' + (mode==='talk'?' on':'') + '" onclick="chatSetMode(\'talk\')">' + t2('talk') + '</button>' +
      '</div>' +
      '<div class="ch-body" id="ch-body">' + msgs +
        (chatBusy ? '<div class="ch-msg ai ch-wait">' + t2('thinking') + '</div>' : '') +
      '</div>' +
      '<div class="ch-bar">' +
        '<textarea id="ch-inp" class="ch-inp" rows="1" placeholder="' +
          (mode==='talk' ? t2('ph_talk') : t2('ph_teach')) + '"' + (chatBusy?' disabled':'') +
          ' oninput="chatDraft=this.value;chatGrow(this)"' +
          ' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();chatSend();}">' +
          chatEsc(chatDraft) + '</textarea>' +
        '<button class="ch-send" id="ch-send" onclick="chatSend()"' + (chatBusy?' disabled':'') + '>' +
          ic('send',18) + '</button>' +
      '</div>' +
    '</div>';

  const inp = document.getElementById('ch-inp');
  if(inp && !chatBusy){ chatGrow(inp); }
  if(chatToEnd){
    chatToEnd = false;
    setTimeout(function(){ window.scrollTo(0, document.body.scrollHeight); }, 20);
  }else{
    window.scrollTo(0, 0);
  }
}
let chatToEnd = false;

function chatGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

async function chatSend(){
  if(chatBusy) return;
  const inp = document.getElementById('ch-inp');
  const q = ((inp && inp.value) || chatDraft || '').trim();
  if(!q) return;
  chatLog.push({ r:'u', t:q.slice(0, 1200) });
  chatDraft = '';
  chatBusy = true;
  chatToEnd = true;
  chatSaveLog();
  renderChat();
  try{
    const prompt = chatPrompt(q);
    const txt = await aiAsk(prompt);
    chatLog.push({ r:'a', t:String(txt).trim() });
  }catch(e){
    chatLog.push({ r:'a', t:(e && e.message ? e.message : aiErrText('other')) });
  }
  chatBusy = false;
  chatToEnd = true;
  chatSaveLog();
  renderChat();
}

// ─── кнопка чата во всех хедерах ───
function mountChatBtn(){
  if(!meta.name) return;
  const hs = document.querySelectorAll('.header');
  for(let i=0;i<hs.length;i++){
    const h = hs[i];
    if(h.querySelector('.ch-btn')) continue;
    if(document.getElementById('chat-screen')) continue;
    let r = h.querySelector('.header-right');
    if(!r){ r = document.createElement('div'); r.className = 'header-right'; h.appendChild(r); }
    const b = document.createElement('button');
    b.className = 'back-btn ch-btn';
    b.setAttribute('aria-label', t2('title'));
    b.innerHTML = ic('chat',15);
    b.onclick = openChat;
    r.insertBefore(b, r.firstChild);
  }
}

// ─── запоминаем экран, чтобы вернуться из чата ───
function wrapScreens(){
  const names = ['renderCourses','renderLessons','renderLesson','render','renderWords',
                 'renderSchedule','renderDialogs','renderDialog','renderMyWords',
                 'renderMyDecks','renderStats','renderImport'];
  names.forEach(function(n){
    const f = window[n];
    if(typeof f !== 'function' || f.__wrapped) return;
    const w = function(){
      const a = Array.prototype.slice.call(arguments);
      lastScreen = function(){ f.apply(null, a); };
      return f.apply(null, a);
    };
    w.__wrapped = true;
    window[n] = w;
  });
  const app = document.getElementById('app');
  if(app && typeof MutationObserver !== 'undefined'){
    new MutationObserver(function(){ mountChatBtn(); }).observe(app, { childList:true });
  }
  mountChatBtn();
}

function bootApp(){
  cloudGet(['ro_meta','ro_progress'], function(res){
    if(res){
      // облако новее или локально пусто — берём облако
      try{
        const cm = res.ro_meta ? JSON.parse(res.ro_meta) : null;
        const cp = res.ro_progress ? JSON.parse(res.ro_progress) : null;
        const localEmpty = !meta.name && Object.keys(progress).length === 0;
        const cloudBetter = cm && (localEmpty || (cm.dayCount||0) > (meta.dayCount||0));
        if(cloudBetter){
          meta = cm;
          if(!meta.mistakes) meta.mistakes = [];
          if(cp) progress = cp;
          try{
            localStorage.setItem('ro_meta', JSON.stringify(meta));
            localStorage.setItem('ro_progress', JSON.stringify(progress));
          }catch(e){}
        }
      }catch(e){}
    }
    applyTheme();
    wrapScreens();
    goToLessons();
  });
}

bootApp();
