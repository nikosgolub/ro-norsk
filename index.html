let chatToEnd = false;

function chatLive(){
  const b = document.getElementById('ch-send');
  if(b) b.disabled = chatBusy || !(chatDraft||'').trim();
}
function chatAsk(q){
  if(chatBusy || !q) return;
  chatDraft = q;
  chatSend();
}
function chatGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

async function chatSend(){
  if(chatBusy) return;
  const inp = document.getElementById('ch-inp');
  const q = ((inp && inp.value) || chatDraft || '').trim();
  if(!q) return;
  chatLog.push({ r:'u', t:q.slice(0, 1200) });
  chatDraft = '';
  chatBusy = true;
  chatToEnd = true;
  chatSaveLog();
  renderChat();
  try{
    const prompt = chatPrompt(q);
    const txt = await aiAsk(prompt);
    chatLog.push({ r:'a', t:String(txt).trim() });
  }catch(e){
    chatLog.push({ r:'a', t:(e && e.message ? e.message : aiErrText('other')) });
  }
  chatBusy = false;
  chatToEnd = true;
  chatSaveLog();
  renderChat();
}

// ─── закреплённая кнопка чата внизу справа ───
let chatFab = null;
function mountChatBtn(){
  if(!chatFab){
    chatFab = document.createElement('button');
    chatFab.className = 'ch-fab off';
    chatFab.setAttribute('aria-label', t2('title'));
    chatFab.innerHTML = ic('ai',26);
    chatFab.onclick = openChat;
    document.body.appendChild(chatFab);
  }
  const ready = !!(meta.name && meta.goalsSet && meta.onb);
  const blocked = !!document.querySelector('.welcome')
               || !!document.getElementById('chat-screen')
               || !!document.querySelector('.modal-back')
               || !!document.querySelector('.tour-mask')
               || !!document.querySelector('.allwin');
  chatFab.className = 'ch-fab' + ((ready && !blocked) ? '' : ' off');
}

// ─── запоминаем экран, чтобы вернуться из чата ───
// ─── ПОЯВЛЕНИЕ ЭКРАНОВ ────────────────────────────────
// Отрисовка в приложении одна и та же: render() зовётся и при переходе на экран,
// и на каждый тап по слову. Анимировать всё — получится мельтешение, поэтому
// здесь единственная точка решения: играем только когда экран действительно
// сменился. Направление берём из глубины иерархии — вглубь приходит справа,
// назад уходит влево. Внутри упражнения отдельно оживляем карточку вопроса.
const SC_DEPTH = {welcome:0,lang:0,onboarding:0,name:0,goals:0,
  courses:1,
  goaledit:2,schedule:2,stats:2,whatsnew:2,lessons:2,mydecks:2,
  lesson:3,dialogs:3,mywords:3,import:3,
  exercise:4,words:4,dialog:4};
const SC_SUB = {pick:0, man:0.5};             // «настроить вручную» — на шаг глубже быстрого выбора
const SC_STAG = '.lesson-list,.block-list,.goal-list';
let scPrev = null, scSub = '', scQ = null;
function scReduced(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches); }
  catch(e){ return false; }
}
function scQKey(){
  return typeof state === 'object' && state ? (state.idx + '/' + (state.questions ? state.questions.length : 0)) : null;
}
function scPop(el){
  if(!el) return;
  el.classList.remove('pop-in');
  void el.offsetWidth;
  el.classList.add('pop-in');
}
function scEnter(app, dir){
  const way = dir > 0 ? 'sc-f' : dir < 0 ? 'sc-b' : '';
  function mark(el, delay, head){
    el.style.setProperty('--sd', delay + 's');
    el.classList.add('sc-a');
    if(head) el.classList.add('sc-h');
    else if(way) el.classList.add(way);
  }
  const kids = [].slice.call(app.children);
  // длинные списки оживают сами, по карточке, а не одним блоком
  const hosts = app.querySelectorAll ? [].slice.call(app.querySelectorAll(SC_STAG)) : [];
  for(let i=0;i<kids.length;i++){
    const base = Math.min(i,6) * 0.03;
    const host = hosts.indexOf(kids[i]) >= 0 ? kids[i] : null;
    if(host){
      const cs = host.children;
      for(let j=0;j<cs.length;j++) mark(cs[j], base + 0.04 + Math.min(j,9) * 0.035, false);
      continue;                               // сам список не анимируем — только карточки в нём
    }
    mark(kids[i], base, kids[i].classList && kids[i].classList.contains('header'));
  }
}
// ─── КАРТОЧКИ РАЗВОРАЧИВАЮТСЯ ПРИ ПРОКРУТКЕ ────────────────────────
// То, что уже на экране, играет обычную анимацию входа. Всё, что ниже сгиба,
// ждёт уменьшенным и разворачивается в момент появления — лист оживает по мере
// прокрутки, а не разом.
const RV_SEL = '.course-card,.lesson-card';
let rvObs = null;
function rvSetup(){
  if(scReduced()) return;
  if(typeof IntersectionObserver !== 'function') return;   // нет наблюдателя — пусть просто видно
  if(!rvObs){
    rvObs = new IntersectionObserver(function(list){
      for(let i=0;i<list.length;i++){
        if(!list[i].isIntersecting) continue;
        list[i].target.classList.add('rv-in');
        rvObs.unobserve(list[i].target);
      }
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  }
  const vh = window.innerHeight || 800;
  const all = document.querySelectorAll(RV_SEL);
  for(let i=0;i<all.length;i++){
    const el = all[i];
    if(el.dataset.rv) continue;
    // уже в кадре — не трогаем и не помечаем: раскладка ещё поедет, когда
    // дорисуются шрифты и обложки, и карточка может уехать за сгиб.
    if(el.getBoundingClientRect().top < vh * 0.92) continue;
    el.dataset.rv = '1';
    el.classList.remove('sc-a','sc-f','sc-b');
    el.classList.add('rv');
    rvObs.observe(el);
  }
}
// Первый проход идёт сразу, чтобы карточка не успела мелькнуть в полный рост,
// а повторные догоняют раскладку после шрифтов и обложек.
function rvSync(){
  rvSetup();
  try{
    requestAnimationFrame(rvSetup);
    setTimeout(rvSetup, 220);
  }catch(e){}
}

function scPaint(recs){
  if(recs && recs.length){
    let hit = false;
    for(let i=0;i<recs.length;i++) if(recs[i].target && recs[i].target.id === 'app') hit = true;
    if(!hit) return;                          // поменялось не на экране, а в body
  }
  const app = document.getElementById('app');
  if(!app) return;
  const sub = scSub; scSub = '';
  const prev = scPrev;
  scPrev = { s:screen, sub:sub };
  if(scReduced()) return;
  const fresh = !prev || prev.s !== screen || prev.sub !== sub;
  if(!fresh){
    if(screen === 'exercise'){
      const q = scQKey();
      if(q !== scQ){ scQ = q; scPop(document.getElementById('q-card')); }
    }
    return;
  }
  scQ = screen === 'exercise' ? scQKey() : null;
  if(sub === 'chat') return;                  // у чата своя анимация, из угла кнопки
  if(!prev){ scEnter(app, 0); return; }       // первый экран за сессию — просто поднимается
  const dir = prev.sub === 'chat' ? -1
    : (SC_DEPTH[screen]||0) + (SC_SUB[sub]||0) - (SC_DEPTH[prev.s]||0) - (SC_SUB[prev.sub]||0);
  scEnter(app, dir);
}

function wrapScreens(){
  const names = ['renderCourses','renderLessons','renderLesson','render','renderWords',
                 'renderSchedule','renderDialogs','renderDialog','renderMyWords',
                 'renderMyDecks','renderStats','renderImport'];
  names.forEach(function(n){
    const f = window[n];
    if(typeof f !== 'function' || f.__wrapped) return;
    const w = function(){
      const a = Array.prototype.slice.call(arguments);
      lastScreen = function(){ f.apply(null, a); };
      return f.apply(null, a);
    };
    w.__wrapped = true;
    window[n] = w;
  });
  const app = document.getElementById('app');
  if(typeof MutationObserver !== 'undefined'){
    const mo = new MutationObserver(function(recs){ mountChatBtn(); scPaint(recs); peelSync(); rvSync(); });
    if(app) mo.observe(app, { childList:true });
    mo.observe(document.body, { childList:true });
  }
  mountChatBtn();
}


// ─── СЛИЯНИЕ С ОБЛАКОМ БЕЗ ПОТЕРЬ ─────────────────────
// Раньше облачная копия целиком затирала локальную, если её dayCount был больше.
// Но dayCount — счётчик за сегодня, он обнуляется каждую ночь: вчерашние 80 «побеждали»
// сегодняшние 40 и стирали день вместе с целями и карточками. Теперь сливаем по полям.
function dayNum(s){
  if(!s) return -1;
  const a = String(s).split('-').map(Number);
  if(a.length < 3 || a.some(function(x){ return isNaN(x); })) return -1;
  return a[0]*10000 + a[1]*100 + a[2];
}
function uniqBy(list, keyOf){
  const seen = {}, out = [];
  (list||[]).forEach(function(x){
    if(!x) return;
    const k = keyOf(x);
    if(seen[k]) return;
    seen[k] = 1; out.push(x);
  });
  return out;
}
function pickByDate(out, a, b, dayKey, valKey){
  const da = dayNum(a[dayKey]), db = dayNum(b[dayKey]);
  if(db > da){ out[dayKey] = b[dayKey]; out[valKey] = b[valKey]||0; }
  else if(da > db){ out[dayKey] = a[dayKey]; out[valKey] = a[valKey]||0; }
  else { out[dayKey] = a[dayKey] || b[dayKey]; out[valKey] = Math.max(a[valKey]||0, b[valKey]||0); }
}
function mergeMeta(a, b){            // a — локальное, b — облачное
  if(!b) return a || {};
  if(!a || (!a.name && !a.day && !(a.log && Object.keys(a.log).length))) return b;
  const out = Object.assign({}, b, a);                 // настройки — локальные
  ['name','lang','theme','goal','lgoal','wgoal','chatmode','fs','seenVer','last'].forEach(function(k){
    out[k] = (a[k] !== undefined ? a[k] : b[k]);
  });
  out.onb = a.onb || b.onb;
  out.goalsSet = a.goalsSet || b.goalsSet;

  pickByDate(out, a, b, 'day', 'dayCount');            // фразы за день
  pickByDate(out, a, b, 'lday', 'lsec');               // секунды аудио за день
  out.streak = Math.max(a.streak||0, b.streak||0);

  out.log = {};                                        // журнал: максимум по каждому дню
  const days = {};
  Object.keys(a.log||{}).forEach(function(k){ days[k] = 1; });
  Object.keys(b.log||{}).forEach(function(k){ days[k] = 1; });
  Object.keys(days).forEach(function(k){
    const x = (a.log||{})[k] || {}, y = (b.log||{})[k] || {};
    out.log[k] = { p:Math.max(x.p||0, y.p||0), a:Math.max(x.a||0, y.a||0), w:Math.max(x.w||0, y.w||0) };
  });

  const hs = {};
  (a.hist||[]).concat(b.hist||[]).forEach(function(d){ if(d) hs[d] = 1; });
  out.hist = Object.keys(hs).sort(function(x,y){ return dayNum(x)-dayNum(y); }).slice(-400);

  out.mistakes = uniqBy((a.mistakes||[]).concat(b.mistakes||[]), function(m){ return m.no; }).slice(-50);
  out.my       = uniqBy((a.my||[]).concat(b.my||[]), function(w){ return ((w.n||w.no||'')+'').toLowerCase() + '|' + (w.set||''); });
  out.mysets   = uniqBy((a.mysets||[]).concat(b.mysets||[]), function(x){ return x.id; });

  out.srs = Object.assign({}, b.srs||{});              // SRS — дальше продвинутая ступень
  Object.keys(a.srs||{}).forEach(function(k){
    const x = a.srs[k], y = out.srs[k];
    out.srs[k] = (!y || (x.s||0) >= (y.s||0)) ? x : y;
  });
  return out;
}
function mergeProgress(a, b){
  if(!b) return a || {};
  if(!a) return b;
  const out = Object.assign({}, a);
  Object.keys(b).forEach(function(k){
    const x = a[k], y = b[k];
    if(!x || typeof x !== 'object'){ out[k] = y; return; }
    const m = Object.assign({}, y, x);
    Object.keys(y).forEach(function(f){
      const xv = x[f], yv = y[f];
      if(typeof xv === 'number' && typeof yv === 'number') m[f] = Math.max(xv, yv);
      else if(xv === undefined) m[f] = yv;
    });
    out[k] = m;
  });
  return out;
}

function bootApp(){
  cloudGet(function(res){
    if(res){
      // облако новее или локально пусто — берём облако
      try{
        const packed = cloudParse(res);
        const cm = packed.meta, cp = packed.progress;
        if(cm || cp){
          meta = mergeMeta(meta, cm);
          if(!meta.mistakes) meta.mistakes = [];
          progress = mergeProgress(progress, cp);
          // объединённое сразу возвращаем в облако, чтобы оно не оставалось устаревшим
          persist('ro_meta', JSON.stringify(meta));
          persist('ro_progress', JSON.stringify(progress));
        }
      }catch(e){}
    }
    applyTheme();
    sndLoad();                       // опись записей — заранее, до первого нажатия
    initTelegram();
    wrapScreens();
    goToLessons();
  });
}

bootApp();
