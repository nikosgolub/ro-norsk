// ─── ОБЛАКО TELEGRAM ───────────────────────────────────────────────
// В CloudStorage один ключ держит 4096 байт, а ro_meta к середине курса
// весит 15 КБ и дальше растёт. Поэтому режем данные на куски по ключам
// ro_m0…, ro_p0… и держим опись в ro_i. Старые ключи ro_meta / ro_progress
// по-прежнему читаются и пишутся, пока данные в них помещаются.
const CL_CHUNK = 3800;            // байт в одном ключе, с запасом до лимита
const CL_MAX = { m:20, p:4 };     // максимум кусков на meta и progress
const CL_LOG_DAYS = 400;          // сколько дней журнала уезжает в облако
const clSent = {};                // что уже лежит в облаке — лишнего не шлём
let clIdx = { m:0, p:0 };
let clTimer = null;

function clChunks(str){
  if(typeof TextEncoder === 'undefined' || typeof TextDecoder === 'undefined') return [str];
  const b = new TextEncoder().encode(str);
  const dec = new TextDecoder();
  const out = [];
  let i = 0;
  while(i < b.length){
    let end = Math.min(i + CL_CHUNK, b.length);
    while(end > i && end < b.length && (b[end] & 0xC0) === 0x80) end--;   // не режем символ пополам
    out.push(dec.decode(b.subarray(i, end)));
    i = end;
  }
  return out.length ? out : [''];
}
function clSet(key, val){
  if(clSent[key] === val) return;
  try{ TG.CloudStorage.setItem(key, val, function(){}); clSent[key] = val; }catch(e){}
}
function clDrop(key){
  try{ TG.CloudStorage.removeItem(key, function(){}); }catch(e){}
  delete clSent[key];
}
function clTrim(obj){                       // в облако едет журнал только за CL_LOG_DAYS
  if(!obj || !obj.log) return obj;
  const days = Object.keys(obj.log);
  if(days.length <= CL_LOG_DAYS) return obj;
  const out = Object.assign({}, obj);
  out.log = {};
  days.sort(function(x,y){ return (+y) - (+x); }).slice(0, CL_LOG_DAYS)
      .forEach(function(d){ out.log[d] = obj.log[d]; });
  return out;
}
function clPush(){
  if(!(TG && TG.CloudStorage)) return;
  const pack = [['m', clTrim(meta), CL_MAX.m, 'ro_meta'], ['p', progress, CL_MAX.p, 'ro_progress']];
  const idx = {};
  pack.forEach(function(e){
    let parts;
    try{ parts = clChunks(JSON.stringify(e[1])); }catch(err){ idx[e[0]] = clIdx[e[0]] || 0; return; }
    if(parts.length > e[2]){ idx[e[0]] = clIdx[e[0]] || 0; return; }      // не влезло — не портим облако
    parts.forEach(function(str, i){ clSet('ro_' + e[0] + i, str); });
    for(let i = parts.length; i < (clIdx[e[0]] || 0); i++) clDrop('ro_' + e[0] + i);
    if(parts.length === 1) clSet(e[3], parts[0]);                        // старый ключ, пока влезает
    else clDrop(e[3]);                                                   // перерос — старый ключ убираем,
                                                                         // чтобы он не всплыл устаревшим
    idx[e[0]] = parts.length;
  });
  clIdx = idx;
  clSet('ro_i', JSON.stringify(idx));
}
function clFlush(){ if(clTimer){ clearTimeout(clTimer); clTimer = null; clPush(); } }

function persist(key,val){
  try{ localStorage.setItem(key,val); }catch(e){}
  if(!(TG && TG.CloudStorage)) return;
  if(key === 'ro_meta' || key === 'ro_progress'){
    if(clTimer) clearTimeout(clTimer);
    clTimer = setTimeout(function(){ clTimer = null; clPush(); }, 1200);
    return;
  }
  try{ TG.CloudStorage.setItem(key,val,function(){}); }catch(e){}
}
try{
  document.addEventListener('visibilitychange', function(){ if(document.hidden) clFlush(); });
  window.addEventListener('pagehide', clFlush);
}catch(e){}
function buzz(kind){
  if(TG && TG.HapticFeedback){
    try{
      if(kind==="tap"){
        if(TG.HapticFeedback.selectionChanged) TG.HapticFeedback.selectionChanged();
        else TG.HapticFeedback.impactOccurred("light");
      }
      else if(kind==="soft"){ TG.HapticFeedback.impactOccurred("soft"); }
      else if(kind==="win"){ TG.HapticFeedback.notificationOccurred("success"); }
      else if(kind==="ok"){ TG.HapticFeedback.impactOccurred("light"); }
      else { TG.HapticFeedback.notificationOccurred("error"); }
    }catch(e){}
    return;
  }
  if(typeof navigator!=="undefined" && navigator.vibrate){
    try{ navigator.vibrate(
      kind==="tap" ? 10
      : kind==="soft" ? 16
      : kind==="win" ? [50,50,50,50,150]
      : kind==="ok" ? 25
      : [60,40,60]); }catch(e){}
  }
}
function canShare(){ return !!(TG || (typeof navigator!=="undefined" && navigator.share)); }
function shareText(t){
  if(TG && TG.openTelegramLink){
    TG.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent("https://t.me") + "&text=" + encodeURIComponent(t));
    return;
  }
  if(typeof navigator!=="undefined" && navigator.share){ navigator.share({text:t}).catch(function(){}); }
}

const LANGS_ALL = [["ru","Русский 🇷🇺"],["en","English 🇬🇧"],["uk","Українська 🇺🇦"],["pl","Polski 🇵🇱"],["es","Español 🇪🇸"]];
// Показываем только языки, для которых переведён и курс, а не один интерфейс.
const LANG_READY = ["ru","en"];
const LANGS = LANGS_ALL.filter(function(l){ return LANG_READY.indexOf(l[0]) >= 0; });
const ICP = {'<CH>':'grid','<KB>':'keyb','<HD>':'head','<SD>':'sound','<MC>':'mic','<RD>':'redo','<BK>':'book','<FL>':'flag','<CL>':'cal','<GL>':'target','<SH>':'share','<GC>':'cap','<TR>':'trophy','<OK>':'check','<NO>':'cross','<BT>':'bolt','<RL>':'ruler','<ER>':'ear','<CK>':'check','<CD>':'cards','<FR>':'fire','<TG>':'target'};
function t(k){
  const d = UI[meta.lang] || UI.ru;
  let v = (d[k]!==undefined ? d[k] : UI.ru[k]);
  if(v===undefined) return k;
  if(typeof v === 'string' && v.indexOf('<')>=0){
    v = v.replace(/<(CH|KB|HD|SD|MC|RD|BK|FL|CL|GL|SH|GC|TR|OK|NO|BT|RL|ER|CK|CD|FR|TG)>/g, function(m){ return ic(ICP[m]) + ' '; });
  }
  return v;
}
let PHRASE_BY_NO = null;
function phraseByNo(no){
  if(PHRASE_BY_NO === null){
    PHRASE_BY_NO = {};
    try{
      COURSES.forEach(function(c){
        (c.L || []).forEach(function(l){
          (l.parts || []).forEach(function(pt){
            pt.q.forEach(function(x){ if(!PHRASE_BY_NO[x.no]) PHRASE_BY_NO[x.no] = x; });
          });
        });
      });
    }catch(e){}
  }
  return PHRASE_BY_NO[no] || null;
}
function srcText(q){
  if(!meta.lang || meta.lang==='ru') return q.ru;
  if(q[meta.lang]) return q[meta.lang];
  if(q.en) return q.en;
  // старые записи в очереди повторения хранят только русский — достаём перевод из курса
  const full = q.no ? phraseByNo(q.no) : null;
  if(full && (full[meta.lang] || full.en)) return full[meta.lang] || full.en;
  return q.ru;
}
// Названия уроков, блоков и курсов: русский — исходный, остальные языки берут свой перевод.
function enLang(){ try{ return !!(typeof meta !== 'undefined' && meta && meta.lang && meta.lang !== 'ru'); }catch(e){ return false; } }
function tx(obj, field){
  if(!obj) return '';
  if(enLang()){
    const k = field + '_' + meta.lang;
    if(obj[k]) return obj[k];
    if(obj[field + '_en']) return obj[field + '_en'];
  }
  return obj[field] || '';
}
function lesTitle(l){ return tx(l,'title'); }
function lesSub(l){ return tx(l,'sub'); }
function partTitle(pt){ return tx(pt,'t'); }
function srcHTML(q){ return cueHTML(srcText(q)); }
// Уточнение в скобках — это подсказка о контексте, а не часть фразы: приглушаем,
// чтобы предложение читалось целиком, а пометка не спорила с ним за внимание.
function cueHTML(s){
  return String(s).replace(/\(([^()]{2,40})\)/g, function(m, inner){
    return '<span class="q-cue">(' + inner + ')</span>';
  });
}
function wordSrc(w){ if(!meta.lang || meta.lang==='ru') return w.r; return w[meta.lang] || w.en || w.r; }

// ─── META: streak, daily goal, mistakes ───

if(!meta.mistakes) meta.mistakes = [];

const GOAL_OPTS = [

function logAdd(field, n){

}
function dstrOf(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function logOf(d){ return (meta.log||{})[dstrOf(d)] || {p:0,a:0,w:0}; }

function addListen(sec){
  const t = dstr(0);
  if(meta.lday!==t){ meta.lday = t; meta.lsec = 0; }
  meta.lsec = (meta.lsec||0) + sec;
  logAdd('a', sec);
  saveMeta();
  checkRings();
}
function todayCount(){ return meta.day===dstr(0) ? (meta.dayCount||0) : 0; }
function streakCount(){ return (meta.day===dstr(0)||meta.day===dstr(-1)) ? (meta.streak||0) : 0; }
function bumpDaily(){
  const t = dstr(0);
  if(meta.day!==t){
    meta.streak = (meta.day===dstr(-1)) ? (meta.streak||0)+1 : 1;
    meta.day = t; meta.dayCount = 0;
  }
  meta.dayCount = (meta.dayCount||0)+1;
  logAdd('p', 1);
  checkRings();
  if(!meta.hist) meta.hist = [];
  if(meta.hist.indexOf(t)<0){ meta.hist.push(t); if(meta.hist.length>400) meta.hist.shift(); }
  saveMeta();
}
// Повторение фраз по тем же интервалам, что и карточки слов. Состояние по каждой из

const RECAP_DAYS = 3;      // через сколько дней урок можно подмешивать в повторение
const RECAP_MAX = 12;      // сколько старых фраз берём за один заход
const MIST_MAX = 20;       // сколько ошибок берём за один заход
const MIST_DECK = 60;      // сколько ошибок всего помещается в колоду
function addMistake(q){

function recapPool(){
  const out = [], t = dnum();

  for(let l=0;l<LESSONS.length;l++){
    const rec = progress[K(l)] || {};
    if(rec.ts === undefined || t - rec.ts < RECAP_DAYS) continue;
    const parts = (LESSONS[l] && LESSONS[l].parts) || [];
    for(let p=0;p<parts.length;p++){
      const done = partProgress(l,p);
      if(!done) continue;
      const qs = (parts[p] && parts[p].q) || [];

function ringArc(pct,size,stroke,color,offsetR,idx,noTrack){
  const r = (size-stroke)/2 - (offsetR||0);
  const c = 2*Math.PI*r;
  const cx = size/2, cy = size/2;
  const base = (idx||0)*0.12;
  function arc(p, lap, col){
    const off = c*(1 - Math.max(0, Math.min(p,100))/100);
    const d = base + lap*0.22;
    return '<circle class="ring-arc' + (p>=100?' done':'') + (lap?' ring-lap':'') +
      '" style="animation-delay:' + d + 's" cx="' + cx + '" cy="' + cy + '" r="' + r +
      '" fill="none" stroke="' + col + '" stroke-width="' + stroke +
      '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c +
      '" data-off="' + off + '" data-delay="' + d + '"/>';
  }
  // Ореолу дорожка не нужна: размывать матовую подложку бессмысленно.
  let out = noTrack ? '' : ('<circle cx="' + cx + '" cy="' + cy + '" r="' + r +
    '" fill="none" stroke="var(--rtrack)" stroke-width="' + stroke + '"/>');
  if(pct <= 100) return out + arc(pct, 0, color);
  const rest = pct - Math.floor(pct/100)*100;
  // ровно N кругов без остатка — просто закрытое кольцо
  if(rest === 0) return out + arc(100, 0, color);
  // план перевыполнен: закрытый круг приглушается, текущий виток идёт поверх
  out += arc(100, 0, 'var(--rdone)');
  out += arc(rest, 1, color);
  return out;
}

// ─── КОЛЬЦА УХОДЯТ ЗА КАРТОЧКУ ─────────────────────────────────────
// Кольца липнут к верху экрана, карточка наезжает на них снизу. Стекло
// полупрозрачное, поэтому просто спрятать за ним кольцо нельзя — оно читалось
// бы сквозь подписи. Вместо этого двигаем срез маски по верхней кромке
// карточки: что ушло под стекло, то плавно растворяется.
let peel = {raf:0, on:false};
function peelBox(){ return document.querySelector('.hero-stack'); }
function peelPaint(){
  peel.raf = 0;
  const st = peelBox();
  if(!st){ peelStop(); return; }
  const hero = st.querySelector('.rings-hero'), card = st.querySelector('.hero');
  if(!hero || !card) return;
  const h = hero.offsetHeight || 0;
  if(!h) return;
  const y = window.pageYOffset || document.documentElement.scrollTop || 0;
  // 1. Отставание кольца от страницы. Доезжает до предела и дальше уходит наверх
  //    вместе со всем остальным — ничего не зависает на экране.
  st.style.setProperty('--par', Math.min(y * 0.7, h * 0.75).toFixed(1));
  // 2. Срез маски — по кромке карточки. Замеряем ПОСЛЕ сдвига: иначе срез
  //    отставал бы на один кадр и тянулся бы за кольцом шлейфом.
  const cut = Math.max(-54, card.getBoundingClientRect().top - hero.getBoundingClientRect().top);
  hero.style.setProperty('--cut', cut.toFixed(1) + 'px');
  // 3. Кольцо ужимается ровно в такт тому, как карточка на него наезжает: считаем
  //    не прокрутку, а саму встречу. Иначе между ними разошлась бы пустая полоса.
  st.style.setProperty('--sc', Math.max(0, Math.min(1, (h - cut) / (h * 0.59))).toFixed(3));
  // 4. Плашки живут своей жизнью: тают от первого же движения пальца.
  const sy = Math.max(0, Math.min(1, y / 90));
  st.style.setProperty('--sy', sy.toFixed(3));
  const chips = st.querySelector('.stat-float');
  if(chips) chips.style.pointerEvents = sy > 0.5 ? 'none' : 'auto';
}
function peelTick(){ if(!peel.raf) peel.raf = requestAnimationFrame(peelPaint); }
function peelStart(){
  if(peel.on) return;
  peel.on = true;
  try{
    window.addEventListener('scroll', peelTick, {passive:true});
    window.addEventListener('resize', peelTick);
  }catch(e){}

}
function peelStop(){
  if(!peel.on) return;
  peel.on = false;
  try{
    window.removeEventListener('scroll', peelTick);
    window.removeEventListener('resize', peelTick);
  }catch(e){}
  if(peel.raf){ cancelAnimationFrame(peel.raf); peel.raf = 0; }
}
function peelSync(){
  if(document.hidden || !peelBox()) peelStop();

  // поэтому пересчитываем их сразу, не дожидаясь первой прокрутки.
  else { peelStart(); peelTick(); }

// Пылинки у свечения: садятся вдоль пройденной части дуги и медленно всплывают.

function auroraDust(size, stroke, pct, offsetR, idx){
  if(!pct || pct < 4 || size < 120) return '';          // на мелких кольцах это мусор
  const r = (size-stroke)/2 - (offsetR||0);
  const c = size/2;
  const col = ['var(--r1)','var(--r2)','var(--r3)'][idx] || 'var(--r1)';
  const span = Math.min(pct, 100)/100;
  const n = Math.max(4, Math.round(span * (idx===0 ? 44 : 28)));
  let out = '';
  for(let i=0;i<n;i++){
    const j = function(k){ const x = Math.sin((i+1)*12.9898 + k*78.233 + idx*5.1) * 43758.5453; return x - Math.floor(x); };
    const a = 2*Math.PI * span * ((i + 0.35 + j(1)*0.3) / n);
    const rr = r + (j(2)-0.5) * stroke * 2.2;
    const x = c + rr*Math.cos(a), y = c + rr*Math.sin(a);

    const mx = (Math.cos(a) * (2 + j(3)*4)).toFixed(1), my = (Math.sin(a) * (2 + j(3)*4)).toFixed(1);

}

function goalCur(k){
  if(k==='p') return DAILY_GOAL;
  if(k==='a') return LISTEN_GOAL;

function goalStep(k, dir){
  const d = GOAL_DEF[k], cur = goalDraft[k], st = d.step;
  // с некруглого значения первый шаг подтягивает к ближайшему кратному 10
  let v = dir > 0 ? Math.floor(cur/st)*st + st : Math.ceil(cur/st)*st - st;
  v = Math.max(d.min, Math.min(d.max, v));
  if(v === goalDraft[k]) return;
  goalDraft[k] = v;
  buzz('ok');
  renderGoalEdit(true);
}

function renderLessons(){
  if(!LESSONS || !LESSONS.length){ renderCourses(); return; }   // курс без уроков
  screen = "lessons";
  const grand = totalPhrases();
  const solvedAll = totalSolved();
  const overallPct = Math.round(solvedAll/grand*100);
  const wTotal = wordsAllTotal();
  const wKnown = wordsAllKnown();
  const wPct = Math.round(wKnown/wTotal*100);

  const cards = LESSONS.map((l,i) => {
    const total = lessonTotal(i);
    const solved = lessonSolved(i);
    const pct = Math.round(solved/total*100);
    const unlocked = lessonUnlocked(i);
    const expired = isExpired(i);
    const done = examPassed(i) && !expired;
    let cls = 'lesson-card';
    if(!unlocked) cls += ' locked';
    else if(expired) cls += ' expired';
    else if(done) cls += ' done';
    const icon = !unlocked ? ic('lock',16) : expired ? ic('clock',16) : done ? ic('check',16) : (i+1);
    const note = !unlocked
      ? (enLang()?'<div class="lock-note">Pass the exam of lesson ':'<div class="lock-note">Сдай экзамен урока ') + i + (enLang()?' at 100%</div>':' на 100%</div>')
      : expired
        ? (enLang()?'<div class="expire-note">Passed — time to refresh</div>':'<div class="expire-note">Сдан — пора освежить</div>')
        : '';
    return '<div class="' + cls + '" onclick="' + (unlocked ? 'renderLesson(' + i + ')' : 'lockedHint(' + i + ')') + '">' +
      '<div class="lesson-num">' + icon + '</div>' +
      '<div class="lesson-info">' +
        '<div class="lesson-title">' + lesTitle(l) + '</div>' +
        (note || '<div class="lesson-sub">' + lesSub(l) + '</div>') +
      '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="lesson-mini-pct">' + pct + '%</div>' +
      '</div>' +
    '</div>';
  }).join("");

  const tc = todayCount();
  const goalHit = tc >= DAILY_GOAL;
  const sc = streakCount();
  let continueBtn = '';
  if(meta.last && (meta.last.c||0)===ci && lessonUnlocked(meta.last.l) && !lessonDone(meta.last.l)){
    continueBtn = '<button class="continue-btn" onclick="resumeLast()">' + t('cont') + ' ' + (meta.last.l+1) + ' · ' + lesTitle(LESSONS[meta.last.l]) + '</button>';
  }
  // Один урок за раз: список из двенадцати дел закрыть невозможно, и он читается как упрёк.
  const stale = staleOne();
  let expBanner = '';
  if(stale >= 0){

// ─── LESSON DETAIL PAGE ───
function partLockHint(p){
  alert((enLang()?'Block ':'Блок ') + (p+1) + (enLang()?' is locked.\n\nFirst pass the previous block with an accuracy of ':' закрыт.\n\nСначала сдай предыдущий блок с точностью ') + PART_PASS + (enLang()?"% — that's about one mistake every 25 phrases.":'% — это примерно одна ошибка на 25 фраз.'));
}
function examLockHint(){
  alert((enLang()?'The exam is locked.\n\nFirst pass all blocks of the lesson with an accuracy of ':'Экзамен закрыт.\n\nСначала сдай все блоки урока с точностью ') + PART_PASS + '%.');
}
function lockedHint(i){
  alert((enLang()?'Lesson ':'Урок ') + (i+1) + (enLang()?' is locked.\n\nTo open it, pass the exam of lesson ':' закрыт.\n\nЧтобы открыть его, сдай экзамен урока ') + i + (enLang()?' — one mistake is allowed out of ':' — допускается одна ошибка из ') + EXAM_N + '.');
}

function renderLesson(i){
  if(!LESSONS || !LESSONS[i]){ renderCourses(); return; }
  screen = "lesson";
  currentLessonIdx = i;
  const l = LESSONS[i];
  const total = lessonTotal(i);
  const solved = lessonSolved(i);

  const wt = wordsTotal(i);
  const wk = Math.min(wordsKnown(i).length, wt);
  const wpct = Math.round(wk/wt*100);
  const wfull = wk >= wt;
  const wordsCard =
    '<div class="block-card' + (wfull?' full':'') + '" onclick="startWords(' + i + ')">' +
      '<div class="block-num">' + ic('book',17) + '</div>' +
      '<div class="block-title">' + t('w_card') + (wfull?t('w_learned'):'') + '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + wpct + '%"></div></div>' +
        '<div class="lesson-mini-pct"' + '' + '>' + wpct + '%</div>' +
      '</div>' +
    '</div>';

  const blocks = l.parts.map((p,pi) => {
    const sz = p.q.length;
    const pd = partProgress(i,pi);
    const acc = partAcc(i,pi);
    const pct = acc;
    const passed = partPassed(i,pi);
    const full = passed;
    const open = partUnlocked(i,pi);
    return '<div class="block-card' + (full?' full':'') + (open?'':' locked') + '" onclick="' + (open ? 'startPart(' + i + ',' + pi + ')' : 'partLockHint(' + pi + ')') + '">' +
      '<div class="block-num">' + (passed?ic('check',16):open?(pi+1):ic('lock',16)) + '</div>' +
      '<div class="block-title">' + partTitle(p) + (open ? '' : (enLang()?' · locked':' · закрыт')) + '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + pct + '%"' + (full?' ':'') + '></div></div>' +
        '<div class="lesson-mini-pct"' + '' + '>' + pct + '%</div>' +
      '</div>' +
    '</div>';
  }).join("");

  let continueBtn = '';
  if(solved >= total){
    continueBtn = '<button class="continue-btn" onclick="startPart(' + i + ',0)">' + t('repeat_l') + '</button>';
  } else {
    let np = 0;
    for(let p=0;p<nParts(i);p++){ if(!partPassed(i,p) && partUnlocked(i,p)){ np = p; break; } }
    continueBtn = '<button class="continue-btn" onclick="startPart(' + i + ',' + np + ')">' + (solved>0?t('cont_b') + ' «' + partTitle(l.parts[np]) + '»':t('start_l')) + '</button>';
  }

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<div class="logo" onclick="renderCourses()">Ro!</div>' +
      '<div class="header-right"><button class="back-btn" onclick="renderLessons()">' + t('back_ls') + '</button></div>' +
    '</div>' +
    '<div class="detail-label">' + t('lesson') + ' ' + (i+1) + ' ' + t('l_of') + ' ' + LESSONS.length + '</div>' +
    '<div class="detail-title">' + lesTitle(l) + '</div>' +
    '<div class="detail-sub">' + lesSub(l) + '</div>' +
    '<div class="detail-count">' + t('phr_done') + ' ' + solved + ' ' + t('of') + ' ' + total + ' ' + t('phrases') + '</div>' +
    continueBtn +
    (function(){
      const es = examScore(i);
      const passed = examPassed(i);
      const exOpen = examUnlocked(i);
      return '<div class="block-list">' +
        '<div class="section-label">' + t('sec1') + '</div>' +
        wordsCard +
        '<div class="section-label">' + t('sec2') + '</div>' +
        blocks +
        '<div class="section-label">' + t('sec3') + '</div>' +
        '<div class="block-card exam-card' + (passed?' full':'') + (exOpen?'':' locked') + '" onclick="' + (exOpen ? 'startExam(' + i + ')' : 'examLockHint()') + '">' +
          '<div class="block-num">' + (exOpen?ic('cap',17):ic('lock',17)) + '</div>' +
          '<div class="block-title">' + t('exam') + (!exOpen ? (enLang()?' · pass all ' + nParts(i) + ' blocks at ':' · сдай ' + nParts(i) + ' ' + blockWord(nParts(i)) + ' на ') + PART_PASS + '%' : passed ? (isExpired(i) ? (enLang()?' — passed, worth refreshing':' — сдан, стоит освежить') : t('exam_ok')) : ' · ' + EXAM_N + (enLang()?' questions, one mistake allowed':' вопросов, одна ошибка допустима')) + '</div>' +
          (es > 0 ? '<div class="lesson-mini-pct"' + '' + '>' + es + '%</div>' : '') +
        '</div>' +
      '</div>';
    })();
}

function startNextPart(i){
  for(let p=0;p<nParts(i);p++){
    if(!partPassed(i,p) && partUnlocked(i,p)){ startPart(i,p); return; }
  }
  renderLesson(i);
}

function startPart(i,p){
  if(!LESSONS || !LESSONS[i] || !LESSONS[i].parts[p]){ renderCourses(); return; }
  if(!partUnlocked(i,p)){ partLockHint(p); return; }
  currentLessonIdx = i;
  currentPartIdx = p;
  screen = "exercise";
  state.review = false;
  state.exam = false;
  state.ai = false;
  meta.last = {c:ci, l:i, p:p}; saveMeta();
  state.questions = shuffle(LESSONS[i].parts[p].q);
  state.idx = 0;
  state.phase = "answering";
  state.feedback = null;
  state.selected = [];
  state.textVal = "";
  state.score = 0;
  state.correctCount = 0;
  state.retryUsed = false;
  state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

function startMistakes(){
  const q = reviewQueue();
  if(q.length===0){ renderCourses(); return; }
  screen = "exercise";
  state.review = true;
  state.exam = false;
  state.ai = false;
  state.questions = shuffle(q);
  state.idx = 0; state.phase = "answering"; state.feedback = null;
  state.selected = []; state.textVal = "";
  state.score = 0; state.correctCount = 0;
  state.retryUsed = false; state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

function startExam(i){
  if(!examUnlocked(i)){ examLockHint(); return; }
  currentLessonIdx = i;
  screen = "exercise";
  state.exam = true;
  state.review = false;
  state.ai = false;
  let all = [];
  LESSONS[i].parts.forEach(p => all = all.concat(p.q));
  state.questions = shuffle(all).slice(0, EXAM_N);
  state.idx = 0; state.phase = "answering"; state.feedback = null;
  state.selected = []; state.textVal = "";
  state.score = 0; state.correctCount = 0;
  state.retryUsed = false; state.retryMode = false;
  state.examHint = 0;
  state.hintAt = null;
  state.pool = makePool(state.questions[0].no);
  render();
}

          '<div class="complete-sub">' + (passed
            ? (enLang()?'Lesson "':'Урок «') + lesTitle(lesson) + (enLang()?'" mastered':'» покорён') + (errs ? (enLang()?' — one mistake does not count':' — одна ошибка не в счёт') : (enLang()?' without a single mistake':' без единой ошибки')) + '!<br>' + (currentLessonIdx+1 < LESSONS.length ? (enLang()?'Lesson unlocked: ':'Открыт урок ') + (currentLessonIdx+2) + ' — så flink du er!' : 'Så flink du er!')
            : (enLang()?'Mistakes: ':'Ошибок: ') + errs + (enLang()?' — only one is forgiven in the exam.<br>Go back to the blocks and try again, you will get there!':' — на экзамене прощается только одна.<br>Загляни в блоки и попробуй снова, всё получится!')) + '</div>' +

    setTimeout(launchFireworks, 60);

    const sub = !passedPart
      ? (enLang()?'Accuracy ':'Точность ') + acc + (enLang()?'% — you need ':'% — для допуска нужно ') + PART_PASS + (enLang()?'%.<br>One more round and this block will unlock the next.':'%.<br>Ещё один заход, и блок откроет следующий.')

function addWord(i){
  if(state.phase!=="answering")return;
  const w=state.pool[i];
  state.selected=[...state.selected,w];
  state.pool=state.pool.filter((_,j)=>j!==i);
  state.hintAt=null;
  buzz("tap");
  render();
}
function removeWord(i){
  if(state.phase!=="answering")return;
  const w=state.selected[i];
  state.pool=shuffle([...state.pool,w]);
  state.selected=state.selected.filter((_,j)=>j!==i);
  state.hintAt=null;
  buzz("tap");
  render();
}

// ─── ПЕРЕТАСКИВАНИЕ ЧИПОВ ─────────────────────────────
let drag = null, dragEatClick = false;
function dropIndex(box, x, y, skip){
  const chips = [].slice.call(box.querySelectorAll('.word-chip')).filter(function(c){ return c!==skip; });
  for(let k=0;k<chips.length;k++){
    const r = chips[k].getBoundingClientRect();
    if(y < r.top) return k;
    if(y <= r.bottom && x < r.left + r.width/2) return k;
  }
  return chips.length;
}
function overEl(el, x, y, pad){
  if(!el) return false;
  const r = el.getBoundingClientRect(); pad = pad||0;
  return x >= r.left-pad && x <= r.right+pad && y >= r.top-pad && y <= r.bottom+pad;
}
function dragClearMarks(){
  const c = document.querySelector('.drop-caret'); if(c) c.remove();
  const b = document.getElementById('builder-ans'); if(b) b.classList.remove('drop-over');
}
function dragStart(e){
  const r = drag.chip.getBoundingClientRect();
  drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
  const g = drag.chip.cloneNode(true);
  g.className = drag.chip.className.replace('hint-bounce','') + ' drag-ghost';
  g.removeAttribute('onclick');
  g.style.width = r.width + 'px';
  document.body.appendChild(g);
  drag.ghost = g;
  drag.chip.classList.add('dragging');
  drag.on = true;
  buzz('soft');            // слово «отлипло» от своего места
}
function dragMove(e){
  // слово висит над пальцем, чтобы было видно, куда оно ляжет
  drag.ghost.style.transform = 'translate(' + (e.clientX - drag.dx) + 'px,' + (e.clientY - drag.dy - 34) + 'px) scale(1.06)';
  const box = document.getElementById('builder-ans');
  dragClearMarks();
  if(overEl(box, e.clientX, e.clientY, 18)){
    box.classList.add('drop-over');
    const ph = box.querySelector('.placeholder'); if(ph) ph.style.visibility = 'hidden';
    const skip = drag.src==='ans' ? drag.chip : null;
    const k = dropIndex(box, e.clientX, e.clientY, skip);
    const chips = [].slice.call(box.querySelectorAll('.word-chip')).filter(function(c){ return c!==skip; });
    const caret = document.createElement('span'); caret.className = 'drop-caret';
    if(k < chips.length) box.insertBefore(caret, chips[k]); else box.appendChild(caret);
    if(drag.to !== k) buzz('tap');       // короткий отклик на каждую новую позицию
    drag.to = k;
  } else {
    const ph = box && box.querySelector('.placeholder'); if(ph) ph.style.visibility = '';
    drag.to = null;
  }
}
function dragEnd(e){
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.on) return;                       // был обычный тап — пусть сработает onclick
  dragEatClick = true;
  setTimeout(function(){ dragEatClick = false; }, 60);
  if(d.ghost) d.ghost.remove();
  dragClearMarks();
  if(state.phase!=="answering"){ render(); return; }
  const sel = state.selected.slice(), pool = state.pool.slice();
  if(d.to!==null && d.to!==undefined){
    let w;
    if(d.src==='pool'){ w = pool[d.i]; pool.splice(d.i,1); }
    else { w = sel[d.i]; sel.splice(d.i,1); }
    sel.splice(Math.min(d.to, sel.length), 0, w);
  } else if(d.src==='ans'){
    pool.push(sel[d.i]); sel.splice(d.i,1);   // вытащил из ответа — слово вернулось в набор
  } else { render(); return; }
  state.selected = sel; state.pool = pool; state.hintAt = null;
  buzz('tap');
  render();
}
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('pointerdown', function(e){
    if(state.phase!=="answering" || (e.button!==undefined && e.button!==0)) return;
    const chip = e.target && e.target.closest ? e.target.closest('.word-chip[data-src]') : null;
    if(!chip) return;
    drag = { chip:chip, src:chip.getAttribute('data-src'), i:+chip.getAttribute('data-i'),
             x0:e.clientX, y0:e.clientY, pid:e.pointerId, on:false, to:null };
  });
  document.addEventListener('pointermove', function(e){
    if(!drag || e.pointerId!==drag.pid) return;
    if(!drag.on){
      const dx = e.clientX-drag.x0, dy = e.clientY-drag.y0;
      if(dx*dx + dy*dy < 64) return;      // до 8px — это ещё тап
      dragStart(e);
    }
    e.preventDefault();
    dragMove(e);
  }, {passive:false});
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', function(){
    if(!drag) return;
    const d = drag; drag = null;
    if(d.ghost) d.ghost.remove();
    dragClearMarks();
    if(d.on) render();
  });
  document.addEventListener('click', function(e){
    if(dragEatClick){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}
function onTextInput(v){ state.textVal=v; }

function switchMode(m){
  state.mode=m;state.phase="answering";state.feedback=null;
  state.selected=[];state.textVal="";state.hintAt=null;
  state.retryUsed=false;state.retryMode=false;
  state.pool=makePool(state.questions[state.idx].no);
  render();
  if(m==="listen") speak(state.questions[state.idx].no);
}

function doSubmit(){
  if(state.phase==="revealed"){ advance(); return; }

  const userAnswer = state.mode==="text"
    ? state.textVal.trim()
    : state.selected.join(" ");

  if(!userAnswer) return;
  state.lastAnswer = userAnswer;
  const correct = state.questions[state.idx].no;

  // Одна бесплатная подсказка: первое неверное слово подпрыгивает, ошибка не засчитывается.
  // В обучении — на каждую фразу, на экзамене — одна на весь экзамен, чтобы случайный
  // промах не хоронил попытку, но проверка оставалась проверкой.
  const hintFree = state.exam
    ? !state.examHint
    : !(state.hintQs===state.questions && state.hintIdx===state.idx);
  if(!isCorrect(userAnswer,correct) && state.mode!=="text" && !state.retryMode && hintFree){
    let at = -1, far = -1;
    acceptedForms(correct).forEach(function(f){
      const ct = normalize(f).split(/\s+/).filter(Boolean);
      let a = -1;
      for(let k=0;k<state.selected.length;k++){ if(normalize(state.selected[k]) !== ct[k]){ a = k; break; } }
      const reach = a < 0 ? 1e9 : a;              // вариант, с которым ответ совпадает дольше всего
      if(reach > far){ far = reach; at = a; }
    });
    if(state.exam) state.examHint = 1;
    else { state.hintQs = state.questions; state.hintIdx = state.idx; }
    state.hintAt = at;
    buzz('err');
    render();
    return;
  }

  if(isCorrect(userAnswer,correct)){
    if(!state.retryMode){ state.score++; }
    state.correctCount += state.retryMode ? 0 : 1;
    const alt = normalize(userAnswer) !== normalize(correct);
    state.feedback={type:"ok", alt:alt, canon:correct, v2:alt && timeAt(normalize(correct).split(' '),0)>0};
    buzz("ok");
    if(state.review) promoteMistake(correct);
  } else {
    if(!state.retryMode) addMistake(state.questions[state.idx]);
    const target = closestForm(userAnswer, correct);
    state.target = target;
    const diff = diffAnswers(userAnswer,target);
    const dg = diagnose(userAnswer,target);
    state.feedback = (dg && dg.order)
      ? {type:"v2",diag:dg,diff}
      : {type:"err",diag:dg,diff};
    buzz("err");
    setTimeout(()=>{
      const c = document.getElementById("q-card");
      if(c){ c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"),450); }
    },10);
  }
  state.phase="revealed";
  render();
}

function doRetry(){
  state.retryUsed = true;
  state.retryMode = true;
  state.phase = "answering";
  state.feedback = null;
  state.selected = [];
  state.textVal = "";
  state.hintAt = null;
  state.pool = makePool(state.questions[state.idx].no);
  render();
}

function advance(){
  const next=state.idx+1;
  bumpDaily();
  if(!state.review && !state.exam && !state.ai) setPartProgress(currentLessonIdx, currentPartIdx, next);
  if(!state.review && !state.ai) touchLesson(currentLessonIdx);
  if(next>=state.questions.length){state.phase="done";render();return;}
  state.idx=next;state.phase="answering";state.feedback=null;
  state.selected=[];state.textVal="";state.hintAt=null;
  state.retryUsed=false;state.retryMode=false;
  state.pool=makePool(state.questions[next].no);
  render();
}

// ─── FLASHCARDS (с SRS) ──────────────────────────────
let wordsState = { deck: [], flipped: false, mode: "no-ru", review: false, my: false };

function startWords(i){
  if(!WORDS || !WORDS[i]){ renderCourses(); return; }
  currentLessonIdx = i;
  screen = "words";
  const known = new Set(wordsKnown(i));
  let deck = [];
  WORDS[i].forEach((w,wi)=>{ if(!known.has(wi)) deck.push({l:i,wi:wi}); });
  if(deck.length===0) deck = WORDS[i].map((_,wi)=>({l:i,wi:wi}));
  wordsState.deck = shuffle(deck);
  wordsState.flipped = false;
  wordsState.review = false;
  wordsState.my = false;
  renderWords();
}

function startWordsReview(){
  const due = srsDue();
  if(due.length===0){ renderCourses(); return; }
  screen = "words";
  wordsState.deck = shuffle(due);
  wordsState.flipped = false;
  wordsState.review = true;
  wordsState.my = false;
  renderWords();
}

function renderWords(){
  const rev = wordsState.review;

  if(wordsState.deck.length===0){
    const i = currentLessonIdx;
    let btn, sub, icon, title;
    if(wordsState.my){
      icon=ic('cards',44); title=(enLang()?'Words reviewed!':'Слова повторены!');
      sub=(enLang()?'Great work on your own vocabulary.<br>Words come back at intervals of 1 · 3 · 7 · 14 · 30 days.':'Отличная работа со своим словарём.<br>Слова вернутся по интервалам 1 · 3 · 7 · 14 · 30 дней.');
      btn=(enLang()?'<button class="restart-btn" onclick="renderMyWords()">To My Words</button>':'<button class="restart-btn" onclick="renderMyWords()">К моим словам</button>');
    } else if(rev){
      icon=ic('cards',44); title=t('w_rev_done');
      sub=(enLang()?'Memory reinforced. Words come back<br>at intervals: 1 · 3 · 7 · 14 · 30 days.':'Память укреплена. Слова вернутся<br>по интервалам: 1 · 3 · 7 · 14 · 30 дней.');
      btn=(enLang()?'<button class="restart-btn" onclick="renderCourses()">Home</button>':'<button class="restart-btn" onclick="renderCourses()">На главную</button>');
    } else {
      const np=(function(){for(let p=0;p<nParts(i);p++){if(!partDone(i,p))return p;}return 0;})();
      icon=ic('book',44); title=t('w_done');
      sub=(enLang()?'All ':'Все ')+WORDS[i].length+(enLang()?' words from the lesson "':' слов урока «')+lesTitle(LESSONS[i])+(enLang()?'" in the bag.<br>Now phrases will come together on their own!':'» в кармане.<br>Теперь фразы соберутся сами собой!');
      btn='<button class="restart-btn" onclick="startPart('+i+','+np+(enLang()?')">To phrases: "':')">К фразам: «')+partTitle(LESSONS[i].parts[np])+'» →</button>';
    }
    document.getElementById("app").innerHTML =
      '<canvas id="fw"></canvas>' +
      '<div class="header">' +
        '<div class="logo" onclick="renderCourses()">Ro!</div>' +
        '<div class="header-right"><button class="back-btn" onclick="' + (wordsState.my?'renderMyWords()':(rev?'renderCourses()':'renderLesson('+i+')')) + '">' + (wordsState.my?(enLang()?'← My Words':'← Мои слова'):(rev?(enLang()?'← Home':'← Главная'):(enLang()?'← Lesson':'← Урок'))) + '</button></div>' +
      '</div>' +
      '<div class="card complete" style="margin-top:2rem">' +
        '<div class="words-done-icon">' + icon + '</div>' +
        '<div class="complete-title">' + title + '</div>' +
        '<div class="complete-sub">' + sub + '</div>' + btn +
      '</div>';
    buzz("win");
    setTimeout(launchFireworks, 60);
    return;
  }

  const cur = wordsState.deck[0];
  const w = cur.my ? cur.w : WORDS[cur.l][cur.wi];
  const front = wordsState.mode==="no-ru" ? w.n : (cur.my ? w.r : wordSrc(w));
  const back  = wordsState.mode==="no-ru" ? (cur.my ? w.r : wordSrc(w)) : w.n;
  let headChip, metaSpan;
  if(wordsState.my){
    headChip = ic('cards',14) + ' ' + wordsState.deck.length;
    metaSpan = (enLang()?'My Words':'Мои слова');
  } else if(rev){
    headChip = ic('cards',14) + (enLang()?' left ':' осталось ') + wordsState.deck.length;
    metaSpan = t('w_srs');
  } else {
    const list = WORDS[currentLessonIdx];
    const kc = Math.min(wordsKnown(currentLessonIdx).length, list.length);
    headChip = '' + ic('book',14) + ' ' + kc + ' / ' + list.length;
    metaSpan = t('w_of') + ' ' + (currentLessonIdx+1);

  document.getElementById("app").innerHTML =

      '<button class="mode-btn ' + (wordsState.mode==="ru-no"?"active":"") + '" onclick="switchWordsMode(\'ru-no\')">' + helpFlag() + ' ' + helpLang() + ' → NO</button>' +
    '</div>' +
    '<div class="word-stage" onclick="flipWord()">' +
      '<div class="word-main">' + front + '</div>' +
      (wordsState.flipped
        ? '<div class="word-divider"></div><div class="word-back">' + back + '</div>'
        : '<div class="word-hint">' + t('tap_f') + '</div>') +
      '<button class="listen-btn" onclick="event.stopPropagation();speak(' + JSON.stringify(w.n) + ')">' + t('listen') + '</button>' +
    '</div>' +
    '<div class="btn-row">' +
      '<button class="submit-btn retry-btn" onclick="wordAgain()">' + t('again') + '</button>' +
      '<button class="submit-btn" onclick="wordKnow()">' + t('know') + '</button>' +
    '</div>' +
    '<div class="deck-count">' + t('deck') + ' ' + wordsState.deck.length + '</div>';
}

function flipWord(){ wordsState.flipped = !wordsState.flipped; renderWords(); }
function switchWordsMode(m){ wordsState.mode = m; wordsState.flipped = false; renderWords(); }
function wordKnow(){
  const cur = wordsState.deck.shift();
  if(cur.my){
    logWord();
    const s = Math.min((cur.w.s||0)+1, SRS_INT.length);
    cur.w.s = s; cur.w.d = dnum() + SRS_INT[s-1];
    saveMeta(); wordsState.flipped = false; renderWords(); return;
  }
  addKnownWord(cur.l, cur.wi);
  srsPromote(cur.l, cur.wi);
  wordsState.flipped = false;
  renderWords();
}
function wordAgain(){
  const cur = wordsState.deck[0];
  if(cur.my){
    cur.w.s = 0; cur.w.d = dnum(); saveMeta();
    wordsState.deck.push(wordsState.deck.shift());
    wordsState.flipped = false; renderWords(); return;
  }
  srsReset(cur.l, cur.wi);
  wordsState.deck.push(wordsState.deck.shift());
  wordsState.flipped = false;
  renderWords();
}

function backupAll(){

  try{
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ro-backup-' + dstr(0) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
  }catch(e){ alert((enLang()?"Couldn't save backup":'Не удалось сохранить копию')); }
}
function pickBackup(){ const f = document.getElementById('bk-file'); if(f && f.click) f.click(); }
function loadBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = function(){
    try{
      const d = JSON.parse(String(rd.result||''));
      if(!d.meta) throw new Error('bad');
      askConfirm((enLang()?'Restore your progress?':'Восстановить прогресс?'), (enLang()?'Your current data will be replaced with the copy from ':'Текущие данные будут заменены копией от ') + new Date(d.ts||Date.now()).toLocaleDateString() + '.', function(){
        meta = d.meta; if(!meta.mistakes) meta.mistakes = [];
        progress = d.progress || {};
        saveMeta(); saveProgress();
        buzz('win');
        applyTheme(); restoreCourse(); renderCourses();
      });
    }catch(err){ alert((enLang()?'File not recognised':'Файл не распознан')); }
  };
  rd.readAsText(file);
}

function toggleDay(i){
  const s = sched();
  const ix = s.days.indexOf(i);
  if(ix>=0) s.days.splice(ix,1); else s.days.push(i);
  saveMeta(); renderSchedule();
}
function setSchedTime(v){ sched().time = v || '19:00'; saveMeta(); }

function schedRule(){
  const s = sched();
  if(s.days.length===0){ alert(t('pick_days')); return null; }
  const BY = ['MO','TU','WE','TH','FR','SA','SU'];
  const hm = (s.time||'19:00').split(':');
  const now = new Date();
  let st = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +hm[0], +hm[1]);
  while(s.days.indexOf((st.getDay()+6)%7)<0 || st < now) st = new Date(st.getTime()+864e5);
  const p = n => (n<10?'0':'')+n;
  const fmt = d => d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  return { start: fmt(st), end: fmt(new Date(st.getTime()+20*60000)), by: s.days.map(d=>BY[d]).join(',') };
}

function addToGoogleCal(){
  const r = schedRule();
  if(!r) return;
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent('Ro! — norsk') +
    '&details=' + encodeURIComponent((enLang()?'Scheduled session: one lesson in Ro!':'Запланированная сессия: один урок в Ro!')) +
    '&dates=' + r.start + '/' + r.end +

function downloadICS(){
  const r = schedRule();
  if(!r) return;
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ro//NO','BEGIN:VEVENT',
    'UID:ro-' + Date.now() + '@ro.app','DTSTART:' + r.start,'DTEND:' + r.end,
    'RRULE:FREQ=WEEKLY;BYDAY=' + r.by,'SUMMARY:Ro! — norsk',
    (enLang()?'DESCRIPTION:Scheduled session in Ro!':'DESCRIPTION:Запланированная сессия в Ro!'),
    'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:Ro!','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  try{
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ro-norsk.ics';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
  }catch(e){
    alert((enLang()?"Couldn't download the file. Try the Google Calendar button.":'Не удалось скачать файл. Попробуй кнопку Google Календаря.'));
  }
}

const DLG_HOURS = 9;
const DLG_GOAL = DLG_HOURS * 3600;
function dlgUnlocked(i){ return i===0 || dlgDone(DIALOGS[i-1].id); }
function dlgHrs(id){ return (dlgStat(id).sec||0) / 3600; }
function dlgStat(id){ const s = (meta.dlg||{})[id]; return s || {sec:0, max:0, plays:0}; }
function dlgDone(id){ return (dlgStat(id).sec||0) >= DLG_GOAL; }
function dlgSave(id, patch){
  if(!meta.dlg) meta.dlg = {};
  const s = meta.dlg[id] || {sec:0, max:0, plays:0};
  meta.dlg[id] = Object.assign(s, patch);
  saveMeta();
}
function mmss(s){ s = Math.max(0, Math.floor(s||0)); const m = Math.floor(s/60); const r = s%60; return m + ':' + (r<10?'0':'') + r; }

function dlgLockHint(i){

}

function dlgProgress(){
  if(!AU) return;
  const cur = AU.currentTime, dur = AU.duration || 1;
  const f = document.getElementById('pl-fill'), c = document.getElementById('pl-cur');
  if(f) f.style.width = (cur/dur*100) + '%';
  if(c) c.textContent = mmss(cur);
}

// Прослушанное считаем по реально проигранному времени и отдельно от кадров: кадры
// замирают, когда приложение свёрнуто, а звук идёт дальше. Раньше на каждое событие
// прибавлялось ровно 0.25 с — браузер шлёт их неравномерно, и минуты в кольце врали.
function dlgCount(){
  if(!AU || AU.paused) { dlgPrevT = -1; return; }
  const d = DIALOGS[curDlg];
  if(!d) return;
  const cur = AU.currentTime, dur = AU.duration || 1;
  if(dlgPrevT >= 0 && cur > dlgPrevT && cur - dlgPrevT < 2) tickAcc += cur - dlgPrevT;
  dlgPrevT = cur;
  if(tickAcc < 5) return;
  const add = Math.round(tickAcc);
  tickAcc = 0;
  addListen(add);
  const st = dlgStat(d.id);
  dlgSave(d.id, { sec: (st.sec||0) + add, max: Math.max(st.max||0, cur/dur) });
  const chip = document.getElementById('dlg-chip');
  if(chip) chip.textContent = (((st.sec||0) + add)/3600).toFixed(1) + ' / ' + DLG_HOURS + (enLang()?' h':' ч');
}

function bindAudio(){
  AU = document.getElementById('au');
  if(!AU) return;
  AU.loop = !!meta.loop;
  AU.addEventListener('loadedmetadata', function(){
    const dd = document.getElementById('pl-dur');
    if(dd) dd.textContent = mmss(AU.duration);
  });
  dlgPrevT = -1;
  AU.addEventListener('timeupdate', function(){ dlgProgress(); dlgCount(); });
  AU.addEventListener('ended', function(){
    const d = DIALOGS[curDlg];
    dlgSave(d.id, { max: 1 });
    if(dlgDone(d.id)) buzz('win');
    const p = document.getElementById('pl-play');
    if(p) p.innerHTML = ic('sound',22);
  });
}

function togglePlay(){
  if(!AU) return;
  const p = document.getElementById('pl-play');
  if(AU.paused){
    AU.play().catch(function(){});
    const d = DIALOGS[curDlg];
    const s = dlgStat(d.id);
    dlgSave(d.id, { plays: (s.plays||0) + 1 });
    if(p) p.innerHTML = '<span class="pl-pause"></span>';
  } else {
    AU.pause();
    if(p) p.innerHTML = ic('sound',22);
  }
}
function toggleLoop(){
  meta.loop = meta.loop ? 0 : 1; saveMeta();
  if(AU) AU.loop = !!meta.loop;
  const b = document.getElementById('pl-loop');
  if(b) b.className = 'pl-btn' + (meta.loop?' on':'');

}
function skip(n){ if(AU) AU.currentTime = Math.max(0, AU.currentTime + n); }
function seekPct(e){
  if(!AU || !AU.duration) return;
  const tr = document.getElementById('pl-track');
  const r = tr.getBoundingClientRect();
  AU.currentTime = ((e.clientX - r.left) / r.width) * AU.duration;

const AI_ERR = {

       model:(enLang()?"The AI model isn't available. You need to update the Worker.":'Модель ИИ недоступна. Нужно обновить Worker.'),
       net:(enLang()?'No connection to the AI. Check your internet and try again.':'Нет связи с ИИ. Проверь интернет и попробуй ещё раз.'),
       other:(enLang()?"The AI isn't responding right now. Try again a bit later.":'ИИ сейчас не отвечает. Попробуй чуть позже.') },
  en:{ quota:'The free daily AI quota is used up. Try again tomorrow — mistake analysis and lesson hints work without AI.',
       key:'The AI access key is not accepted. It needs updating in the Worker settings.',
       model:'The AI model is unavailable. The Worker needs updating.',
       net:'No connection to the AI. Check your internet and try again.',
       other:'The AI is not responding right now. Try again a bit later.' }
};
function aiErrText(reason){
  const d = (meta.lang && meta.lang!=='ru' && AI_ERR[meta.lang]) ? AI_ERR[meta.lang] : (meta.lang && meta.lang!=='ru' ? AI_ERR.en : AI_ERR.ru);
  return d[reason] || d.other;
}
// onText — ответ приходит кусками и показывается по мере генерации.
// Модель может думать двадцать секунд, но первые слова появляются через одну-две.
async function aiAsk(prompt, json, onText){
  const stream = !!onText && !json && typeof ReadableStream !== 'undefined';
  let res;
  try{
    res = await fetch(AI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, json: !!json, stream: stream })
    });
  }catch(e){ throw new Error(aiErrText('net')); }
  if(stream && res.ok && res.body && /event-stream/.test(res.headers.get('Content-Type')||'')){
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', info = null;
    for(;;){
      const r = await reader.read();
      if(r.done) break;
      buf += dec.decode(r.value, {stream:true});
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split('\n').find(function(x){ return x.indexOf('data:') === 0; });
        if(!line) continue;
        let j; try{ j = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
        if(j.t){ text += j.t; onText(text); }
        else if(j.done) info = j;
        else if(j.error) throw new Error(aiErrText('other'));
      }
    }
    if(!text.trim()) throw new Error(aiErrText('other'));
    aiAsk.last = info || null;
    return text.trim();
  }
  if(!res.ok){
    let reason = 'other';
    try{ const j = await res.json(); if(j && j.reason) reason = j.reason; }catch(e){}
    throw new Error(aiErrText(reason));
  }
  const data = await res.json();
  const txt = (data.text || '').trim();
  if(!txt) throw new Error(aiErrText('other'));
  try{
    return json ? JSON.parse(txt.replace(/^```json|```$/g,'').trim()) : txt;
  }catch(e){ throw new Error(aiErrText('other')); }
}

      (enLang()?'Explain exactly the mistake they made, not the topic of the task in general. ':'Разбирай именно ту ошибку, которую он допустил, а не тему задания вообще. ') +
      (enLang()?'No greetings and no lists, just the explanation.':'Без приветствий и без списков, просто объяснение.'), false, show);
    stop();

let impRows = [];

function parseWords(text){
  const rows = [], bad = [];
  const lines = (text||'').split(/\r?\n/);
  for(const raw of lines){
    const line = raw.trim();
    if(!line || line.charAt(0)==='#') continue;
    let parts = null;
    if(line.indexOf('\t')>=0) parts = line.split('\t');
    else if(line.indexOf(' — ')>=0) parts = line.split(' — ');
    else if(line.indexOf(' – ')>=0) parts = line.split(' – ');
    else if(line.indexOf(' - ')>=0) parts = line.split(' - ');
    else if(line.indexOf(';')>=0) parts = line.split(';');
    else if(line.indexOf(':')>=0) parts = line.split(':');
    else if(line.indexOf(',')>=0) parts = line.split(',');
    if(!parts || parts.length < 2){ bad.push(line); continue; }
    const n = parts[0].replace(/^["']|["']$/g,'').replace(/[<>&]/g,'').trim().slice(0,60);
    const r = parts.slice(1).join(' ').replace(/^["']|["']$/g,'').replace(/[<>&]/g,'').trim().slice(0,80);
    if(!n || !r){ bad.push(line); continue; }
    rows.push({n:n, r:r});
  }
  return {rows:rows, bad:bad};
}

function previewImport(){
  const ta = document.getElementById('imp-text');
  const res = parseWords(ta ? ta.value : '');
  const have = new Set(myList().map(function(w){ return w.n.toLowerCase(); }));
  const fresh = [], dup = [];
  const seen = new Set();
  for(const r of res.rows){
    const k = r.n.toLowerCase();
    if(have.has(k) || seen.has(k)){ dup.push(r); continue; }
    seen.add(k); fresh.push(r);
  }
  impRows = fresh;
  const box = document.getElementById('imp-preview');
  if(!box) return;
  if(!res.rows.length && !res.bad.length){ box.innerHTML = (enLang()?'<div class="deck-count" style="margin-top:14px">Empty for now — paste your list above.</div>':'<div class="deck-count" style="margin-top:14px">Пока пусто — вставь список выше.</div>'); return; }

function doImport(){
  if(!impRows.length) return;
  const set = (myCur!=='all' && myCur!=='none') ? myCur : null;
  for(const r of impRows){
    const w = { n:r.n, r:r.r, s:0, d:dnum() };
    if(set) w.set = set;
    myList().push(w);
  }
  const n = impRows.length;
  impRows = [];
  saveMeta();
  buzz('win');
  renderMyWords();
}

function exportWords(){
  const list = myList();
  if(!list.length){ alert((enLang()?'Vocabulary is empty':'Словарь пуст')); return; }
  const byId = {};
  for(const s of mySets()) byId[s.id] = s.name;
  let txt = '';
  const groups = {};
  for(const w of list){
    const g = w.set ? byId[w.set] || (enLang()?'No section':'Без раздела') : (enLang()?'No section':'Без раздела');
    if(!groups[g]) groups[g] = [];
    groups[g].push(w.n + ' — ' + w.r);
  }
  for(const g in groups) txt += '# ' + g + '\n' + groups[g].join('\n') + '\n\n';
  try{
    const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (enLang()?'ro-vocabulary.txt':'ro-словарь.txt');
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
  }catch(e){ alert((enLang()?"Couldn't export the file":'Не удалось выгрузить файл')); }
}

function startMyWords(){
  const list = myFiltered();
  const due = myDue(list);
  const deck = (due.length ? due : list).map(function(w){ return { my:true, w:w }; });
  if(!deck.length){ renderMyWords(); return; }
  screen = 'words';
  wordsState.deck = shuffle(deck);
  wordsState.flipped = false;
  wordsState.review = false;
  wordsState.my = true;
  renderWords();
}

let statPeriod = 'week';

function renderStats(){
  screen = 'stats';
  const P = statPeriod;
  const days = P==='week' ? weekDays() : daysBack(P==='month'?30:365);
  const ph = sumRange(days,'p'), au = sumRange(days,'a'), wd = sumRange(days,'w');
  const act = activeDays(days);
  const avg = act ? Math.round(ph/act) : 0;

  let chart = '';
  if(P==='week'){
    const vals = days.map(function(d){ return logOf(d).p||0; });
    const mx = Math.max(DAILY_GOAL, Math.max.apply(null, vals));
    const wl = t('wd');
    chart = '<div class="week-strip" style="border:none;padding:0;margin:0;gap:8px">' + days.map(function(d,i){
      const h = Math.max(4, Math.round(vals[i]/mx*100));
      const today = dstrOf(d) === dstr(0);
      return '<div class="wk-col' + (isFuture(d)?' future':'') + '"><div class="wk-bar-bg" style="height:100px"><div class="wk-bar' + (vals[i]>=DAILY_GOAL?' hit':'') + (today?' today':'') + '" style="height:' + h + 'px"></div></div>' +
        '<div class="wk-lbl' + (today?' today':'') + '">' + wl[i] + '</div>' +
        '<div class="wk-lbl" style="color:var(--ink2);font-weight:600">' + (vals[i]||'') + '</div></div>';
    }).join('') + '</div>';
  } else if(P==='month'){
    chart = '<div class="heat">' + days.map(function(d){
      const v = logOf(d).p||0;
      const lvl = v===0?0 : v<DAILY_GOAL*0.34?1 : v<DAILY_GOAL*0.67?2 : v<DAILY_GOAL?3 : 4;
      return '<div class="ht l' + lvl + '" title="' + d.getDate() + '"></div>';
    }).join('') + '</div>' +
    (enLang()?'<div class="heat-legend"><span>less</span><div class="ht l0"></div><div class="ht l1"></div><div class="ht l2"></div><div class="ht l3"></div><div class="ht l4"></div><span>more</span></div>':'<div class="heat-legend"><span>меньше</span><div class="ht l0"></div><div class="ht l1"></div><div class="ht l2"></div><div class="ht l3"></div><div class="ht l4"></div><span>больше</span></div>');
  } else {
    const mo = [];
    for(let m=11;m>=0;m--){
      const d = new Date(); d.setMonth(d.getMonth()-m);
      let s = 0;
      const y = d.getFullYear(), mm = d.getMonth();
      const last = new Date(y, mm+1, 0).getDate();
      for(let day=1; day<=last; day++) s += ((meta.log||{})[y+'-'+(mm+1)+'-'+day]||{}).p||0;
      mo.push({ n: t('mo')[mm].slice(0,3), v: s });
    }
    const mx = Math.max(1, Math.max.apply(null, mo.map(function(x){return x.v;})));
    chart = '<div class="year-row">' + mo.map(function(x){
      return '<div class="yr-col"><div class="yr-bar-bg"><div class="yr-bar" style="height:' + Math.max(3, Math.round(x.v/mx*90)) + 'px"></div></div>' +
        '<div class="wk-lbl">' + x.n + '</div></div>';
    }).join('') + '</div>';
  }

  document.getElementById('app').innerHTML =
    '<div class="header">' +
      '<button class="back-btn" onclick="renderCourses()">' + t('back_h') + '</button>' +
      '<div class="header-right"><div class="score-chip">' + ic('fire',14) + ' ' + streakCount() + '</div></div>' +
    '</div>' +
    (enLang()?'<div class="detail-title">Stats</div>':'<div class="detail-title">Статистика</div>') +
    (enLang()?'<div class="detail-sub">Pace beats volume — look at how regular you are</div>':'<div class="detail-sub">Ритм важнее объёма — смотри на регулярность</div>') +
    '<div class="mode-toggle" style="margin:1rem 0">' +
      '<button class="mode-btn' + (P==='week'?' active':'') + (enLang()?'" onclick="setStatPeriod(\'week\')">Week</button>':'" onclick="setStatPeriod(\'week\')">Неделя</button>') +
      '<button class="mode-btn' + (P==='month'?' active':'') + (enLang()?'" onclick="setStatPeriod(\'month\')">Month</button>':'" onclick="setStatPeriod(\'month\')">Месяц</button>') +
      '<button class="mode-btn' + (P==='year'?' active':'') + (enLang()?'" onclick="setStatPeriod(\'year\')">Year</button>':'" onclick="setStatPeriod(\'year\')">Год</button>') +
    '</div>' +
    '<div class="card">' + chart + '</div>' +
    '<div class="stat-grid">' +
      '<div class="sg"><div class="sg-v">' + ph + (enLang()?'</div><div class="sg-l">phrases</div></div>':'</div><div class="sg-l">фраз</div></div>') +
      '<div class="sg"><div class="sg-v">' + Math.round(au/60) + (enLang()?'</div><div class="sg-l">minutes of audio</div></div>':'</div><div class="sg-l">минут аудио</div></div>') +
      '<div class="sg"><div class="sg-v">' + wd + (enLang()?'</div><div class="sg-l">words</div></div>':'</div><div class="sg-l">слов</div></div>') +
      '<div class="sg"><div class="sg-v">' + act + (enLang()?'</div><div class="sg-l">days practised</div></div>':'</div><div class="sg-l">дней занятий</div></div>') +
      '<div class="sg"><div class="sg-v">' + avg + (enLang()?'</div><div class="sg-l">phrases a day</div></div>':'</div><div class="sg-l">фраз в день</div></div>') +
      '<div class="sg"><div class="sg-v">' + bestWeek() + (enLang()?'</div><div class="sg-l">best week</div></div>':'</div><div class="sg-l">лучшая неделя</div></div>') +
    '</div>' +
    (enLang()?'<div class="section-label" style="margin-top:24px">Course total</div>':'<div class="section-label" style="margin-top:24px">Всего за курс</div>') +
    '<div class="stat-grid" style="margin-top:10px">' +
      (function(){
        const sL=LESSONS, sW=WORDS, sc2=ci;
        ci=0; LESSONS=COURSES[0].L; WORDS=COURSES[0].W;
        let p=0,pt=0,w=0,wt=0;
        for(let l=0;l<LESSONS.length;l++){ p+=lessonSolved(l); pt+=lessonTotal(l); w+=Math.min(wordsKnown(l).length,WORDS[l].length); wt+=WORDS[l].length; }
        ci=sc2; LESSONS=sL; WORDS=sW;
        let hrs=0; for(const d of DIALOGS) hrs += dlgStat(d.id).sec||0;
        return '<div class="sg"><div class="sg-v">' + Math.round(p/pt*100) + (enLang()?'%</div><div class="sg-l">of course phrases</div></div>':'%</div><div class="sg-l">фраз курса</div></div>') +
          '<div class="sg"><div class="sg-v">' + Math.round(w/wt*100) + (enLang()?'%</div><div class="sg-l">of course words</div></div>':'%</div><div class="sg-l">слов курса</div></div>') +
          '<div class="sg"><div class="sg-v">' + (hrs/3600).toFixed(1) + (enLang()?'</div><div class="sg-l">hours of audio</div></div>':'</div><div class="sg-l">часов аудио</div></div>');
      })() +
    '</div>';
  try{ window.scrollTo(0,0); }catch(e){}
}

  tourStep = 0;
  const m = document.createElement('div');
  m.className = 'tour-mask';
  m.id = 'tour-mask';
  m.innerHTML = '<div class="tour-hole" id="tour-hole"></div><div class="tour-tip" id="tour-tip"></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function(e){ if(e.target===m) tourNext(); });
  tourShow();
}

function tourShow(){
  const s = TOUR[tourStep];
  const hole = document.getElementById('tour-hole');
  const tip = document.getElementById('tour-tip');
  if(!hole || !tip) return;
  const el = document.querySelector(s.sel);
  if(!el){ tourNext(); return; }

  // подводим элемент в центр экрана, затем позиционируем подсветку
  try{ el.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){ el.scrollIntoView(); }

  const place = function(){
    const r = el.getBoundingClientRect();
    const pad = 8;
    hole.style.top = (r.top - pad) + 'px';
    hole.style.left = (r.left - pad) + 'px';
    hole.style.width = (r.width + pad*2) + 'px';
    hole.style.height = (r.height + pad*2) + 'px';

    const last = tourStep === TOUR.length-1;
    tip.innerHTML =
      '<div class="tour-step">' + (tourStep+1) + ' / ' + TOUR.length + '</div>' +
      '<div class="tour-title">' + s.t + '</div>' +
      '<div class="tour-text">' + s.d + '</div>' +
      '<div class="tour-nav">' +
        '<button class="tour-next" onclick="tourNext()">' + (last ? (enLang()?'Got it':'Понятно') : (enLang()?'Next':'Далее')) + '</button>' +
        (last ? '' : (enLang()?'<button class="tour-skip" onclick="tourEnd()">Skip</button>':'<button class="tour-skip" onclick="tourEnd()">Пропустить</button>')) +
      '</div>';

    const tipH = tip.offsetHeight || 200;
    const vh = window.innerHeight;
    let top = r.bottom + 16;
    if(top + tipH > vh - 12) top = r.top - tipH - 16;      // не влезает снизу — ставим сверху
    if(top < 12) top = Math.min(vh - tipH - 12, r.bottom + 16); // не влезает сверху — возвращаем вниз
    tip.style.top = Math.max(12, Math.min(top, vh - tipH - 12)) + 'px';
  };

  place();
  setTimeout(place, 320);   // пересчёт после плавной прокрутки
}

function tourNext(){
  tourStep++;
  if(tourStep >= TOUR.length){ tourEnd(); return; }
  tourShow();
}

function tourEnd(){
  meta.tour = 1; saveMeta();
  const m = document.getElementById('tour-mask');
  if(m) m.remove();
}

// ─── FIREWORKS ──────────────────────────────────────
function launchFireworks(cid){
  const cv = document.getElementById(cid || 'fw');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  let parts = [];
  let bursts = 0;
  const MAX_BURSTS = 7;
  function burst(){
    const x = cv.width*(0.2+Math.random()*0.6);
    const y = cv.height*(0.12+Math.random()*0.38);
    const hue = Math.floor(Math.random()*360);
    for(let i=0;i<64;i++){
      const a = Math.PI*2*i/64;
      const sp = 2 + Math.random()*3.8;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:hue+Math.random()*40-20});
    }
    bursts++;
  }
  burst();
  const iv = setInterval(()=>{ if(bursts<MAX_BURSTS) burst(); else clearInterval(iv); }, 430);
  function frame(){
    if(!document.getElementById('fw')){ clearInterval(iv); return; }
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.vy+=0.045; p.vx*=0.985; p.vy*=0.985;
      p.life-=0.011;
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = 'hsl(' + p.hue + ',92%,66%)';
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.3,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    parts = parts.filter(p=>p.life>0);
    if(parts.length>0 || bursts<MAX_BURSTS){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,cv.width,cv.height); }
  }
  requestAnimationFrame(frame);
}

// Старый загрузчик из облака удалён: он безусловно затирал локальные данные

// ─── ВОССТАНОВЛЕНИЕ ИЗ ОБЛАКА TELEGRAM ───
function cloudGet(cb){
  if(!(TG && TG.CloudStorage && TG.CloudStorage.getItems)){ cb(null); return; }
  const keys = ['ro_i','ro_meta','ro_progress'];
  for(let i=0;i<CL_MAX.m;i++) keys.push('ro_m'+i);
  for(let i=0;i<CL_MAX.p;i++) keys.push('ro_p'+i);
  let done = false;
  const finish = function(v){ if(!done){ done = true; cb(v); } };
  setTimeout(function(){ finish(null); }, 2500);   // не ждём вечно
  try{
    TG.CloudStorage.getItems(keys, function(err, res){
      if(err || !res){ finish(null); return; }
      finish(res);
    });
  }catch(e){ finish(null); }
}
// Собираем meta и progress из кусков; если описи нет или кусок потерялся —
// откатываемся на старый одиночный ключ.
function cloudParse(res){
  let idx = null;
  try{ idx = res.ro_i ? JSON.parse(res.ro_i) : null; }catch(e){}
  if(idx) clIdx = { m: +idx.m || 0, p: +idx.p || 0 };
  Object.keys(res).forEach(function(k){ if(typeof res[k] === 'string' && res[k]) clSent[k] = res[k]; });
  let torn = false;
  const join = function(pre, n, legacy){
    if(n > 0){
      let str = '', ok = true;
      for(let i=0;i<n;i++){
        const v = res[pre+i];
        if(typeof v !== 'string' || v === ''){ ok = false; break; }
        str += v;
      }
      if(ok){ try{ return JSON.parse(str); }catch(e){} }
      torn = true;                                   // опись есть, а куски битые
    }
    if(legacy){ try{ return JSON.parse(legacy); }catch(e){} }
    return null;
  };
  const m = join('ro_m', clIdx.m, res.ro_meta), pr = join('ro_p', clIdx.p, res.ro_progress);
  // облачная копия неполная — берём только то, что лежит на устройстве
  if(torn) return { meta:null, progress:null };
  return { meta:m, progress:pr };
}

function chatContext(){
  const L = [];
  const nm = (meta.name || '').trim();
  const parts = [];
  if(nm) parts.push((enLang()?'name ':'имя ') + nm);
  const st = streakCount(); if(st) parts.push((enLang()?'on a ':'занимается ') + st + (enLang()?'-day streak':' дней подряд'));
  const ts = totalSolved(); if(ts) parts.push((enLang()?'phrases completed: ':'пройдено фраз: ') + ts);
  if(parts.length) L.push((enLang()?'Learner: ':'Ученик: ') + parts.join('; ') + '.');

  try{
    const co = COURSES[ci];
    if(co && !co.audio && LESSONS[currentLessonIdx]){
      const les = LESSONS[currentLessonIdx];
      let s = (enLang()?'Now: course "':'Сейчас: курс «') + tx(co,'title') + (enLang()?'", lesson ':'», урок ') + (currentLessonIdx+1) + ' «' + lesTitle(les) + '»';
      if(les.parts && les.parts[currentPartIdx]) s += (enLang()?', block "':', блок «') + partTitle(les.parts[currentPartIdx]) + '»';
      L.push(s + '.');
    }
  }catch(e){}

  try{
    if(state && state.questions && state.questions[state.idx] && state.phase){
      const q = state.questions[state.idx];
      let s = (enLang()?'Phrase on screen: "':'Фраза на экране: «') + srcText(q) + '» → «' + q.no + '»';
      if(state.phase === 'revealed' && state.lastAnswer) s += (enLang()?'. The learner answered: "':'. Ученик ответил: «') + state.lastAnswer + '»';
      if(state.feedback && state.feedback.diag) s += (enLang()?'. The trainer identified the mistake: ':'. Тренажёр определил ошибку: ') + plainDiag(state.feedback.diag);
      L.push(s + '.');
    }
  }catch(e){}

  try{
    const ms = (meta.mistakes || []).slice(-6);
    if(ms.length) L.push((enLang()?'Phrases they keep stumbling on: ':'Фразы, на которых он спотыкается: ') + ms.map(function(m){ return '«' + m.no + '»'; }).join(', ') + '.');
  }catch(e){}

  try{

  }catch(e){}

  return (enLang()?'CONTEXT (use it only if it relates to the question; do not just recap it):\n':'КОНТЕКСТ (используй, только если он относится к вопросу; не пересказывай его просто так):\n') + L.join('\n');
}

    (enLang()?"— If the question isn't about Norwegian or studying, bring it back on topic in one sentence.":'— Если вопрос не про норвежский язык или учёбу, одной фразой верни к теме.');
}

function chatPrompt(question){
  const sys = chatSystem();
  const ctx = chatContext();
  const hist = chatLog.slice();
  function build(h){
    let s = sys + '\n\n';
    if(ctx) s += ctx + '\n\n';
    if(h.length){
      s += (enLang()?'CONVERSATION:\n':'ПЕРЕПИСКА:\n') + h.map(function(m){
        return (m.r === 'u' ? (enLang()?'Learner: ':'Ученик: ') : (enLang()?'You: ':'Ты: ')) + m.t;
      }).join('\n') + '\n\n';
    }
    return s + (enLang()?'Learner: ':'Ученик: ') + question + (enLang()?'\nYou:':'\nТы:');
  }
  let h = hist;
  let out = build(h);
  while(out.length > 9500 && h.length > 2){ h = h.slice(2); out = build(h); }
  if(out.length > 11000) out = out.slice(0, 11000);
  return out;
}

// ─── разметка сообщений ───
function chatEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function chatFmt(s){
  let h = chatEsc(s);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^✓\s*(.+)$/gm, '<span class="ch-fix">✓ $1</span>');
  return h.replace(/\n/g, '<br>');
}
