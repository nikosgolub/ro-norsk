<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ro! — Норвежский тренажёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#0a0a0a;--paper:#161616;--ink:#f5f5f5;--ink2:#a3a3a3;--ink3:#666;
  --line:#262626;--blue:#7aa2f7;--blue-light:#16213a;--green:#4ade80;
  --green-light:#0d2818;--red:#f87171;--red-light:#2d1414;
  --amber:#fbbf24;--amber-light:#2b2210;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{touch-action:manipulation}

.app{max-width:700px;margin:0 auto;padding:0 1rem 3rem;padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right));padding-top:env(safe-area-inset-top)}
.header{padding:1.25rem 0 0;display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem}
.logo{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;cursor:pointer}
.head-greet{font-size:17px;font-weight:700;letter-spacing:-0.3px;color:var(--ink);cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.score-chip{background:#fff;color:#0a0a0a;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
.back-btn{background:none;border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:500;font-family:inherit;padding:6px 14px;border-radius:12px;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--ink2);color:var(--ink)}

.progress-section{margin-bottom:1.25rem}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.progress-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.milestones{display:flex;gap:3px;margin-top:6px}
.ms{height:3px;flex:1;border-radius:2px;background:var(--line);transition:background .3s}
.ms.done{background:#fff}

.mode-toggle{display:flex;background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:16px;padding:3px;margin-bottom:1.25rem;width:fit-content}
.mode-btn{padding:9px 18px;font-size:13px;font-weight:500;border:none;background:none;color:var(--ink2);border-radius:12px;cursor:pointer;transition:all .2s;font-family:inherit;min-height:38px}
.mode-btn.active{background:#fff;color:#0a0a0a}

.card{background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:20px;padding:1.75rem;margin-bottom:1rem}
.type-badge{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--blue-light);color:var(--blue);margin-bottom:1rem}
.q-ru{font-size:24px;font-weight:600;line-height:1.3;color:var(--ink);margin-bottom:1.5rem;letter-spacing:-0.3px}
.pool-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:500;margin-bottom:7px}
.builder-answer{min-height:52px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:1rem;cursor:default;transition:border-color .2s,background .2s}
.builder-answer.has-content{border-style:solid;border-color:var(--ink2)}
.builder-answer.correct-state{border-color:var(--green);background:var(--green-light)}
.builder-answer.wrong-state{border-color:var(--red);background:var(--red-light)}
.placeholder{color:var(--ink3);font-size:14px}
.word-chip{padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;border:1px solid transparent;min-height:42px;display:inline-flex;align-items:center}
.word-chip.pool{background:var(--paper);border-color:var(--line);color:var(--ink)}
.word-chip.pool:hover{border-color:var(--ink2)}
.word-chip.selected{background:#fff;color:#0a0a0a}
.word-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.text-input{width:100%;padding:14px 16px;font-size:16px;font-family:inherit;background:var(--bg);border:2px solid var(--line);border-radius:14px;color:var(--ink);outline:none;transition:border-color .2s;margin-bottom:1rem;min-height:50px}
.text-input:focus{border-color:var(--ink2)}
.text-input.correct-state{border-color:var(--green);background:var(--green-light)}
.text-input.wrong-state{border-color:var(--red);background:var(--red-light)}
.submit-btn{width:100%;padding:15px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#0a0a0a;border:none;border-radius:16px;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.01em;min-height:50px}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{opacity:.35;cursor:not-allowed}
.submit-btn.next{background:var(--green);color:#04150b}
.btn-row{display:flex;gap:10px}
.btn-row .submit-btn{flex:1}
.retry-btn{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.retry-btn:hover{border-color:var(--ink2)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}

.feedback{border-radius:16px;padding:1rem 1.25rem;margin-bottom:1rem;font-size:14px;line-height:1.6;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.feedback.ok{background:var(--green-light);border:1px solid #1d5c34;color:var(--green)}
.feedback.err{background:var(--red-light);border:1px solid #6b2525;color:var(--red)}
.feedback.v2{background:var(--amber-light);border:1px solid #6b5a10;color:var(--amber)}
.fb-title{font-weight:600;margin-bottom:5px}
.diff-view{font-size:15px;line-height:2;margin-top:8px}
.dw{padding:2px 4px;border-radius:6px;margin:0 1px}
.dw.correct{color:var(--green)}
.dw.missing{background:var(--red-light);color:var(--red);text-decoration:underline;text-decoration-style:wavy}
.dw.extra{background:#3a3010;color:#d9b64a;text-decoration:line-through}
.diff-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;opacity:.7}
.rule-box{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:13px;color:var(--ink2);line-height:1.65}
.rule-box b{color:var(--ink)}
.rule-box code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:12.5px;color:var(--blue)}
.play-big{display:block;margin:6px auto 10px;background:#fff;color:#0a0a0a;font-size:16px;font-weight:600;font-family:inherit;border:none;border-radius:16px;padding:16px 30px;cursor:pointer;min-height:54px;transition:transform .1s,opacity .2s}
.play-big:hover{opacity:.9}
.play-big:active{transform:scale(.97)}
.listen-hint{text-align:center;font-size:13px;color:var(--ink3);margin-bottom:1.25rem}
.pron-res{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.listen-btn{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;font-family:inherit;padding:9px 16px;border-radius:12px;cursor:pointer;transition:all .2s;margin-top:10px}
.listen-btn:hover{border-color:var(--ink2)}
.listen-btn:active{transform:scale(.97)}

.complete{text-align:center;padding:3rem 1.5rem}
.complete-icon{font-size:52px;margin-bottom:1rem}
.complete-title{font-size:28px;font-weight:700;margin-bottom:.5rem;letter-spacing:-0.5px}
.complete-sub{color:var(--ink2);font-size:15px;margin-bottom:2rem;line-height:1.6}
.stats{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:1rem 1.5rem;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--ink)}
.stat-label{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.restart-btn{padding:14px 32px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#0a0a0a;border:none;border-radius:16px;cursor:pointer;min-height:50px}

/* ─── LESSON SELECTOR ─── */
.lessons-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin:0.5rem 0 0.25rem}
.lessons-sub{font-size:14px;color:var(--ink2);margin-bottom:1.5rem}
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson-card{background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:16px;padding:1.05rem 1.15rem;cursor:pointer;transition:border-color .2s,transform .1s;display:flex;align-items:center;gap:13px}
.lesson-card:hover{border-color:var(--ink2)}
.lesson-card:active{transform:scale(.99)}
.lesson-card.done{border-color:#1d5c34}
.lesson-num{width:38px;height:38px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2);flex-shrink:0}
.lesson-card.done .lesson-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.lesson-info{flex:1;min-width:0}
.lesson-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
.lesson-sub{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.lesson-arrow{color:var(--ink3);font-size:16px;flex-shrink:0}

/* compact right-side progress on lesson cards */
.lesson-mini{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:64px}
.lesson-mini-bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.lesson-mini-fill{height:100%;background:#fff;border-radius:2px;transition:width .4s ease}
.lesson-card.done .lesson-mini-fill{background:var(--green)}
.lesson-mini-pct{font-size:11px;font-weight:600;color:var(--ink3)}
.lesson-card.done .lesson-mini-pct{color:var(--green)}
.fjord-banner{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;line-height:0}
.fjord-banner svg{width:100%;height:auto;display:block}
.footer{text-align:center;font-size:12px;color:var(--ink3);margin-top:2.25rem;line-height:1.7}
.footer a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);transition:color .2s}
.footer a:hover{color:var(--ink)}
.today-row{display:flex;gap:8px;margin-bottom:12px}
.today-chip{flex:1;background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:14px;padding:10px 10px 11px;text-align:center;color:var(--ink2)}
.tc-val{font-size:15.5px;font-weight:700;color:var(--ink)}
.tc-lbl{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.3}
.today-chip.lit .tc-val{color:var(--amber)}
.today-chip.hit .tc-val{color:var(--green)}
.today-chip.lit{color:var(--amber);border-color:#6b5a10}
.today-chip.hit{color:var(--green);border-color:#1d5c34}
/* hero ring on main screen */
.hero{display:flex;flex-direction:column;gap:14px;background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:20px;padding:1.15rem 1.35rem;margin-bottom:1.25rem}
.hero-rings{display:flex;gap:12px;align-items:stretch}
.ring-divider{width:1px;background:var(--line);margin:6px 0;flex-shrink:0}
.ring-cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.ring-caption{font-size:12px;color:var(--ink2);text-align:center;line-height:1.45}
.ring-caption b{color:var(--ink);font-size:13px}
.ring-wrap{position:relative;width:84px;height:84px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-wrap svg circle{transition:stroke-dashoffset .6s ease}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;letter-spacing:-0.5px}
.hero-info{min-width:0}
.hero-title{font-size:16px;font-weight:700;letter-spacing:-0.2px}
.hero-sub{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
/* lesson detail page */
.detail-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:4px}
.detail-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
.detail-sub{font-size:14px;color:var(--ink2);margin-bottom:6px}
.detail-count{font-size:13px;color:var(--ink3);margin-bottom:1.25rem}
.continue-btn{width:100%;padding:15px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#0a0a0a;border:none;border-radius:16px;cursor:pointer;min-height:50px;margin-bottom:1rem;transition:opacity .2s,transform .1s}
.continue-btn:hover{opacity:.9}
.continue-btn:active{transform:scale(.98)}
.block-list{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:16px 0 0;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.section-label:first-child{margin-top:0}
.exam-card{border-color:#4a3f10}
.exam-card:hover{border-color:var(--amber)}
.exam-card .block-num{background:var(--amber-light);border-color:#6b5a10;color:var(--amber)}
.exam-card.full{border-color:#1d5c34}
.exam-card.full .block-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.block-card{background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:16px;padding:1rem 1.15rem;cursor:pointer;transition:border-color .2s,transform .1s;display:flex;align-items:center;gap:13px}
.block-card:hover{border-color:var(--ink2)}
.block-card:active{transform:scale(.99)}
.block-card.full{border-color:#1d5c34}
.block-num{width:34px;height:34px;border-radius:11px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink2);flex-shrink:0}
.block-card.full .block-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.block-card.full .lesson-mini-fill{background:var(--green)}
.block-title{flex:1;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35;min-width:0}
/* flashcards */
.word-stage{background:rgba(22,22,22,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:12px;padding:1.5rem;margin-bottom:1rem;user-select:none;-webkit-user-select:none;transition:border-color .2s}
.word-stage:active{border-color:var(--ink2)}
.word-main{font-size:30px;font-weight:700;letter-spacing:-0.5px;line-height:1.25}
.word-divider{width:44px;height:1px;background:var(--line)}
.word-back{font-size:19px;color:var(--ink2);font-weight:500;line-height:1.35;animation:slideIn .2s ease}
.word-hint{font-size:12.5px;color:var(--ink3)}
.deck-count{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:12px}
.words-done-icon{font-size:52px;margin-bottom:1rem}
/* fireworks */
#fw{position:fixed;inset:0;z-index:50;pointer-events:none}

/* ─── WELCOME SCREEN ─── */
.welcome{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;background:var(--bg)}
.welcome-content{margin-top:calc(12vh + env(safe-area-inset-top));padding:0 1.5rem;max-width:420px}
.welcome-logo{font-size:44px;font-weight:600;letter-spacing:-1px;color:#fff;margin-bottom:14px}
.welcome-tagline{font-size:15px;line-height:1.65;color:rgba(255,255,255,0.85);margin-bottom:26px}
.welcome-btn{background:rgba(255,255,255,0.92);color:#0a0a0a;font-size:15px;font-weight:600;font-family:inherit;border:none;border-radius:16px;padding:14px 36px;cursor:pointer;transition:transform .15s,background .2s;min-height:50px}
.welcome-btn:hover{background:#fff}
.welcome-btn:active{transform:scale(.97)}

/* schedule & calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px}
.cal-h{font-size:11px;font-weight:600;color:var(--ink3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--ink2);position:relative;border:1px solid transparent}
.cal-d.other{opacity:.25}
.cal-d.plan{border-color:#3a3a3a;background:var(--bg)}
.cal-d.today{border-color:#fff;color:#fff;font-weight:700}
.cal-d.hit{background:var(--green-light);border-color:#1d5c34;color:var(--green);font-weight:600}
.wd-row{display:flex;gap:6px;margin:8px 0 14px}
.wd-chip{flex:1;padding:10px 0;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .15s;min-height:42px;display:flex;align-items:center;justify-content:center}
.wd-chip.on{background:#fff;color:#0a0a0a;border-color:#fff}
.time-input{width:110px;padding:11px 14px;font-size:16px;font-family:inherit;background:var(--bg);border:2px solid var(--line);border-radius:14px;color:var(--ink);outline:none;text-align:center}
.time-input:focus{border-color:var(--ink2)}
.sched-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sched-label{font-size:14px;color:var(--ink2);font-weight:500}
.plan-banner{background:var(--amber-light);border:1px solid #6b5a10;color:var(--amber);border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;text-align:center;margin-bottom:12px;cursor:pointer}
.lang-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lang-btn{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.22);border-radius:16px;color:#fff;font-size:16px;font-weight:600;font-family:inherit;padding:14px;cursor:pointer;min-height:52px;transition:all .2s}
.lang-btn:hover,.lang-btn.on{background:rgba(255,255,255,0.92);color:#0a0a0a;border-color:#fff}
.onb-illo{height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.onb-dots{display:flex;gap:6px;justify-content:center;margin:18px 0 22px}
.onb-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,0.22);transition:all .25s}
.onb-dot.active{width:20px;background:#fff}
.onb-title{font-size:23px;font-weight:700;letter-spacing:-0.4px;color:#fff;margin-bottom:10px}
.onb-sub{font-size:14.5px;line-height:1.6;color:rgba(255,255,255,0.75);margin-bottom:26px;max-width:300px;margin-left:auto;margin-right:auto}
.skip-link{display:block;margin:16px auto 0;background:none;border:none;color:rgba(255,255,255,0.45);font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;padding:8px}
.skip-link:hover{color:rgba(255,255,255,0.7)}
.name-input{width:100%;max-width:300px;padding:14px 18px;font-size:17px;font-family:inherit;text-align:center;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.25);border-radius:16px;color:#fff;outline:none;margin-bottom:16px;transition:border-color .2s}
.name-input::placeholder{color:rgba(255,255,255,0.4)}
.name-input:focus{border-color:rgba(255,255,255,0.6)}
.hero-title .edit-hint{font-size:12px;opacity:.45;margin-left:6px}

  .card{padding:1.2rem;border-radius:18px}

function getRuleHTML(type){
  const r = (meta.lang && meta.lang!=='ru' && TYPE_RULES_EN[type]) ? TYPE_RULES_EN[type] : TYPE_RULES[type];
  if(!r) return "";
  return '<div class="rule-box">' + t('rule') + r + '</div>';
}

const TIME_ADV = new Set(["i dag","i går","i morgen","nå","snart","senere","før","alltid","aldri","ofte","sjelden","allerede"]);
const SUBJECTS = new Set(["jeg","du","han","hun","vi","dere","de","det","man"]);
const VERBS = new Set(["jobber","jobbet","snakker","snakket","spiser","spiste","ser","så","kjøper","kjøpte","bor","bodde","er","var","skal","vil","kan","må","har","hadde","blir","ble","drikker","drakk","går","gikk","kommer","kom"]);

function checkV2(user) {
  const tokens = user.trim().toLowerCase().replace(/[?!,]/g,"").split(/\s+/);
  let advEnd = -1;
  for (let i = 0; i < tokens.length - 1; i++) {
    if (TIME_ADV.has(tokens[i]+" "+tokens[i+1])) { advEnd = i+1; break; }
    if (TIME_ADV.has(tokens[i])) { advEnd = i; break; }
  }
  if (advEnd < 0) return null;
  const after = tokens.slice(advEnd+1);
  if (after.length < 2) return null;
  if (SUBJECTS.has(after[0]) && VERBS.has(after[1])) {
    return "⚡ Правило V2: после «" + tokens.slice(0,advEnd+1).join(" ") + "» глагол должен стоять 2-м — сразу после обстоятельства. Подлежащее идёт после глагола.";
  }
  return null;
}

function normalize(s){ return s.trim().toLowerCase().replace(/[?!,.]/g,"").replace(/\s+/g," ").trim(); }
function isCorrect(u,c){ return normalize(u)===normalize(c); }

function buildLCS(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const lcs=[];let i=m,j=n;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){lcs.unshift(a[i-1]);i--;j--;}else if(dp[i-1][j]>dp[i][j-1])i--;else j--;}
  return lcs;
}

function diffAnswers(u,c){
  const uw=normalize(u).split(/\s+/).filter(Boolean),cw=normalize(c).split(/\s+/).filter(Boolean);
  const lcs=buildLCS(uw,cw);
  const res=[];let ui=0,ci=0,li=0;
  while(ci<cw.length||ui<uw.length){
    if(li<lcs.length&&ui<uw.length&&ci<cw.length&&uw[ui]===lcs[li]&&cw[ci]===lcs[li]){
      res.push({word:cw[ci],status:"correct"});ui++;ci++;li++;
    }else if(ci<cw.length&&(li>=lcs.length||cw[ci]!==lcs[li])){
      res.push({word:cw[ci],status:"missing"});ci++;
    }else if(ui<uw.length){res.push({word:uw[ui],status:"extra"});ui++;}
  }
  return res;
}

function shuffle(arr){ const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

const PROPER = new Set(["Amerika","Bergen","Danmark","Mars","Norge","Oslo","Polen","Spania","Sverige","TV","Ukraina"]);

function makePool(sentence){
  const words = sentence.replace(/[?!,.]/g,"").split(/\s+/).filter(Boolean);
  if(words.length && !PROPER.has(words[0])) words[0] = words[0].charAt(0).toLowerCase() + words[0].slice(1);
  const have = new Set(words.map(w=>w.toLowerCase()));
  const noise = [];
  for(const w of shuffle(words.slice())){
    const alts = FORM_OF[w.toLowerCase()];
    if(!alts) continue;
    const pick = shuffle(alts.slice()).find(a => !have.has(a) && noise.indexOf(a)===-1);
    if(pick){ noise.push(pick); if(noise.length===2) break; }
  }
  return shuffle(words.concat(noise));
}

const SR = (typeof window!=="undefined") && (window.SpeechRecognition || window.webkitSpeechRecognition);

function pronounce(){
  if(!SR) return;
  const target = state.questions[state.idx].no;
  const btn = document.getElementById('mic-btn');
  if(btn) btn.textContent = '🎙️ Слушаю…';
  try{
    const rec = new SR();
    rec.lang = 'nb-NO';
    rec.interimResults = false;
    rec.maxAlternatives = 5;
    rec.onresult = function(e){
      let ok = false, heard = '';
      const res = e.results[0];
      for(let i=0;i<res.length;i++){
        if(!heard) heard = res[i].transcript;
        if(isCorrect(res[i].transcript, target)) ok = true;
      }
      const box = document.getElementById('pron-res');
      if(box) box.innerHTML = ok
        ? '✅ Отличное произношение! Bra uttale!'
        : '👂 Услышал: «' + heard + '»<br>Послушай образец и попробуй ещё раз';
      const b = document.getElementById('mic-btn');
      if(b) b.textContent = '🎤 Ещё раз';
    };
    rec.onerror = function(){
      const b = document.getElementById('mic-btn');
      if(b) b.textContent = '🎤 Произнести';
      const box = document.getElementById('pron-res');
      if(box) box.innerHTML = 'Микрофон недоступен — проверь разрешения браузера';
    };
    rec.onend = function(){
      const b = document.getElementById('mic-btn');
      if(b && b.textContent.indexOf('Слушаю')>=0) b.textContent = '🎤 Произнести';
    };
    rec.start();
  }catch(e){}
}

function speak(text){
  if('speechSynthesis' in window){
    const utt = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,"").trim());
    utt.lang = 'nb-NO';
    utt.rate = 0.82;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);
  }
}

let screen = "welcome"; // welcome | lessons | exercise
let currentLessonIdx = 0;
let currentPartIdx = 0;
const PARTS = 3;

// ─── PROGRESS (persisted) ───
let progress = {};
try{ progress = JSON.parse(localStorage.getItem('ro_progress')||'{}'); }catch(e){ progress = {}; }
function saveProgress(){ persist('ro_progress', JSON.stringify(progress)); }
function partSize(l,p){ return LESSONS[l].parts[p].q.length; }
function lessonTotal(l){ let s=0; for(let p=0;p<PARTS;p++) s += partSize(l,p); return s; }
function partProgress(l,p){ return Math.min((progress['l'+l]||{})['p'+p]||0, partSize(l,p)); }
function setPartProgress(l,p,v){
  if(!progress['l'+l]) progress['l'+l] = {};
  const k = 'p'+p;
  if(v > (progress['l'+l][k]||0)){ progress['l'+l][k] = v; saveProgress(); }
}
function partDone(l,p){ return partProgress(l,p) >= partSize(l,p); }
function lessonSolved(l){ let s=0; for(let p=0;p<PARTS;p++) s += partProgress(l,p); return s; }
function examScore(l){ return (progress['l'+l]||{}).e || 0; }
function setExamScore(l,pct){ if(!progress['l'+l]) progress['l'+l]={}; if(pct > (progress['l'+l].e||0)){ progress['l'+l].e = pct; saveProgress(); } }
const EXAM_N = 20, EXAM_PASS = 85;
function lessonDone(l){ for(let p=0;p<PARTS;p++){ if(!partDone(l,p)) return false; } return true; }
function lessonsDoneCount(){ let c=0; for(let i=0;i<LESSONS.length;i++){ if(lessonDone(i)) c++; } return c; }
function totalPhrases(){ let s=0; for(let i=0;i<LESSONS.length;i++) s += lessonTotal(i); return s; }
function totalSolved(){ let s=0; for(let i=0;i<LESSONS.length;i++) s += lessonSolved(i); return s; }
// ─── TELEGRAM / HAPTICS / SHARE ───
const TG = (typeof window!=="undefined") && window.Telegram && window.Telegram.WebApp;
if(TG){ try{ TG.ready(); TG.expand(); }catch(e){} }
function persist(key,val){
  try{ localStorage.setItem(key,val); }catch(e){}
  if(TG && TG.CloudStorage){ try{ TG.CloudStorage.setItem(key,val,function(){}); }catch(e){} }
}
function buzz(kind){
  if(TG && TG.HapticFeedback){
    try{ kind==="win" ? TG.HapticFeedback.notificationOccurred("success")
       : kind==="ok" ? TG.HapticFeedback.impactOccurred("light")
       : TG.HapticFeedback.notificationOccurred("error"); }catch(e){}
    return;
  }
  if(typeof navigator!=="undefined" && navigator.vibrate){
    try{ navigator.vibrate(kind==="win" ? [50,50,50,50,150] : kind==="ok" ? 25 : [60,40,60]); }catch(e){}
  }
}
function canShare(){ return !!(TG || (typeof navigator!=="undefined" && navigator.share)); }
function shareText(t){
  if(TG && TG.openTelegramLink){
    TG.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent("https://t.me") + "&text=" + encodeURIComponent(t));
    return;
  }
  if(typeof navigator!=="undefined" && navigator.share){ navigator.share({text:t}).catch(function(){}); }
}

// ─── META: streak, daily goal, mistakes ───
let meta = {};
try{ meta = JSON.parse(localStorage.getItem('ro_meta')||'{}'); }catch(e){ meta = {}; }
if(!meta.mistakes) meta.mistakes = [];
function saveMeta(){ persist('ro_meta', JSON.stringify(meta)); }
function dstr(off){ const d = new Date(Date.now()+(off||0)*864e5); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
const DAILY_GOAL = 75;
function todayCount(){ return meta.day===dstr(0) ? (meta.dayCount||0) : 0; }
function streakCount(){ return (meta.day===dstr(0)||meta.day===dstr(-1)) ? (meta.streak||0) : 0; }
function bumpDaily(){
  const t = dstr(0);
  if(meta.day!==t){
    meta.streak = (meta.day===dstr(-1)) ? (meta.streak||0)+1 : 1;
    meta.day = t; meta.dayCount = 0;
  }
  meta.dayCount = (meta.dayCount||0)+1;
  if(!meta.hist) meta.hist = [];
  if(meta.hist.indexOf(t)<0){ meta.hist.push(t); if(meta.hist.length>400) meta.hist.shift(); }
  saveMeta();
}
function addMistake(q){
  if(meta.mistakes.some(m=>m.no===q.no)) return;
  meta.mistakes.push({ru:q.ru,no:q.no,type:q.type});
  if(meta.mistakes.length>50) meta.mistakes.shift();
  saveMeta();
}
function removeMistake(no){ meta.mistakes = meta.mistakes.filter(m=>m.no!==no); saveMeta(); }
function dnum(){ return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5); }
const SRS_INT = [1,3,7,14,30];
function srsPromote(l,wi){
  if(!meta.srs) meta.srs = {};
  const k = l+':'+wi;
  const cur = meta.srs[k]||{s:0};
  const s = Math.min(cur.s+1, SRS_INT.length);
  meta.srs[k] = {s:s, d:dnum()+SRS_INT[s-1]};
  saveMeta();
}
function srsReset(l,wi){ if(!meta.srs) meta.srs = {}; meta.srs[l+':'+wi] = {s:0, d:dnum()}; saveMeta(); }
function srsDue(){
  const out = []; const t = dnum();
  for(const k in (meta.srs||{})){
    if(meta.srs[k].d <= t){ const a = k.split(':'); out.push({l:+a[0], wi:+a[1]}); }
  }
  return out;
}
function dayWord(n){ if(meta.lang==='ru'||meta.lang===undefined||meta.lang==='uk'){ const m=n%10,h=n%100; if(h>=11&&h<=14) return t('days5'); if(m===1) return t('days1'); if(m>=2&&m<=4) return t('days2'); return t('days5'); } return n===1 ? t('days1') : t('days5'); }

function wordsTotal(l){ return WORDS[l].length; }
function wordsKnown(l){ return (progress['l'+l]||{}).w || []; }
function addKnownWord(l,wi){
  if(!progress['l'+l]) progress['l'+l] = {};
  if(!progress['l'+l].w) progress['l'+l].w = [];
  if(progress['l'+l].w.indexOf(wi)===-1){ progress['l'+l].w.push(wi); saveProgress(); }
}
function ringSVG(pct,size,stroke,color){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c*(1-Math.min(pct,100)/100);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + (color||'#fff') + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/>' +
  '</svg>';
}
function wordsAllTotal(){ let s=0; for(let i=0;i<WORDS.length;i++) s += WORDS[i].length; return s; }
function wordsAllKnown(){ let s=0; for(let i=0;i<WORDS.length;i++) s += Math.min(wordsKnown(i).length, WORDS[i].length); return s; }

function goToLessons(){
  const w = document.querySelector(".welcome");

function renderOnboarding(step){

function saveName(){
  const inp = document.getElementById("name-inp");
  let v = (inp && inp.value ? inp.value : "").replace(/[<>&"']/g,"").trim().slice(0,20);

  renderLessons();

function renderLesson(i){
  screen = "lesson";
  currentLessonIdx = i;
  const l = LESSONS[i];
  const total = lessonTotal(i);
  const solved = lessonSolved(i);

  const wt = wordsTotal(i);
  const wk = Math.min(wordsKnown(i).length, wt);
  const wpct = Math.round(wk/wt*100);
  const wfull = wk >= wt;
  const wordsCard =
    '<div class="block-card' + (wfull?' full':'') + '" onclick="startWords(' + i + ')">' +
      '<div class="block-num">📖</div>' +
      '<div class="block-title">' + t('w_card') + (wfull?t('w_learned'):'') + '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + wpct + '%"></div></div>' +
        '<div class="lesson-mini-pct"' + (wfull?' style="color:var(--green)"':'') + '>' + wpct + '%</div>' +
      '</div>' +
    '</div>';

  const blocks = l.parts.map((p,pi) => {
    const sz = p.q.length;
    const pd = partProgress(i,pi);
    const pct = Math.round(pd/sz*100);
    const full = pd >= sz;
    return '<div class="block-card' + (full?' full':'') + '" onclick="startPart(' + i + ',' + pi + ')">' +
      '<div class="block-num">' + (full?'✓':(pi+1)) + '</div>' +
      '<div class="block-title">' + p.t + '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + pct + '%"' + (full?' ':'') + '></div></div>' +
        '<div class="lesson-mini-pct"' + (full?' style="color:var(--green)"':'') + '>' + pct + '%</div>' +
      '</div>' +
    '</div>';
  }).join("");

  let continueBtn = '';
  if(solved >= total){
    continueBtn = '<button class="continue-btn" onclick="startPart(' + i + ',0)">' + t('repeat_l') + '</button>';
  } else {
    let np = 0;
    for(let p=0;p<PARTS;p++){ if(!partDone(i,p)){ np = p; break; } }
    continueBtn = '<button class="continue-btn" onclick="startPart(' + i + ',' + np + ')">' + (solved>0?t('cont_b') + ' «' + l.parts[np].t + '»':t('start_l')) + '</button>';
  }

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<div class="logo" onclick="renderLessons()">Ro!</div>' +
      '<div class="header-right"><button class="back-btn" onclick="renderLessons()">' + t('back_ls') + '</button></div>' +
    '</div>' +
    '<div class="detail-label">' + t('lesson') + ' ' + (i+1) + ' ' + t('l_of') + ' ' + LESSONS.length + '</div>' +
    '<div class="detail-title">' + l.title + '</div>' +
    '<div class="detail-sub">' + l.sub + '</div>' +
    '<div class="detail-count">' + t('phr_done') + ' ' + solved + ' ' + t('of') + ' ' + total + ' ' + t('phrases') + '</div>' +
    continueBtn +
    (function(){
      const es = examScore(i);
      const passed = es >= EXAM_PASS;
      return '<div class="block-list">' +
        '<div class="section-label">' + t('sec1') + '</div>' +
        wordsCard +
        '<div class="section-label">' + t('sec2') + '</div>' +
        blocks +
        '<div class="section-label">' + t('sec3') + '</div>' +
        '<div class="block-card exam-card' + (passed?' full':'') + '" onclick="startExam(' + i + ')">' +
          '<div class="block-num">🎓</div>' +
          '<div class="block-title">' + t('exam') + (passed ? t('exam_ok') : ' · ' + EXAM_N + ' ' + t('exam_q')) + '</div>' +
          (es > 0 ? '<div class="lesson-mini-pct"' + (passed?' style="color:var(--green)"':' style="color:var(--amber)"') + '>' + es + '%</div>' : '') +
        '</div>' +
      '</div>';
    })();
}

function startNextPart(i){
  for(let p=0;p<PARTS;p++){
    if(!partDone(i,p)){ startPart(i,p); return; }
  }
  startPart(i,0);
}

function startPart(i,p){
  currentLessonIdx = i;
  currentPartIdx = p;
  screen = "exercise";
  state.review = false;
  state.exam = false;
  meta.last = {l:i, p:p}; saveMeta();
  state.questions = shuffle(LESSONS[i].parts[p].q);
  state.idx = 0;
  state.phase = "answering";
  state.feedback = null;
  state.selected = [];
  state.textVal = "";
  state.score = 0;
  state.correctCount = 0;
  state.retryUsed = false;
  state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

function startMistakes(){
  if(meta.mistakes.length===0){ renderLessons(); return; }
  screen = "exercise";
  state.review = true;
  state.exam = false;
  state.questions = shuffle(meta.mistakes.slice());
  state.idx = 0; state.phase = "answering"; state.feedback = null;
  state.selected = []; state.textVal = "";
  state.score = 0; state.correctCount = 0;
  state.retryUsed = false; state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

function startExam(i){
  currentLessonIdx = i;
  screen = "exercise";
  state.exam = true;
  state.review = false;
  let all = [];
  LESSONS[i].parts.forEach(p => all = all.concat(p.q));
  state.questions = shuffle(all).slice(0, EXAM_N);
  state.idx = 0; state.phase = "answering"; state.feedback = null;
  state.selected = []; state.textVal = "";
  state.score = 0; state.correctCount = 0;
  state.retryUsed = false; state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

    return;
  }

  const hasContent = mode==="builder" ? selected.length>0 : textVal.trim().length>0;
  let inputCls = "";
  if(phase==="revealed") inputCls = feedback&&feedback.type==="ok" ? "correct-state" : "wrong-state";
  else if(hasContent) inputCls = "has-content";

  let feedbackHTML = "";
  if(feedback){
    if(feedback.type==="ok"){
      feedbackHTML = '<div class="feedback ok"><div class="fb-title">' + t('ok_t') + '</div>' +
        '<button class="listen-btn" onclick="speak(state.questions[state.idx].no)">' + t('listen') + '</button>' +
        (SR ? '<button class="listen-btn" id="mic-btn" style="margin-left:8px" onclick="pronounce()">' + t('mic') + '</button>' : '') +
        '<div class="pron-res" id="pron-res"></div></div>';
    } else if(feedback.type==="v2"){
      feedbackHTML = '<div class="feedback v2">' +
        '<div class="fb-title">' + t('v2_t') + '</div>' +
        '<div>' + feedback.message + '</div>' +
        '<div class="diff-view"><span class="diff-label">' + t('corr') + '</span>' +
          feedback.diff.map(d=>'<span class="dw ' + d.status + '">' + d.word + '</span>').join(" ") + '</div>' +
        (state.exam ? '' : getRuleHTML(current.type)) +
      '</div>';
    } else {
      feedbackHTML = '<div class="feedback err">' +
        '<div class="fb-title">' + t('err_t') + '</div>' +
        '<div class="diff-view">' + feedback.diff.map(d=>'<span class="dw ' + d.status + '">' + d.word + '</span>').join(" ") + '</div>' +
        (state.exam ? '' : getRuleHTML(current.type)) +
      '</div>';
    }
  }

  const builderHTML =
    '<div class="pool-label">' + t('your') + '</div>' +
    '<div class="builder-answer ' + inputCls + '" id="builder-ans">' +
      (selected.length===0
        ? '<span class="placeholder">' + t('tap_w') + '</span>'
        : selected.map((w,i)=>'<span class="word-chip selected" onclick="removeWord(' + i + ')">' + w + '</span>').join("")) +
    '</div>' +
    '<div class="pool-label" style="margin-top:1rem">' + t('pool') + '</div>' +
    '<div class="word-pool">' +
      pool.map((w,i)=>'<span class="word-chip pool" onclick="addWord(' + i + ')">' + w + '</span>').join("") +
    '</div>';

  const textHTML =
    '<input id="text-inp" class="text-input ' + inputCls + '" type="text" placeholder="'+t('inp_ph')+'"' +
    ' value="' + textVal.replace(/"/g,'&quot;') + '"' +
    (phase==="revealed"?" disabled":"") +
    ' oninput="onTextInput(this.value)"' +
    ' onkeydown="if(event.key===\'Enter\'&&state.phase===\'answering\')doSubmit()">';

  let buttonsHTML;
  if(phase==="revealed" && feedback && feedback.type!=="ok" && !state.retryUsed && !state.exam){
    buttonsHTML = '<div class="btn-row">' +
      '<button class="submit-btn retry-btn" onclick="doRetry()">' + t('again') + '</button>' +
      '<button class="submit-btn next" onclick="advance()">' + t('nxt') + '</button>' +
    '</div>';
  } else if(phase==="revealed"){
    buttonsHTML = '<button class="submit-btn next" onclick="advance()">' + t('nxt') + '</button>';
  } else {
    buttonsHTML = '<button class="submit-btn" onclick="doSubmit()"' + (!hasContent?" disabled":"") + '>' + t('check') + '</button>';
  }

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<div class="logo" onclick="renderLessons()">Ro!</div>' +
      '<div class="header-right">' +
        '<div class="score-chip">⭐ ' + score + ' / ' + idx + '</div>' +
        '<button class="back-btn" onclick="' + backCall + '">' + (state.review?t('back_h'):t('back_l')) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="progress-section">' +
      '<div class="progress-meta">' +
        '<span>' + headSpan + '</span>' +
        '<span>' + idx + ' / ' + total + '</span>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="milestones">' + milestones.map(m=>'<div class="ms ' + (idx>m?"done":"") + '"></div>').join("") + '</div>' +
    '</div>' +
    '<div class="mode-toggle">' +
      '<button class="mode-btn ' + (mode==="builder"?"active":"") + '" onclick="switchMode(\'builder\')">' + t('mode_c') + '</button>' +
      '<button class="mode-btn ' + (mode==="text"?"active":"") + '" onclick="switchMode(\'text\')">' + t('mode_t') + '</button>' +
      '<button class="mode-btn ' + (mode==="listen"?"active":"") + '" onclick="switchMode(\'listen\')">' + t('mode_l') + '</button>' +
    '</div>' +
    '<div class="card" id="q-card">' +
      '<div class="type-badge">' + typeLabel(current.type) + '</div>' +
      (mode==="listen" && phase!=="revealed"
        ? '<button class="play-big" onclick="speak(state.questions[state.idx].no)">' + t('play') + '</button>' +
          '<div class="listen-hint">' + t('l_hint') + '</div>'
        : '<div class="q-ru">' + srcText(current) + '</div>') +
      (mode==="text" ? textHTML : builderHTML) +
    '</div>' +
    feedbackHTML +
    buttonsHTML;
}

// ─── ACTIONS ──────────────────────────────────────────
function addWord(i){
  if(state.phase!=="answering")return;
  const w=state.pool[i];
  state.selected=[...state.selected,w];
  state.pool=state.pool.filter((_,j)=>j!==i);
  render();
}
function removeWord(i){
  if(state.phase!=="answering")return;
  const w=state.selected[i];
  state.pool=shuffle([...state.pool,w]);
  state.selected=state.selected.filter((_,j)=>j!==i);
  render();
}
function onTextInput(v){ state.textVal=v; }

function switchMode(m){
  state.mode=m;state.phase="answering";state.feedback=null;
  state.selected=[];state.textVal="";
  state.retryUsed=false;state.retryMode=false;
  state.pool=makePool(state.questions[state.idx].no);
  render();
  if(m==="listen") setTimeout(()=>speak(state.questions[state.idx].no), 250);
}

function doSubmit(){
  if(state.phase==="revealed"){ advance(); return; }

  const userAnswer = state.mode==="text"
    ? state.textVal.trim()
    : state.selected.join(" ");

  if(!userAnswer) return;
  const correct = state.questions[state.idx].no;

  if(isCorrect(userAnswer,correct)){
    if(!state.retryMode){ state.score++; }
    state.correctCount += state.retryMode ? 0 : 1;
    state.feedback={type:"ok"};
    buzz("ok");
    if(state.review) removeMistake(correct);
  } else {
    if(!state.retryMode && !state.review) addMistake(state.questions[state.idx]);
    const v2hint = checkV2(userAnswer);
    const diff = diffAnswers(userAnswer,correct);
    state.feedback = v2hint
      ? {type:"v2",message:v2hint,diff}
      : {type:"err",diff};
    buzz("err");
    setTimeout(()=>{
      const c = document.getElementById("q-card");
      if(c){ c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"),450); }
    },10);
  }
  state.phase="revealed";
  render();
}

function doRetry(){
  state.retryUsed = true;
  state.retryMode = true;
  state.phase = "answering";
  state.feedback = null;
  state.selected = [];
  state.textVal = "";
  state.pool = makePool(state.questions[state.idx].no);
  render();
}

function advance(){
  const next=state.idx+1;
  bumpDaily();
  if(!state.review && !state.exam) setPartProgress(currentLessonIdx, currentPartIdx, next);
  if(next>=state.questions.length){state.phase="done";render();return;}
  state.idx=next;state.phase="answering";state.feedback=null;
  state.selected=[];state.textVal="";
  state.retryUsed=false;state.retryMode=false;
  state.pool=makePool(state.questions[next].no);
  render();
}

// ─── FLASHCARDS (с SRS) ──────────────────────────────
let wordsState = { deck: [], flipped: false, mode: "no-ru", review: false };

function startWords(i){
  currentLessonIdx = i;
  screen = "words";
  const known = new Set(wordsKnown(i));
  let deck = [];
  WORDS[i].forEach((w,wi)=>{ if(!known.has(wi)) deck.push({l:i,wi:wi}); });
  if(deck.length===0) deck = WORDS[i].map((_,wi)=>({l:i,wi:wi}));
  wordsState.deck = shuffle(deck);
  wordsState.flipped = false;
  wordsState.review = false;
  renderWords();
}

function startWordsReview(){
  const due = srsDue();
  if(due.length===0){ renderLessons(); return; }
  screen = "words";
  wordsState.deck = shuffle(due);
  wordsState.flipped = false;
  wordsState.review = true;
  renderWords();
}

function renderWords(){
  const rev = wordsState.review;

  if(wordsState.deck.length===0){
    const i = currentLessonIdx;
    let btn, sub, icon, title;
    if(rev){
      icon='🃏'; title=t('w_rev_done');
      sub='Память укреплена. Слова вернутся<br>по интервалам: 1 · 3 · 7 · 14 · 30 дней.';
      btn='<button class="restart-btn" onclick="renderLessons()">На главную</button>';
    } else {
      const np=(function(){for(let p=0;p<PARTS;p++){if(!partDone(i,p))return p;}return 0;})();
      icon='📖'; title=t('w_done');
      sub='Все '+WORDS[i].length+' слов урока «'+LESSONS[i].title+'» в кармане.<br>Теперь фразы соберутся сами собой!';
      btn='<button class="restart-btn" onclick="startPart('+i+','+np+')">К фразам: «'+LESSONS[i].parts[np].t+'» →</button>';
    }
    document.getElementById("app").innerHTML =
      '<canvas id="fw"></canvas>' +
      '<div class="header">' +
        '<div class="logo" onclick="renderLessons()">Ro!</div>' +
        '<div class="header-right"><button class="back-btn" onclick="' + (rev?'renderLessons()':'renderLesson('+i+')') + '">' + (rev?'← Главная':'← Урок') + '</button></div>' +
      '</div>' +
      '<div class="card complete" style="margin-top:2rem">' +
        '<div class="words-done-icon">' + icon + '</div>' +
        '<div class="complete-title">' + title + '</div>' +
        '<div class="complete-sub">' + sub + '</div>' + btn +
      '</div>';
    buzz("win");
    setTimeout(launchFireworks, 60);
    return;
  }

  const cur = wordsState.deck[0];
  const w = WORDS[cur.l][cur.wi];
  const front = wordsState.mode==="no-ru" ? w.n : wordSrc(w);
  const back  = wordsState.mode==="no-ru" ? wordSrc(w) : w.n;
  let headChip, metaSpan;
  if(rev){
    headChip = '🃏 осталось ' + wordsState.deck.length;
    metaSpan = t('w_srs');
  } else {
    const list = WORDS[currentLessonIdx];
    const kc = Math.min(wordsKnown(currentLessonIdx).length, list.length);
    headChip = '📖 ' + kc + ' / ' + list.length;
    metaSpan = t('w_of') + ' ' + (currentLessonIdx+1);
  }
  const pct = rev ? 0 : Math.round(Math.min(wordsKnown(currentLessonIdx).length,WORDS[currentLessonIdx].length)/WORDS[currentLessonIdx].length*100);

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<div class="logo" onclick="renderLessons()">Ro!</div>' +
      '<div class="header-right">' +
        '<div class="score-chip">' + headChip + '</div>' +
        '<button class="back-btn" onclick="' + (rev?'renderLessons()':'renderLesson('+currentLessonIdx+')') + '">' + (rev?'← Главная':'← Урок') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="progress-section">' +
      '<div class="progress-meta"><span>' + metaSpan + '</span>' +
        (rev ? '<span>' + t('in_d') + ' ' + wordsState.deck.length + '</span>' : '<span>' + t('w_pct') + ' ' + pct + '%</span>') +
      '</div>' +
      (rev ? '' : '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>') +
    '</div>' +
    '<div class="mode-toggle">' +
      '<button class="mode-btn ' + (wordsState.mode==="no-ru"?"active":"") + '" onclick="switchWordsMode(\'no-ru\')">🇳🇴 NO → RU</button>' +
      '<button class="mode-btn ' + (wordsState.mode==="ru-no"?"active":"") + '" onclick="switchWordsMode(\'ru-no\')">🇷🇺 RU → NO</button>' +
    '</div>' +
    '<div class="word-stage" onclick="flipWord()">' +
      '<div class="word-main">' + front + '</div>' +
      (wordsState.flipped
        ? '<div class="word-divider"></div><div class="word-back">' + back + '</div>'
        : '<div class="word-hint">' + t('tap_f') + '</div>') +
      '<button class="listen-btn" onclick="event.stopPropagation();speak(WORDS[' + cur.l + '][' + cur.wi + '].n)">' + t('listen') + '</button>' +
    '</div>' +
    '<div class="btn-row">' +
      '<button class="submit-btn retry-btn" onclick="wordAgain()">' + t('again') + '</button>' +
      '<button class="submit-btn" onclick="wordKnow()">' + t('know') + '</button>' +
    '</div>' +
    '<div class="deck-count">' + t('deck') + ' ' + wordsState.deck.length + '</div>';
}

function flipWord(){ wordsState.flipped = !wordsState.flipped; renderWords(); }
function switchWordsMode(m){ wordsState.mode = m; wordsState.flipped = false; renderWords(); }
function wordKnow(){
  const cur = wordsState.deck.shift();
  addKnownWord(cur.l, cur.wi);
  srsPromote(cur.l, cur.wi);
  wordsState.flipped = false;
  renderWords();
}
function wordAgain(){
  const cur = wordsState.deck[0];
  srsReset(cur.l, cur.wi);
  wordsState.deck.push(wordsState.deck.shift());
  wordsState.flipped = false;
  renderWords();
}

// ─── SCHEDULE / CALENDAR / REMINDERS ───
function WDl(){ return t('wd'); }
function sched(){ if(!meta.sched) meta.sched = {days:[], time:'19:00'}; return meta.sched; }
function isPlannedToday(){ const d=(new Date().getDay()+6)%7; return sched().days.indexOf(d)>=0; }

function renderSchedule(){
  screen = "schedule";
  const s = sched();
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1);
  const off = (first.getDay()+6)%7;
  const dim = new Date(y, m+1, 0).getDate();
  const hist = new Set(meta.hist||[]);
  const tstr = dstr(0);
  const WD = WDl();
  let cells = WD.map(w=>'<div class="cal-h">'+w+'</div>').join('');
  for(let i=0;i<off;i++) cells += '<div class="cal-d other"></div>';
  for(let d=1;d<=dim;d++){
    const ds = y+'-'+(m+1)+'-'+d;
    const wd = (new Date(y,m,d).getDay()+6)%7;
    let cls = 'cal-d';
    if(s.days.indexOf(wd)>=0) cls += ' plan';
    if(hist.has(ds)) cls += ' hit';
    if(ds===tstr) cls += ' today';
    cells += '<div class="'+cls+'">'+d+'</div>';
  }
  const monthName = t('mo')[m];
  const notifOn = meta.notif && (typeof Notification!=='undefined') && Notification.permission==='granted';

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<div class="logo" onclick="renderLessons()">Ro!</div>' +
      '<div class="header-right"><button class="back-btn" onclick="renderLessons()">' + t('back_h') + '</button></div>' +
    '</div>' +
    '<div class="detail-title">' + t('sched') + '</div>' +
    '<div class="detail-sub">' + t('sched_s') + '</div>' +
    '<div class="card" style="margin-top:1rem">' +
      '<div class="pool-label">' + monthName + ' ' + y + ' · <span style="color:var(--green)">●</span> ' + t('cal_leg') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="pool-label">' + t('days_t') + '</div>' +
      '<div class="wd-row">' + WDl().map((w,i)=>'<div class="wd-chip'+(s.days.indexOf(i)>=0?' on':'')+'" onclick="toggleDay('+i+')">'+w+'</div>').join('') + '</div>' +
      '<div class="sched-row"><span class="sched-label">' + t('time_t') + '</span>' +
        '<input class="time-input" id="sched-time" type="time" value="'+s.time+'" onchange="setSchedTime(this.value)"></div>' +
      '<button class="submit-btn" style="margin-bottom:10px" onclick="downloadICS()">' + t('ics') + '</button>' +
      '<button class="submit-btn retry-btn" id="notif-btn" onclick="toggleNotif()">' + (notifOn?t('notif_on'):t('notif_off')) + '</button>' +
      '<div class="deck-count" style="margin-top:10px">' + t('sched_n') + '</div>' +
    '</div>';
}

function toggleDay(i){
  const s = sched();
  const ix = s.days.indexOf(i);
  if(ix>=0) s.days.splice(ix,1); else s.days.push(i);
  saveMeta(); renderSchedule();
}
function setSchedTime(v){ sched().time = v || '19:00'; saveMeta(); }

function downloadICS(){
  const s = sched();
  if(s.days.length===0){ alert(t('pick_days')); return; }
  const BY = ['MO','TU','WE','TH','FR','SA','SU'];
  const [hh,mm] = s.time.split(':');
  const now = new Date();
  let st = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +hh, +mm);
  while(s.days.indexOf((st.getDay()+6)%7)<0 || st < now) st = new Date(st.getTime()+864e5);
  const p = n => (n<10?'0':'')+n;
  const dt = st.getFullYear()+p(st.getMonth()+1)+p(st.getDate())+'T'+p(st.getHours())+p(st.getMinutes())+'00';
  const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Ro//NO\r\nBEGIN:VEVENT\r\nUID:ro-norsk-'+Date.now()+'\r\nDTSTART:'+dt+'\r\nDURATION:PT20M\r\nRRULE:FREQ=WEEKLY;BYDAY='+s.days.map(d=>BY[d]).join(',')+'\r\nSUMMARY:Ro! — норвежский 🚣\r\nDESCRIPTION:Запланированная сессия: 10 фраз и пара слов. Ro ro ro!\r\nBEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:Пора грести!\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = 'ro-norsk.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

function toggleNotif(){
  if(typeof Notification==='undefined'){ alert('Браузер не поддерживает уведомления'); return; }
  if(meta.notif && Notification.permission==='granted'){ meta.notif = 0; saveMeta(); renderSchedule(); return; }
  Notification.requestPermission().then(function(p){
    if(p==='granted'){ meta.notif = 1; saveMeta(); }
    renderSchedule();
  });
}

let lastNotifMin = '';
setInterval(function(){
  try{
    if(!meta.notif || typeof Notification==='undefined' || Notification.permission!=='granted') return;
    if(!isPlannedToday()) return;
    const n = new Date();
    const cur = (n.getHours()<10?'0':'')+n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes();
    if(cur===sched().time && lastNotifMin!==cur+dstr(0)){
      lastNotifMin = cur+dstr(0);
      new Notification('Ro! 🚣', {body:'Сегодня запланированная сессия — урок ждёт!'});
      buzz('ok');
    }
  }catch(e){}
}, 30000);

// ─── FIREWORKS ──────────────────────────────────────
function launchFireworks(){
  const cv = document.getElementById('fw');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  let parts = [];
  let bursts = 0;
  const MAX_BURSTS = 7;
  function burst(){
    const x = cv.width*(0.2+Math.random()*0.6);
    const y = cv.height*(0.12+Math.random()*0.38);
    const hue = Math.floor(Math.random()*360);
    for(let i=0;i<64;i++){
      const a = Math.PI*2*i/64;
      const sp = 2 + Math.random()*3.8;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:hue+Math.random()*40-20});
    }
    bursts++;
  }
  burst();
  const iv = setInterval(()=>{ if(bursts<MAX_BURSTS) burst(); else clearInterval(iv); }, 430);
  function frame(){
    if(!document.getElementById('fw')){ clearInterval(iv); return; }
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.vy+=0.045; p.vx*=0.985; p.vy*=0.985;
      p.life-=0.011;
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = 'hsl(' + p.hue + ',92%,66%)';
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.3,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    parts = parts.filter(p=>p.life>0);
    if(parts.length>0 || bursts<MAX_BURSTS){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,cv.width,cv.height); }
  }
  requestAnimationFrame(frame);
}

if(TG && TG.CloudStorage){
  try{
    TG.CloudStorage.getItems(['ro_progress','ro_meta'], function(err, vals){
      if(err || !vals) return;
      try{ if(vals.ro_progress) progress = JSON.parse(vals.ro_progress); }catch(e){}
      try{ if(vals.ro_meta){ meta = JSON.parse(vals.ro_meta); if(!meta.mistakes) meta.mistakes = []; } }catch(e){}
      if(screen==="lessons") renderLessons();
      else if(screen==="lesson") renderLesson(currentLessonIdx);
    });
  }catch(e){}
}

goToLessons();
