r them."},{"t":21,"no":"Jeg synes det er fint at man kan høre hvor folk kommer fra.","ru":"Не так уж плохо, что ты можешь понять по их говору, откуда они.","en":"I think it's nice that you can hear where people come from."},{"t":26,"no":"Rolf: Ikke når de er på tv eller snakker til folk fra andre steder.","ru":"Рольф: Но не тогда, когда они выступают по телевизору или общаются с людьми из другой местности.","en":"Rolf: Not when they're on TV or talking to people from other places."},{"t":31,"no":"Da skal de snakke tydelig. De bør ta hensyn til om folk forstår dem.","ru":"Надо говорить отчетливо. Они должны помнить о том, что их могут просто не понять.","en":"Then they should speak clearly. They ought to consider whether people understand them."},{"t":37,"no":"Jorunn: Du skjønner hvis du vil skjønne.","ru":"Йорунн: Если захочешь понять, поймешь.","en":"Jorunn: You'll understand if you want to understand."},{"t":40,"no":"Rolf: Kanskje, men tenk på utlendingene da. Det er veldig vanskelig for dem.","ru":"Рольф: Допустим, но подумай об иностранцах! Для них это еще сложнее.","en":"Rolf: Maybe, but think of the foreigners. It's very hard for them."},{"t":46,"no":"Jorunn: Og hvordan synes du folk skulle snakke da?","ru":"Йорунн: И как же, по-твоему, нужно разговаривать?","en":"Jorunn: And how do you think people should speak, then?"},{"t":49,"no":"Rolf: De skulle snakke sånn som meg, selvfølgelig.","ru":"Рольф: Так же, как я, разумеется.","en":"Rolf: They should speak like me, of course."}],"title_en":"In front of the TV","sub_en":"In front of the TV · En-To-Tre"},{"id":"07nor","file":"07nor.mp3","title":"Indira får vondt i ryggen","sub":"У Индиры болит спина · Ny i Norge","lines":[{"t":0,"no":"– Nei, Indira, dette går ikke. Jeg synes at du skal gå hjem.","ru":"Нет, Индира, так не пойдет. Тебе нужно ехать домой.","en":"– No, Indira, this isn't working. I think you should go home."},{"t":5,"no":"– Hvis jeg klarer å gå, da.","ru":"Если получится, тогда…","en":"– If I can manage to walk, that is."},{"t":7,"no":"– Jeg kan ringe til faren din. Kanskje han kan hente deg?","ru":"Я могу позвонить твоему отцу. Может быть, он сможет тебя забрать?","en":"– I can call your father. Maybe he can come and get you?"},{"t":12,"no":"– Nei, faren min er ikke hjemme akkurat nå.","ru":"Нет, папы сейчас нет дома.","en":"– No, my father isn't at home right now."},{"t":15,"no":"– Det var leit. Han er jo fysioterapeut …","ru":"Жаль. Он ведь физиотерапевт...","en":"– That's a shame. He's a physiotherapist, after all …"},{"t":18,"no":"– Ja, jeg må nok bestille time hos legen.","ru":"Да, мне, наверное, надо будет записаться к врачу.","en":"– Yes, I'll probably have to book an appointment with the doctor."},{"t":22,"no":"– Har du fastlege?","ru":"У тебя есть постоянный врач?","en":"– Do you have a regular doctor?"},{"t":24,"no":"– Ja, vi har en fastlege. Hele familien går til henne.","ru":"Да, у нас есть семейный врач. Вся семья лечится у него.","en":"– Yes, we have a regular doctor. The whole family goes to her."},{"t":28,"no":"– Det er bra. Vil du bruke telefonen på kontoret?","ru":"Это хорошо. Хочешь воспользоваться телефоном в кабинете?","en":"– That's good. Do you want to use the phone in the office?"},{"t":32,"no":"– Gjerne. Tusen takk.","ru":"Да, спасибо большое.","en":"– Yes, please. Thanks very much."},{"t":34,"no":"– Jeg skal hjelpe deg inn dit.","ru":"Сейчас я тебе помогу.","en":"– I'll help you in there."}],"title_en":"Indira gets a sore back","sub_en":"Indira's back hurts · Ny i Norge"},{"id":"08nor","file":"08nor.mp3","title":"Smakte maten?","sub":"Ну как, вкусно? · Ny i Norge","lines":[{"t":0,"no":"Anne: God dag. Jeg har bestilt et bord til Anne Lien.","ru":"Анна: Добрый день. Я забронировала столик на Анну Лиен.","en":"Anne: Good afternoon. I've booked a table for Anne Lien."},{"t":4,"no":"Kelneren: Det stemmer. Det er det bordet der borte ved vinduet. Vær så god.","ru":"Официант: Да, верно. Ваш столик там у окна. Прошу вас.","en":"Kelneren: That's right. It's that table over there by the window. Here you are."},{"t":9,"no":"Anne: Takk.","ru":"Анна: Спасибо.","en":"Anne: Thanks."},{"t":10,"no":"Kelneren: Her er menyen, vær så god.","ru":"Официант: Вот меню.","en":"Kelneren: Here's the menu, here you are."},{"t":12,"no":"Anne: Ja, men vi vet hva vi skal ha. Har dere ribbe, med medisterpølse og alt som hører med?","ru":"Анна: Спасибо, но мы уже знаем, что хотим заказать. У вас есть ребрышки со свиной колбасой и всем, что полагается?","en":"Anne: Yes, but we know what we're going to have. Have you got ribbe, with medisterpølse and everything that goes with it?"},{"t":19,"no":"Kelneren: Ja, selvsagt. To porsjoner?","ru":"Официант: Да, конечно. Две порции?","en":"Kelneren: Yes, of course. Two portions?"},{"t":22,"no":"Anne: Ja takk.","ru":"Анна: Да.","en":"Anne: Yes, please."},{"t":23,"no":"Kelneren: Og hva vil dere ha å drikke?","ru":"Официант: А что будете пить?","en":"Kelneren: And what would you like to drink?"},{"t":25,"no":"Anne: En øl til meg.","ru":"Анна: Я буду пиво.","en":"Anne: A beer for me."},{"t":27,"no":"John: Jeg kjører, så jeg tar en alkoholfri øl.","ru":"Джон: Я за рулем, поэтому я возьму безалкогольное пиво.","en":"John: I'm driving, so I'll have an alcohol-free beer."},{"t":30,"no":"Anne: Smakte det godt, synes du?","ru":"Анна: Ну как, тебе понравилось?","en":"Anne: Did it taste good, do you think?"},{"t":33,"no":"John: Ja, det var ikke så verst. Det likner kanskje litt på «spare-ribs»?","ru":"Джон: Да, неплохо. Похоже на свиную грудинку, да?","en":"John: Yes, it wasn't bad at all. It's maybe a bit like «spare-ribs»?"},{"t":38,"no":"Anne: Kanskje det, men dette er jo ikke grillet.","ru":"Анна: Возможно. Это все-таки не на гриле.","en":"Anne: Maybe so, but this isn't grilled, of course."},{"t":42,"no":"John: Nei, det er sant. Men likevel …","ru":"Джон: Да, это верно. Но все-таки…","en":"John: No, that's true. But all the same …"}],"title_en":"Did the food taste good?","sub_en":"So, was it good? · Ny i Norge"},{"id":"09nor","file":"09nor.mp3","title":"Hvordan går det med studiene? – 1","sub":"Как твоя учеба? - 1 · En-To-Tre","lines":[{"t":0,"no":"Jon: Hei, Laura. Hvordan går det med økonomistudiene?","ru":"Джон: Привет, Лаура. Как твои занятия по экономике?","en":"Jon: Hi, Laura. How are the economics studies going?"},{"t":4,"no":"Laura: Jeg har sluttet å studere økonomi. Nå tar jeg kunsthistorie.","ru":"Лаура: Я бросила экономику. Теперь я изучаю историю искусств.","en":"Laura: I've stopped studying economics. I'm doing art history now."},{"t":9,"no":"Jon: Kunsthistorie! Hvorfor det? Er det ikke lettere å få en god jobb med økonomi enn med kunsthistorie?","ru":"Джон: Историю искусств? Почему? Разве экономисту не легче найти хорошую работу, чем искусствоведу?","en":"Jon: Art history! Why's that? Isn't it easier to get a good job with economics than with art history?"},{"t":17,"no":"Laura: Jo, det er det sikkert. Men det er viktigst for meg å gjøre noe jeg er interessert i.","ru":"Лаура: Да, пожалуй. Но для меня самое важное - заниматься тем, что мне интересно.","en":"Laura: Yes, it probably is. But the most important thing for me is to do something I'm interested in."},{"t":24,"no":"Jeg forsto at jeg ikke likte økonomi. For meg er det mye mer interessant med kunsthistorie.","ru":"Я поняла, что мне не нравится экономика. Для меня гораздо интереснее история искусств.","en":"I realised I didn't like economics. For me art history is much more interesting."},{"t":31,"no":"Jon: Men hva slags jobb kan du få? Hva vil du gjøre hvis du ikke får jobb etter studiene?","ru":"Джон: А какую работу ты можешь найти? Что ты будешь делать, если не устроишься на работу после окончания вуза?","en":"Jon: But what kind of job can you get? What will you do if you don't get a job after your studies?"},{"t":38,"no":"Laura: Jeg vil helst jobbe i mediene, men det er nok ikke lett å få jobb der.","ru":"Лаура: Я бы хотела работать в СМИ, но там не так просто устроиться на работу.","en":"Laura: I'd most like to work in the media, but it's probably not easy to get a job there."},{"t":44,"no":"Hvis jeg ikke finner noe annet, kan jeg ta en vaskejobb eller sitte i kassa på supermarkedet.","ru":"Если не найду ничего другого, я могу быть уборщицей или сидеть на кассе в супермаркете.","en":"If I don't find anything else, I can take a cleaning job or sit at the till in the supermarket."},{"t":52,"no":"Det er ikke så viktig. Jeg er sikker på at jeg får en jobb.","ru":"Это не так уж важно. Я уверена, что без работы не останусь.","en":"It's not that important. I'm sure I'll get a job."}],"title_en":"How are your studies going? – 1","sub_en":"How are your studies going? - 1 · En-To-Tre"},{"id":"10nor","file":"10nor.mp3","title":"Hvordan går det med studiene? – 2","sub":"Как твоя учеба? - 2 · En-To-Tre","lines":[{"t":0,"no":"Jon: Er ikke lønna viktig for deg?","ru":"Джон: Для тебя не важна зарплата?","en":"Jon: Isn't the pay important to you?"},{"t":2,"no":"Laura: Jo, litt, kanskje. Jeg må tjene nok til å betale studielånet.","ru":"Лаура: Да, немного, может быть. Нужно накопить на оплату студенческого кредита.","en":"Laura: Yes, a bit, maybe. I need to earn enough to pay off my student loan."},{"t":8,"no":"Men først vil jeg ha en morsom studietid.","ru":"Но прежде меня ждет увлекательная учеба.","en":"But first I want to have a fun time as a student."},{"t":11,"no":"Men du, da - valgte du å studere medisin fordi det er lett å få en god jobb?","ru":"А ты как – ты решил изучать медицину, потому что легко будет найти хорошую работу?","en":"But what about you - did you choose to study medicine because it's easy to get a good job?"},{"t":17,"no":"Jon: Nei, jeg er interessert i mennesker, og jeg synes det er interessant med medisin.","ru":"Джон: Нет, мне интересны люди, и медицина для меня – интересное направление.","en":"Jon: No, I'm interested in people, and I find medicine interesting."},{"t":23,"no":"Men jeg tenkte også på at det er lettere å få seg en god jobb for en lege enn for mange andre.","ru":"Но я также думал и о том, что врачу проще найти хорошую работу, чем представителям многих других профессий.","en":"But I also thought about the fact that it's easier for a doctor to get a good job than for a lot of others."},{"t":31,"no":"Laura: Du får sikkert bedre lønn enn meg. Men kanskje jeg har det morsommere enn deg mens vi studerer.","ru":"Лаура: Тебе, конечно, будут платить больше. Но зато, наверное, у меня учеба интереснее.","en":"Laura: You'll certainly get better pay than me. But maybe I'll have more fun than you while we're studying."},{"t":39,"no":"Nå skal jeg ha en forelesning om italiensk kunst. Jeg gleder meg.","ru":"Сейчас будет лекция по итальянскому искусству. Надо идти.","en":"Now I've got a lecture on Italian art. I'm looking forward to it."},{"t":44,"no":"Jon: Jeg må også skynde meg. Jeg skal på et seminar om psykologi. Det er mer interessant!","ru":"Джон: Мне тоже пора. Я собираюсь на семинар по психологии. Это еще интереснее!","en":"Jon: I have to hurry too. I'm off to a seminar on psychology. That's more interesting!"},{"t":50,"no":"Laura: God fornøyelse.","ru":"Лаура: Удачи.","en":"Laura: Enjoy."},{"t":51,"no":"Jon: I like måte.","ru":"Джон: И тебе.","en":"Jon: You too."}],"title_en":"How are your studies going? – 2","sub_en":"How are your studies going? - 2 · En-To-Tre"},{"id":"11nor","file":"11nor.mp3","title":"På bussen","sub":"В автобусе · En-To-Tre","lines":[{"t":0,"no":"Per: Hei, Kari.","ru":"Пер: Привет, Кари!","en":"Per: Hi, Kari."},{"t":1,"no":"Kari: Hei, Per. Hyggelig å se deg.","ru":"Кари: Привет, Пер. Рада тебя видеть.","en":"Kari: Hi, Per. Nice to see you."},{"t":4,"no":"Per: I like måte. Kan jeg sitte her?","ru":"Пер: Я тоже. Можно присесть?","en":"Per: You too. Can I sit here?"},{"t":6,"no":"Kari: Selvfølgelig. Hvor skal du?","ru":"Кари: Конечно. Куда едешь?","en":"Kari: Of course. Where are you going?"},{"t":8,"no":"Per: Jeg skal til sentrum, på kino. Vil du bli med meg?","ru":"Пер: Я еду в центр, в кино. Хочешь со мной?","en":"Per: I'm going into town, to the cinema. Do you want to come with me?"},{"t":12,"no":"Kari: Dessverre. Jeg kan ikke. Jeg skal på jobb.","ru":"Кари: К сожалению, не могу. Мне надо на работу.","en":"Kari: Unfortunately not. I can't. I'm off to work."},{"t":16,"no":"Per: Hvor jobber du nå?","ru":"Пер: Где ты сейчас работаешь?","en":"Per: Where are you working now?"},{"t":18,"no":"Kari: Jeg er kokk på en restaurant i Fjellgata.","ru":"Кари: Я повар в ресторане на улице Фьелльгата.","en":"Kari: I'm a chef at a restaurant in Fjellgata."},{"t":21,"no":"Per: Hva med søndag? Har du fri på søndag?","ru":"Пер: А как насчет воскресенья? В воскресенье ты свободна?","en":"Per: What about Sunday? Are you free on Sunday?"},{"t":24,"no":"Kari: Ja, jeg jobber ikke på søndag, men da har jeg en avtale med Grete.","ru":"Кари: Да, я не работаю в воскресенье, но на этот раз мы уже договорились с Гретой.","en":"Kari: Yes, I'm not working on Sunday, but I've made plans with Grete then."},{"t":29,"no":"Vi skal på lang tur i fjellet. Vil du bli med oss?","ru":"Мы собираемся в длинный поход в горы. Пойдешь с нами?","en":"We're going on a long hike in the mountains. Do you want to come with us?"},{"t":33,"no":"Per: Lang tur? Hm, nei, dessverre. Jeg kan ikke på søndag.","ru":"Пер: Длинный поход? Хм, нет, к сожалению. Я не могу в воскресенье.","en":"Per: A long hike? Hm, no, unfortunately not. I can't on Sunday."},{"t":38,"no":"Jeg skal ..., jeg må ... . Jeg har ikke tid på søndag.","ru":"Я должен... Мне надо... Мне некогда в воскресенье.","en":"I'm going to ..., I have to ... . I haven't got time on Sunday."},{"t":42,"no":"Kari: Jeg forstår. Oi! Her må jeg gå av. Ser deg senere.","ru":"Кари: Понимаю. О! Моя остановка. Увидимся позже.","en":"Kari: I understand. Oh! This is where I get off. See you later."},{"t":46,"no":"Per: Men når kan vi gå på kino? Jeg ringer deg tirsdag eller onsdag. OK?","ru":"Пер: Но когда же мы сходим в кино? Я позвоню тебе во вторник или в среду. ОК?","en":"Per: But when can we go to the cinema? I'll ring you Tuesday or Wednesday. OK?"},{"t":52,"no":"Kari: Fint! Ha det. Vi ses.","ru":"Кари: Хорошо! Пока. До встречи.","en":"Kari: Great! Bye. See you."}],"title_en":"On the bus","sub_en":"On the bus · En-To-Tre"},{"id":"12nor","file":"12nor.mp3","title":"På kafé","sub":"В кафе · En-To-Tre","lines":[{"t":0,"no":"Lasse: Skal vi gå på kafé?","ru":"Лассе: Пойдем в кафе?","en":"Lasse: Shall we go to a café?"},{"t":2,"no":"Marit: Ja, gjerne. Her er en kafé.","ru":"Марит: Да, я бы не отказалась. Вот кафе.","en":"Marit: Yes, I'd love to. Here's a café."},{"t":5,"no":"Lasse: Fint. Vi går inn her.","ru":"Лассе: Хорошо. Зайдем сюда.","en":"Lasse: Great. Let's go in here."},{"t":7,"no":"Lasse: Er du sulten?","ru":"Лассе: Проголодалась?","en":"Lasse: Are you hungry?"},{"t":8,"no":"Marit: Ja, litt.","ru":"Марит: Да, немного.","en":"Marit: Yes, a bit."},{"t":9,"no":"Lasse: Hva vil du ha?","ru":"Лассе: Что будешь есть?","en":"Lasse: What would you like?"},{"t":11,"no":"Marit: Jeg vet ikke. Kanskje et rundstykke med ost.","ru":"Марит: Я не знаю. Может быть, булочку с сыром.","en":"Marit: I don't know. Maybe a roll with cheese."},{"t":14,"no":"Lasse: Vil du ha noe å drikke?","ru":"Лассе: А пить?","en":"Lasse: Would you like something to drink?"},{"t":16,"no":"Marit: Bare en kopp kaffe. Og du?","ru":"Марит: Только кофе. А ты?","en":"Marit: Just a cup of coffee. And you?"},{"t":18,"no":"Lasse: Jeg er tørst. Jeg tar et glass øl. Unnskyld, er det lov å røyke her?","ru":"Лассе: Я хочу пить. Я возьму стакан пива. Извините, здесь можно курить?","en":"Lasse: I'm thirsty. I'll have a glass of beer. Excuse me, is smoking allowed here?"},{"t":24,"no":"Servitør: Nei, dessverre.","ru":"Официант: Нет, к сожалению.","en":"Servitør: No, I'm afraid not."},{"t":26,"no":"Marit: Du må gå ut og røyke.","ru":"Марит: Придется тебе покурить на улице.","en":"Marit: You'll have to go outside to smoke."},{"t":28,"no":"Lasse: Ut? Er du gal? Det er jo vinter.","ru":"Лассе: На улице? Ты с ума сошла? Сейчас же зима.","en":"Lasse: Outside? Are you mad? It's winter, after all."},{"t":31,"no":"Servitør: Vil dere bestille?","ru":"Официант: Будете что-то заказывать?","en":"Servitør: Would you like to order?"},{"t":33,"no":"Lasse: Ja takk. Et glass øl, en kopp kaffe og et rundstykke med ost.","ru":"Лассе: Да. Стакан пива, чашку кофе и булочку с сыром.","en":"Lasse: Yes, please. A glass of beer, a cup of coffee and a roll with cheese."},{"t":37,"no":"Nei forresten, jeg vil også ha kaffe. To kopper kaffe, et rundstykke og en is.","ru":"Впрочем, погодите, я тоже возьму кофе. Два кофе, булочку и мороженое.","en":"No, actually, I'll have coffee too. Two cups of coffee, a roll and an ice cream."},{"t":43,"no":"Servitør: Sjokoladeis eller vaniljeis?","ru":"Официант: Шоколадное или ванильное?","en":"Servitør: Chocolate ice cream or vanilla ice cream?"},{"t":45,"no":"Lasse: Sjokoladeis. Har dere sjokoladesaus?","ru":"Лассе: Шоколадное. У вас есть шоколадный соус?","en":"Lasse: Chocolate ice cream. Have you got chocolate sauce?"},{"t":48,"no":"Servitør: Ja, det har vi.","ru":"Официант: Да, есть.","en":"Servitør: Yes, we have."},{"t":50,"no":"Marit: Skal du spise sjokoladeis med sjokoladesaus?","ru":"Марит: Ты будешь шоколадное мороженое с шоколадным соусом?","en":"Marit: Are you going to eat chocolate ice cream with chocolate sauce?"},{"t":53,"no":"Lasse: Ja, det er kjempegodt.","ru":"Лассе: Ну да, это же просто супер.","en":"Lasse: Yes, it's absolutely delicious."}],"title_en":"At a café","sub_en":"At a café · En-To-Tre"},{"id":"13nor","file":"13nor.mp3","title":"Hva gjorde du i helga?","sub":"Как прошли выходные? · En-To-Tre","lines":[{"t":0,"no":"Kirsten: Hei John. Hvordan går det? Hadde du det hyggelig i helga?","ru":"Кирстен: Привет, Джон. Как дела? Как выходные?","en":"Kirsten: Hi John. How are you? Did you have a nice weekend?"},{"t":5,"no":"John: Ikke spesielt!","ru":"Джон: Ничего особенного.","en":"John: Not especially!"},{"t":7,"no":"Kirsten: Å, var ikke du ute sammen med Anita i går?","ru":"Кирстен: О, разве ты не гулял с Анитой вчера?","en":"Kirsten: Oh, weren't you out with Anita yesterday?"},{"t":10,"no":"John: Hun kom ikke!","ru":"Джон: Она не пришла.","en":"John: She didn't come!"},{"t":12,"no":"Kirsten: Kom hun ikke? Kanskje hun var syk.","ru":"Кирстен: Да? Может быть, заболела.","en":"Kirsten: She didn't come? Maybe she was ill."},{"t":15,"no":"John: Nei, vi snakket sammen i telefonen etter frokost.","ru":"Джон: Нет, мы говорили по телефону после завтрака.","en":"John: No, we spoke on the phone after breakfast."},{"t":19,"no":"Kirsten: Kan det være en misforståelse?","ru":"Кирстен: Может, произошло недоразумение?","en":"Kirsten: Could it be a misunderstanding?"},{"t":21,"no":"John: Jeg tror ikke det. Avtalen var klokka halv to utenfor kinoen.","ru":"Джон: Не думаю. Мы договорились встретиться в полвторого, рядом с кинотеатром.","en":"John: I don't think so. We agreed on half past one outside the cinema."},{"t":27,"no":"Jeg kom kvart over to og ventet i over en time. Jeg følte meg helt dum!","ru":"Я пришел в 2:15 и ждал целый час. Я чувствовал себя так глупо!","en":"I got there at a quarter past two and waited for over an hour. I felt completely stupid!"},{"t":34,"no":"Kirsten: Jeg trodde hun likte deg godt.","ru":"Кирстен: Я думала, что ты ей понравился.","en":"Kirsten: I thought she liked you a lot."},{"t":36,"no":"John: Det trodde jeg også. Men man kan ikke stole på norske jenter!","ru":"Джон: Я тоже так думал. Но нельзя положиться на норвежских девушек!","en":"John: So did I. But you can't trust Norwegian girls!"},{"t":41,"no":"Kirsten: Et øyeblikk! Sa du at du kom klokka kvart over to?","ru":"Кирстен: Минутку! Так ты говоришь, что пришел в 15 минут третьего?","en":"Kirsten: Hang on a moment! Did you say you got there at a quarter past two?"},{"t":46,"no":"John: Ja.","ru":"Джон: Да.","en":"John: Yes."},{"t":47,"no":"Kirsten: Og avtalen var klokka halv to?","ru":"Кирстен: И встреча была назначена на половину второго?","en":"Kirsten: And you'd agreed on half past one?"},{"t":50,"no":"John: Det sa jeg jo!","ru":"Джон: Да, все правильно.","en":"John: That's what I said!"},{"t":52,"no":"Kirsten: Ha! Da må du skynde deg å ringe henne og be om unnskyldning.","ru":"Кирстен: Ага! Тогда ты должен немедленно ей позвонить и извиниться.","en":"Kirsten: Ha! Then you'd better hurry up and ring her and apologise."},{"t":56,"no":"John: Hva? Hvorfor det?","ru":"Джон: Что? Почему?","en":"John: What? Why's that?"},{"t":58,"no":"Kirsten: Fordi du kom for sent! Og så må du lese kapittel sju i norskboka en gang til!","ru":"Кирстен: Потому что ты опоздал! И перечитай главу 7 в учебнике норвежского!","en":"Kirsten: Because you were late! And then you'll have to read chapter seven in your Norwegian book again!"}],"title_en":"What did you do at the weekend?","sub_en":"How was your weekend? · En-To-Tre"},{"id":"14nor","file":"14nor.mp3","title":"Utenfor treningsstudioet","sub":"У спортзала · Ny i Norge","lines":[{"t":0,"no":"Hassan: Hei, Larissa, hyggelig å se deg! Hvordan går det?","ru":"Хасан: Привет, Лариса, рад тебя видеть! Как дела?","en":"Hassan: Hi, Larissa, nice to see you! How are you?"},{"t":4,"no":"Larissa: Det går bra. Og med deg?","ru":"Лариса: Все в порядке. А у тебя?","en":"Larissa: I'm fine. And you?"},{"t":7,"no":"Hassan: Jeg er litt forkjølet. Ellers går det bra.","ru":"Хасан: Немного простыл. В остальном все хорошо.","en":"Hassan: I've got a bit of a cold. Otherwise I'm fine."},{"t":10,"no":"Larissa: Sier du det? Ja, det er viktig å holde seg i form. Da blir du ikke syk så lett.","ru":"Лариса: Да ты что? Держи себя в форме, это важно. Тогда так легко не заболеешь.","en":"Larissa: Really? Well, it's important to keep in shape. Then you don't get ill so easily."},{"t":17,"no":"Hassan: Ja, kanskje det?","ru":"Хасан: Да, может быть.","en":"Hassan: Yes, maybe so."},{"t":19,"no":"Larissa: Og så er det gøy å trene også. Jeg pleier å trene to ganger i uka.","ru":"Лариса: К тому же физкультура дарит радость. Я обычно тренируюсь два раза в неделю.","en":"Larissa: And working out is fun, too. I usually work out twice a week."},{"t":25,"no":"Hassan: Jeg har aldri vært på sånn trening. Men jeg har spilt fotball i mange år.","ru":"Хасан: Я никогда не был на такой тренировке. Но я много лет играл в футбол.","en":"Hassan: I've never been to that kind of training. But I've played football for many years."},{"t":32,"no":"Kanskje jeg kan prøve når jeg blir frisk?","ru":"Может быть, когда мне станет лучше, попробовать сходить?","en":"Maybe I could try when I get better?"},{"t":35,"no":"Larissa: Hvorfor ikke? Du kan jo ha en prøvetime.","ru":"Лариса: Почему бы нет? Ты можете просто посетить пробное занятие.","en":"Larissa: Why not? You could always have a trial session."},{"t":39,"no":"Hassan: Det er sant. Er du også på vei til norskkurset, forresten?","ru":"Хасан: Это верно. Кстати, ты тоже идешь на курсы норвежского?","en":"Hassan: That's true. By the way, are you on your way to the Norwegian course too?"},{"t":43,"no":"Larissa: Nei, jeg kan ikke komme i kveld. Jeg må være barnevakt.","ru":"Лариса: Нет, я не могу. Сегодня вечером я работаю няней.","en":"Larissa: No, I can't come tonight. I have to babysit."},{"t":48,"no":"Randi har reist til England, og Ståle skal på fotballkamp.","ru":"Ранди побывала в Англии, а Столе собирается на футбольный матч.","en":"Randi's gone to England, and Ståle's going to a football match."},{"t":53,"no":"Hassan: Javel. Vil du at jeg skal gi beskjed til Tor?","ru":"Хасан: Хорошо. Хочешь, чтобы я передал Тору?","en":"Hassan: I see. Do you want me to let Tor know?"},{"t":56,"no":"Larissa: Nei, det trenger du ikke. Jeg har snakket med Tor.","ru":"Лариса: Нет, не нужно. Я уже поговорила с Тором.","en":"Larissa: No, you don't need to. I've spoken to Tor."},{"t":59,"no":"Hassan: Ja vel. Men nå må jeg gå. Jeg vil ikke komme for seint.","ru":"Хасан: Ладно. Мне пора. Лучше не опаздывать.","en":"Hassan: All right. But I have to go now. I don't want to be late."},{"t":64,"no":"Larissa: Nei, det er sant. Vi ses - og god bedring!","ru":"Лариса: Правильно. До встречи, и выздоравливай!","en":"Larissa: No, that's true. See you - and get well soon!"}],"title_en":"Outside the gym","sub_en":"Outside the gym · Ny i Norge"},{"id":"15nor","file":"15nor.mp3","title":"Ikke kjør så fort!","sub":"Не гони так сильно! · Ny i Norge","lines":[{"t":0,"no":"Carlos: Ikke kjør så fort, Hassan! Det er jo bare seksti kilometer her.","ru":"Карлос: Не гони так, Хасан! Ограничение 60 километров в час.","en":"Carlos: Don't drive so fast, Hassan! It's only sixty kilometres an hour here."},{"t":5,"no":"Hassan: Men det er ingen trafikk her ute på landet. Er du redd?","ru":"Хасан: Но в этой местности совсем слабое движение. Ты боишься?","en":"Hassan: But there's no traffic out here in the countryside. Are you scared?"},{"t":10,"no":"Carlos: Nei, men jeg synes du skal kjøre forsiktig. Veien er fryktelig smal.","ru":"Карлос: Нет, но я думаю, ездить надо осторожно. Дорога ужасно узкая.","en":"Carlos: No, but I think you should drive carefully. The road is terribly narrow."},{"t":15,"no":"Se der! To gutter med en ball.","ru":"Смотри! Там два мальчика с мячом.","en":"Look there! Two boys with a ball."},{"t":18,"no":"Hassan: Ja, jeg ser dem. Jeg kjører bare i femti. Sett på radioen, er du snill!","ru":"Хасан: Да, вижу. Я еду не быстрее 50. Будь добр, включи радио.","en":"Hassan: Yes, I can see them. I'm only doing fifty. Put the radio on, will you!"},{"t":24,"no":"Carlos: Hør så stilig musikk.","ru":"Карлос: Хорошая музыка.","en":"Carlos: Listen, what great music."},{"t":26,"no":"Se hvordan du kjører! Du kjører altfor fort!","ru":"Не увлекайся! Ты едешь слишком быстро!","en":"Look how you're driving! You're driving far too fast!"},{"t":29,"no":"Hassan: Ikke mas sånn! Jeg kjører forsiktig.","ru":"Хасан: Да не переживай ты так! Я аккуратно езжу.","en":"Hassan: Don't nag like that! I'm driving carefully."},{"t":32,"no":"Carlos: Nei, jeg synes ikke at du gjør det. Har du ikke kjørt i Norge før? Det er ikke lov å kjøre så fort!","ru":"Карлос: Что-то не заметно. Ты никогда раньше не был в Норвегии? Нельзя здесь так гонять!","en":"Carlos: No, I don't think you are. Haven't you driven in Norway before? You're not allowed to drive that fast!"},{"t":39,"no":"Hassan: Men jeg må jo teste bilen din litt. Vi må se hva den kan.","ru":"Хасан: Но надо немного проверить машину. Мы должны узнать ее возможности.","en":"Hassan: But I've got to test your car a bit. We have to see what it can do."},{"t":44,"no":"Carlos: Nei, det er ikke nødvendig. Og forresten, tenk om det er fartskontroll?","ru":"Карлос: Без этого вполне можно обойтись. И, кстати, ты про дорожную инспекцию подумал?","en":"Carlos: No, that isn't necessary. And besides, what if there's a speed check?"},{"t":50,"no":"Hassan: Det er vel ikke fartskontroll her, langt ute på landet!","ru":"Хасан: Откуда здесь в глубинке дорожная инспекция?","en":"Hassan: There's hardly a speed check here, way out in the countryside!"}],"title_en":"Don't drive so fast!","sub_en":"Don't drive so fast! · Ny i Norge"},{"id":"16nor","file":"16nor.mp3","title":"Fartskontroll","sub":"Дорожная инспекция · Ny i Norge","lines":[{"t":0,"no":"Carlos: Hassan, nå kjører du for fort. Bilen er helt ny, og jeg har ikke lyst til å ødelegge den den første dagen!","ru":"Карлос: Хасан, сейчас ты точно превышаешь. Машина совсем новая, и я не хочу испортить ее в первый же день!","en":"Carlos: Hassan, you're driving too fast now. The car is brand new, and I don't fancy wrecking it on the first day!"},{"t":8,"no":"Se der!","ru":"Смотри!","en":"Look there!"},{"t":9,"no":"Hassan: Hva var det?","ru":"Хасан: Что это было?","en":"Hassan: What was that?"},{"t":10,"no":"Carlos: Jeg tror at det var en radar.","ru":"Карлос: Кажется, это был радар.","en":"Carlos: I think that was a speed camera."},{"t":12,"no":"Hassan: Å nei, tror du jeg ble tatt?","ru":"Хасан: Только не это! Думаешь, меня засекли?","en":"Hassan: Oh no, do you think I got caught?"},{"t":14,"no":"Carlos: Sannsynligvis. Der står politiet! De vinker på oss.","ru":"Карлос: Наверное. Вон стоит полиция! Они машут нам.","en":"Carlos: Probably. There's the police! They're waving us down."},{"t":18,"no":"Konstabelen: God dag.","ru":"Полицейский: Добрый день.","en":"Konstabelen: Good afternoon."},{"t":19,"no":"Hassan: God dag.","ru":"Хасан: Добрый день.","en":"Hassan: Good afternoon."},{"t":20,"no":"Konstabelen: Du har det visst travelt i dag! Kan jeg få se førerkortet?","ru":"Полицейский: Ну вы и разогнались! Могу я увидеть ваши права?","en":"Konstabelen: You're certainly in a hurry today! Can I see your driving licence?"},{"t":25,"no":"Hassan: Dessverre, jeg har glemt det hjemme.","ru":"Хасан: К сожалению, я забыл их дома.","en":"Hassan: Unfortunately, I've left it at home."},{"t":28,"no":"Konstabelen: Det var verre. Er dette din bil?","ru":"Полицейский: Это уже хуже. Это ваш автомобиль?","en":"Konstabelen: That makes it worse. Is this your car?"},{"t":31,"no":"Hassan: Nei, det er bilen til kameraten min.","ru":"Хасан: Нет, это машина моего друга.","en":"Hassan: No, it's my friend's car."},{"t":33,"no":"Konstabelen: Er det riktig?","ru":"Полицейский: Это правда?","en":"Konstabelen: Is that right?"},{"t":35,"no":"Carlos: Ja, det er det.","ru":"Карлос: Да, это так.","en":"Carlos: Yes, it is."},{"t":36,"no":"Konstabelen: Vel, da må jeg få se vognkortet. Og så må jeg ha navnet ditt.","ru":"Полицейский: Ну, тогда я посмотрю технический талон. Ваше имя?","en":"Konstabelen: Well, then I'll have to see the registration document. And I'll need your name."},{"t":41,"no":"Hassan: Det er Hassan Darani.","ru":"Хасан: Хасан Дарани.","en":"Hassan: It's Hassan Darani."},{"t":43,"no":"Konstabelen: Vel, Hassan Darani, da får du en fartsbot på femten hundre kroner.","ru":"Полицейский: Что ж, Хасан Дарани, вы получаете штрафной талон на 1500 крон за превышение скорости.","en":"Konstabelen: Well, Hassan Darani, then you're getting a speeding fine of fifteen hundred kroner."},{"t":50,"no":"Du får også en bot på fem hundre kroner for å kjøre uten å ha førerkortet med deg.","ru":"Также вы должны будете заплатить 500 крон штрафа за вождение без водительских прав.","en":"You're also getting a fine of five hundred kroner for driving without your driving licence on you."},{"t":56,"no":"Hassan: Så mye?","ru":"Хасан: Так много?","en":"Hassan: That much?"},{"t":57,"no":"Konstabelen: Ja, sånn er det. Vedtar du bøtene?","ru":"Полицейский: Да, так и есть. Или вы не согласны?","en":"Konstabelen: Yes, that's how it is. Do you accept the fines?"},{"t":61,"no":"Hassan: Ja, jeg må vel det ...","ru":"Хасан: Я полагаю, согласен…","en":"Hassan: Yes, I suppose I have to ..."}],"title_en":"Speed check","sub_en":"Speed check · Ny i Norge"},{"id":"17nor","file":"17nor.mp3","title":"Kjære mor og far! – 1","sub":"Дорогие мама и папа! – 1 · Ny i Norge","lines":[{"t":0,"no":"Kjære mor og far!","ru":"Дорогие мама и папа!","en":"Dear Mum and Dad!"},{"t":2,"no":"Her kommer en hilsen fra Norge.","ru":"Привет вам из Норвегии.","en":"Here's a greeting from Norway."},{"t":5,"no":"Først vil jeg takke for at dere er så flinke til å ringe til oss.","ru":"Прежде всего хочу сказать спасибо, что успеваете нам звонить.","en":"First of all I want to thank you for being so good about ringing us."},{"t":10,"no":"Det er vi veldig glade for, for vi vet at det er dyrt!","ru":"Нам очень приятно, ведь мы знаем, что это дорого.","en":"We're really glad of it, because we know it's expensive!"},{"t":15,"no":"Vi trives her i Norge, men vi savner dere jo.","ru":"Мы живем здесь как в сказке, только скучаем по вам.","en":"We're happy here in Norway, but of course we miss you."},{"t":19,"no":"Tom trives også. Han går i barnehage og har fått mange venner.","ru":"У Тома тоже все замечательно. Он ходит в детский сад и у него много друзей.","en":"Tom is happy too. He goes to nursery and has made lots of friends."},{"t":25,"no":"Han vokser og er blid og glad.","ru":"Он растет счастливым и веселым.","en":"He's growing, and he's cheerful and happy."},{"t":28,"no":"I barnehagen er de forresten veldig flinke til å hjelpe ham med språket, så han snakker ganske godt norsk allerede.","ru":"Садик очень помогает ему учить язык, так что он уже хорошо говорит по-норвежски.","en":"At the nursery, by the way, they're very good at helping him with the language, so he already speaks Norwegian quite well."},{"t":36,"no":"Da jeg skrev sist, fortalte jeg at det var vanskelig å forstå nyhetene på TV.","ru":"Когда я писал вам в прошлый раз, я говорил, что мне трудно понимать новости по телевизору.","en":"When I wrote last time, I told you it was hard to understand the news on TV."},{"t":42,"no":"Nå går det bra. Anne hjelper meg, og jeg forstår nesten alt når folk snakker norsk.","ru":"Теперь все наладилось. Анна помогает мне, и я понимаю почти все, что говорят норвежцы.","en":"Now it's going fine. Anne helps me, and I understand almost everything when people speak Norwegian."},{"t":49,"no":"I går spilte bandet vårt i en sekstiårsdag.","ru":"Вчера мы с группой играли на юбилее 60 лет.","en":"Yesterday our band played at a sixtieth birthday party."},{"t":52,"no":"Mora til en av de andre i bandet fylte år.","ru":"Именинницей была мать одного из музыкантов.","en":"It was the birthday of the mother of one of the others in the band."},{"t":55,"no":"Det var litt av en fest, kan dere tro!","ru":"Вот это вечеринка была!","en":"It was quite a party, I can tell you!"},{"t":58,"no":"Vi fikk være til stede på middagen, og jeg skal si det var stil over det.","ru":"Мы остались на банкет, который был довольно своеобразен.","en":"We got to stay for the dinner, and I must say it was done in style."},{"t":64,"no":"Mye mer formelt enn hjemme hos oss i USA!","ru":"Гораздо более торжественное мероприятие, чем у нас в Америке.","en":"Much more formal than back home with us in the USA!"},{"t":68,"no":"Det var bordplassering, og jeg kjente ingen av dem jeg satt ved siden av.","ru":"Места были распределены, и я не знал никого из своих соседей по столу.","en":"There was a seating plan, and I didn't know any of the people I was sitting next to."}],"title_en":"Dear Mum and Dad! – 1","sub_en":"Dear Mum and Dad! – 1 · Ny i Norge"},{"id":"18nor","file":"18nor.mp3","title":"Kjære mor og far! – 2","sub":"Дорогие мама и папа! - 2 · Ny i Norge","lines":[{"t":0,"no":"Men den ene var bonde, og vi snakket om norsk jordbruk og om USA.","ru":"Один из них был фермером, и мы говорили о норвежском сельском хозяйстве и о США.","en":"But one of them was a farmer, and we talked about Norwegian agriculture and about the USA."},{"t":6,"no":"Den andre var litt sjenert. Han sa ikke så mye.","ru":"Другой был немного застенчивым и больше помалкивал.","en":"The other one was a bit shy. He didn't say very much."},{"t":10,"no":"Han svarte bare ja eller nei når jeg spurte om noe.","ru":"Только отвечал «да» или «нет», когда я о чем-то спрашивал.","en":"He just answered yes or no when I asked about something."},{"t":14,"no":"Men det er klart det kan være litt vanskelig å vite hva en skal snakke med fremmede mennesker om ...","ru":"Но, конечно, немного трудно находить темы для разговора, когда общаешься с незнакомыми людьми...","en":"But of course it can be a bit difficult to know what to talk about with people you don't know ..."},{"t":21,"no":"Maten var imidlertid god: Laks og jordbær med fløte.","ru":"Однако еда была хорошая: лосось и клубника со сливками.","en":"The food, however, was good: salmon and strawberries with cream."},{"t":26,"no":"Det var mange taler ved bordet.","ru":"Было много застольных речей.","en":"There were a lot of speeches at the table."},{"t":28,"no":"Først hilste hovedpersonens mann alle velkommen.","ru":"Сначала всех приветствовал муж виновницы торжества.","en":"First the guest of honour's husband welcomed everyone."},{"t":32,"no":"Deretter var det lange taler. Maten ble kald mens de snakket.","ru":"Потом были еще длинные речи. Еда успела остыть, пока они разглагольствовали.","en":"Then came the long speeches. The food went cold while they talked."},{"t":38,"no":"På festen spiste jeg med kniv og gaffel på den måten som de gjør her i Europa.","ru":"На вечеринке я ел ножом и вилкой, как делают здесь, в Европе.","en":"At the party I ate with a knife and fork the way they do here in Europe."},{"t":44,"no":"Jeg er ofte usikker på hva jeg skal gjøre når amerikanske og norske tradisjoner er forskjellige.","ru":"Я часто затрудняюсь с тем, как поступить, когда сталкиваюсь с культурными различиями.","en":"I'm often unsure what to do when American and Norwegian traditions are different."},{"t":51,"no":"Som oftest har jeg Anne i nærheten til å hjelpe meg, men ...","ru":"Конечно, я всегда могу спросить жену, и все же...","en":"Most of the time I've got Anne nearby to help me, but ..."},{"t":55,"no":"Siden dette er den første julen vår i Norge, tenkte vi å invitere dere hit.","ru":"Так как это наше первое Рождество в Норвегии, мы думаем пригласить вас сюда.","en":"Since this is our first Christmas in Norway, we thought we'd invite you here."},{"t":61,"no":"Vi er jo ikke så mange. Annes foreldre og broren hennes med familie kommer også.","ru":"Нас не так много. Придут родители Анны и ее брат с семьей.","en":"There aren't that many of us, after all. Anne's parents and her brother with his family are coming too."},{"t":67,"no":"Med dere blir vi ti personer, to små og åtte store.","ru":"С вами нас будет десять человек - два малыша и восемь взрослых.","en":"With you we'll be ten people, two little ones and eight grown-ups."},{"t":72,"no":"Vi håper dere kan komme, og ser fram til å være samlet alle sammen.","ru":"Мы надеемся, что вы сможете приехать, и с нетерпением ждем того дня, когда мы соберемся всей семьей.","en":"We hope you can come, and we're looking forward to all being together."},{"t":78,"no":"Kjærlige hilsener fra John","ru":"С любовью, Джон","en":"Love from John"}],"title_en":"Dear Mum and Dad! – 2","sub_en":"Dear Mum and Dad! - 2 · Ny i Norge"},{"id":"19nor","file":"19nor.mp3","title":"Et julebesøk","sub":"Рождественский вечер · Ny i Norge","lines":[{"t":0,"no":"Anne: Hvor mange personer blir vi egentlig?","ru":"Анна: Сколько нас будет точно?","en":"Anne: How many of us are there going to be, actually?"},{"t":3,"no":"John: Tja, alt i alt blir vi, la meg se, åtte voksne og to barn.","ru":"Джон: Так, давай посмотрим - восемь взрослых и двое детей.","en":"John: Well, all in all we'll be, let me see, eight adults and two children."},{"t":8,"no":"Anne: Men de fleste er norske. Og de vil sikkert ha norsk mat på julaften.","ru":"Анна: Причем большинство - норвежцы. И они, безусловно, захотят чего-нибудь норвежского в канун Рождества.","en":"Anne: But most of them are Norwegian. And they'll definitely want Norwegian food on Christmas Eve."},{"t":15,"no":"John: Ja, men den norske julematen er jo så spesiell.","ru":"Джон: Да, но норвежская рождественская кухня так специфична...","en":"John: Yes, but Norwegian Christmas food is so particular."},{"t":19,"no":"Anne: Vi pleier å ha ribbe. Har du smakt det?","ru":"Анна: Обычно у нас бывают ребрышки. Ты пробовал?","en":"Anne: We usually have pork ribs. Have you tasted that?"},{"t":22,"no":"John: Nei, men jeg har smakt pinnekjøtt.","ru":"Джон: Нет, но я уже пробовал ребрышки ягненка.","en":"John: No, but I've tasted pinnekjøtt."},{"t":25,"no":"Da vi spilte på den nye restauranten med bandet forrige lørdag, fikk vi det.","ru":"Когда мы с группой играли в новом ресторане в прошлую субботу, там и попробовал.","en":"When we played at the new restaurant with the band last Saturday, we got that."},{"t":31,"no":"Det smakte ikke så verst. Men - familien din har kanskje ikke spist kalkun.","ru":"На вкус не так уж плохо. Но... у вас в семье, наверное, никогда не ели индейку.","en":"It didn't taste too bad. But - maybe your family has never eaten turkey."},{"t":37,"no":"Det kan jo være spennende å prøve nye ting!","ru":"А ведь так интересно пробовать новые блюда!","en":"It can be exciting to try new things!"},{"t":40,"no":"Anne: Ikke på julaften. Da er nordmenn veldig konservative.","ru":"Анна: Только не в канун Рождества. В этом отношении норвежцы очень консервативны.","en":"Anne: Not on Christmas Eve. Norwegians are very conservative then."},{"t":45,"no":"John: Kan vi ikke lage en blandingsmeny?","ru":"Джон: А как насчет устроить смешанное меню?","en":"John: Can't we make a mixed menu?"},{"t":48,"no":"Anne: Jo, det var en god idé. Så kan vi ha ribbe til hovedrett og pai til dessert.","ru":"Анна: Хорошая идея. Тогда можно на первое приготовить ребрышки, а на десерт - пирог.","en":"Anne: Yes, that's a good idea. Then we can have pork ribs for the main course and pie for dessert."},{"t":55,"no":"John: Ja, eller kanskje kalkun til hovedrett og multekrem til dessert.","ru":"Джон: Или, может, на первое будет индейка, а на десерт - морошковый крем.","en":"John: Yes, or maybe turkey for the main course and cloudberry cream for dessert."},{"t":61,"no":"Anne: Det høres godt ut! Det tar vi.","ru":"Анна: Звучит отлично! Так и сделаем.","en":"Anne: That sounds good! Let's go for that."}],"title_en":"A Christmas visit","sub_en":"Christmas evening · Ny i Norge"},{"id":"20nor","file":"20nor.mp3","title":"Hva driver du med? – 1","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Sonia, 32 år","ru":"Соня, 32 года","en":"Sonia, 32 years old"},{"no":"– Hva gjør du nå, Sonia?","ru":"Чем вы сейчас занимаетесь, Соня?","en":"– What are you doing now, Sonia?"},{"no":"– Jeg er hjemmeværende.","ru":"Я домохозяйка.","en":"– I'm a stay-at-home mum."},{"no":"Vi har to barn som skal begynne på skolen nå, og da vil jeg gjerne være hjemme og passe på dem.","ru":"У нас двое детей пошли в школу, и я бы хотела быть дома и присматривать за ними.","en":"We've got two children who are about to start school now, and so I'd really like to be at home and look after them."},{"no":"Jeg synes det er viktig at de har noen å komme hjem til når de er ferdige på skolen.","ru":"Я считаю, для ребенка важно, чтобы кто-то встречал его дома, когда он приходит из школы.","en":"I think it's important that they have someone to come home to when they're finished at school."},{"no":"– Har du jobbet utenfor hjemmet før?","ru":"А раньше вы где-то работали?","en":"– Have you worked outside the home before?"},{"no":"– Jeg jobbet litt i en barnehage før jeg giftet meg, og før jeg kom hit til landet.","ru":"Я работала немного в детском саду до того, как вышла замуж и до того, как переехала в эту страну.","en":"– I worked a bit in a nursery before I got married, and before I came to this country."},{"no":"– Har du lyst til å ta utdanning eller gå ut i jobb senere?","ru":"Хотели бы вы в будущем пойти работать или учиться?","en":"– Do you want to get some education or go out to work later on?"},{"no":"– Jeg vet ikke. Kanskje. Jeg liker å jobbe hjemme.","ru":"Не знаю. Может быть. Мне нравится следить за домом.","en":"– I don't know. Maybe. I like working at home."},{"no":"Men når barna blir større, får jeg kanskje lyst til å komme ut litt.","ru":"Но, как дети подрастут, возможно, я захочу немного развеяться.","en":"But when the children get bigger, I might feel like getting out a bit."},{"no":"Jeg kan få en vaskejobb på kjøpesenteret nå, hvis jeg vil.","ru":"Сейчас я могла бы работать уборщицей в торговом центре.","en":"I could get a cleaning job at the shopping centre now, if I wanted."},{"no":"Men jeg foretrekker å være hjemme i noen år til.","ru":"Но я хочу посидеть дома еще несколько лет.","en":"But I prefer to be at home for a few more years."}],"title_en":"What do you do? – 1","sub_en":"Stein på stein - Leksjon 1"},{"id":"21nor","file":"21nor.mp3","title":"Hva driver du med? – 2","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Jan, 45 år","ru":"Ян, 45 лет","en":"Jan, 45 years old"},{"no":"– Hva driver du med, Jan?","ru":"Чем вы занимаетесь, Ян?","en":"– What do you do, Jan?"},{"no":"– Jeg har vært arbeidsledig i noen måneder, men i neste uke begynner jeg som sjåfør i et stort firma.","ru":"Я несколько месяцев был безработным, но на следующей неделе начинаю работать водителем в крупной компании.","en":"– I've been unemployed for a few months, but next week I'm starting as a driver at a big company."},{"no":"Det gleder jeg meg til.","ru":"Не терпится приступить.","en":"I'm looking forward to that."},{"no":"– Hva slags jobber har du hatt før?","ru":"Кем вы работали раньше?","en":"– What sort of jobs have you had before?"},{"no":"– Før jeg kom hit til landet, jobbet jeg som ingeniør.","ru":"До того как приехал в страну, я был инженером.","en":"– Before I came to this country, I worked as an engineer."},{"no":"– Har du hatt jobb her i landet?","ru":"А у нас в стране вы работали?","en":"– Have you had a job here in this country?"},{"no":"– Ja, jeg har hatt forskjellige jobber. Først jobbet jeg på et fiskemottak, senere på et lager.","ru":"Да, я работал в разных местах. Сначала на рыбозаводе, потом на складе.","en":"– Yes, I've had various jobs. First I worked at a fish processing plant, later at a warehouse."},{"no":"– Hva slags jobb vil du helst ha?","ru":"Кем бы вы хотели работать?","en":"– What sort of job would you most like to have?"},{"no":"– Jeg håper at jeg får godkjent ingeniørutdanningen min.","ru":"Я надеюсь, что смогу подтвердить свой диплом инженера.","en":"– I'm hoping to get my engineering qualifications recognised."},{"no":"Men foreløpig er jeg fornøyd med å være sjåfør.","ru":"Но пока я доволен и должностью водителя.","en":"But for now I'm happy being a driver."},{"no":"Det er en ganske selvstendig jobb – den gir frihet.","ru":"Работаешь сам по себе, никто над душой не стоит.","en":"It's quite an independent job – it gives you freedom."},{"no":"Lønna er heller ikke så verst.","ru":"И зарплата неплохая.","en":"And the pay isn't bad either."}],"title_en":"What do you do? – 2","sub_en":"Stein på stein - Leksjon 1"},{"id":"22nor","file":"22nor.mp3","title":"Hva driver du med? – 3","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Ella, 21 år","ru":"Элла, 21 год","en":"Ella, 21 years old"},{"no":"– Hva gjør du, Ella?","ru":"Чем вы занимаетесь, Элла?","en":"– What do you do, Ella?"},{"no":"– Jeg går på norskkurs, og så jobber jeg i butikk tre kvelder i uka.","ru":"Я хожу на курсы норвежского и работаю в магазине три вечера в неделю.","en":"– I go to a Norwegian course, and I work in a shop three evenings a week."},{"no":"Jeg har tenkt å begynne å studere her, men først må jeg lære mer norsk.","ru":"Я планирую начать учиться, но сначала нужно выучить норвежский как следует.","en":"I'm planning to start studying here, but first I have to learn more Norwegian."},{"no":"– Hva har du tenkt å studere?","ru":"Что вы собираетесь изучать?","en":"– What are you planning to study?"},{"no":"– Hjemme studerte jeg matematikk og kjemi. Nå har jeg lyst til å studere oljeteknologi.","ru":"На родине я изучала математику и химию. Теперь я хочу изучать нефтяные технологии.","en":"– Back home I studied maths and chemistry. Now I'd like to study petroleum technology."},{"no":"Jeg ønsker meg en jobb i oljeindustrien. Det er drømmejobben.","ru":"Я хочу работать в нефтяной промышленности. Это работа моей мечты.","en":"I want a job in the oil industry. That's the dream job."},{"no":"– Hvorfor det?","ru":"Почему?","en":"– Why's that?"},{"no":"– Det virker spennende. Jeg kan få jobb i mange land, og jeg tror jeg kan tjene ganske bra i en slik jobb.","ru":"Мне кажется, это здорово. Я могу найти работу во многих странах, и я думаю, что могу неплохо преуспеть на такой работе.","en":"– It seems exciting. I can get work in lots of countries, and I think I can earn quite well in a job like that."},{"no":"– Lykke til!","ru":"Удачи.","en":"– Good luck!"},{"no":"– Takk!","ru":"Спасибо!","en":"– Thanks!"}],"title_en":"What do you do? – 3","sub_en":"Stein på stein - Leksjon 1"},{"id":"23nor","file":"23nor.mp3","title":"Hva driver du med? – 5","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Linn, 27 år","ru":"Линн, 27 лет","en":"Linn, 27 years old"},{"no":"– Hva slags planer har du, Linn?","ru":"Какие у вас планы, Линн?","en":"– What sort of plans have you got, Linn?"},{"no":"– Drømmen min er å starte et spisested.","ru":"Моя мечта - открыть свой ресторан.","en":"– My dream is to start an eating place."},{"no":"Jeg har jobbet på mange restauranter og kafeer, så jeg har lang erfaring.","ru":"Я работала во многих ресторанах и кафе, и у меня большой опыт.","en":"I've worked at lots of restaurants and cafés, so I've got long experience."},{"no":"– Hvorfor vil du starte for deg selv?","ru":"Почему вы хотите открыть свое дело?","en":"– Why do you want to start up on your own?"},{"no":"– Jeg har lyst på nye utfordringer.","ru":"Я люблю стремиться к новым вершинам.","en":"– I want new challenges."},{"no":"Jeg har mange gode ideer som jeg gjerne vil prøve å gjøre noe med.","ru":"У меня много хороших идей, которые я хотела бы попробовать реализовать.","en":"I've got lots of good ideas that I'd really like to try to do something with."},{"no":"Og det er morsommere å jobbe for seg selv enn for andre.","ru":"И на себя работать интереснее, чем на других.","en":"And it's more fun working for yourself than for other people."},{"no":"– Hva slags spisested har du tenkt deg?","ru":"Каким вы видите свой ресторан?","en":"– What sort of eating place have you got in mind?"},{"no":"– Jeg har tenkt meg et typisk lunsjsted.","ru":"Я думаю, типичное место, где можно пообедать.","en":"– I'm thinking of a typical lunch place."},{"no":"Folk her i byen går mer og mer ut på kafé i lunsjpausen, og jeg vil gi dem noe nytt.","ru":"Местные жители все чаще ходят обедать в кафе, и я хочу предложить им что-то новенькое.","en":"People here in town go out to cafés more and more in the lunch break, and I want to give them something new."},{"no":"– Hva da?","ru":"Что именно?","en":"– Like what?"},{"no":"– Jeg vil spesialisere meg på teservering.","ru":"Моей «изюминкой» будет чайное обслуживание.","en":"– I want to specialise in serving tea."},{"no":"Tenk deg: Te fra mange kanter av verden – og så smørbrød og kaker som passer til.","ru":"Представьте себе: чай со всех концов света, а к нему соответствующие бутерброды и пирожные.","en":"Just imagine: tea from many corners of the world – and then open sandwiches and cakes to go with it."},{"no":"– Det virker spennende.","ru":"Звучит заманчиво.","en":"– That sounds exciting."},{"no":"– Ja, jeg håper jeg klarer det.","ru":"Да, я надеюсь, что у меня получится.","en":"– Yes, I hope I can manage it."},{"no":"Jeg går på AMO-kurs nå for å lære hva jeg må gjøre hvis jeg vil starte for meg selv.","ru":"Сейчас я иду на курсы АМО, чтобы научиться тому, как открыть свое дело.","en":"I'm on an AMO course now to learn what I have to do if I want to start up on my own."},{"no":"– Det er vel ikke lett?","ru":"Наверно, это не легко?","en":"– It's not easy, though, is it?"},{"no":"– Nei, det ser nokså komplisert ut. Det er så mange lover og regler man må kjenne til.","ru":"Да, выглядит непросто. Надо знать столько законов и постановлений.","en":"– No, it looks rather complicated. There are so many laws and rules you have to know about."},{"no":"Men jeg skal klare det! Jeg har bare meg selv å tenke på, så jeg kan jobbe hardt.","ru":"Но я справлюсь! У меня нет других забот, так что я могу с головой уйти в работу.","en":"But I'm going to manage it! I've only got myself to think about, so I can work hard."},{"no":"– Lykke til!","ru":"Удачи!","en":"– Good luck!"},{"no":"– Takk skal du ha.","ru":"Спасибо.","en":"– Thank you very much."}],"title_en":"What do you do? – 5","sub_en":"Stein på stein - Leksjon 1"},{"id":"24nor","file":"24nor.mp3","title":"Hva driver du med? – 5","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Linn, 27 år","ru":"Линн, 27 лет","en":"Linn, 27 years old"},{"no":"– Hva slags planer har du, Linn?","ru":"Какие у вас планы, Линн?","en":"– What sort of plans have you got, Linn?"},{"no":"– Drømmen min er å starte et spisested.","ru":"Моя мечта - открыть свой ресторан.","en":"– My dream is to start an eating place."},{"no":"Jeg har jobbet på mange restauranter og kafeer, så jeg har lang erfaring.","ru":"Я работала во многих ресторанах и кафе, и у меня большой опыт.","en":"I've worked at lots of restaurants and cafés, so I've got long experience."},{"no":"– Hvorfor vil du starte for deg selv?","ru":"Почему вы хотите открыть свое дело?","en":"– Why do you want to start up on your own?"},{"no":"– Jeg har lyst på nye utfordringer.","ru":"Я люблю стремиться к новым вершинам.","en":"– I want new challenges."},{"no":"Jeg har mange gode ideer som jeg gjerne vil prøve å gjøre noe med.","ru":"У меня много хороших идей, которые я хотела бы попробовать реализовать.","en":"I've got lots of good ideas that I'd really like to try to do something with."},{"no":"Og det er morsommere å jobbe for seg selv enn for andre.","ru":"И на себя работать интереснее, чем на других.","en":"And it's more fun working for yourself than for other people."},{"no":"– Hva slags spisested har du tenkt deg?","ru":"Каким вы видите свой ресторан?","en":"– What sort of eating place have you got in mind?"},{"no":"– Jeg har tenkt meg et typisk lunsjsted.","ru":"Я думаю, типичное место, где можно пообедать.","en":"– I'm thinking of a typical lunch place."},{"no":"Folk her i byen går mer og mer ut på kafé i lunsjpausen, og jeg vil gi dem noe nytt.","ru":"Местные жители все чаще ходят обедать в кафе, и я хочу предложить им что-то новенькое.","en":"People here in town go out to cafés more and more in the lunch break, and I want to give them something new."},{"no":"– Hva da?","ru":"Что именно?","en":"– Like what?"},{"no":"– Jeg vil spesialisere meg på teservering.","ru":"Моей «изюминкой» будет чайное обслуживание.","en":"– I want to specialise in serving tea."},{"no":"Tenk deg: Te fra mange kanter av verden – og så smørbrød og kaker som passer til.","ru":"Представьте себе: чай со всех концов света, а к нему соответствующие бутерброды и пирожные.","en":"Just imagine: tea from many corners of the world – and then open sandwiches and cakes to go with it."},{"no":"– Det virker spennende.","ru":"Звучит заманчиво.","en":"– That sounds exciting."},{"no":"– Ja, jeg håper jeg klarer det.","ru":"Да, я надеюсь, что у меня получится.","en":"– Yes, I hope I can manage it."},{"no":"Jeg går på AMO-kurs nå for å lære hva jeg må gjøre hvis jeg vil starte for meg selv.","ru":"Сейчас я иду на курсы АМО*, чтобы научиться тому, как открыть свое дело.","en":"I'm on an AMO course now to learn what I have to do if I want to start up on my own."},{"no":"– Det er vel ikke lett?","ru":"Наверно, это не легко?","en":"– It's not easy, though, is it?"},{"no":"– Nei, det ser nokså komplisert ut. Det er så mange lover og regler man må kjenne til.","ru":"Да, выглядит непросто. Надо знать столько законов и постановлений.","en":"– No, it looks rather complicated. There are so many laws and rules you have to know about."},{"no":"Men jeg skal klare det! Jeg har bare meg selv å tenke på, så jeg kan jobbe hardt.","ru":"Но я справлюсь! У меня нет других забот, так что я могу с головой уйти в работу.","en":"But I'm going to manage it! I've only got myself to think about, so I can work hard."},{"no":"– Lykke til!","ru":"Удачи!","en":"– Good luck!"},{"no":"– Takk skal du ha.","ru":"Спасибо.","en":"– Thank you very much."}],"title_en":"What do you do? – 5","sub_en":"Stein på stein - Leksjon 1"},{"id":"25nor","file":"25nor.mp3","title":"I lunsjpausen","sub":"Stein på stein - Leksjon 4","lines":[{"no":"Finn: Nå må jeg slanke meg!","ru":"Финн: Пора бы мне похудеть!","en":"Finn: I really need to lose some weight!"},{"no":"Ove: Å? Har kona begynt å klage?","ru":"Уве: Да? Жена начала жаловаться?","en":"Ove: Oh? Has your wife started complaining?"},{"no":"Finn: Litt, og så var jeg hos legen i går.","ru":"Финн: Немного, и еще вчера я был у врача.","en":"Finn: A bit, and then I was at the doctor's yesterday."},{"no":"Ove: Dårlige nyheter?","ru":"Уве: Плохие новости?","en":"Ove: Bad news?"},{"no":"Finn: Jeg veier for mye, og blodtrykket er for høyt.","ru":"Финн: Лишний вес и повышенное давление.","en":"Finn: I weigh too much, and my blood pressure's too high."},{"no":"Ove: Da bør du kanskje spise litt salat til lunsj?","ru":"Уве: Тогда, может, тебе съесть на обед немного салата?","en":"Ove: Then maybe you should have a bit of salad for lunch?"},{"no":"Finn: Jeg har ikke tenkt å bli vegetarianer. Jeg er ikke noen kanin!","ru":"Финн: Я не собираюсь становиться вегетарианцем. Я не кролик!","en":"Finn: I'm not planning to become a vegetarian. I'm not a rabbit!"},{"no":"Ove: Nei, men litt grønnsaker skader ikke. Du bør i det minste kutte ut colaen.","ru":"Уве: Как хочешь, но немного овощей не помешает. По меньшей мере нужно отказаться от кока-колы.","en":"Ove: No, but a few vegetables won't do any harm. You should at least cut out the cola."},{"no":"Vet du at det er over femti sukkerbiter i ei slik flaske?","ru":"Знаешь, что в одной бутылке колы более 50 кубиков сахара?","en":"Do you know there are over fifty sugar cubes in a bottle like that?"},{"no":"Finn: Nå tuller du! Men hva gjør du for å holde deg i form? Går du på helsestudio?","ru":"Финн: Ничего себе! Но как же ты остаешься в форме? Ходишь в спортзал?","en":"Finn: You're joking! But what do you do to keep in shape? Do you go to the gym?"},{"no":"Ove: Nei, men jeg går en tur hver dag etter jobben.","ru":"Уве: Нет, но я хожу на прогулку каждый день после работы.","en":"Ove: No, but I go for a walk every day after work."},{"no":"Finn: Hjelper det?","ru":"Финн: Помогает?","en":"Finn: Does it help?"},{"no":"Ove: Absolutt. En time hver dag hjelper godt.","ru":"Уве: Еще как. Всего час в день - и ты другой человек.","en":"Ove: Absolutely. An hour every day helps a lot."},{"no":"Kan du ikke bli med meg? Vi bor jo ikke så langt fra hverandre.","ru":"Не хочешь присоединиться? Мы живем не так далеко друг от друга.","en":"Why don't you come with me? We don't live that far from each other, after all."},{"no":"Finn: Kanskje det. Da blir i alle fall kona fornøyd.","ru":"Финн: Пожалуй. По крайней мере, жена будет довольна.","en":"Finn: Maybe I will. At least then my wife will be happy."}],"title_en":"In the lunch break","sub_en":"Stein på stein - Leksjon 4"},{"id":"26nor","file":"26nor.mp3","title":"Et møte","sub":"Stein på stein - Leksjon 5","lines":[{"no":"Randi: Har du ikke fått deg pc ennå?","ru":"Ранди: Ты еще не купил себе компьютер?","en":"Randi: Haven't you got yourself a PC yet?"},{"no":"Stein: Nei, hvorfor det? Jeg klarer meg godt uten.","ru":"Стайн: Нет, зачем? Я прекрасно обхожусь без него.","en":"Stein: No, why would I? I manage fine without one."},{"no":"Randi: Jeg er helt avhengig av datamaskinen og av Internett.","ru":"Ранди: А я не могу жить без компьютера и Интернета.","en":"Randi: I'm completely dependent on my computer and on the Internet."},{"no":"Stein: Hva bruker du den til?","ru":"Стайн: Для чего ты его используешь?","en":"Stein: What do you use it for?"},{"no":"Randi: Jeg skriver e-post og betaler regninger. Dessuten finner jeg informasjon om alt som skjer.","ru":"Ранди: Я пишу письма по электронной почте и оплачиваю счета онлайн. К тому же узнаю новости обо всем, что происходит в мире.","en":"Randi: I write emails and pay bills. Besides, I find information about everything that's going on."},{"no":"Stein: Jeg foretrekker å skrive gammeldagse brev på papir. Og jeg synes jeg får vite det jeg trenger på andre måter.","ru":"Стайн: Мне больше по душе старомодные письма на бумаге. И я могу узнать все, что мне нужно, из других источников.","en":"Stein: I prefer writing old-fashioned letters on paper. And I find I get to know what I need in other ways."},{"no":"Randi: Men på nettet kommer det nyheter hele tida. Og jeg kan slå opp på nettsidene til de fleste store avisene i verden.","ru":"Ранди: Но в интернете новости все время обновляются. Я могу зайти на сайт большинства крупных газет мира.","en":"Randi: But online the news comes in all the time. And I can look up the websites of most of the big newspapers in the world."},{"no":"På den måten får jeg mye mer informasjon.","ru":"Так я могу получить намного больше информации.","en":"That way I get a lot more information."},{"no":"Stein: Det er jo mest dårlige nyheter likevel, og jeg synes jeg får mer enn nok av dem i aviser og på tv.","ru":"Стайн: В любом случае это самые плохие новости. И мне этого с лихвой хватает в газетах и на ТВ.","en":"Stein: It's mostly bad news anyway, and I feel I get more than enough of that in the papers and on TV."},{"no":"Randi: Jeg kan til og med høre musikk og se film på pc-en min. Det er veldig praktisk.","ru":"Ранди: Я могу и музыку слушать, и фильмы смотреть на компьютере. Это очень удобно.","en":"Randi: I can even listen to music and watch films on my PC. It's very practical."},{"no":"Stein: Nei takk! Det høres ikke noe koselig ut.","ru":"Стайн: Нет уж, спасибо! Ничего удобного тут не вижу.","en":"Stein: No thanks! That doesn't sound cosy at all."},{"no":"Når jeg hører musikk eller ser på film, vil jeg sitte godt i sofaen og ikke sitte og stirre på en liten datamaskin.","ru":"Когда я слушаю музыку или смотрю фильм, я хочу расслабиться на диване, а не сидеть и пялиться на маленький экран.","en":"When I listen to music or watch a film, I want to sit comfortably on the sofa, not sit staring at a little computer."},{"no":"Jeg klarer meg godt uten.","ru":"Мне и без компьютера неплохо живется.","en":"I manage fine without one."},{"no":"Randi: Det spørs hvor lenge det er mulig. Snart foregår det meste på nettet.","ru":"Ранди: Вопрос в том, как долго это возможно. Скоро все на свете будет в онлайне...","en":"Randi: It's a question of how long that'll be possible. Soon most things will happen online."}],"title_en":"A meeting","sub_en":"Stein på stein - Leksjon 5"},{"id":"27nor","file":"27nor.mp3","title":"Hva slags skole vil vi ha? – 1","sub":"Stein på stein - Leksjon 6","lines":[{"no":"Martin: Jeg synes at den norske skolen er altfor slapp. Elevene kan jo gjøre akkurat hva de vil!","ru":"Мартин: По-моему, в норвежских школах совсем распустили учеников. Они занимаются, чем в голову взбредет!","en":"Martin: I think the Norwegian school system is far too lax. The pupils can do exactly what they want!"},{"no":"Anita: Nå overdriver du! De lærer å arbeide selvstendig, og det er viktig.","ru":"Анита: Это уж ты загнул! Просто они учится работать самостоятельно, а это имеет большое значение.","en":"Anita: Now you're exaggerating! They're learning to work independently, and that's important."},{"no":"Det nytter ikke med gammeldags pugging i våre dager.","ru":"В наши дни старомодная зубрежка уже неактуальна.","en":"Old-fashioned rote learning is no use these days."},{"no":"Martin: Litt mer pugging kan det godt være. Jeg vil at barna mine skal lære så mye som mulig.","ru":"Мартин: Могло бы быть и немного больше зубрежки. Я хочу, чтобы мои дети знали как можно больше.","en":"Martin: A bit more rote learning wouldn't hurt. I want my children to learn as much as possible."},{"no":"Da må læreren bestemme. Nå har de ikke noen respekt for lærerne.","ru":"И решать должен учитель. Нынче никакого уважения к учителям.","en":"Then the teacher has to decide. These days they've got no respect for the teachers."},{"no":"Elevene bruker til og med fornavn på læreren!","ru":"Ученики даже обращаются к учителям просто по имени!","en":"The pupils even call the teacher by their first name!"},{"no":"Anita: Lærerne synes kanskje at det ikke skal være for mye avstand mellom lærer og elev.","ru":"Анита: Может быть, учителя не хотят держать детей на слишком длинной дистанции.","en":"Anita: Maybe the teachers think there shouldn't be too much distance between teacher and pupil."},{"no":"Samarbeid og trygghet er viktig.","ru":"Главное - сотрудничество и безопасность.","en":"Cooperation and a sense of security are important."},{"no":"Martin: Samarbeid og samarbeid! De kaster bort så mye tid!","ru":"Мартин: Сотрудничество, сотрудничество... Только время впустую тратят!","en":"Martin: Cooperation, cooperation! They waste so much time!"},{"no":"Jeg tror at mange elever vil ha mer disiplin.","ru":"Многих учеников надо бы поучить дисциплине.","en":"I think a lot of pupils want more discipline."},{"no":"Det er så mye bråk i klassen at det er vanskelig å lære noe som helst.","ru":"В классе стоит такой гам, что невозможно заниматься.","en":"There's so much noise in the class that it's hard to learn anything at all."}],"title_en":"What sort of school do we want? – 1","sub_en":"Stein på stein - Leksjon 6"},{"id":"28nor","file":"28nor.mp3","title":"Hva slags skole vil vi ha? – 2","sub":"Stein på stein - Leksjon 6","lines":[{"no":"Anita: Synes du ikke at selvstendighet og samarbeid er viktig?","ru":"Анита: Что же плохого в независимости и сотрудничестве?","en":"Anita: Don't you think independence and cooperation are important?"},{"no":"Jeg tror man lærer mye av å arbeide sammen og diskutere med hverandre.","ru":"Я думаю, поработать вместе и обсудить результаты - это довольно познавательно.","en":"I think you learn a lot from working together and discussing things with each other."},{"no":"Martin: Men hvis man skal lære matematikk og språk, nytter det ikke å diskutere med hverandre.","ru":"Мартин: Но когда учишь математику или язык, тут нечего обсуждать.","en":"Martin: But if you're going to learn maths and languages, discussing things with each other is no use."},{"no":"Da må læreren hjelpe elevene, og elevene må få ro til å arbeide ordentlig med fagene.","ru":"Учитель должен помогать ученикам, а ученики - заниматься в спокойной обстановке.","en":"Then the teacher has to help the pupils, and the pupils need peace and quiet to work properly on the subjects."},{"no":"Dessuten må de få karakterer mye tidligere.","ru":"Кроме того, нужно ввести оценки и в более раннем возрасте.","en":"Besides, they should get marks much earlier."},{"no":"Anita: Det er jeg helt uenig i. Karakterer vil bare føre til mer press for elevene.","ru":"Анита: В корне не согласна. Оценки - только лишний стресс для учеников.","en":"Anita: I completely disagree with that. Marks will only lead to more pressure for the pupils."},{"no":"Martin: Hvis de ikke får karakterer, trenger de jo ikke å arbeide så mye på skolen.","ru":"Мартин: Если им не ставить оценок, у них не будет мотивации учиться усерднее.","en":"Martin: If they don't get marks, they don't need to work very hard at school, do they."},{"no":"Det er viktig å vite hvordan det går.","ru":"Важно отслеживать свой прогресс.","en":"It's important to know how you're doing."},{"no":"Hvis de får dårlige karakterer, skjønner elevene at de må begynne å arbeide mer.","ru":"Если ученик получит плохую оценку, он поймет, что ему нужно больше трудиться.","en":"If they get bad marks, the pupils realise that they have to start working more."},{"no":"Dessuten er det sunt med konkurranse.","ru":"К тому же это здоровая конкуренция.","en":"Besides, competition is healthy."},{"no":"Anita: Jeg tror at karakterer ødelegger. Det er viktig at barna kan gå sammen på skolen uten at de får høre at noen er bedre enn andre.","ru":"Анита: А я считаю, что от оценок дети только пострадают. Важно, чтобы они могли учиться вместе и не слышать, что кто-то лучше других.","en":"Anita: I think marks are destructive. It's important that children can go to school together without being told that some are better than others."}],"title_en":"What sort of school do we want? – 2","sub_en":"Stein på stein - Leksjon 6"},{"id":"29nor","file":"29nor.mp3","title":"Hvordan var det da du var liten?","sub":"Stein på stein - Leksjon 8","lines":[{"no":"Silje: Bestefar, hadde dere pizza da du var liten?","ru":"Силье: Дедушка, у вас была пицца, когда ты был маленьким?","en":"Silje: Grandad, did you have pizza when you were little?"},{"no":"Bestefar: Nei, og ikke tv heller.","ru":"Дедушка: Нет, и телевизора не было.","en":"Bestefar: No, and no TV either."},{"no":"Silje: Hva gjorde dere da?","ru":"Силье: Чем вы занимались?","en":"Silje: So what did you do?"},{"no":"Bestefar: Vi hørte på radio, og så lekte vi mye ute i gata.","ru":"Дедушка: Мы слушали радио и много играли на улице.","en":"Bestefar: We listened to the radio, and we played a lot out in the street."},{"no":"Det var ikke så mange biler den gangen.","ru":"В то время машин на улицах было немного.","en":"There weren't so many cars back then."},{"no":"Silje: Var det ikke litt kjedelig?","ru":"Силье: Разве это не скучно?","en":"Silje: Wasn't that a bit boring?"},{"no":"Bestefar: Nei, det var ikke kjedelig, men det var ei mye roligere tid.","ru":"Дедушка: Нет, нам было не скучно, но тогда жизнь была гораздо спокойнее.","en":"Bestefar: No, it wasn't boring, but it was a much quieter time."},{"no":"Folk hadde tid til å stoppe og prate sammen, og til å stikke innom på en kopp kaffe om kvelden.","ru":"Люди успевали остановиться и поговорить, и пригласить друг друга на чашку кофе вечерком.","en":"People had time to stop and chat, and to drop in for a cup of coffee in the evening."},{"no":"Alle har det så travelt i dag.","ru":"А нынче все такие занятые.","en":"Everyone's in such a hurry nowadays."},{"no":"Silje: Det samme sier oldemor, enda hun hadde fem barn og verken vaskemaskin eller ferdigmat i fryseren.","ru":"Силье: Бабушка тоже так говорит. А ведь у нее было пятеро детей и не было ни стиральной машины, ни мороженых полуфабрикатов.","en":"Silje: Great-grandma says the same thing, even though she had five children and neither a washing machine nor ready meals in the freezer."},{"no":"Er ikke det litt - litt ulogisk?","ru":"Тебе не кажется, что это немного... нелогично?","en":"Isn't that a bit - a bit illogical?"},{"no":"Bestefar: Jo, og kanskje er jeg romantisk når jeg snakker om barndommen. Men det er slik jeg husker den.","ru":"Дедушка: Ну, может быть, я слишком романтичен, когда говорю о детстве. Но я помню свое детство именно таким.","en":"Bestefar: Yes, and maybe I am being romantic when I talk about my childhood. But that's how I remember it."},{"no":"Silje: Jeg har lyst til å snakke mer med oldemor om dette.","ru":"Силье: Я хочу еще поговорить об этом с бабушкой.","en":"Silje: I'd like to talk to Great-grandma some more about this."},{"no":"Bestefar: Gjør det, men da bør du ha god tid. Oldemor elsker å snakke om gamle dager.","ru":"Дедушка: Поговори, только сначала убедись, что ты никуда не торопишься. Бабушка любит поговорить о былых временах.","en":"Bestefar: Do that, but then you should make sure you've got plenty of time. Great-grandma loves talking about the old days."}],"title_en":"What was it like when you were little?","sub_en":"Stein på stein - Leksjon 8"},{"id":"30nor","file":"30nor.mp3","title":"På norskkurs","sub":"Stein på stein - Leksjon 9","lines":[{"no":"Maryam: Å, du er så flink i norsk! Hvordan klarer du det?","ru":"Марьям: О, ты так хорошо успеваешь по норвежскому! Как тебе это удается?","en":"Maryam: Oh, you're so good at Norwegian! How do you manage it?"},{"no":"Usman: Kona mi hjelper meg. Hun har gått på skolen her i landet og kan mye norsk.","ru":"Усман: Жена мне помогает. Она училась в норвежской школе и очень хорошо знает язык.","en":"Usman: My wife helps me. She went to school here in this country and knows a lot of Norwegian."},{"no":"Maryam: Du er heldig som kan få hjelp. Hvor lenge har du vært her nå?","ru":"Марьям: Повезло тебе, что есть такой помощник. Как давно ты здесь?","en":"Maryam: You're lucky to be able to get help. How long have you been here now?"},{"no":"Usman: Snart ett år. Jeg håper at jeg kan lære nok norsk til at jeg kan begynne å arbeide til neste år.","ru":"Усман: Скоро год. Я надеюсь, что смогу достаточно освоить норвежский, чтобы начать работать в следующем году.","en":"Usman: Almost a year. I hope I can learn enough Norwegian to be able to start working next year."},{"no":"Hvor lenge har du bodd her?","ru":"Как долго ты живешь здесь?","en":"How long have you lived here?"},{"no":"Maryam: Nesten to år. Først bodde jeg litt over et år på asylmottak med barna mine.","ru":"Марьям: Почти два года. Чуть больше года мы с детьми жили в приюте для беженцев.","en":"Maryam: Almost two years. First I lived for a little over a year at an asylum reception centre with my children."},{"no":"Så flyttet vi hit. Nå har vi bodd her i åtte måneder.","ru":"Потом переехали сюда и живем здесь уже восемь месяцев.","en":"Then we moved here. Now we've lived here for eight months."},{"no":"Men jeg lærte ikke mye norsk før jeg kom på dette kurset.","ru":"Но я не очень преуспела в норвежском, пока не пошла на эти курсы.","en":"But I didn't learn much Norwegian before I came to this course."},{"no":"Usman: Trives du?","ru":"Усман: Тебе хорошо живется?","en":"Usman: Do you like it here?"},{"no":"Maryam: Jeg er veldig glad for å være i trygghet. Barna mine har det godt og trives på skolen.","ru":"Марьям: Я очень рада, что нахожусь в безопасности. Моим детям тут нравится, и они любят ходить в школу.","en":"Maryam: I'm very glad to be safe. My children are doing well and like it at school."},{"no":"Men jeg synes ikke det er så lett å finne seg til rette. Det er så mye som er annerledes enn hjemme.","ru":"Но не так просто адаптироваться к здешней жизни. Дома все было совсем по-другому.","en":"But I don't find it so easy to settle in. There's so much that's different from home."},{"no":"Usman: Lengter du hjem?","ru":"Усман: Ты скучаешь по дому?","en":"Usman: Do you miss home?"},{"no":"Maryam: Nå er situasjonen hjemme så vanskelig at det er umulig for meg å bo der.","ru":"Марьям: Сейчас обстановка на родине так накалилась, что оставаться там невозможно.","en":"Maryam: Right now the situation back home is so difficult that it's impossible for me to live there."},{"no":"Men hvis det blir fred, vil jeg helst reise tilbake. Hva med deg? Lengter du hjem?","ru":"Но если настанет мир, я хотела бы вернуться. А как ты? Скучаешь по дому?","en":"But if there's peace, I'd rather go back. What about you? Do you miss home?"},{"no":"Usman: Ja, jeg lengter ofte etter familie og venner. Men kona mi har stor familie her, og jeg har fått noen nye venner.","ru":"Усман: Да, я часто скучаю по семье и друзьям. Но у моей жены здесь большая семья, и у меня появились новые друзья.","en":"Usman: Yes, I often miss my family and friends. But my wife has a big family here, and I've made some new friends."},{"no":"Søndag var jeg til og med på skitur! Jeg klarte å holde meg på beina.","ru":"В воскресенье я даже ходил с ними на лыжную прогулку. Мне удалось удержаться на ногах.","en":"On Sunday I even went on a skiing trip! I managed to stay on my feet."},{"no":"Maryam: Jeg er glad hvis jeg klarer å uttale «skitur»!","ru":"Марьям: А мне бы только суметь выговорить \"лыжная прогулка\"!","en":"Maryam: I'll be glad if I manage to pronounce «skitur»!"}],"title_en":"At the Norwegian course","sub_en":"Stein på stein - Leksjon 9"}];

// Полный экран нужен только на телефоне: там он убирает шапку Telegram, которая

// на весь монитор и прячет управление — поэтому там режим не просим вовсе.
function fsMobile(){
  try{ return /^(ios|android)/.test(String((TG && TG.platform) || '')); }
  catch(e){ return false; }
}
function fsSupported(){
  try{ return !!(TG && fsMobile() && TG.isVersionAtLeast && TG.isVersionAtLeast('8.0') && TG.requestFullscreen); }
  catch(e){ return false; }
}
function fsOn(){ return meta.fs !== false; }

  }

function K(l){ return (ci===0 ? '' : COURSES[ci].id + '_') + 'l' + l; }
function partSize(l,p){ return LESSONS[l].parts[p].q.length; }
function lessonTotal(l){ let s=0; const n=nParts(l); for(let p=0;p<n;p++) s += partSize(l,p); return s; }
function partProgress(l,p){ return Math.min((progress[K(l)]||{})['p'+p]||0, partSize(l,p)); }
function setPartProgress(l,p,v){
  if(!progress[K(l)]) progress[K(l)] = {};
  const k = 'p'+p;
  if(v > (progress[K(l)][k]||0)){ progress[K(l)][k] = v; saveProgress(); }
}
function partDone(l,p){ return partProgress(l,p) >= partSize(l,p); }
function lessonSolved(l){ let s=0; const n=nParts(l); for(let p=0;p<n;p++) s += partProgress(l,p); return s; }
function examScore(l){ return (progress[K(l)]||{}).e || 0; }
function setExamScore(l,pct){ if(!progress[K(l)]) progress[K(l)]={}; if(pct > (progress[K(l)].e||0)){ progress[K(l)].e = pct; saveProgress(); } }
const PART_PASS = 90;   // % верных ответов в блоке для допуска к следующему
const EXAM_N = 20, EXAM_ERR = 1;                 // сколько ошибок прощается на экзамене
const EXAM_PASS = Math.round((EXAM_N - EXAM_ERR) / EXAM_N * 100);
function partAcc(l,p){
  const rec = progress[K(l)] || {};
  if(rec['a'+p] !== undefined) return rec['a'+p];
  return partDone(l,p) ? PART_PASS : 0;   // пройден до введения точности — зачёт
}
function setPartAcc(l,p,pct){ if(!progress[K(l)]) progress[K(l)]={}; const k='a'+p; if(pct > (progress[K(l)][k]||0)){ progress[K(l)][k]=pct; saveProgress(); } }
function partPassed(l,p){ return partAcc(l,p) >= PART_PASS; }
function partUnlocked(l,p){ return p===0 || partPassed(l,p-1); }
function examUnlocked(l){ const n=nParts(l); for(let p=0;p<n;p++){ if(!partPassed(l,p)) return false; } return true; }   // порог сдачи экзамена, %
// Урок остывает не каждые две недели, а всё реже: освежил — следующий раз
// напомним позже. Иначе обслуживание курса растёт линейно и к концу съедает
// весь дневной бюджет, не оставляя времени на новое.
const LESSON_INT = [14, 30, 60, 120];
const EXPIRE_DAYS = LESSON_INT[0];    // через сколько дней остывает свежесданный урок
function lessonStage(l){ return Math.min((progress[K(l)]||{}).rs || 0, LESSON_INT.length - 1); }
function lessonInt(l){ return LESSON_INT[lessonStage(l)]; }
function touchLesson(l){
  if(!progress[K(l)]) progress[K(l)] = {};
  const rec = progress[K(l)];
  if(isExpired(l)){
    const over = lessonAge(l) / lessonInt(l);
    // Освежил вовремя — интервал растёт. Забросил надолго — сужаем обратно.
    rec.rs = over > 2 ? Math.max(lessonStage(l) - 1, 0)
                      : Math.min(lessonStage(l) + 1, LESSON_INT.length - 1);
  }
  rec.ts = dnum();
  saveProgress();
}
function lessonAge(l){ const ts=(progress[K(l)]||{}).ts; return ts===undefined ? null : dnum()-ts; }
function examPassed(l){ return everPassed(l) || examScore(l) >= EXAM_PASS; }
function everPassed(l){ return !!(progress[K(l)]||{}).ok; }
function isExpired(l){ const a=lessonAge(l); return everPassed(l) && a!==null && a >= lessonInt(l); }
// Самый «залежавшийся» урок — показываем только его, а не список из двенадцати.
function staleOne(){
  let best = -1, worst = 0;
  for(let i=0;i<LESSONS.length;i++){
    if(!isExpired(i)) continue;
    const over = lessonAge(i) / lessonInt(i);
    if(over > worst){ worst = over; best = i; }
  }
  return best;
}
function lessonUnlocked(l){ return l===0 || everPassed(l-1); }
function expiredList(){ const out=[]; for(let i=0;i<LESSONS.length;i++) if(isExpired(i)) out.push(i); return out; }
function lessonDone(l){ return examPassed(l) && !isExpired(l); }
function lessonsDoneCount(){ let c=0; for(let i=0;i<LESSONS.length;i++){ if(lessonDone(i)) c++; } return c; }
// Сданный урок остаётся сданным: «остыл» — повод освежить, а не отмена заслуги.
function lessonsPassedCount(){ let c=0; for(let i=0;i<LESSONS.length;i++){ if(everPassed(i)) c++; } return c; }
function totalPhrases(){ let s=0; for(let i=0;i<LESSONS.length;i++) s += lessonTotal(i); return s; }
function totalSolved(){ let s=0; for(let i=0;i<LESSONS.length;i++) s += lessonSolved(i); return s; }
