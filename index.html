<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ro! — Норвежский тренажёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#0c0c0c;--paper:#131313;--ink:#f5f5f5;--ink2:#a3a3a3;--ink3:#666;
  --line:#232325;--blue:#7aa2f7;--blue-light:#16213a;--green:#4ade80;
  --green-light:#0d2818;--red:#f87171;--red-light:#2d1414;
  --amber:#fbbf24;--amber-light:#2b2210;
  
  --grad:#ffffff;
  --grad-soft:rgba(255,255,255,0.06);
  --acc1:#ffffff;--acc2:#ffffff;--acc3:#FFFFFF;
  --grad:#ffffff;
  --grad-soft:rgba(255,255,255,0.06);
}
body{font-family:'Manrope',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{touch-action:manipulation}

/* ─── тур по интерфейсу ─── */
.tour-mask{position:fixed;inset:0;z-index:60}
.tour-hole{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,0.78);border:1.5px solid rgba(255,255,255,0.5);transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none}
.tour-tip{position:absolute;left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));
  background:linear-gradient(160deg,rgba(38,38,38,0.96),rgba(22,22,22,0.96));backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:1rem 1.15rem 1.1rem;
  box-shadow:0 12px 40px rgba(0,0,0,0.5);transition:top .3s cubic-bezier(.4,0,.2,1)}
.tour-step{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.tour-title{font-size:16.5px;font-weight:700;letter-spacing:-0.2px;margin-bottom:5px}
.tour-text{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.tour-nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.tour-next{flex:1;background:#fff;color:#000001;border:none;border-radius:13px;padding:11px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.tour-skip{background:none;border:none;color:var(--ink3);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:11px 4px}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.amb{position:absolute;border-radius:50%;filter:blur(120px)}
.amb.a1{width:70vw;height:70vw;min-width:420px;min-height:420px;top:-25%;right:-20%;background:radial-gradient(circle,rgba(122,162,247,0.20),transparent 70%)}
.amb.a2{width:60vw;height:60vw;min-width:360px;min-height:360px;bottom:-20%;left:-18%;background:radial-gradient(circle,rgba(248,113,113,0.14),transparent 70%)}

/* ─── матовое стекло ─── */
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,0.10);
  box-shadow:0 1px 0 rgba(255,255,255,0.09) inset, 0 8px 28px rgba(0,0,0,0.35);
}
.app{max-width:700px;margin:0 auto;padding:0 1rem 3rem;padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right));padding-top:env(safe-area-inset-top)}
.header{padding:1.25rem 0 0;display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem}
.ic{vertical-align:-3px;display:inline-block;flex-shrink:0}
.logo{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;cursor:pointer}
.head-greet{font-size:17px;font-weight:700;letter-spacing:-0.3px;color:var(--ink);cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.score-chip{background:#fff;color:#000001;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
.back-btn{background:none;border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:500;font-family:inherit;padding:6px 14px;border-radius:12px;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--ink2);color:var(--ink)}

.progress-section{margin-bottom:1.25rem}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.progress-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1)}

.mode-toggle{display:flex;background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:16px;padding:3px;margin-bottom:1.25rem;width:fit-content}
.mode-btn{padding:9px 18px;font-size:13px;font-weight:500;border:none;background:none;color:var(--ink2);border-radius:12px;cursor:pointer;transition:all .2s;font-family:inherit;min-height:38px}
.mode-btn.active{background:#fff;color:#000001}

.card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:20px;padding:1.75rem;margin-bottom:1rem}
.type-badge{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--blue-light);color:var(--blue);margin-bottom:1rem}
.q-ru{font-size:24px;font-weight:600;line-height:1.3;color:var(--ink);margin-bottom:1.5rem;letter-spacing:-0.3px}
.pool-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:500;margin-bottom:7px}
.builder-answer{min-height:52px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:1rem;cursor:default;transition:border-color .2s,background .2s}
.builder-answer.has-content{border-style:solid;border-color:var(--ink2)}
.builder-answer.correct-state{border-color:var(--green);background:var(--green-light)}
.builder-answer.wrong-state{border-color:var(--red);background:var(--red-light)}
.placeholder{color:var(--ink3);font-size:14px}
.word-chip{padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;border:1px solid transparent;min-height:42px;display:inline-flex;align-items:center}
.word-chip.pool{background:var(--paper);border-color:var(--line);color:var(--ink)}
.word-chip.pool:hover{border-color:var(--ink2)}
.word-chip.selected{background:#fff;color:#000001}
.word-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.text-input{width:100%;padding:14px 16px;font-size:16px;font-family:inherit;background:var(--bg);border:2px solid var(--line);border-radius:14px;color:var(--ink);outline:none;transition:border-color .2s;margin-bottom:1rem;min-height:50px}
.text-input:focus{border-color:var(--ink2)}
.text-input.correct-state{border-color:var(--green);background:var(--green-light)}
.text-input.wrong-state{border-color:var(--red);background:var(--red-light)}
.submit-btn{width:100%;padding:15px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#000001;border:none;border-radius:16px;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.01em;min-height:50px}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{opacity:.35;cursor:not-allowed}
.submit-btn.next{background:var(--green);color:#04150b}
.btn-row{display:flex;gap:10px}
.btn-row .submit-btn{flex:1}
.retry-btn{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.retry-btn:hover{border-color:var(--ink2)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}

.feedback{border-radius:16px;padding:1rem 1.25rem;margin-bottom:1rem;font-size:14px;line-height:1.6;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.feedback.ok{background:var(--green-light);border:1px solid #1d5c34;color:var(--green)}
.feedback.err{background:var(--red-light);border:1px solid #6b2525;color:var(--red)}
.feedback.v2{background:var(--amber-light);border:1px solid #6b5a10;color:var(--amber)}
.fb-title{font-weight:600;margin-bottom:5px}
.diff-view{font-size:15px;line-height:2;margin-top:8px}
.dw{padding:2px 4px;border-radius:6px;margin:0 1px}
.dw.correct{color:var(--green)}
.dw.missing{background:var(--red-light);color:var(--red);text-decoration:underline;text-decoration-style:wavy}
.dw.extra{background:#3a3010;color:#d9b64a;text-decoration:line-through}
.diff-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;opacity:.7}
.rule-box{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:13px;color:var(--ink2);line-height:1.65}
.rule-box b{color:var(--ink)}
.rule-box code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:12.5px;color:var(--blue)}
.why-list{margin:6px 0 0;padding-left:18px}
.why-list li{margin:4px 0}
.why-also{margin-top:8px}
.why-cmp{margin-top:9px;font-size:12.5px;line-height:1.8}
.why-cmp span{opacity:.6;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.why-rule{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
#chat-screen{display:flex;flex-direction:column;min-height:calc(100vh - 20px)}
.ch-btn{padding:6px 10px;display:inline-flex;align-items:center}
.ch-modes{display:flex;gap:6px;margin:0 0 14px}
.ch-mode{flex:1;background:none;border:1px solid var(--line);color:var(--ink2);font-family:inherit;font-size:13px;font-weight:500;padding:9px 0;border-radius:12px;cursor:pointer;transition:all .2s}
.ch-mode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch-body{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.ch-msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.ch-msg.ai{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid var(--line);border-bottom-left-radius:5px}
.ch-msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
.ch-msg.me code{color:inherit}
.ch-msg code{background:none;border:none;padding:0;font-family:inherit;font-size:inherit;font-weight:600;color:var(--ink)}
.ch-msg.ai{color:var(--ink2)}
.ch-greet{color:var(--ink2)}
.ch-wait{color:var(--ink3);font-style:italic;opacity:.8}
.ch-fix{display:inline-block;color:var(--green);font-weight:500}
.ch-say{display:block;margin-top:7px;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:9px;padding:3px 9px;cursor:pointer;line-height:0}
.ch-bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px 0 14px;background:var(--bg)}
.ch-inp{flex:1;resize:none;background:var(--card-bg,rgba(255,255,255,0.05));border:1px solid var(--line);border-radius:16px;color:var(--ink);font-family:inherit;font-size:15px;line-height:1.5;padding:12px 14px;max-height:140px;outline:none}
.ch-inp:focus{border-color:var(--ink2)}
.ch-inp::placeholder{color:var(--ink3)}
.ch-send{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:16px;background:var(--ink);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.ch-send:disabled,.ch-inp:disabled{opacity:.45;cursor:default}
body.light .ch-msg.ai{background:rgba(0,0,0,0.04)}
.play-big{display:block;margin:6px auto 10px;background:#fff;color:#000001;font-size:16px;font-weight:600;font-family:inherit;border:none;border-radius:16px;padding:16px 30px;cursor:pointer;min-height:54px;transition:transform .1s,opacity .2s}
.play-big:hover{opacity:.9}
.play-big:active{transform:scale(.97)}
.listen-hint{text-align:center;font-size:13px;color:var(--ink3);margin-bottom:1.25rem}
.pron-res{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.listen-btn{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;font-family:inherit;padding:9px 16px;border-radius:12px;cursor:pointer;transition:all .2s;margin-top:10px}
.listen-btn:hover{border-color:var(--ink2)}
.listen-btn:active{transform:scale(.97)}

.complete{text-align:center;padding:3rem 1.5rem}
.complete-icon{margin-bottom:1rem;color:var(--ink)}
.complete-title{font-size:28px;font-weight:700;margin-bottom:.5rem;letter-spacing:-0.5px}
.complete-sub{color:var(--ink2);font-size:15px;margin-bottom:2rem;line-height:1.6}
.stats{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:1rem 1.5rem;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--ink)}
.stat-label{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.restart-btn{padding:14px 32px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#000001;border:none;border-radius:16px;cursor:pointer;min-height:50px}

/* ─── LESSON SELECTOR ─── */
.lessons-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin:0.5rem 0 0.25rem}
.lessons-sub{font-size:14px;color:var(--ink2);margin-bottom:1.5rem}
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson-card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:16px;padding:1.05rem 1.15rem;cursor:pointer;transition:border-color .2s,transform .1s;display:flex;align-items:center;gap:13px}
.lesson-card:hover{border-color:rgba(255,255,255,0.22)}
.lesson-card:active{transform:scale(.99)}
.lesson-card.done{border-color:rgba(74,222,128,0.35);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35),0 0 0 1px rgba(74,222,128,0.10)}
.lesson-num{width:38px;height:38px;line-height:0;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2);flex-shrink:0}
.lesson-card.done .lesson-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.lesson-info{flex:1;min-width:0}
.lesson-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
.lesson-sub{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.lesson-arrow{color:var(--ink3);font-size:16px;flex-shrink:0}

.modal-back{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1.25rem}
.modal-box{width:min(360px,100%);background:linear-gradient(160deg,rgba(38,38,38,0.98),rgba(22,22,22,0.98));border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:1.25rem;box-shadow:0 16px 48px rgba(0,0,0,0.55)}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-0.2px;margin-bottom:12px}
.modal-text{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-bottom:14px}
.modal-row{display:flex;gap:10px;margin-top:12px}
.modal-row .submit-btn{flex:1}
.modal-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.set-row{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.set-chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;color:var(--ink2);font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;cursor:pointer;min-height:36px;transition:all .15s}
.set-chip:hover{border-color:var(--ink2)}
.set-chip.on{background:#fff;color:#000001;border-color:#fff}
.set-chip.add{color:var(--ink3);border-style:dashed}
.imp-area{min-height:140px;resize:vertical;font-family:inherit;line-height:1.5;padding:12px 14px}
.imp-hint{font-size:12.5px;color:var(--ink3);line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.imp-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.imp-sum b{color:var(--ink);font-size:15px}
.my-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,0.06)}
.my-row:last-child{border-bottom:none}
.my-txt{flex:1;min-width:0}
.my-row .my-no{font-size:14.5px;font-weight:600;color:var(--ink)}
.my-row .my-ru{font-size:12.5px;color:var(--ink3);margin-top:2px}
.my-when{font-size:11px;color:var(--ink3);white-space:nowrap}
.my-del{background:none;border:none;color:var(--ink3);cursor:pointer;padding:6px;line-height:0}
.cal-row{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.cal-link{background:none;border:none;color:var(--ink3);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.cal-box{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
.cal-t{font-size:12.5px;color:var(--ink2);line-height:1.5}
.cal-n{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.pl-time{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:7px}
.pl-track{height:6px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;cursor:pointer;margin-bottom:14px}
.pl-fill{height:100%;width:0;background:#fff;border-radius:3px}
.pl-row{display:flex;align-items:center;justify-content:center;gap:12px}
.pl-btn{min-width:52px;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.pl-btn:hover{border-color:var(--ink2)}
.pl-btn.on{background:#fff;color:#000001;border-color:#fff}
.pl-btn.on svg{color:#000001}
.pl-play{width:60px;height:60px;border-radius:50%;background:#fff;color:#000001;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pl-play:active{transform:scale(.96)}
.pl-pause{display:inline-block;width:16px;height:18px;border-left:5px solid #000001;border-right:5px solid #000001}
.dl-box{display:flex;flex-direction:column;gap:2px;padding:1rem .9rem}
.dl-line{padding:9px 11px;border-radius:12px;cursor:pointer;transition:background .2s}
.dl-line.active{background:rgba(255,255,255,0.10)}
.dl-no{font-size:15.5px;font-weight:600;line-height:1.45}
.dl-ru{font-size:13.5px;color:var(--ink3);margin-top:3px;line-height:1.4;display:none}
.dl-box.ru .dl-ru{display:block}
.cover{width:calc(100% + 2.5rem);margin:-1.15rem -1.25rem 14px;border-radius:18px 18px 0 0;overflow:hidden;line-height:0;background:var(--bg)}
.cover img{width:100%;height:auto;display:block;opacity:.92}
body.light .cover img{opacity:1;filter:invert(1) hue-rotate(180deg) brightness(1.05)}
.course-card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:18px;padding:1.15rem 1.25rem;cursor:pointer;transition:border-color .2s,transform .1s}
.course-card:hover{border-color:rgba(255,255,255,0.22)}
.course-card:active{transform:scale(.99)}
.course-card.soon{opacity:.45;cursor:default}
.course-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.course-title{font-size:17px;font-weight:700;letter-spacing:-0.2px}
.course-pct{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.course-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.course-sub{font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.4}
.course-meta{font-size:12px;color:var(--ink3);margin-top:7px}
/* compact right-side progress on lesson cards */
.lesson-card.locked{opacity:.5}
.lesson-card.locked .lesson-num{background:var(--bg);border-color:var(--line);color:var(--ink3)}
.lesson-card.expired{border-color:rgba(251,191,36,0.38)}
.lesson-card.expired .lesson-num{background:var(--amber-light);border-color:#6b5a10;color:var(--amber)}
.lock-note{font-size:11.5px;color:var(--ink3);margin-top:3px}
.expire-note{font-size:11.5px;color:var(--amber);margin-top:3px}
.lesson-mini{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:64px}
.lesson-mini-bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.lesson-mini-fill{height:100%;background:#fff;border-radius:2px;transition:width .4s ease}
.lesson-card.done .lesson-mini-fill{background:var(--green)}
.lesson-mini-pct{font-size:11px;font-weight:600;color:var(--ink3)}
.lesson-card.done .lesson-mini-pct{color:var(--green)}
.fjord-banner{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;line-height:0}
.fjord-banner svg{width:100%;height:auto;display:block}
.footer{text-align:center;font-size:12px;color:var(--ink3);margin-top:2.25rem;line-height:1.7}
.tour-link{display:inline-block;margin-bottom:10px;cursor:pointer}
.footer a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);transition:color .2s}
.footer a:hover{color:var(--ink)}
.daily{display:flex;flex-direction:column;gap:8px}
.daily-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2)}
.daily-streak{display:inline-flex;align-items:center;gap:6px}
.daily-streak.lit{color:var(--amber)}
.daily-goal{font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.daily-goal.hit{color:var(--green)}
.daily-bar{height:4px;background:rgba(255,255,255,0.10);border-radius:2px;overflow:hidden}
.daily-fill{height:100%;background:#fff;border-radius:2px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.daily-fill.hit{background:var(--green)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sg{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));border:1px solid rgba(255,255,255,0.10);border-radius:14px;padding:12px 8px;text-align:center}
.sg-v{font-size:20px;font-weight:700;letter-spacing:-0.5px;font-variant-numeric:tabular-nums}
.sg-l{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.3}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.ht{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,0.06)}
.ht.l1{background:rgba(74,222,128,0.25)}
.ht.l2{background:rgba(74,222,128,0.45)}
.ht.l3{background:rgba(74,222,128,0.7)}
.ht.l4{background:var(--green)}
.heat-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:12px;font-size:10.5px;color:var(--ink3)}
.heat-legend .ht{width:12px;aspect-ratio:1}
.year-row{display:flex;gap:5px;align-items:flex-end}
.yr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.yr-bar-bg{width:100%;height:90px;display:flex;align-items:flex-end;background:rgba(255,255,255,0.05);border-radius:5px;overflow:hidden}
.yr-bar{width:100%;background:var(--ink2);border-radius:5px}
body.light .sg{background:linear-gradient(160deg,rgba(255,255,255,0.96),rgba(255,255,255,0.86));border-color:rgba(15,22,40,0.08)}
body.light .ht{background:rgba(15,22,40,0.07)}
body.light .yr-bar-bg{background:rgba(15,22,40,0.07)}

/* ─── градиент только как редкий акцент ─── */
/* главная кнопка экрана — единственное градиентное пятно в интерфейсе */
.submit-btn,.continue-btn,.restart-btn,.welcome-btn,.tour-next{
  background:var(--grad)!important;color:#fff!important;border:none!important;
  box-shadow:0 6px 22px rgba(114,60,235,0.28);
}
.submit-btn.retry-btn{background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none}
.submit-btn.next{background:var(--grad)!important}
.submit-btn:disabled{opacity:.35;box-shadow:none}
/* активные состояния — ровный фиолетовый */
.mode-btn.active{background:rgba(255,255,255,0.12)!important;color:var(--ink)!important;border-color:transparent!important}
.wd-chip.on,.set-chip.on,.goal-btn.on,.lang-btn.on,.pl-btn.on,.word-chip.selected{
  background:#ffffff!important;color:#fff!important;border-color:#ffffff!important;
}
.pl-play{background:#ffffff!important;color:#fff!important}
.score-chip{background:rgba(255,255,255,0.07)!important;color:var(--ink2)!important;border:1px solid var(--line)!important;font-weight:600}
/* плитки иконок — всегда нейтральные */
.lesson-num,.block-num{border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--ink2)}
.lesson-card.done .lesson-num,.block-card.full .block-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.lesson-card.locked .lesson-num,.block-card.locked .block-num{background:rgba(255,255,255,0.03);border-color:var(--line);color:var(--ink3)}
.exam-card .block-num{background:rgba(255,239,99,0.12);border-color:rgba(255,239,99,0.3);color:var(--ink2)}
/* полосы — ровный фиолетовый, зелёный при выполнении */
.progress-fill,.daily-fill,.lesson-mini-fill,.pl-fill,.part-bar-fill{background:#ffffff}
.daily-fill.hit,.lesson-card.done .lesson-mini-fill{background:var(--green)}
.wk-bar{background:rgba(255,255,255,0.14)}
.wk-bar.today{background:#ffffff}
.wk-bar.hit{background:var(--green)}
.yr-bar{background:#ffffff;opacity:.8}
/* тепловая карта — одна фиолетовая шкала */
.ht.l1{background:rgba(114,60,235,0.25)}
.ht.l2{background:rgba(114,60,235,0.45)}
.ht.l3{background:rgba(114,60,235,0.7)}
.ht.l4{background:#ffffff}
/* жёлтый — внимание */
.daily-streak.lit{color:var(--ink2)}
.plan-banner{background:rgba(255,239,99,0.10);border-color:rgba(255,239,99,0.28);color:var(--ink2)}
.lesson-card.expired{border-color:rgba(255,239,99,0.35)}
.expire-note{color:var(--ink2)}
.exam-card{border-color:rgba(255,239,99,0.22)}
body.light .score-chip{background:rgba(15,22,40,0.06);color:var(--ink)}
body.light .lesson-num,body.light .block-num{background:rgba(15,22,40,0.05);border-color:rgba(15,22,40,0.10)}
body.light .wk-bar{background:rgba(15,22,40,0.14)}
.ring-arc{transition:stroke-dashoffset 1.15s cubic-bezier(.22,.68,.32,1)}
.ring-arc.done{animation:ringPop .55s ease-out forwards}
@keyframes numIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes ringPop{
  0%{filter:none}
  45%{filter:drop-shadow(0 0 7px rgba(255,255,255,0.75))}
  100%{filter:none}
}
@media (prefers-reduced-motion: reduce){
  .ring-arc{transition:none}
  .ring-arc.done{animation:none}
}
.toast-ring{position:relative;width:40px;height:40px;flex-shrink:0}
.toast-chk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);opacity:0;animation:chkIn .34s .75s forwards ease-out}
@keyframes chkIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:11px;min-width:270px;max-width:calc(100vw - 32px);
  background:linear-gradient(160deg,rgba(38,38,38,0.97),rgba(20,20,20,0.97));backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:12px 15px;
  box-shadow:0 12px 34px rgba(0,0,0,0.5);animation:toastIn .38s cubic-bezier(.2,.9,.3,1)}
.toast.out{animation:toastOut .42s ease-in forwards}
.toast-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-t{font-size:14px;font-weight:700;letter-spacing:-0.2px}
.toast-d{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.35}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.95)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-18px)}}
.allwin{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:awIn .3s ease-out}
.allwin canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.aw-box{position:relative;text-align:center;max-width:340px;width:100%}
.aw-rings{position:relative;width:150px;height:150px;margin:0 auto 20px}
.aw-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);animation:numIn .5s .5s both ease-out}
.aw-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:8px}
.aw-sub{font-size:14.5px;color:var(--ink2);line-height:1.55;margin-bottom:22px}
@keyframes awIn{from{opacity:0}to{opacity:1}}
body.light .toast{background:linear-gradient(160deg,#fff,#f4f5f7);border-color:rgba(15,22,40,0.12);box-shadow:0 12px 34px rgba(15,22,40,0.18)}
body.light .toast-ic{background:rgba(15,22,40,0.07)}
body.light .allwin{background:rgba(244,245,247,0.94)}
/* ─── дневные кольца ─── */
.rings-hero{display:flex;align-items:center;gap:18px}
.rings-wrap{position:relative;width:168px;height:168px;flex-shrink:0}
.rings-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rings-big{animation:numIn .5s .25s both ease-out;font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}
.rings-small{font-size:11.5px;color:var(--ink3);margin-top:3px}
.rings-legend{display:flex;flex-direction:column;gap:11px;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lg-t{color:var(--ink2);min-width:44px}
.lg-v{font-weight:600;font-variant-numeric:tabular-nums}
/* полоса недели */
.week-strip{display:flex;gap:6px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08)}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wk-bar-bg{width:100%;height:52px;display:flex;align-items:flex-end;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden}
.wk-bar{width:100%;background:var(--ink3);border-radius:6px;transition:height .4s ease}
.wk-bar.hit{background:var(--green)}
.wk-bar.today{background:var(--ink)}
.wk-bar.today.hit{background:var(--green)}
.wk-lbl{font-size:10.5px;color:var(--ink3)}
.wk-lbl.today{color:var(--ink);font-weight:700}
.wk-col.future{opacity:.35}
.hero-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);font-size:12.5px;color:var(--ink2)}
.hf-item{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.hf-sep{flex:1}
body.light .wk-bar-bg{background:rgba(15,22,40,0.07)}
body.light .wk-bar.today{background:#15161a}
/* hero ring on main screen */
.hero{display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:20px;padding:1.15rem 1.35rem;margin-bottom:1.25rem}
.hero-rings{display:flex;gap:12px;align-items:stretch;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08)}
.ring-divider{width:1px;background:var(--line);margin:6px 0;flex-shrink:0}
.ring-cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.ring-caption{font-size:12px;color:var(--ink2);text-align:center;line-height:1.45}
.ring-caption b{color:var(--ink);font-size:13px}
.ring-wrap{position:relative;width:84px;height:84px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-wrap svg circle{transition:stroke-dashoffset .6s ease}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;letter-spacing:-0.5px}
.hero-info{min-width:0}
.hero-title{font-size:16px;font-weight:700;letter-spacing:-0.2px}
.hero-sub{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
/* lesson detail page */
.detail-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:4px}
.detail-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
.detail-sub{font-size:14px;color:var(--ink2);margin-bottom:6px}
.detail-count{font-size:13px;color:var(--ink3);margin-bottom:1.25rem}
.continue-btn{width:100%;padding:15px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#000001;border:none;border-radius:16px;cursor:pointer;min-height:50px;margin-bottom:1rem;transition:opacity .2s,transform .1s}
.continue-btn:hover{opacity:.9}
.continue-btn:active{transform:scale(.98)}
.block-list{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:16px 0 0;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.section-label:first-child{margin-top:0}
.exam-card{border-color:rgba(251,191,36,0.30)}
.exam-card:hover{border-color:var(--amber)}
.exam-card .block-num{background:var(--amber-light);border-color:#6b5a10;color:var(--amber)}
.exam-card.full{border-color:#1d5c34}
.exam-card.full .block-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.block-card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:16px;padding:1rem 1.15rem;cursor:pointer;transition:border-color .2s,transform .1s;display:flex;align-items:center;gap:13px}
.block-card:hover{border-color:rgba(255,255,255,0.22)}
.block-card:active{transform:scale(.99)}
.block-card.full{border-color:rgba(74,222,128,0.35)}
.block-num{width:34px;height:34px;line-height:0;border-radius:11px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink2);flex-shrink:0}
.block-card.full .block-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.block-card.full .lesson-mini-fill{background:var(--green)}
.block-title{flex:1;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35;min-width:0}
/* flashcards */
.word-stage{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:12px;padding:1.5rem;margin-bottom:1rem;user-select:none;-webkit-user-select:none;transition:border-color .2s}
.word-stage:active{border-color:var(--ink2)}
.word-main{font-size:30px;font-weight:700;letter-spacing:-0.5px;line-height:1.25}
.word-divider{width:44px;height:1px;background:var(--line)}
.word-back{font-size:19px;color:var(--ink2);font-weight:500;line-height:1.35;animation:slideIn .2s ease}
.word-hint{font-size:12.5px;color:var(--ink3)}
.deck-count{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:12px;line-height:1.5}
.words-done-icon{margin-bottom:1rem;color:var(--ink)}
/* fireworks */
#fw{position:fixed;inset:0;z-index:50;pointer-events:none}

/* ─── WELCOME SCREEN ─── */
.welcome{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;background:var(--bg)}
.welcome.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;overscroll-behavior:contain}
.welcome.scroll .welcome-content{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.welcome-content{margin-top:calc(12vh + env(safe-area-inset-top));padding:0 1.5rem;max-width:420px}
.welcome-logo{font-size:44px;font-weight:600;letter-spacing:-1px;color:#fff;margin-bottom:14px}
.welcome-tagline{font-size:15px;line-height:1.65;color:rgba(255,255,255,0.85);margin-bottom:26px}
.welcome-btn{background:rgba(255,255,255,0.92);color:#000001;font-size:15px;font-weight:600;font-family:inherit;border:none;border-radius:16px;padding:14px 36px;cursor:pointer;transition:transform .15s,background .2s;min-height:50px}
.welcome-btn:hover{background:#fff}
.welcome-btn:active{transform:scale(.97)}

/* schedule & calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px}
.cal-h{font-size:11px;font-weight:600;color:var(--ink3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--ink2);position:relative;border:1px solid transparent}
.cal-d.other{opacity:.25}
.cal-d.plan{border-color:#3a3a3a;background:var(--bg)}
.cal-d.today{border-color:#fff;color:#fff;font-weight:700}
.cal-d.hit{background:var(--green-light);border-color:#1d5c34;color:var(--green);font-weight:600}
.wd-row{display:flex;gap:6px;margin:8px 0 14px}
.wd-chip{flex:1;padding:10px 0;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .15s;min-height:42px;display:flex;align-items:center;justify-content:center}

function alignOps(a,b){

  for(let j=0;j<=n;j++) d[0][j]=j;

    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost(i-1,j-1));
  const ops=[]; let i=m,j=n;

function classifyPair(uw,cw,cArr,j){
  const L=W();
  if(cArr && j>0 && cArr[j-1]==="i" && TIMEW.has(cw))
    return {order:false, text:L.fixed_ph(uw,cw,"i "+cw)};
  if(PRON_CASE[uw]===cw) return {order:false, text:(SUBJ_PRON.has(cw)?L.pron_subj:L.pron_obj)(uw,cw)};
  const vu=VERB_FORM[uw],vc=VERB_FORM[cw];
  if(vu&&vc){
    if(vu[0]===vc[0]) return {order:false, text:L.verb_form(uw,cw,L.vt[vu[1]],L.vt[vc[1]],L.vtail[vc[1]])};
    return {order:false, text:L.verb_other(uw,cw)};
  }
  const nr=nounRel(uw,cw);
  if(nr) return {order:false, text:L[nr](uw,cw)};
  const au=ADJ_FORM[uw],ac=ADJ_FORM[cw];
  if(au&&ac&&au[0]===ac[0]) return {order:false, text:L.adj_form(uw,cw)};
  const du=DEG_FORM[uw],dc=DEG_FORM[cw];
  if(du&&dc&&du[0]===dc[0]) return {order:false, text:L.adj_degree(uw,cw)};
  if(ART.has(uw)&&ART.has(cw)) return {order:false, text:L.art_gender(uw,cw)};
  if(deAccent(uw)===deAccent(cw)) return {order:false, text:L.letter(uw,cw)};
  if(lev(uw,cw)<=1 && Math.max(uw.length,cw.length)>3) return {order:false, text:L.typo(uw,cw)};
  return {order:false, text:L.word(uw,cw)};
}
function classifyMiss(cw){
  const L=W();
  if(cw==="ikke") return {order:false, text:L.miss_ikke};
  if(cw==="skal") return {order:false, text:L.miss_skal};
  if(cw==="har") return {order:false, text:L.miss_har};
  if(cw==="å")   return {order:false, text:L.miss_aa};
  if(MODALS.has(cw)||FINITE.has(cw)) return {order:false, text:L.miss_aux(cw)};
  if(ART.has(cw)) return {order:false, text:L.miss_art(cw)};
  return {order:false, text:L.miss_word(cw)};
}
function classifyExtra(uw,c){
  const L=W();
  if(uw==="ikke") return {order:false, text:(c&&c.indexOf("ikke")>=0)?L.dup_ikke:L.extra_ikke};
  if(uw==="å")    return {order:false, text:L.extra_aa};
  if(MODALS.has(uw)||FINITE.has(uw)) return {order:false, text:L.extra_aux(uw)};
  if(ART.has(uw)) return {order:false, text:L.extra_art(uw)};
  return {order:false, text:L.extra_word(uw)};
}

function orderDiag(u,c){
  const L=W();
  const ui=u.indexOf("ikke"), ci=c.indexOf("ikke");
  if(ui>=0&&ci>=0&&ui!==ci){
    const nu=u.filter(function(w){return w!=="ikke";}).join(" ");
    const nc=c.filter(function(w){return w!=="ikke";}).join(" ");
    if(nu===nc) return {order:true, title:L.t_ikke, text:L.order_ikke(c[ci-1], c[ci+1])};
  }
  for(let i=0;i<c.length-1;i++){
    if(POSS.has(c[i+1]) && !POSS.has(c[i])){
      const pi=u.indexOf(c[i+1]);
      if(pi>=0 && pi<u.length-1 && pairRelated(u[pi+1],c[i]))
        return {order:true, title:L.t_ord, text:L.order_poss(c[i],c[i+1])};
    }
  }
  const vc=finiteIdx(c), vu=finiteIdx(u);
  if(vc>=1 && vu!==vc){
    const front=c.slice(0,vc).join(" ");
    if(c.length>vc+1 && SUBJ_ALL.has(c[vc+1])){
      const txt = QWORD.has(c[0]) ? L.order_qw(front,c[vc],c[vc+1]) : L.order_v2(front,c[vc],c[vc+1]);
      return {order:true, title:L.t_v2, text:txt, rule:true};
    }
    if(SUBJ_ALL.has(c[0])) return {order:true, title:L.t_ord, text:L.order_svo(c[0],c[vc]), rule:true};
  }
  if(vc===0&&vu!==0&&c.length>1) return {order:true, title:L.t_v2, text:L.order_q0(c[0],c[1]), rule:true};
  return {order:true, title:L.t_ord, text:L.order_gen, rule:true};
}

// полное соответствие слово-в-слово: те же слова, но другой порядок и/или формы
function bijection(u,c){
  if(u.length!==c.length) return null;
  const used=new Array(c.length).fill(false), pairs=[], left=[];
  u.forEach(function(w,i){
    let j=-1;
    for(let k=0;k<c.length;k++) if(!used[k]&&c[k]===w){ j=k; break; }
    if(j>=0){ used[j]=true; pairs.push([i,j]); } else left.push(i);
  });
  for(const i of left){
    let j=-1;
    for(let k=0;k<c.length;k++) if(!used[k]&&pairRelated(u[i],c[k])){ j=k; break; }
    if(j<0) return null;
    used[j]=true; pairs.push([i,j]);
  }
  return pairs.sort(function(a,b){ return a[0]-b[0]; });
}
function packItems(items,L){
  if(items.length===1) return items[0].text;
  if(items.length>3) return L.toomany;
  return L.many+'<ul class="why-list">'+items.map(function(i){return "<li>"+i.text+"</li>";}).join("")+"</ul>";
}

function diagnose(userRaw, correctRaw){
  const u=tokz(userRaw), c=tokz(correctRaw);
  if(!u.length||!c.length||u.join(" ")===c.join(" ")) return null;
  const L=W();

  const pairs=bijection(u,c);
  if(pairs){
    let ident=true;
    for(let k=1;k<pairs.length;k++) if(pairs[k][1]<pairs[k-1][1]) ident=false;
    const notes=[];
    pairs.forEach(function(p){ if(u[p[0]]!==c[p[1]]) notes.push(classifyPair(u[p[0]],c[p[1]],c,p[1])); });
    if(!ident){
      const d=orderDiag(u,c);
      if(notes.length) d.text += '<div class="why-also">'+packItems(notes,L)+'</div>';
      return d;
    }
    if(notes.length) return {order:false, title:L.t_err, text:packItems(notes,L)};
  }

  const ops=alignOps(u,c);
  const missAt={}, extraAt={};
  ops.forEach(function(o,i){
    if(o.op==="miss"){ (missAt[o.c]=missAt[o.c]||[]).push(i); }
    if(o.op==="extra"){ (extraAt[o.u]=extraAt[o.u]||[]).push(i); }
  });
  Object.keys(missAt).forEach(function(w){
    if(!extraAt[w]) return;
    const n=Math.min(missAt[w].length, extraAt[w].length);
    for(let k=0;k<n;k++){ ops[missAt[w][k]].op="moved"; ops[extraAt[w][k]].op="drop"; }
  });

  const items=[]; let allOrder=true;
  ops.forEach(function(o){
    if(o.op==="eq"||o.op==="drop") return;
    if(o.op==="moved"){ items.push({order:true, text:L.moved(o.c)}); return; }
    let it;
    if(o.op==="sub") it=classifyPair(o.u,o.c,c,c.indexOf(o.c));
    else if(o.op==="miss") it=classifyMiss(o.c);
    else it=classifyExtra(o.u,c);
    items.push(it); allOrder=false;
  });
  if(!items.length) return null;

  if(allOrder){
    const d=orderDiag(u,c);
    if(items.length===1) d.text=items[0].text;
    return d;
  }
  return {order:false, title:L.t_err, text:packItems(items,L)};
}

function escHT(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function icp(s){
  return s.replace(/<(CH|KB|HD|SD|MC|RD|BK|FL|CL|GL|SH|GC|TR|OK|NO|BT|RL|ER|CK|CD|FR|TG)>/g,
    function(m){ return ic(ICP[m]) + ' '; });
}
function ruleText(type){
  return (meta.lang && meta.lang!=="ru" && TYPE_RULES_EN[type]) ? TYPE_RULES_EN[type] : (TYPE_RULES[type]||"");
}
function explainHTML(qn){
  const d = state.feedback && state.feedback.diag;
  if(!d) return getRuleHTML(qn.type);
  const L=W();
  let inner = icp(L.lbl) + d.text;
  inner += '<div class="why-cmp"><span>'+L.you+':</span> <code>'+escHT(state.lastAnswer||"")+'</code><br>'+
           '<span>'+L.need+':</span> <code>'+escHT(qn.no)+'</code></div>';
  if(d.rule){
    const r = ruleText(qn.type);
    if(r) inner += '<div class="why-rule">' + t('rule') + r + '</div>';
  }
  return '<div class="rule-box">' + inner + '</div>';
}

const TIME_ADV = new Set(["i dag","i går","i morgen","nå","snart","senere","før","alltid","aldri","ofte","sjelden","allerede"]);
const SUBJECTS = new Set(["jeg","du","han","hun","vi","dere","de","det","man"]);
const VERBS = new Set(["jobber","jobbet","snakker","snakket","spiser","spiste","ser","så","kjøper","kjøpte","bor","bodde","er","var","skal","vil","kan","må","har","hadde","blir","ble","drikker","drakk","går","gikk","kommer","kom"]);

function checkV2(user) {
  const tokens = user.trim().toLowerCase().replace(/[?!,]/g,"").split(/\s+/);
  let advEnd = -1;
  for (let i = 0; i < tokens.length - 1; i++) {
    if (TIME_ADV.has(tokens[i]+" "+tokens[i+1])) { advEnd = i+1; break; }
    if (TIME_ADV.has(tokens[i])) { advEnd = i; break; }
  }
  if (advEnd < 0) return null;
  const after = tokens.slice(advEnd+1);
  if (after.length < 2) return null;
  if (SUBJECTS.has(after[0]) && VERBS.has(after[1])) {
    return "<BT>Правило V2: после «" + tokens.slice(0,advEnd+1).join(" ") + "» глагол должен стоять 2-м — сразу после обстоятельства. Подлежащее идёт после глагола.";
  }
  return null;
}

function normalize(s){ return s.trim().toLowerCase().replace(/[?!,.]/g,"").replace(/\s+/g," ").trim(); }
function isCorrect(u,c){ return normalize(u)===normalize(c); }

function buildLCS(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const lcs=[];let i=m,j=n;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){lcs.unshift(a[i-1]);i--;j--;}else if(dp[i-1][j]>dp[i][j-1])i--;else j--;}
  return lcs;
}

function diffAnswers(u,c){
  const uw=normalize(u).split(/\s+/).filter(Boolean),cw=normalize(c).split(/\s+/).filter(Boolean);
  const lcs=buildLCS(uw,cw);
  const res=[];let ui=0,ci=0,li=0;
  while(ci<cw.length||ui<uw.length){
    if(li<lcs.length&&ui<uw.length&&ci<cw.length&&uw[ui]===lcs[li]&&cw[ci]===lcs[li]){
      res.push({word:cw[ci],status:"correct"});ui++;ci++;li++;
    }else if(ci<cw.length&&(li>=lcs.length||cw[ci]!==lcs[li])){
      res.push({word:cw[ci],status:"missing"});ci++;
    }else if(ui<uw.length){res.push({word:uw[ui],status:"extra"});ui++;}
  }
  return res;
}

const PROPER = new Set(["Amerika","Bergen","Danmark","Mars","Norge","Oslo","Polen","Spania","Sverige","TV","Ukraina"]);

function makePool(sentence){
  const words = sentence.replace(/[?!,.]/g,"").split(/\s+/).filter(Boolean);
  if(words.length && !PROPER.has(words[0])) words[0] = words[0].charAt(0).toLowerCase() + words[0].slice(1);
  const have = new Set(words.map(w=>w.toLowerCase()));
  const noise = [];
  for(const w of shuffle(words.slice())){
    const alts = FORM_OF[w.toLowerCase()];
    if(!alts) continue;
    const pick = shuffle(alts.slice()).find(a => !have.has(a) && noise.indexOf(a)===-1);
    if(pick){ noise.push(pick); if(noise.length===2) break; }
  }
  return shuffle(words.concat(noise));
}

const SR = (typeof window!=="undefined") && (window.SpeechRecognition || window.webkitSpeechRecognition);

function pronounce(){
  if(!SR) return;
  const target = state.questions[state.idx].no;
  const btn = document.getElementById('mic-btn');
  if(btn) btn.textContent = '<MC>Слушаю…';
  try{
    const rec = new SR();
    rec.lang = 'nb-NO';
    rec.interimResults = false;
    rec.maxAlternatives = 5;
    rec.onresult = function(e){
      let ok = false, heard = '';
      const res = e.results[0];
      for(let i=0;i<res.length;i++){
        if(!heard) heard = res[i].transcript;
        if(isCorrect(res[i].transcript, target)) ok = true;
      }
      const box = document.getElementById('pron-res');
      if(box) box.innerHTML = ok
        ? '<OK>Отличное произношение! Bra uttale!'
        : '<ER>Услышал: «' + heard + '»<br>Послушай образец и попробуй ещё раз';
      const b = document.getElementById('mic-btn');
      if(b) b.textContent = '<MC>Ещё раз';
    };
    rec.onerror = function(){
      const b = document.getElementById('mic-btn');
      if(b) b.textContent = '<MC>Произнести';
      const box = document.getElementById('pron-res');
      if(box) box.innerHTML = 'Микрофон недоступен — проверь разрешения браузера';
    };
    rec.onend = function(){
      const b = document.getElementById('mic-btn');
      if(b && b.textContent.indexOf('Слушаю')>=0) b.textContent = '<MC>Произнести';
    };
    rec.start();
  }catch(e){}
}

function speak(text){
  if('speechSynthesis' in window){
    const utt = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,"").trim());
    utt.lang = 'nb-NO';
    utt.rate = 0.82;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);
  }
}
