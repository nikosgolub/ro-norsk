 ha et glass sherry?","ru":"Свайн: Выпьешь хереса?"},{"t":18,"no":"Indira: Ja, takk, gjerne.","ru":"Индира: Да, спасибо, с удовольствием."},{"t":20,"no":"Svein: Her! Vær så god.","ru":"Свайн: Вот, пожалуйста."},{"t":22,"no":"Grete: Er dere sultne? Maten er klar.","ru":"Грета: Проголодались? Еда уже готова."},{"t":25,"no":"Vi har indisk mat til deg, Indira, tikka masala.","ru":"У нас есть индийское блюдо для тебя, Индира, - тикка масала."},{"t":29,"no":"Indira: Å, - å så hyggelig!","ru":"Индира: О, как это мило!"}]},{"id":"05nor","file":"05nor.mp3","title":"Hvordan går det?","sub":"Как дела? · En-To-Tre","lines":[{"t":0,"no":"Panos: Hei, Sara. Hvordan går det?","ru":"Панос: Привет, Сара. Как дела?"},{"t":3,"no":"Sara: Bare bra. Hvordan har du det?","ru":"Сара: Отлично. У тебя как?"},{"t":6,"no":"Panos: Bra, men jeg har mye å gjøre.","ru":"Панос: Хорошо, но я сейчас много занимаюсь."},{"t":9,"no":"Sara: Hva gjør du?","ru":"Сара: Чем занимаешься?"},{"t":11,"no":"Panos: Jeg studerer norsk og matematikk.","ru":"Панос: Я изучаю норвежский и математику."},{"t":14,"no":"Sara: Er det vanskelig?","ru":"Сара: Сложно?"},{"t":16,"no":"Panos: Ja, norsk er ganske vanskelig. Hva gjør du, Sara? Studerer du?","ru":"Панос: Да, норвежский довольно сложный. Чем занимаешься ты, Сара? Ты учишься?"},{"t":22,"no":"Sara: Nei, nå jobber jeg, men jeg vil gjerne studere.","ru":"Сара: Нет, сейчас работаю, но я хотела бы учиться."},{"t":26,"no":"Panos: Hvor bor du?","ru":"Панос: Где ты живешь?"},{"t":28,"no":"Sara: I Åsveien, men jeg skal snart flytte.","ru":"Сара: В Освайен, но я скоро перееду."},{"t":31,"no":"Panos: Skal du flytte?","ru":"Панос: Ты переезжаешь?"},{"t":33,"no":"Sara: Ja, jeg flytter snart til sentrum.","ru":"Сара: Да, в ближайшее время, поближе к центру."},{"t":36,"no":"Men nå må jeg gå. Ha det bra, Panos.","ru":"Мне пора. До свидания, Панос."},{"t":39,"no":"Panos: Ha det!","ru":"Панос: Пока!"}]},{"id":"06nor","file":"06nor.mp3","title":"Foran TV","sub":"У телевизора · En-To-Tre","lines":[{"t":0,"no":"Rolf: Huff, for et kjedelig program! Jeg skjønte nesten ikke hva han sa!","ru":"Рольф: Ух, ну и скучная программа! Я почти ничего не понял."},{"t":6,"no":"Jorunn: Han snakket jo bare dialekten sin!","ru":"Йорунн: Он говорил только на своем диалекте!"},{"t":9,"no":"Rolf: Jeg hadde lyst til å høre hva han sa om politikk, og da er det irriterende når jeg ikke skjønner hva han sier.","ru":"Рольф: Я хотел послушать его выступление о политике, и эта непонятная речь меня раздражает."},{"t":17,"no":"Jorunn: Folk må da snakke sånn som det er naturlig for dem.","ru":"Йорунн: Люди должны говорить так, как для них наиболее естественно."},{"t":21,"no":"Jeg synes det er fint at man kan høre hvor folk kommer fra.","ru":"Не так уж плохо, что ты можешь понять по их говору, откуда они."},{"t":26,"no":"Rolf: Ikke når de er på tv eller snakker til folk fra andre steder.","ru":"Рольф: Но не тогда, когда они выступают по телевизору или общаются с людьми из другой местности."},{"t":31,"no":"Da skal de snakke tydelig. De bør ta hensyn til om folk forstår dem.","ru":"Надо говорить отчетливо. Они должны помнить о том, что их могут просто не понять."},{"t":37,"no":"Jorunn: Du skjønner hvis du vil skjønne.","ru":"Йорунн: Если захочешь понять, поймешь."},{"t":40,"no":"Rolf: Kanskje, men tenk på utlendingene da. Det er veldig vanskelig for dem.","ru":"Рольф: Допустим, но подумай об иностранцах! Для них это еще сложнее."},{"t":46,"no":"Jorunn: Og hvordan synes du folk skulle snakke da?","ru":"Йорунн: И как же, по-твоему, нужно разговаривать?"},{"t":49,"no":"Rolf: De skulle snakke sånn som meg, selvfølgelig.","ru":"Рольф: Так же, как я, разумеется."}]},{"id":"07nor","file":"07nor.mp3","title":"Indira får vondt i ryggen","sub":"У Индиры болит спина · Ny i Norge","lines":[{"t":0,"no":"– Nei, Indira, dette går ikke. Jeg synes at du skal gå hjem.","ru":"Нет, Индира, так не пойдет. Тебе нужно ехать домой."},{"t":5,"no":"– Hvis jeg klarer å gå, da.","ru":"Если получится, тогда…"},{"t":7,"no":"– Jeg kan ringe til faren din. Kanskje han kan hente deg?","ru":"Я могу позвонить твоему отцу. Может быть, он сможет тебя забрать?"},{"t":12,"no":"– Nei, faren min er ikke hjemme akkurat nå.","ru":"Нет, папы сейчас нет дома."},{"t":15,"no":"– Det var leit. Han er jo fysioterapeut …","ru":"Жаль. Он ведь физиотерапевт..."},{"t":18,"no":"– Ja, jeg må nok bestille time hos legen.","ru":"Да, мне, наверное, надо будет записаться к врачу."},{"t":22,"no":"– Har du fastlege?","ru":"У тебя есть постоянный врач?"},{"t":24,"no":"– Ja, vi har en fastlege. Hele familien går til henne.","ru":"Да, у нас есть семейный врач. Вся семья лечится у него."},{"t":28,"no":"– Det er bra. Vil du bruke telefonen på kontoret?","ru":"Это хорошо. Хочешь воспользоваться телефоном в кабинете?"},{"t":32,"no":"– Gjerne. Tusen takk.","ru":"Да, спасибо большое."},{"t":34,"no":"– Jeg skal hjelpe deg inn dit.","ru":"Сейчас я тебе помогу."}]},{"id":"08nor","file":"08nor.mp3","title":"Smakte maten?","sub":"Ну как, вкусно? · Ny i Norge","lines":[{"t":0,"no":"Anne: God dag. Jeg har bestilt et bord til Anne Lien.","ru":"Анна: Добрый день. Я забронировала столик на Анну Лиен."},{"t":4,"no":"Kelneren: Det stemmer. Det er det bordet der borte ved vinduet. Vær så god.","ru":"Официант: Да, верно. Ваш столик там у окна. Прошу вас."},{"t":9,"no":"Anne: Takk.","ru":"Анна: Спасибо."},{"t":10,"no":"Kelneren: Her er menyen, vær så god.","ru":"Официант: Вот меню."},{"t":12,"no":"Anne: Ja, men vi vet hva vi skal ha. Har dere ribbe, med medisterpølse og alt som hører med?","ru":"Анна: Спасибо, но мы уже знаем, что хотим заказать. У вас есть ребрышки со свиной колбасой и всем, что полагается?"},{"t":19,"no":"Kelneren: Ja, selvsagt. To porsjoner?","ru":"Официант: Да, конечно. Две порции?"},{"t":22,"no":"Anne: Ja takk.","ru":"Анна: Да."},{"t":23,"no":"Kelneren: Og hva vil dere ha å drikke?","ru":"Официант: А что будете пить?"},{"t":25,"no":"Anne: En øl til meg.","ru":"Анна: Я буду пиво."},{"t":27,"no":"John: Jeg kjører, så jeg tar en alkoholfri øl.","ru":"Джон: Я за рулем, поэтому я возьму безалкогольное пиво."},{"t":30,"no":"Anne: Smakte det godt, synes du?","ru":"Анна: Ну как, тебе понравилось?"},{"t":33,"no":"John: Ja, det var ikke så verst. Det likner kanskje litt på «spare-ribs»?","ru":"Джон: Да, неплохо. Похоже на свиную грудинку, да?"},{"t":38,"no":"Anne: Kanskje det, men dette er jo ikke grillet.","ru":"Анна: Возможно. Это все-таки не на гриле."},{"t":42,"no":"John: Nei, det er sant. Men likevel …","ru":"Джон: Да, это верно. Но все-таки…"}]},{"id":"09nor","file":"09nor.mp3","title":"Hvordan går det med studiene? – 1","sub":"Как твоя учеба? - 1 · En-To-Tre","lines":[{"t":0,"no":"Jon: Hei, Laura. Hvordan går det med økonomistudiene?","ru":"Джон: Привет, Лаура. Как твои занятия по экономике?"},{"t":4,"no":"Laura: Jeg har sluttet å studere økonomi. Nå tar jeg kunsthistorie.","ru":"Лаура: Я бросила экономику. Теперь я изучаю историю искусств."},{"t":9,"no":"Jon: Kunsthistorie! Hvorfor det? Er det ikke lettere å få en god jobb med økonomi enn med kunsthistorie?","ru":"Джон: Историю искусств? Почему? Разве экономисту не легче найти хорошую работу, чем искусствоведу?"},{"t":17,"no":"Laura: Jo, det er det sikkert. Men det er viktigst for meg å gjøre noe jeg er interessert i.","ru":"Лаура: Да, пожалуй. Но для меня самое важное - заниматься тем, что мне интересно."},{"t":24,"no":"Jeg forsto at jeg ikke likte økonomi. For meg er det mye mer interessant med kunsthistorie.","ru":"Я поняла, что мне не нравится экономика. Для меня гораздо интереснее история искусств."},{"t":31,"no":"Jon: Men hva slags jobb kan du få? Hva vil du gjøre hvis du ikke får jobb etter studiene?","ru":"Джон: А какую работу ты можешь найти? Что ты будешь делать, если не устроишься на работу после окончания вуза?"},{"t":38,"no":"Laura: Jeg vil helst jobbe i mediene, men det er nok ikke lett å få jobb der.","ru":"Лаура: Я бы хотела работать в СМИ, но там не так просто устроиться на работу."},{"t":44,"no":"Hvis jeg ikke finner noe annet, kan jeg ta en vaskejobb eller sitte i kassa på supermarkedet.","ru":"Если не найду ничего другого, я могу быть уборщицей или сидеть на кассе в супермаркете."},{"t":52,"no":"Det er ikke så viktig. Jeg er sikker på at jeg får en jobb.","ru":"Это не так уж важно. Я уверена, что без работы не останусь."}]},{"id":"10nor","file":"10nor.mp3","title":"Hvordan går det med studiene? – 2","sub":"Как твоя учеба? - 2 · En-To-Tre","lines":[{"t":0,"no":"Jon: Er ikke lønna viktig for deg?","ru":"Джон: Для тебя не важна зарплата?"},{"t":2,"no":"Laura: Jo, litt, kanskje. Jeg må tjene nok til å betale studielånet.","ru":"Лаура: Да, немного, может быть. Нужно накопить на оплату студенческого кредита."},{"t":8,"no":"Men først vil jeg ha en morsom studietid.","ru":"Но прежде меня ждет увлекательная учеба."},{"t":11,"no":"Men du, da - valgte du å studere medisin fordi det er lett å få en god jobb?","ru":"А ты как – ты решил изучать медицину, потому что легко будет найти хорошую работу?"},{"t":17,"no":"Jon: Nei, jeg er interessert i mennesker, og jeg synes det er interessant med medisin.","ru":"Джон: Нет, мне интересны люди, и медицина для меня – интересное направление."},{"t":23,"no":"Men jeg tenkte også på at det er lettere å få seg en god jobb for en lege enn for mange andre.","ru":"Но я также думал и о том, что врачу проще найти хорошую работу, чем представителям многих других профессий."},{"t":31,"no":"Laura: Du får sikkert bedre lønn enn meg. Men kanskje jeg har det morsommere enn deg mens vi studerer.","ru":"Лаура: Тебе, конечно, будут платить больше. Но зато, наверное, у меня учеба интереснее."},{"t":39,"no":"Nå skal jeg ha en forelesning om italiensk kunst. Jeg gleder meg.","ru":"Сейчас будет лекция по итальянскому искусству. Надо идти."},{"t":44,"no":"Jon: Jeg må også skynde meg. Jeg skal på et seminar om psykologi. Det er mer interessant!","ru":"Джон: Мне тоже пора. Я собираюсь на семинар по психологии. Это еще интереснее!"},{"t":50,"no":"Laura: God fornøyelse.","ru":"Лаура: Удачи."},{"t":51,"no":"Jon: I like måte.","ru":"Джон: И тебе."}]},{"id":"11nor","file":"11nor.mp3","title":"På bussen","sub":"В автобусе · En-To-Tre","lines":[{"t":0,"no":"Per: Hei, Kari.","ru":"Пер: Привет, Кари!"},{"t":1,"no":"Kari: Hei, Per. Hyggelig å se deg.","ru":"Кари: Привет, Пер. Рада тебя видеть."},{"t":4,"no":"Per: I like måte. Kan jeg sitte her?","ru":"Пер: Я тоже. Можно присесть?"},{"t":6,"no":"Kari: Selvfølgelig. Hvor skal du?","ru":"Кари: Конечно. Куда едешь?"},{"t":8,"no":"Per: Jeg skal til sentrum, på kino. Vil du bli med meg?","ru":"Пер: Я еду в центр, в кино. Хочешь со мной?"},{"t":12,"no":"Kari: Dessverre. Jeg kan ikke. Jeg skal på jobb.","ru":"Кари: К сожалению, не могу. Мне надо на работу."},{"t":16,"no":"Per: Hvor jobber du nå?","ru":"Пер: Где ты сейчас работаешь?"},{"t":18,"no":"Kari: Jeg er kokk på en restaurant i Fjellgata.","ru":"Кари: Я повар в ресторане на улице Фьелльгата."},{"t":21,"no":"Per: Hva med søndag? Har du fri på søndag?","ru":"Пер: А как насчет воскресенья? В воскресенье ты свободна?"},{"t":24,"no":"Kari: Ja, jeg jobber ikke på søndag, men da har jeg en avtale med Grete.","ru":"Кари: Да, я не работаю в воскресенье, но на этот раз мы уже договорились с Гретой."},{"t":29,"no":"Vi skal på lang tur i fjellet. Vil du bli med oss?","ru":"Мы собираемся в длинный поход в горы. Пойдешь с нами?"},{"t":33,"no":"Per: Lang tur? Hm, nei, dessverre. Jeg kan ikke på søndag.","ru":"Пер: Длинный поход? Хм, нет, к сожалению. Я не могу в воскресенье."},{"t":38,"no":"Jeg skal ..., jeg må ... . Jeg har ikke tid på søndag.","ru":"Я должен... Мне надо... Мне некогда в воскресенье."},{"t":42,"no":"Kari: Jeg forstår. Oi! Her må jeg gå av. Ser deg senere.","ru":"Кари: Понимаю. О! Моя остановка. Увидимся позже."},{"t":46,"no":"Per: Men når kan vi gå på kino? Jeg ringer deg tirsdag eller onsdag. OK?","ru":"Пер: Но когда же мы сходим в кино? Я позвоню тебе во вторник или в среду. ОК?"},{"t":52,"no":"Kari: Fint! Ha det. Vi ses.","ru":"Кари: Хорошо! Пока. До встречи."}]},{"id":"12nor","file":"12nor.mp3","title":"På kafé","sub":"В кафе · En-To-Tre","lines":[{"t":0,"no":"Lasse: Skal vi gå på kafé?","ru":"Лассе: Пойдем в кафе?"},{"t":2,"no":"Marit: Ja, gjerne. Her er en kafé.","ru":"Марит: Да, я бы не отказалась. Вот кафе."},{"t":5,"no":"Lasse: Fint. Vi går inn her.","ru":"Лассе: Хорошо. Зайдем сюда."},{"t":7,"no":"Lasse: Er du sulten?","ru":"Лассе: Проголодалась?"},{"t":8,"no":"Marit: Ja, litt.","ru":"Марит: Да, немного."},{"t":9,"no":"Lasse: Hva vil du ha?","ru":"Лассе: Что будешь есть?"},{"t":11,"no":"Marit: Jeg vet ikke. Kanskje et rundstykke med ost.","ru":"Марит: Я не знаю. Может быть, булочку с сыром."},{"t":14,"no":"Lasse: Vil du ha noe å drikke?","ru":"Лассе: А пить?"},{"t":16,"no":"Marit: Bare en kopp kaffe. Og du?","ru":"Марит: Только кофе. А ты?"},{"t":18,"no":"Lasse: Jeg er tørst. Jeg tar et glass øl. Unnskyld, er det lov å røyke her?","ru":"Лассе: Я хочу пить. Я возьму стакан пива. Извините, здесь можно курить?"},{"t":24,"no":"Servitør: Nei, dessverre.","ru":"Официант: Нет, к сожалению."},{"t":26,"no":"Marit: Du må gå ut og røyke.","ru":"Марит: Придется тебе покурить на улице."},{"t":28,"no":"Lasse: Ut? Er du gal? Det er jo vinter.","ru":"Лассе: На улице? Ты с ума сошла? Сейчас же зима."},{"t":31,"no":"Servitør: Vil dere bestille?","ru":"Официант: Будете что-то заказывать?"},{"t":33,"no":"Lasse: Ja takk. Et glass øl, en kopp kaffe og et rundstykke med ost.","ru":"Лассе: Да. Стакан пива, чашку кофе и булочку с сыром."},{"t":37,"no":"Nei forresten, jeg vil også ha kaffe. To kopper kaffe, et rundstykke og en is.","ru":"Впрочем, погодите, я тоже возьму кофе. Два кофе, булочку и мороженое."},{"t":43,"no":"Servitør: Sjokoladeis eller vaniljeis?","ru":"Официант: Шоколадное или ванильное?"},{"t":45,"no":"Lasse: Sjokoladeis. Har dere sjokoladesaus?","ru":"Лассе: Шоколадное. У вас есть шоколадный соус?"},{"t":48,"no":"Servitør: Ja, det har vi.","ru":"Официант: Да, есть."},{"t":50,"no":"Marit: Skal du spise sjokoladeis med sjokoladesaus?","ru":"Марит: Ты будешь шоколадное мороженое с шоколадным соусом?"},{"t":53,"no":"Lasse: Ja, det er kjempegodt.","ru":"Лассе: Ну да, это же просто супер."}]},{"id":"13nor","file":"13nor.mp3","title":"Hva gjorde du i helga?","sub":"Как прошли выходные? · En-To-Tre","lines":[{"t":0,"no":"Kirsten: Hei John. Hvordan går det? Hadde du det hyggelig i helga?","ru":"Кирстен: Привет, Джон. Как дела? Как выходные?"},{"t":5,"no":"John: Ikke spesielt!","ru":"Джон: Ничего особенного."},{"t":7,"no":"Kirsten: Å, var ikke du ute sammen med Anita i går?","ru":"Кирстен: О, разве ты не гулял с Анитой вчера?"},{"t":10,"no":"John: Hun kom ikke!","ru":"Джон: Она не пришла."},{"t":12,"no":"Kirsten: Kom hun ikke? Kanskje hun var syk.","ru":"Кирстен: Да? Может быть, заболела."},{"t":15,"no":"John: Nei, vi snakket sammen i telefonen etter frokost.","ru":"Джон: Нет, мы говорили по телефону после завтрака."},{"t":19,"no":"Kirsten: Kan det være en misforståelse?","ru":"Кирстен: Может, произошло недоразумение?"},{"t":21,"no":"John: Jeg tror ikke det. Avtalen var klokka halv to utenfor kinoen.","ru":"Джон: Не думаю. Мы договорились встретиться в полвторого, рядом с кинотеатром."},{"t":27,"no":"Jeg kom kvart over to og ventet i over en time. Jeg følte meg helt dum!","ru":"Я пришел в 2:15 и ждал целый час. Я чувствовал себя так глупо!"},{"t":34,"no":"Kirsten: Jeg trodde hun likte deg godt.","ru":"Кирстен: Я думала, что ты ей понравился."},{"t":36,"no":"John: Det trodde jeg også. Men man kan ikke stole på norske jenter!","ru":"Джон: Я тоже так думал. Но нельзя положиться на норвежских девушек!"},{"t":41,"no":"Kirsten: Et øyeblikk! Sa du at du kom klokka kvart over to?","ru":"Кирстен: Минутку! Так ты говоришь, что пришел в 15 минут третьего?"},{"t":46,"no":"John: Ja.","ru":"Джон: Да."},{"t":47,"no":"Kirsten: Og avtalen var klokka halv to?","ru":"Кирстен: И встреча была назначена на половину второго?"},{"t":50,"no":"John: Det sa jeg jo!","ru":"Джон: Да, все правильно."},{"t":52,"no":"Kirsten: Ha! Da må du skynde deg å ringe henne og be om unnskyldning.","ru":"Кирстен: Ага! Тогда ты должен немедленно ей позвонить и извиниться."},{"t":56,"no":"John: Hva? Hvorfor det?","ru":"Джон: Что? Почему?"},{"t":58,"no":"Kirsten: Fordi du kom for sent! Og så må du lese kapittel sju i norskboka en gang til!","ru":"Кирстен: Потому что ты опоздал! И перечитай главу 7 в учебнике норвежского!"}]},{"id":"14nor","file":"14nor.mp3","title":"Utenfor treningsstudioet","sub":"У спортзала · Ny i Norge","lines":[{"t":0,"no":"Hassan: Hei, Larissa, hyggelig å se deg! Hvordan går det?","ru":"Хасан: Привет, Лариса, рад тебя видеть! Как дела?"},{"t":4,"no":"Larissa: Det går bra. Og med deg?","ru":"Лариса: Все в порядке. А у тебя?"},{"t":7,"no":"Hassan: Jeg er litt forkjølet. Ellers går det bra.","ru":"Хасан: Немного простыл. В остальном все хорошо."},{"t":10,"no":"Larissa: Sier du det? Ja, det er viktig å holde seg i form. Da blir du ikke syk så lett.","ru":"Лариса: Да ты что? Держи себя в форме, это важно. Тогда так легко не заболеешь."},{"t":17,"no":"Hassan: Ja, kanskje det?","ru":"Хасан: Да, может быть."},{"t":19,"no":"Larissa: Og så er det gøy å trene også. Jeg pleier å trene to ganger i uka.","ru":"Лариса: К тому же физкультура дарит радость. Я обычно тренируюсь два раза в неделю."},{"t":25,"no":"Hassan: Jeg har aldri vært på sånn trening. Men jeg har spilt fotball i mange år.","ru":"Хасан: Я никогда не был на такой тренировке. Но я много лет играл в футбол."},{"t":32,"no":"Kanskje jeg kan prøve når jeg blir frisk?","ru":"Может быть, когда мне станет лучше, попробовать сходить?"},{"t":35,"no":"Larissa: Hvorfor ikke? Du kan jo ha en prøvetime.","ru":"Лариса: Почему бы нет? Ты можете просто посетить пробное занятие."},{"t":39,"no":"Hassan: Det er sant. Er du også på vei til norskkurset, forresten?","ru":"Хасан: Это верно. Кстати, ты тоже идешь на курсы норвежского?"},{"t":43,"no":"Larissa: Nei, jeg kan ikke komme i kveld. Jeg må være barnevakt.","ru":"Лариса: Нет, я не могу. Сегодня вечером я работаю няней."},{"t":48,"no":"Randi har reist til England, og Ståle skal på fotballkamp.","ru":"Ранди побывала в Англии, а Столе собирается на футбольный матч."},{"t":53,"no":"Hassan: Javel. Vil du at jeg skal gi beskjed til Tor?","ru":"Хасан: Хорошо. Хочешь, чтобы я передал Тору?"},{"t":56,"no":"Larissa: Nei, det trenger du ikke. Jeg har snakket med Tor.","ru":"Лариса: Нет, не нужно. Я уже поговорила с Тором."},{"t":59,"no":"Hassan: Ja vel. Men nå må jeg gå. Jeg vil ikke komme for seint.","ru":"Хасан: Ладно. Мне пора. Лучше не опаздывать."},{"t":64,"no":"Larissa: Nei, det er sant. Vi ses - og god bedring!","ru":"Лариса: Правильно. До встречи, и выздоравливай!"}]},{"id":"15nor","file":"15nor.mp3","title":"Ikke kjør så fort!","sub":"Не гони так сильно! · Ny i Norge","lines":[{"t":0,"no":"Carlos: Ikke kjør så fort, Hassan! Det er jo bare seksti kilometer her.","ru":"Карлос: Не гони так, Хасан! Ограничение 60 километров в час."},{"t":5,"no":"Hassan: Men det er ingen trafikk her ute på landet. Er du redd?","ru":"Хасан: Но в этой местности совсем слабое движение. Ты боишься?"},{"t":10,"no":"Carlos: Nei, men jeg synes du skal kjøre forsiktig. Veien er fryktelig smal.","ru":"Карлос: Нет, но я думаю, ездить надо осторожно. Дорога ужасно узкая."},{"t":15,"no":"Se der! To gutter med en ball.","ru":"Смотри! Там два мальчика с мячом."},{"t":18,"no":"Hassan: Ja, jeg ser dem. Jeg kjører bare i femti. Sett på radioen, er du snill!","ru":"Хасан: Да, вижу. Я еду не быстрее 50. Будь добр, включи радио."},{"t":24,"no":"Carlos: Hør så stilig musikk.","ru":"Карлос: Хорошая музыка."},{"t":26,"no":"Se hvordan du kjører! Du kjører altfor fort!","ru":"Не увлекайся! Ты едешь слишком быстро!"},{"t":29,"no":"Hassan: Ikke mas sånn! Jeg kjører forsiktig.","ru":"Хасан: Да не переживай ты так! Я аккуратно езжу."},{"t":32,"no":"Carlos: Nei, jeg synes ikke at du gjør det. Har du ikke kjørt i Norge før? Det er ikke lov å kjøre så fort!","ru":"Карлос: Что-то не заметно. Ты никогда раньше не был в Норвегии? Нельзя здесь так гонять!"},{"t":39,"no":"Hassan: Men jeg må jo teste bilen din litt. Vi må se hva den kan.","ru":"Хасан: Но надо немного проверить машину. Мы должны узнать ее возможности."},{"t":44,"no":"Carlos: Nei, det er ikke nødvendig. Og forresten, tenk om det er fartskontroll?","ru":"Карлос: Без этого вполне можно обойтись. И, кстати, ты про дорожную инспекцию подумал?"},{"t":50,"no":"Hassan: Det er vel ikke fartskontroll her, langt ute på landet!","ru":"Хасан: Откуда здесь в глубинке дорожная инспекция?"}]},{"id":"16nor","file":"16nor.mp3","title":"Fartskontroll","sub":"Дорожная инспекция · Ny i Norge","lines":[{"t":0,"no":"Carlos: Hassan, nå kjører du for fort. Bilen er helt ny, og jeg har ikke lyst til å ødelegge den den første dagen!","ru":"Карлос: Хасан, сейчас ты точно превышаешь. Машина совсем новая, и я не хочу испортить ее в первый же день!"},{"t":8,"no":"Se der!","ru":"Смотри!"},{"t":9,"no":"Hassan: Hva var det?","ru":"Хасан: Что это было?"},{"t":10,"no":"Carlos: Jeg tror at det var en radar.","ru":"Карлос: Кажется, это был радар."},{"t":12,"no":"Hassan: Å nei, tror du jeg ble tatt?","ru":"Хасан: Только не это! Думаешь, меня засекли?"},{"t":14,"no":"Carlos: Sannsynligvis. Der står politiet! De vinker på oss.","ru":"Карлос: Наверное. Вон стоит полиция! Они машут нам."},{"t":18,"no":"Konstabelen: God dag.","ru":"Полицейский: Добрый день."},{"t":19,"no":"Hassan: God dag.","ru":"Хасан: Добрый день."},{"t":20,"no":"Konstabelen: Du har det visst travelt i dag! Kan jeg få se førerkortet?","ru":"Полицейский: Ну вы и разогнались! Могу я увидеть ваши права?"},{"t":25,"no":"Hassan: Dessverre, jeg har glemt det hjemme.","ru":"Хасан: К сожалению, я забыл их дома."},{"t":28,"no":"Konstabelen: Det var verre. Er dette din bil?","ru":"Полицейский: Это уже хуже. Это ваш автомобиль?"},{"t":31,"no":"Hassan: Nei, det er bilen til kameraten min.","ru":"Хасан: Нет, это машина моего друга."},{"t":33,"no":"Konstabelen: Er det riktig?","ru":"Полицейский: Это правда?"},{"t":35,"no":"Carlos: Ja, det er det.","ru":"Карлос: Да, это так."},{"t":36,"no":"Konstabelen: Vel, da må jeg få se vognkortet. Og så må jeg ha navnet ditt.","ru":"Полицейский: Ну, тогда я посмотрю технический талон. Ваше имя?"},{"t":41,"no":"Hassan: Det er Hassan Darani.","ru":"Хасан: Хасан Дарани."},{"t":43,"no":"Konstabelen: Vel, Hassan Darani, da får du en fartsbot på femten hundre kroner.","ru":"Полицейский: Что ж, Хасан Дарани, вы получаете штрафной талон на 1500 крон за превышение скорости."},{"t":50,"no":"Du får også en bot på fem hundre kroner for å kjøre uten å ha førerkortet med deg.","ru":"Также вы должны будете заплатить 500 крон штрафа за вождение без водительских прав."},{"t":56,"no":"Hassan: Så mye?","ru":"Хасан: Так много?"},{"t":57,"no":"Konstabelen: Ja, sånn er det. Vedtar du bøtene?","ru":"Полицейский: Да, так и есть. Или вы не согласны?"},{"t":61,"no":"Hassan: Ja, jeg må vel det ...","ru":"Хасан: Я полагаю, согласен…"}]},{"id":"17nor","file":"17nor.mp3","title":"Kjære mor og far! – 1","sub":"Дорогие мама и папа! – 1 · Ny i Norge","lines":[{"t":0,"no":"Kjære mor og far!","ru":"Дорогие мама и папа!"},{"t":2,"no":"Her kommer en hilsen fra Norge.","ru":"Привет вам из Норвегии."},{"t":5,"no":"Først vil jeg takke for at dere er så flinke til å ringe til oss.","ru":"Прежде всего хочу сказать спасибо, что успеваете нам звонить."},{"t":10,"no":"Det er vi veldig glade for, for vi vet at det er dyrt!","ru":"Нам очень приятно, ведь мы знаем, что это дорого."},{"t":15,"no":"Vi trives her i Norge, men vi savner dere jo.","ru":"Мы живем здесь как в сказке, только скучаем по вам."},{"t":19,"no":"Tom trives også. Han går i barnehage og har fått mange venner.","ru":"У Тома тоже все замечательно. Он ходит в детский сад и у него много друзей."},{"t":25,"no":"Han vokser og er blid og glad.","ru":"Он растет счастливым и веселым."},{"t":28,"no":"I barnehagen er de forresten veldig flinke til å hjelpe ham med språket, så han snakker ganske godt norsk allerede.","ru":"Садик очень помогает ему учить язык, так что он уже хорошо говорит по-норвежски."},{"t":36,"no":"Da jeg skrev sist, fortalte jeg at det var vanskelig å forstå nyhetene på TV.","ru":"Когда я писал вам в прошлый раз, я говорил, что мне трудно понимать новости по телевизору."},{"t":42,"no":"Nå går det bra. Anne hjelper meg, og jeg forstår nesten alt når folk snakker norsk.","ru":"Теперь все наладилось. Анна помогает мне, и я понимаю почти все, что говорят норвежцы."},{"t":49,"no":"I går spilte bandet vårt i en sekstiårsdag.","ru":"Вчера мы с группой играли на юбилее 60 лет."},{"t":52,"no":"Mora til en av de andre i bandet fylte år.","ru":"Именинницей была мать одного из музыкантов."},{"t":55,"no":"Det var litt av en fest, kan dere tro!","ru":"Вот это вечеринка была!"},{"t":58,"no":"Vi fikk være til stede på middagen, og jeg skal si det var stil over det.","ru":"Мы остались на банкет, который был довольно своеобразен."},{"t":64,"no":"Mye mer formelt enn hjemme hos oss i USA!","ru":"Гораздо более торжественное мероприятие, чем у нас в Америке."},{"t":68,"no":"Det var bordplassering, og jeg kjente ingen av dem jeg satt ved siden av.","ru":"Места были распределены, и я не знал никого из своих соседей по столу."}]},{"id":"18nor","file":"18nor.mp3","title":"Kjære mor og far! – 2","sub":"Дорогие мама и папа! - 2 · Ny i Norge","lines":[{"t":0,"no":"Men den ene var bonde, og vi snakket om norsk jordbruk og om USA.","ru":"Один из них был фермером, и мы говорили о норвежском сельском хозяйстве и о США."},{"t":6,"no":"Den andre var litt sjenert. Han sa ikke så mye.","ru":"Другой был немного застенчивым и больше помалкивал."},{"t":10,"no":"Han svarte bare ja eller nei når jeg spurte om noe.","ru":"Только отвечал «да» или «нет», когда я о чем-то спрашивал."},{"t":14,"no":"Men det er klart det kan være litt vanskelig å vite hva en skal snakke med fremmede mennesker om ...","ru":"Но, конечно, немного трудно находить темы для разговора, когда общаешься с незнакомыми людьми..."},{"t":21,"no":"Maten var imidlertid god: Laks og jordbær med fløte.","ru":"Однако еда была хорошая: лосось и клубника со сливками."},{"t":26,"no":"Det var mange taler ved bordet.","ru":"Было много застольных речей."},{"t":28,"no":"Først hilste hovedpersonens mann alle velkommen.","ru":"Сначала всех приветствовал муж виновницы торжества."},{"t":32,"no":"Deretter var det lange taler. Maten ble kald mens de snakket.","ru":"Потом были еще длинные речи. Еда успела остыть, пока они разглагольствовали."},{"t":38,"no":"På festen spiste jeg med kniv og gaffel på den måten som de gjør her i Europa.","ru":"На вечеринке я ел ножом и вилкой, как делают здесь, в Европе."},{"t":44,"no":"Jeg er ofte usikker på hva jeg skal gjøre når amerikanske og norske tradisjoner er forskjellige.","ru":"Я часто затрудняюсь с тем, как поступить, когда сталкиваюсь с культурными различиями."},{"t":51,"no":"Som oftest har jeg Anne i nærheten til å hjelpe meg, men ...","ru":"Конечно, я всегда могу спросить жену, и все же..."},{"t":55,"no":"Siden dette er den første julen vår i Norge, tenkte vi å invitere dere hit.","ru":"Так как это наше первое Рождество в Норвегии, мы думаем пригласить вас сюда."},{"t":61,"no":"Vi er jo ikke så mange. Annes foreldre og broren hennes med familie kommer også.","ru":"Нас не так много. Придут родители Анны и ее брат с семьей."},{"t":67,"no":"Med dere blir vi ti personer, to små og åtte store.","ru":"С вами нас будет десять человек - два малыша и восемь взрослых."},{"t":72,"no":"Vi håper dere kan komme, og ser fram til å være samlet alle sammen.","ru":"Мы надеемся, что вы сможете приехать, и с нетерпением ждем того дня, когда мы соберемся всей семьей."},{"t":78,"no":"Kjærlige hilsener fra John","ru":"С любовью, Джон"}]},{"id":"19nor","file":"19nor.mp3","title":"Et julebesøk","sub":"Рождественский вечер · Ny i Norge","lines":[{"t":0,"no":"Anne: Hvor mange personer blir vi egentlig?","ru":"Анна: Сколько нас будет точно?"},{"t":3,"no":"John: Tja, alt i alt blir vi, la meg se, åtte voksne og to barn.","ru":"Джон: Так, давай посмотрим - восемь взрослых и двое детей."},{"t":8,"no":"Anne: Men de fleste er norske. Og de vil sikkert ha norsk mat på julaften.","ru":"Анна: Причем большинство - норвежцы. И они, безусловно, захотят чего-нибудь норвежского в канун Рождества."},{"t":15,"no":"John: Ja, men den norske julematen er jo så spesiell.","ru":"Джон: Да, но норвежская рождественская кухня так специфична..."},{"t":19,"no":"Anne: Vi pleier å ha ribbe. Har du smakt det?","ru":"Анна: Обычно у нас бывают ребрышки. Ты пробовал?"},{"t":22,"no":"John: Nei, men jeg har smakt pinnekjøtt.","ru":"Джон: Нет, но я уже пробовал ребрышки ягненка."},{"t":25,"no":"Da vi spilte på den nye restauranten med bandet forrige lørdag, fikk vi det.","ru":"Когда мы с группой играли в новом ресторане в прошлую субботу, там и попробовал."},{"t":31,"no":"Det smakte ikke så verst. Men - familien din har kanskje ikke spist kalkun.","ru":"На вкус не так уж плохо. Но... у вас в семье, наверное, никогда не ели индейку."},{"t":37,"no":"Det kan jo være spennende å prøve nye ting!","ru":"А ведь так интересно пробовать новые блюда!"},{"t":40,"no":"Anne: Ikke på julaften. Da er nordmenn veldig konservative.","ru":"Анна: Только не в канун Рождества. В этом отношении норвежцы очень консервативны."},{"t":45,"no":"John: Kan vi ikke lage en blandingsmeny?","ru":"Джон: А как насчет устроить смешанное меню?"},{"t":48,"no":"Anne: Jo, det var en god idé. Så kan vi ha ribbe til hovedrett og pai til dessert.","ru":"Анна: Хорошая идея. Тогда можно на первое приготовить ребрышки, а на десерт - пирог."},{"t":55,"no":"John: Ja, eller kanskje kalkun til hovedrett og multekrem til dessert.","ru":"Джон: Или, может, на первое будет индейка, а на десерт - морошковый крем."},{"t":61,"no":"Anne: Det høres godt ut! Det tar vi.","ru":"Анна: Звучит отлично! Так и сделаем."}]},{"id":"20nor","file":"20nor.mp3","title":"Hva driver du med? – 1","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Sonia, 32 år","ru":"Соня, 32 года"},{"no":"– Hva gjør du nå, Sonia?","ru":"Чем вы сейчас занимаетесь, Соня?"},{"no":"– Jeg er hjemmeværende.","ru":"Я домохозяйка."},{"no":"Vi har to barn som skal begynne på skolen nå, og da vil jeg gjerne være hjemme og passe på dem.","ru":"У нас двое детей пошли в школу, и я бы хотела быть дома и присматривать за ними."},{"no":"Jeg synes det er viktig at de har noen å komme hjem til når de er ferdige på skolen.","ru":"Я считаю, для ребенка важно, чтобы кто-то встречал его дома, когда он приходит из школы."},{"no":"– Har du jobbet utenfor hjemmet før?","ru":"А раньше вы где-то работали?"},{"no":"– Jeg jobbet litt i en barnehage før jeg giftet meg, og før jeg kom hit til landet.","ru":"Я работала немного в детском саду до того, как вышла замуж и до того, как переехала в эту страну."},{"no":"– Har du lyst til å ta utdanning eller gå ut i jobb senere?","ru":"Хотели бы вы в будущем пойти работать или учиться?"},{"no":"– Jeg vet ikke. Kanskje. Jeg liker å jobbe hjemme.","ru":"Не знаю. Может быть. Мне нравится следить за домом."},{"no":"Men når barna blir større, får jeg kanskje lyst til å komme ut litt.","ru":"Но, как дети подрастут, возможно, я захочу немного развеяться."},{"no":"Jeg kan få en vaskejobb på kjøpesenteret nå, hvis jeg vil.","ru":"Сейчас я могла бы работать уборщицей в торговом центре."},{"no":"Men jeg foretrekker å være hjemme i noen år til.","ru":"Но я хочу посидеть дома еще несколько лет."}]},{"id":"21nor","file":"21nor.mp3","title":"Hva driver du med? – 2","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Jan, 45 år","ru":"Ян, 45 лет"},{"no":"– Hva driver du med, Jan?","ru":"Чем вы занимаетесь, Ян?"},{"no":"– Jeg har vært arbeidsledig i noen måneder, men i neste uke begynner jeg som sjåfør i et stort firma.","ru":"Я несколько месяцев был безработным, но на следующей неделе начинаю работать водителем в крупной компании."},{"no":"Det gleder jeg meg til.","ru":"Не терпится приступить."},{"no":"– Hva slags jobber har du hatt før?","ru":"Кем вы работали раньше?"},{"no":"– Før jeg kom hit til landet, jobbet jeg som ingeniør.","ru":"До того как приехал в страну, я был инженером."},{"no":"– Har du hatt jobb her i landet?","ru":"А у нас в стране вы работали?"},{"no":"– Ja, jeg har hatt forskjellige jobber. Først jobbet jeg på et fiskemottak, senere på et lager.","ru":"Да, я работал в разных местах. Сначала на рыбозаводе, потом на складе."},{"no":"– Hva slags jobb vil du helst ha?","ru":"Кем бы вы хотели работать?"},{"no":"– Jeg håper at jeg får godkjent ingeniørutdanningen min.","ru":"Я надеюсь, что смогу подтвердить свой диплом инженера."},{"no":"Men foreløpig er jeg fornøyd med å være sjåfør.","ru":"Но пока я доволен и должностью водителя."},{"no":"Det er en ganske selvstendig jobb – den gir frihet.","ru":"Работаешь сам по себе, никто над душой не стоит."},{"no":"Lønna er heller ikke så verst.","ru":"И зарплата неплохая."}]},{"id":"22nor","file":"22nor.mp3","title":"Hva driver du med? – 3","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Ella, 21 år","ru":"Элла, 21 год"},{"no":"– Hva gjør du, Ella?","ru":"Чем вы занимаетесь, Элла?"},{"no":"– Jeg går på norskkurs, og så jobber jeg i butikk tre kvelder i uka.","ru":"Я хожу на курсы норвежского и работаю в магазине три вечера в неделю."},{"no":"Jeg har tenkt å begynne å studere her, men først må jeg lære mer norsk.","ru":"Я планирую начать учиться, но сначала нужно выучить норвежский как следует."},{"no":"– Hva har du tenkt å studere?","ru":"Что вы собираетесь изучать?"},{"no":"– Hjemme studerte jeg matematikk og kjemi. Nå har jeg lyst til å studere oljeteknologi.","ru":"На родине я изучала математику и химию. Теперь я хочу изучать нефтяные технологии."},{"no":"Jeg ønsker meg en jobb i oljeindustrien. Det er drømmejobben.","ru":"Я хочу работать в нефтяной промышленности. Это работа моей мечты."},{"no":"– Hvorfor det?","ru":"Почему?"},{"no":"– Det virker spennende. Jeg kan få jobb i mange land, og jeg tror jeg kan tjene ganske bra i en slik jobb.","ru":"Мне кажется, это здорово. Я могу найти работу во многих странах, и я думаю, что могу неплохо преуспеть на такой работе."},{"no":"– Lykke til!","ru":"Удачи."},{"no":"– Takk!","ru":"Спасибо!"}]},{"id":"23nor","file":"23nor.mp3","title":"Hva driver du med? – 5","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Linn, 27 år","ru":"Линн, 27 лет"},{"no":"– Hva slags planer har du, Linn?","ru":"Какие у вас планы, Линн?"},{"no":"– Drømmen min er å starte et spisested.","ru":"Моя мечта - открыть свой ресторан."},{"no":"Jeg har jobbet på mange restauranter og kafeer, så jeg har lang erfaring.","ru":"Я работала во многих ресторанах и кафе, и у меня большой опыт."},{"no":"– Hvorfor vil du starte for deg selv?","ru":"Почему вы хотите открыть свое дело?"},{"no":"– Jeg har lyst på nye utfordringer.","ru":"Я люблю стремиться к новым вершинам."},{"no":"Jeg har mange gode ideer som jeg gjerne vil prøve å gjøre noe med.","ru":"У меня много хороших идей, которые я хотела бы попробовать реализовать."},{"no":"Og det er morsommere å jobbe for seg selv enn for andre.","ru":"И на себя работать интереснее, чем на других."},{"no":"– Hva slags spisested har du tenkt deg?","ru":"Каким вы видите свой ресторан?"},{"no":"– Jeg har tenkt meg et typisk lunsjsted.","ru":"Я думаю, типичное место, где можно пообедать."},{"no":"Folk her i byen går mer og mer ut på kafé i lunsjpausen, og jeg vil gi dem noe nytt.","ru":"Местные жители все чаще ходят обедать в кафе, и я хочу предложить им что-то новенькое."},{"no":"– Hva da?","ru":"Что именно?"},{"no":"– Jeg vil spesialisere meg på teservering.","ru":"Моей «изюминкой» будет чайное обслуживание."},{"no":"Tenk deg: Te fra mange kanter av verden – og så smørbrød og kaker som passer til.","ru":"Представьте себе: чай со всех концов света, а к нему соответствующие бутерброды и пирожные."},{"no":"– Det virker spennende.","ru":"Звучит заманчиво."},{"no":"– Ja, jeg håper jeg klarer det.","ru":"Да, я надеюсь, что у меня получится."},{"no":"Jeg går på AMO-kurs nå for å lære hva jeg må gjøre hvis jeg vil starte for meg selv.","ru":"Сейчас я иду на курсы АМО, чтобы научиться тому, как открыть свое дело."},{"no":"– Det er vel ikke lett?","ru":"Наверно, это не легко?"},{"no":"– Nei, det ser nokså komplisert ut. Det er så mange lover og regler man må kjenne til.","ru":"Да, выглядит непросто. Надо знать столько законов и постановлений."},{"no":"Men jeg skal klare det! Jeg har bare meg selv å tenke på, så jeg kan jobbe hardt.","ru":"Но я справлюсь! У меня нет других забот, так что я могу с головой уйти в работу."},{"no":"– Lykke til!","ru":"Удачи!"},{"no":"– Takk skal du ha.","ru":"Спасибо."}]},{"id":"24nor","file":"24nor.mp3","title":"Hva driver du med? – 5","sub":"Stein på stein - Leksjon 1","lines":[{"no":"Linn, 27 år","ru":"Линн, 27 лет"},{"no":"– Hva slags planer har du, Linn?","ru":"Какие у вас планы, Линн?"},{"no":"– Drømmen min er å starte et spisested.","ru":"Моя мечта - открыть свой ресторан."},{"no":"Jeg har jobbet på mange restauranter og kafeer, så jeg har lang erfaring.","ru":"Я работала во многих ресторанах и кафе, и у меня большой опыт."},{"no":"– Hvorfor vil du starte for deg selv?","ru":"Почему вы хотите открыть свое дело?"},{"no":"– Jeg har lyst på nye utfordringer.","ru":"Я люблю стремиться к новым вершинам."},{"no":"Jeg har mange gode ideer som jeg gjerne vil prøve å gjøre noe med.","ru":"У меня много хороших идей, которые я хотела бы попробовать реализовать."},{"no":"Og det er morsommere å jobbe for seg selv enn for andre.","ru":"И на себя работать интереснее, чем на других."},{"no":"– Hva slags spisested har du tenkt deg?","ru":"Каким вы видите свой ресторан?"},{"no":"– Jeg har tenkt meg et typisk lunsjsted.","ru":"Я думаю, типичное место, где можно пообедать."},{"no":"Folk her i byen går mer og mer ut på kafé i lunsjpausen, og jeg vil gi dem noe nytt.","ru":"Местные жители все чаще ходят обедать в кафе, и я хочу предложить им что-то новенькое."},{"no":"– Hva da?","ru":"Что именно?"},{"no":"– Jeg vil spesialisere meg på teservering.","ru":"Моей «изюминкой» будет чайное обслуживание."},{"no":"Tenk deg: Te fra mange kanter av verden – og så smørbrød og kaker som passer til.","ru":"Представьте себе: чай со всех концов света, а к нему соответствующие бутерброды и пирожные."},{"no":"– Det virker spennende.","ru":"Звучит заманчиво."},{"no":"– Ja, jeg håper jeg klarer det.","ru":"Да, я надеюсь, что у меня получится."},{"no":"Jeg går på AMO-kurs nå for å lære hva jeg må gjøre hvis jeg vil starte for meg selv.","ru":"Сейчас я иду на курсы АМО*, чтобы научиться тому, как открыть свое дело."},{"no":"– Det er vel ikke lett?","ru":"Наверно, это не легко?"},{"no":"– Nei, det ser nokså komplisert ut. Det er så mange lover og regler man må kjenne til.","ru":"Да, выглядит непросто. Надо знать столько законов и постановлений."},{"no":"Men jeg skal klare det! Jeg har bare meg selv å tenke på, så jeg kan jobbe hardt.","ru":"Но я справлюсь! У меня нет других забот, так что я могу с головой уйти в работу."},{"no":"– Lykke til!","ru":"Удачи!"},{"no":"– Takk skal du ha.","ru":"Спасибо."}]},{"id":"25nor","file":"25nor.mp3","title":"I lunsjpausen","sub":"Stein på stein - Leksjon 4","lines":[{"no":"Finn: Nå må jeg slanke meg!","ru":"Финн: Пора бы мне похудеть!"},{"no":"Ove: Å? Har kona begynt å klage?","ru":"Уве: Да? Жена начала жаловаться?"},{"no":"Finn: Litt, og så var jeg hos legen i går.","ru":"Финн: Немного, и еще вчера я был у врача."},{"no":"Ove: Dårlige nyheter?","ru":"Уве: Плохие новости?"},{"no":"Finn: Jeg veier for mye, og blodtrykket er for høyt.","ru":"Финн: Лишний вес и повышенное давление."},{"no":"Ove: Da bør du kanskje spise litt salat til lunsj?","ru":"Уве: Тогда, может, тебе съесть на обед немного салата?"},{"no":"Finn: Jeg har ikke tenkt å bli vegetarianer. Jeg er ikke noen kanin!","ru":"Финн: Я не собираюсь становиться вегетарианцем. Я не кролик!"},{"no":"Ove: Nei, men litt grønnsaker skader ikke. Du bør i det minste kutte ut colaen.","ru":"Уве: Как хочешь, но немного овощей не помешает. По меньшей мере нужно отказаться от кока-колы."},{"no":"Vet du at det er over femti sukkerbiter i ei slik flaske?","ru":"Знаешь, что в одной бутылке колы более 50 кубиков сахара?"},{"no":"Finn: Nå tuller du! Men hva gjør du for å holde deg i form? Går du på helsestudio?","ru":"Финн: Ничего себе! Но как же ты остаешься в форме? Ходишь в спортзал?"},{"no":"Ove: Nei, men jeg går en tur hver dag etter jobben.","ru":"Уве: Нет, но я хожу на прогулку каждый день после работы."},{"no":"Finn: Hjelper det?","ru":"Финн: Помогает?"},{"no":"Ove: Absolutt. En time hver dag hjelper godt.","ru":"Уве: Еще как. Всего час в день - и ты другой человек."},{"no":"Kan du ikke bli med meg? Vi bor jo ikke så langt fra hverandre.","ru":"Не хочешь присоединиться? Мы живем не так далеко друг от друга."},{"no":"Finn: Kanskje det. Da blir i alle fall kona fornøyd.","ru":"Финн: Пожалуй. По крайней мере, жена будет довольна."}]},{"id":"26nor","file":"26nor.mp3","title":"Et møte","sub":"Stein på stein - Leksjon 5","lines":[{"no":"Randi: Har du ikke fått deg pc ennå?","ru":"Ранди: Ты еще не купил себе компьютер?"},{"no":"Stein: Nei, hvorfor det? Jeg klarer meg godt uten.","ru":"Стайн: Нет, зачем? Я прекрасно обхожусь без него."},{"no":"Randi: Jeg er helt avhengig av datamaskinen og av Internett.","ru":"Ранди: А я не могу жить без компьютера и Интернета."},{"no":"Stein: Hva bruker du den til?","ru":"Стайн: Для чего ты его используешь?"},{"no":"Randi: Jeg skriver e-post og betaler regninger. Dessuten finner jeg informasjon om alt som skjer.","ru":"Ранди: Я пишу письма по электронной почте и оплачиваю счета онлайн. К тому же узнаю новости обо всем, что происходит в мире."},{"no":"Stein: Jeg foretrekker å skrive gammeldagse brev på papir. Og jeg synes jeg får vite det jeg trenger på andre måter.","ru":"Стайн: Мне больше по душе старомодные письма на бумаге. И я могу узнать все, что мне нужно, из других источников."},{"no":"Randi: Men på nettet kommer det nyheter hele tida. Og jeg kan slå opp på nettsidene til de fleste store avisene i verden.","ru":"Ранди: Но в интернете новости все время обновляются. Я могу зайти на сайт большинства крупных газет мира."},{"no":"På den måten får jeg mye mer informasjon.","ru":"Так я могу получить намного больше информации."},{"no":"Stein: Det er jo mest dårlige nyheter likevel, og jeg synes jeg får mer enn nok av dem i aviser og på tv.","ru":"Стайн: В любом случае это самые плохие новости. И мне этого с лихвой хватает в газетах и на ТВ."},{"no":"Randi: Jeg kan til og med høre musikk og se film på pc-en min. Det er veldig praktisk.","ru":"Ранди: Я могу и музыку слушать, и фильмы смотреть на компьютере. Это очень удобно."},{"no":"Stein: Nei takk! Det høres ikke noe koselig ut.","ru":"Стайн: Нет уж, спасибо! Ничего удобного тут не вижу."},{"no":"Når jeg hører musikk eller ser på film, vil jeg sitte godt i sofaen og ikke sitte og stirre på en liten datamaskin.","ru":"Когда я слушаю музыку или смотрю фильм, я хочу расслабиться на диване, а не сидеть и пялиться на маленький экран."},{"no":"Jeg klarer meg godt uten.","ru":"Мне и без компьютера неплохо живется."},{"no":"Randi: Det spørs hvor lenge det er mulig. Snart foregår det meste på nettet.","ru":"Ранди: Вопрос в том, как долго это возможно. Скоро все на свете будет в онлайне..."}]},{"id":"27nor","file":"27nor.mp3","title":"Hva slags skole vil vi ha? – 1","sub":"Stein på stein - Leksjon 6","lines":[{"no":"Martin: Jeg synes at den norske skolen er altfor slapp. Elevene kan jo gjøre akkurat hva de vil!","ru":"Мартин: По-моему, в норвежских школах совсем распустили учеников. Они занимаются, чем в голову взбредет!"},{"no":"Anita: Nå overdriver du! De lærer å arbeide selvstendig, og det er viktig.","ru":"Анита: Это уж ты загнул! Просто они учится работать самостоятельно, а это имеет большое значение."},{"no":"Det nytter ikke med gammeldags pugging i våre dager.","ru":"В наши дни старомодная зубрежка уже неактуальна."},{"no":"Martin: Litt mer pugging kan det godt være. Jeg vil at barna mine skal lære så mye som mulig.","ru":"Мартин: Могло бы быть и немного больше зубрежки. Я хочу, чтобы мои дети знали как можно больше."},{"no":"Da må læreren bestemme. Nå har de ikke noen respekt for lærerne.","ru":"И решать должен учитель. Нынче никакого уважения к учителям."},{"no":"Elevene bruker til og med fornavn på læreren!","ru":"Ученики даже обращаются к учителям просто по имени!"},{"no":"Anita: Lærerne synes kanskje at det ikke skal være for mye avstand mellom lærer og elev.","ru":"Анита: Может быть, учителя не хотят держать детей на слишком длинной дистанции."},{"no":"Samarbeid og trygghet er viktig.","ru":"Главное - сотрудничество и безопасность."},{"no":"Martin: Samarbeid og samarbeid! De kaster bort så mye tid!","ru":"Мартин: Сотрудничество, сотрудничество... Только время впустую тратят!"},{"no":"Jeg tror at mange elever vil ha mer disiplin.","ru":"Многих учеников надо бы поучить дисциплине."},{"no":"Det er så mye bråk i klassen at det er vanskelig å lære noe som helst.","ru":"В классе стоит такой гам, что невозможно заниматься."}]},{"id":"28nor","file":"28nor.mp3","title":"Hva slags skole vil vi ha? – 2","sub":"Stein på stein - Leksjon 6","lines":[{"no":"Anita: Synes du ikke at selvstendighet og samarbeid er viktig?","ru":"Анита: Что же плохого в независимости и сотрудничестве?"},{"no":"Jeg tror man lærer mye av å arbeide sammen og diskutere med hverandre.","ru":"Я думаю, поработать вместе и обсудить результаты - это довольно познавательно."},{"no":"Martin: Men hvis man skal lære matematikk og språk, nytter det ikke å diskutere med hverandre.","ru":"Мартин: Но когда учишь математику или язык, тут нечего обсуждать."},{"no":"Da må læreren hjelpe elevene, og elevene må få ro til å arbeide ordentlig med fagene.","ru":"Учитель должен помогать ученикам, а ученики - заниматься в спокойной обстановке."},{"no":"Dessuten må de få karakterer mye tidligere.","ru":"Кроме того, нужно ввести оценки и в более раннем возрасте."},{"no":"Anita: Det er jeg helt uenig i. Karakterer vil bare føre til mer press for elevene.","ru":"Анита: В корне не согласна. Оценки - только лишний стресс для учеников."},{"no":"Martin: Hvis de ikke får karakterer, trenger de jo ikke å arbeide så mye på skolen.","ru":"Мартин: Если им не ставить оценок, у них не будет мотивации учиться усерднее."},{"no":"Det er viktig å vite hvordan det går.","ru":"Важно отслеживать свой прогресс."},{"no":"Hvis de får dårlige karakterer, skjønner elevene at de må begynne å arbeide mer.","ru":"Если ученик получит плохую оценку, он поймет, что ему нужно больше трудиться."},{"no":"Dessuten er det sunt med konkurranse.","ru":"К тому же это здоровая конкуренция."},{"no":"Anita: Jeg tror at karakterer ødelegger. Det er viktig at barna kan gå sammen på skolen uten at de får høre at noen er bedre enn andre.","ru":"Анита: А я считаю, что от оценок дети только пострадают. Важно, чтобы они могли учиться вместе и не слышать, что кто-то лучше других."}]},{"id":"29nor","file":"29nor.mp3","title":"Hvordan var det da du var liten?","sub":"Stein på stein - Leksjon 8","lines":[{"no":"Silje: Bestefar, hadde dere pizza da du var liten?","ru":"Силье: Дедушка, у вас была пицца, когда ты был маленьким?"},{"no":"Bestefar: Nei, og ikke tv heller.","ru":"Дедушка: Нет, и телевизора не было."},{"no":"Silje: Hva gjorde dere da?","ru":"Силье: Чем вы занимались?"},{"no":"Bestefar: Vi hørte på radio, og så lekte vi mye ute i gata.","ru":"Дедушка: Мы слушали радио и много играли на улице."},{"no":"Det var ikke så mange biler den gangen.","ru":"В то время машин на улицах было немного."},{"no":"Silje: Var det ikke litt kjedelig?","ru":"Силье: Разве это не скучно?"},{"no":"Bestefar: Nei, det var ikke kjedelig, men det var ei mye roligere tid.","ru":"Дедушка: Нет, нам было не скучно, но тогда жизнь была гораздо спокойнее."},{"no":"Folk hadde tid til å stoppe og prate sammen, og til å stikke innom på en kopp kaffe om kvelden.","ru":"Люди успевали остановиться и поговорить, и пригласить друг друга на чашку кофе вечерком."},{"no":"Alle har det så travelt i dag.","ru":"А нынче все такие занятые."},{"no":"Silje: Det samme sier oldemor, enda hun hadde fem barn og verken vaskemaskin eller ferdigmat i fryseren.","ru":"Силье: Бабушка тоже так говорит. А ведь у нее было пятеро детей и не было ни стиральной машины, ни мороженых полуфабрикатов."},{"no":"Er ikke det litt - litt ulogisk?","ru":"Тебе не кажется, что это немного... нелогично?"},{"no":"Bestefar: Jo, og kanskje er jeg romantisk når jeg snakker om barndommen. Men det er slik jeg husker den.","ru":"Дедушка: Ну, может быть, я слишком романтичен, когда говорю о детстве. Но я помню свое детство именно таким."},{"no":"Silje: Jeg har lyst til å snakke mer med oldemor om dette.","ru":"Силье: Я хочу еще поговорить об этом с бабушкой."},{"no":"Bestefar: Gjør det, men da bør du ha god tid. Oldemor elsker å snakke om gamle dager.","ru":"Дедушка: Поговори, только сначала убедись, что ты никуда не торопишься. Бабушка любит поговорить о былых временах."}]},{"id":"30nor","file":"30nor.mp3","title":"På norskkurs","sub":"Stein på stein - Leksjon 9","lines":[{"no":"Maryam: Å, du er så flink i norsk! Hvordan klarer du det?","ru":"Марьям: О, ты так хорошо успеваешь по норвежскому! Как тебе это удается?"},{"no":"Usman: Kona mi hjelper meg. Hun har gått på skolen her i landet og kan mye norsk.","ru":"Усман: Жена мне помогает. Она училась в норвежской школе и очень хорошо знает язык."},{"no":"Maryam: Du er heldig som kan få hjelp. Hvor lenge har du vært her nå?","ru":"Марьям: Повезло тебе, что есть такой помощник. Как давно ты здесь?"},{"no":"Usman: Snart ett år. Jeg håper at jeg kan lære nok norsk til at jeg kan begynne å arbeide til neste år.","ru":"Усман: Скоро год. Я надеюсь, что смогу достаточно освоить норвежский, чтобы начать работать в следующем году."},{"no":"Hvor lenge har du bodd her?","ru":"Как долго ты живешь здесь?"},{"no":"Maryam: Nesten to år. Først bodde jeg litt over et år på asylmottak med barna mine.","ru":"Марьям: Почти два года. Чуть больше года мы с детьми жили в приюте для беженцев."},{"no":"Så flyttet vi hit. Nå har vi bodd her i åtte måneder.","ru":"Потом переехали сюда и живем здесь уже восемь месяцев."},{"no":"Men jeg lærte ikke mye norsk før jeg kom på dette kurset.","ru":"Но я не очень преуспела в норвежском, пока не пошла на эти курсы."},{"no":"Usman: Trives du?","ru":"Усман: Тебе хорошо живется?"},{"no":"Maryam: Jeg er veldig glad for å være i trygghet. Barna mine har det godt og trives på skolen.","ru":"Марьям: Я очень рада, что нахожусь в безопасности. Моим детям тут нравится, и они любят ходить в школу."},{"no":"Men jeg synes ikke det er så lett å finne seg til rette. Det er så mye som er annerledes enn hjemme.","ru":"Но не так просто адаптироваться к здешней жизни. Дома все было совсем по-другому."},{"no":"Usman: Lengter du hjem?","ru":"Усман: Ты скучаешь по дому?"},{"no":"Maryam: Nå er situasjonen hjemme så vanskelig at det er umulig for meg å bo der.","ru":"Марьям: Сейчас обстановка на родине так накалилась, что оставаться там невозможно."},{"no":"Men hvis det blir fred, vil jeg helst reise tilbake. Hva med deg? Lengter du hjem?","ru":"Но если настанет мир, я хотела бы вернуться. А как ты? Скучаешь по дому?"},{"no":"Usman: Ja, jeg lengter ofte etter familie og venner. Men kona mi har stor familie her, og jeg har fått noen nye venner.","ru":"Усман: Да, я часто скучаю по семье и друзьям. Но у моей жены здесь большая семья, и у меня появились новые друзья."},{"no":"Søndag var jeg til og med på skitur! Jeg klarte å holde meg på beina.","ru":"В воскресенье я даже ходил с ними на лыжную прогулку. Мне удалось удержаться на ногах."},{"no":"Maryam: Jeg er glad hvis jeg klarer å uttale «skitur»!","ru":"Марьям: А мне бы только суметь выговорить \"лыжная прогулка\"!"}]}];

const COURSES = [
  { id:'a1',  title:'Норвежский A1–A2', sub:'Грамматика, лексика, числа', L:null, W:null, cover:'a1' },
  { id:'dlg', title:'Диалоги на слух',  sub:'Аудио с расшифровкой',       audio:true, cover:'dlg' }
];
let ci = 0;

function applyTheme(){
  const light = meta.theme === 'light';
  try{
    document.body.className = light ? 'light' : '';
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', light ? '#f4f5f7' : '#000001');
  }catch(e){}
}
function toggleTheme(){
  meta.theme = meta.theme === 'light' ? 'dark' : 'light';
  saveMeta();
  applyTheme();
  buzz('ok');
  if(screen==='courses') renderCourses();
  else if(screen==='lessons') renderLessons();
}

function restoreCourse(){
  const i = meta.course || 0;
  if(COURSES[i] && !COURSES[i].soon){ ci = i; LESSONS = COURSES[i].L; WORDS = COURSES[i].W; }
}

function resumeLast(){
  const m = meta.last;
  if(!m) return;
  const cIdx = m.c || 0;
  if(!COURSES[cIdx] || COURSES[cIdx].soon) return;
  ci = cIdx; LESSONS = COURSES[cIdx].L; WORDS = COURSES[cIdx].W;
  meta.course = cIdx; saveMeta();
  if(!lessonUnlocked(m.l)){ renderLessons(); return; }
  if(partPassed(m.l, m.p) || !partUnlocked(m.l, m.p)){
    startNextPart(m.l); return;
  }
  startPart(m.l, m.p);
}

function openCourse(i){
  if(COURSES[i].soon) return;
  if(COURSES[i].audio){ ci = i; meta.course = i; saveMeta(); renderDialogs(); return; }
  ci = i;
  LESSONS = COURSES[i].L;
  WORDS = COURSES[i].W;
  meta.course = i; saveMeta();
  renderLessons();
}

function courseStats(i){
  const c = COURSES[i];
  if(c.soon) return {pct:0, done:0, total:0};
  if(c.audio){
    let done = 0;
    for(const d of DIALOGS){ if(dlgDone(d.id)) done++; }
    return { pct: DIALOGS.length ? Math.round(done/DIALOGS.length*100) : 0, done: done, total: DIALOGS.length };
  }
  const sl = ci, sL = LESSONS, sW = WORDS;
  ci = i; LESSONS = c.L; WORDS = c.W;
  let solved = 0, total = 0;
  for(let l=0;l<LESSONS.length;l++){ solved += lessonSolved(l); total += lessonTotal(l); }
  const done = lessonsDoneCount();
  ci = sl; LESSONS = sL; WORDS = sW;
  return { pct: total ? Math.round(solved/total*100) : 0, done: done, total: c.L.length };
}

function srsDueAll(){
  const t = dnum(); const byC = {};
  for(const k in (meta.srs||{})){
    if(meta.srs[k].d > t) continue;
    const a = k.split(':');
    const cid = a[0].indexOf('_')>=0 ? a[0].split('_')[0] : COURSES[0].id;
    byC[cid] = (byC[cid]||0) + 1;
  }
  return byC;
}

function openSrsAll(){
  const due = srsDueAll();
  for(let i=0;i<COURSES.length;i++){
    if(due[COURSES[i].id]){
      ci = i; LESSONS = COURSES[i].L; WORDS = COURSES[i].W;
      meta.course = i; saveMeta();
      startWordsReview(); return;
    }
  }
}

const RING_INFO = {
  p: { t:'Кольцо фраз закрыто!', d:'Дневная норма фраз выполнена', ic:'check' },
  a: { t:'Кольцо аудио закрыто!', d:'Ты дослушал дневную норму диалогов', ic:'head' },
  w: { t:'Кольцо слов закрыто!', d:'Карточки на сегодня разобраны', ic:'cards' }
};

function ringState(){
  const t = dstr(0);
  if(!meta.rings || meta.rings.day !== t) meta.rings = { day:t, p:0, a:0, w:0, all:0 };
  return meta.rings;
}
function ringPcts(){
  return {
    p: DAILY_GOAL ? todayCount()/DAILY_GOAL : 1,
    a: LISTEN_GOAL ? listenToday()/LISTEN_GOAL : 1,
    w: (dayLog().w||0)/10
  };
}

function checkRings(){
  const st = ringState();
  const pc = ringPcts();
  const justClosed = [];
  for(const k of ['p','a','w']){
    if(!st[k] && pc[k] >= 1){ st[k] = 1; justClosed.push(k); }
  }
  const allNow = st.p && st.a && st.w;
  if(allNow && !st.all){
    st.all = 1; saveMeta();
    setTimeout(allRingsWin, 420);
    return;
  }
  if(justClosed.length){
    saveMeta();
    ringToast(justClosed[0]);
  }
}

function ringToast(k){
  const info = RING_INFO[k];
  if(!info) return;
  const old = document.getElementById('toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.id = 'toast';
  el.innerHTML = '<div class="toast-ring">' + miniRing(k, 40) + '<div class="toast-chk">' + ic('check',15) + '</div></div>' +
    '<div class="toast-tx"><div class="toast-t">' + info.t + '</div><div class="toast-d">' + info.d + '</div></div>';
  document.body.appendChild(el);
  buzz('win');
  setTimeout(animateRings, 40);
  setTimeout(function(){ const t = document.getElementById('toast'); if(t) t.className = 'toast out'; }, 3000);
  setTimeout(function(){ const t = document.getElementById('toast'); if(t) t.remove(); }, 3500);
}

function allRingsWin(){
  const old = document.getElementById('allwin');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'allwin';
  el.id = 'allwin';
  el.innerHTML = '<canvas id="fw2"></canvas>' +
    '<div class="aw-box">' +

function K(l){ return (ci===0 ? '' : COURSES[ci].id + '_') + 'l' + l; }
function partSize(l,p){ return LESSONS[l].parts[p].q.length; }
function lessonTotal(l){ let s=0; for(let p=0;p<PARTS;p++) s += partSize(l,p); return s; }
function partProgress(l,p){ return Math.min((progress[K(l)]||{})['p'+p]||0, partSize(l,p)); }
function setPartProgress(l,p,v){
  if(!progress[K(l)]) progress[K(l)] = {};
  const k = 'p'+p;
  if(v > (progress[K(l)][k]||0)){ progress[K(l)][k] = v; saveProgress(); }
}
function partDone(l,p){ return partProgress(l,p) >= partSize(l,p); }
function lessonSolved(l){ let s=0; for(let p=0;p<PARTS;p++) s += partProgress(l,p); return s; }
function examScore(l){ return (progress[K(l)]||{}).e || 0; }
function setExamScore(l,pct){ if(!progress[K(l)]) progress[K(l)]={}; if(pct > (progress[K(l)].e||0)){ progress[K(l)].e = pct; saveProgress(); } }
const PART_PASS = 90;   // % верных ответов в блоке для допуска к следующему
const EXAM_N = 20, EXAM_PASS = 100;
function partAcc(l,p){
  const rec = progress[K(l)] || {};
  if(rec['a'+p] !== undefined) return rec['a'+p];
  return partDone(l,p) ? PART_PASS : 0;   // пройден до введения точности — зачёт
}
function setPartAcc(l,p,pct){ if(!progress[K(l)]) progress[K(l)]={}; const k='a'+p; if(pct > (progress[K(l)][k]||0)){ progress[K(l)][k]=pct; saveProgress(); } }
function partPassed(l,p){ return partAcc(l,p) >= PART_PASS; }
function partUnlocked(l,p){ return p===0 || partPassed(l,p-1); }
function examUnlocked(l){ for(let p=0;p<PARTS;p++){ if(!partPassed(l,p)) return false; } return true; }   // порог сдачи экзамена, %
const EXPIRE_DAYS = 14;               // через сколько дней урок «остывает»
function touchLesson(l){ if(!progress[K(l)]) progress[K(l)]={}; progress[K(l)].ts = dnum(); saveProgress(); }
function lessonAge(l){ const ts=(progress[K(l)]||{}).ts; return ts===undefined ? null : dnum()-ts; }
function examPassed(l){ return examScore(l) >= EXAM_PASS; }
function everPassed(l){ return !!(progress[K(l)]||{}).ok; }
function isExpired(l){ const a=lessonAge(l); return everPassed(l) && a!==null && a >= EXPIRE_DAYS; }
function lessonUnlocked(l){ return l===0 || everPassed(l-1); }
function expiredList(){ const out=[]; for(let i=0;i<LESSONS.length;i++) if(isExpired(i)) out.push(i); return out; }
function lessonDone(l){ return examPassed(l) && !isExpired(l); }
function lessonsDoneCount(){ let c=0; for(let i=0;i<LESSONS.length;i++){ if(lessonDone(i)) c++; } return c; }
function totalPhrases(){ let s=0; for(let i=0;i<LESSONS.length;i++) s += lessonTotal(i); return s; }
function totalSolved(){ let s=0; for(let i=0;i<LESSONS.length;i++) s += lessonSolved(i); return s; }

  if(meta.lday!==t){ meta.lday = t; meta.lsec = 0; }
  meta.lsec = (meta.lsec||0) + sec;
  logAdd('a', sec);
  saveMeta();
  checkRings();
}
function todayCount(){ return meta.day===dstr(0) ? (meta.dayCount||0) : 0; }
function streakCount(){ return (meta.day===dstr(0)||meta.day===dstr(-1)) ? (meta.streak||0) : 0; }
function bumpDaily(){
  const t = dstr(0);
  if(meta.day!==t){
    meta.streak = (meta.day===dstr(-1)) ? (meta.streak||0)+1 : 1;
    meta.day = t; meta.dayCount = 0;
  }
  meta.dayCount = (meta.dayCount||0)+1;
  logAdd('p', 1);
  checkRings();
  if(!meta.hist) meta.hist = [];
  if(meta.hist.indexOf(t)<0){ meta.hist.push(t); if(meta.hist.length>400) meta.hist.shift(); }
  saveMeta();
}
function addMistake(q){
  if(meta.mistakes.some(m=>m.no===q.no)) return;
  meta.mistakes.push({ru:q.ru,no:q.no,type:q.type});
  if(meta.mistakes.length>50) meta.mistakes.shift();
  saveMeta();
}
function removeMistake(no){ meta.mistakes = meta.mistakes.filter(m=>m.no!==no); saveMeta(); }
function dnum(){ return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5); }
const SRS_INT = [1,3,7,14,30];
function srsPromote(l,wi){
  if(!meta.srs) meta.srs = {};
  const k = (ci===0?'':COURSES[ci].id+'_') + l + ':' + wi;
  const cur = meta.srs[k]||{s:0};
  const s = Math.min(cur.s+1, SRS_INT.length);
  meta.srs[k] = {s:s, d:dnum()+SRS_INT[s-1]};
  saveMeta();
}
function srsReset(l,wi){ if(!meta.srs) meta.srs = {}; meta.srs[(ci===0?'':COURSES[ci].id+'_')+l+':'+wi] = {s:0, d:dnum()}; saveMeta(); }
function srsDue(){
  const out = []; const t = dnum();
  for(const k in (meta.srs||{})){
    if(meta.srs[k].d <= t){
      const a = k.split(':');
      const cid = a[0].indexOf('_')>=0 ? a[0].split('_')[0] : COURSES[0].id;
      if(cid !== COURSES[ci].id) continue;
      out.push({l:+a[0].replace(/^.*_/,''), wi:+a[1]});
    }
  }
  return out;
}
function dayWord(n){ if(meta.lang==='ru'||meta.lang===undefined||meta.lang==='uk'){ const m=n%10,h=n%100; if(h>=11&&h<=14) return t('days5'); if(m===1) return t('days1'); if(m>=2&&m<=4) return t('days2'); return t('days5'); } return n===1 ? t('days1') : t('days5'); }

function wordsTotal(l){ return WORDS[l].length; }
function wordsKnown(l){ return (progress[K(l)]||{}).w || []; }
function logWord(){ logAdd('w', 1); checkRings(); }
function addKnownWord(l,wi){
  if(!progress[K(l)]) progress[K(l)] = {};
  if(!progress[K(l)].w) progress[K(l)].w = [];
  if(progress[K(l)].w.indexOf(wi)===-1){ progress[K(l)].w.push(wi); saveProgress(); logWord(); }
}
function weekDays(){
  const out = [];
  const now = new Date();
  const shift = (now.getDay()+6)%7;            // 0 = понедельник
  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(now.getDate() - shift + i);
    out.push(d);
  }
  return out;
}
function isFuture(d){ const t = new Date(); t.setHours(23,59,59,999); return d > t; }
function daysBack(n){
  const out = [];
  for(let i=n-1;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); out.push(d); }
  return out;
}
function sumRange(days, field){ let s=0; for(const d of days) s += logOf(d)[field]||0; return s; }
function activeDays(days){ let c=0; for(const d of days){ const l=logOf(d); if(l.p||l.a||l.w) c++; } return c; }
function bestWeek(){
  let best = 0;
  for(let w=0; w<26; w++){
    let s = 0;
    for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-(w*7+i)); s += logOf(d).p||0; }
    if(s>best) best = s;
  }
  return best;
}
function ringArc(pct,size,stroke,color,offsetR,idx){
  const r = (size-stroke)/2 - (offsetR||0);
  const c = 2*Math.PI*r;
  const off = c*(1-Math.min(pct,100)/100);
  const done = pct >= 100;
  return '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '" opacity="0.55"/>' +
    '<circle class="ring-arc' + (done?' done':'') + '" style="animation-delay:' + ((idx||0)*0.12) + 's" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '" data-off="' + off + '" data-delay="' + ((idx||0)*0.12) + '"/>';
}

function miniRing(k, size){
  const col = k==='p' ? '#ffffff' : k==='a' ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.3)';
  const stroke = 5;
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '" opacity="0.55"/>' +
    '<circle class="ring-arc done" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '" data-off="0" data-delay="0.1"/>' +
  '</svg>';
}

function animateRings(){
  const arcs = document.querySelectorAll ? document.querySelectorAll('.ring-arc') : null;
  if(!arcs) return;
  for(let i=0;i<arcs.length;i++){
    (function(el){
      const off = el.getAttribute('data-off');
      const d = parseFloat(el.getAttribute('data-delay')||0) * 1000;
      setTimeout(function(){ el.style.strokeDashoffset = off; }, 60 + d);
    })(arcs[i]);
  }
}
function trioRings(size){
  const pPct = Math.round(Math.min(todayCount(),DAILY_GOAL)/DAILY_GOAL*100);
  const aPct = LISTEN_GOAL ? Math.round(Math.min(listenToday(),LISTEN_GOAL)/LISTEN_GOAL*100) : 0;
  const wGoal = 10;
  const wPct = Math.round(Math.min(dayLog().w||0, wGoal)/wGoal*100);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
    ringArc(pPct,size,11,'#ffffff',0,0) +
    ringArc(aPct,size,11,'rgba(255,255,255,0.55)',15,1) +
    ringArc(wPct,size,11,'rgba(255,255,255,0.3)',30,2) +
  '</svg>';
}
function ringSVG(pct,size,stroke,color){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c*(1-Math.min(pct,100)/100);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + (color||'#ffffff') + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/>' +
  '</svg>';
}

function wordsAllKnown(){ let s=0; for(let i=0;i<WORDS.length;i++) s += Math.min(wordsKnown(i).length, WORDS[i].length); return s; }

// ─── LESSON DETAIL PAGE ───
function partLockHint(p){
  alert('Блок ' + (p+1) + ' закрыт.\n\nСначала сдай предыдущий блок с точностью ' + PART_PASS + '% — это примерно одна ошибка на 25 фраз.');
}
function examLockHint(){
  alert('Экзамен закрыт.\n\nСначала сдай все три блока урока с точностью ' + PART_PASS + '%.');
}
function lockedHint(i){
  alert('Урок ' + (i+1) + ' закрыт.\n\nЧтобы открыть его, сдай экзамен урока ' + i + ' на ' + EXAM_PASS + '% — без единой ошибки.');
}

function renderLesson(i){
  screen = "lesson";
  currentLessonIdx = i;
  const l = LESSONS[i];
  const total = lessonTotal(i);
  const solved = lessonSolved(i);

  const wt = wordsTotal(i);
  const wk = Math.min(wordsKnown(i).length, wt);
  const wpct = Math.round(wk/wt*100);
  const wfull = wk >= wt;
  const wordsCard =
    '<div class="block-card' + (wfull?' full':'') + '" onclick="startWords(' + i + ')">' +
      '<div class="block-num">' + ic('book',17) + '</div>' +
      '<div class="block-title">' + t('w_card') + (wfull?t('w_learned'):'') + '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + wpct + '%"></div></div>' +
        '<div class="lesson-mini-pct"' + '' + '>' + wpct + '%</div>' +
      '</div>' +
    '</div>';

  const blocks = l.parts.map((p,pi) => {
    const sz = p.q.length;
    const pd = partProgress(i,pi);
    const acc = partAcc(i,pi);
    const pct = acc;
    const passed = partPassed(i,pi);
    const full = passed;
    const open = partUnlocked(i,pi);
    return '<div class="block-card' + (full?' full':'') + (open?'':' locked') + '" onclick="' + (open ? 'startPart(' + i + ',' + pi + ')' : 'partLockHint(' + pi + ')') + '">' +
      '<div class="block-num">' + (passed?ic('check',16):open?(pi+1):ic('lock',16)) + '</div>' +
      '<div class="block-title">' + p.t + (open ? '' : ' · закрыт') + '</div>' +
      '<div class="lesson-mini">' +
        '<div class="lesson-mini-bar"><div class="lesson-mini-fill" style="width:' + pct + '%"' + (full?' ':'') + '></div></div>' +
        '<div class="lesson-mini-pct"' + '' + '>' + pct + '%</div>' +
      '</div>' +
    '</div>';
  }).join("");

  let continueBtn = '';
  if(solved >= total){
    continueBtn = '<button class="continue-btn" onclick="startPart(' + i + ',0)">' + t('repeat_l') + '</button>';
  } else {
    let np = 0;
    for(let p=0;p<PARTS;p++){ if(!partPassed(i,p) && partUnlocked(i,p)){ np = p; break; } }
    continueBtn = '<button class="continue-btn" onclick="startPart(' + i + ',' + np + ')">' + (solved>0?t('cont_b') + ' «' + l.parts[np].t + '»':t('start_l')) + '</button>';
  }

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<div class="logo" onclick="renderCourses()">Ro!</div>' +
      '<div class="header-right"><button class="back-btn" onclick="renderLessons()">' + t('back_ls') + '</button></div>' +
    '</div>' +
    '<div class="detail-label">' + t('lesson') + ' ' + (i+1) + ' ' + t('l_of') + ' ' + LESSONS.length + '</div>' +
    '<div class="detail-title">' + l.title + '</div>' +
    '<div class="detail-sub">' + l.sub + '</div>' +
    '<div class="detail-count">' + t('phr_done') + ' ' + solved + ' ' + t('of') + ' ' + total + ' ' + t('phrases') + '</div>' +
    continueBtn +
    (function(){
      const es = examScore(i);
      const passed = es >= EXAM_PASS;
      const exOpen = examUnlocked(i);
      return '<div class="block-list">' +
        '<div class="section-label">' + t('sec1') + '</div>' +
        wordsCard +
        '<div class="section-label">' + t('sec2') + '</div>' +
        blocks +
        '<div class="section-label">' + t('sec3') + '</div>' +
        '<div class="block-card exam-card' + (passed?' full':'') + (exOpen?'':' locked') + '" onclick="' + (exOpen ? 'startExam(' + i + ')' : 'examLockHint()') + '">' +
          '<div class="block-num">' + (exOpen?ic('cap',17):ic('lock',17)) + '</div>' +
          '<div class="block-title">' + t('exam') + (!exOpen ? ' · сдай три блока на ' + PART_PASS + '%' : passed ? (isExpired(i) ? ' — остыл, пересдай' : t('exam_ok')) : ' · ' + EXAM_N + ' вопросов, нужно 100%') + '</div>' +
          (es > 0 ? '<div class="lesson-mini-pct"' + '' + '>' + es + '%</div>' : '') +
        '</div>' +
      '</div>';
    })();
}

function startNextPart(i){
  for(let p=0;p<PARTS;p++){
    if(!partPassed(i,p) && partUnlocked(i,p)){ startPart(i,p); return; }
  }
  renderLesson(i);
}

function startPart(i,p){
  if(!partUnlocked(i,p)){ partLockHint(p); return; }
  currentLessonIdx = i;
  currentPartIdx = p;
  screen = "exercise";
  state.review = false;
  state.exam = false;
  state.ai = false;
  meta.last = {c:ci, l:i, p:p}; saveMeta();
  state.questions = shuffle(LESSONS[i].parts[p].q);
  state.idx = 0;
  state.phase = "answering";
  state.feedback = null;
  state.selected = [];
  state.textVal = "";
  state.score = 0;
  state.correctCount = 0;
  state.retryUsed = false;
  state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

function startMistakes(){
  if(meta.mistakes.length===0){ renderCourses(); return; }
  screen = "exercise";
  state.review = true;
  state.exam = false;
  state.ai = false;
  state.questions = shuffle(meta.mistakes.slice());
  state.idx = 0; state.phase = "answering"; state.feedback = null;
  state.selected = []; state.textVal = "";
  state.score = 0; state.correctCount = 0;
  state.retryUsed = false; state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

function startExam(i){
  if(!examUnlocked(i)){ examLockHint(); return; }
  currentLessonIdx = i;
  screen = "exercise";
  state.exam = true;
  state.review = false;
  state.ai = false;
  let all = [];
  LESSONS[i].parts.forEach(p => all = all.concat(p.q));
  state.questions = shuffle(all).slice(0, EXAM_N);
  state.idx = 0; state.phase = "answering"; state.feedback = null;
  state.selected = []; state.textVal = "";
  state.score = 0; state.correctCount = 0;
  state.retryUsed = false; state.retryMode = false;
  state.pool = makePool(state.questions[0].no);
  render();
}

}

// ─── ACTIONS ──────────────────────────────────────────
function addWord(i){
  if(state.phase!=="answering")return;
  const w=state.pool[i];
  state.selected=[...state.selected,w];
  state.pool=state.pool.filter((_,j)=>j!==i);
  render();
}
function removeWord(i){
  if(state.phase!=="answering")return;
  const w=state.selected[i];
  state.pool=shuffle([...state.pool,w]);
  state.selected=state.selected.filter((_,j)=>j!==i);
  render();
}
function onTextInput(v){ state.textVal=v; }

function switchMode(m){
  state.mode=m;state.phase="answering";state.feedback=null;
  state.selected=[];state.textVal="";
  state.retryUsed=false;state.retryMode=false;
  state.pool=makePool(state.questions[state.idx].no);
  render();
  if(m==="listen") setTimeout(()=>speak(state.questions[state.idx].no), 250);
}

function doSubmit(){
  if(state.phase==="revealed"){ advance(); return; }

  const userAnswer = state.mode==="text"
    ? state.textVal.trim()
    : state.selected.join(" ");

  if(!userAnswer) return;
  state.lastAnswer = userAnswer;
  const correct = state.questions[state.idx].no;

  if(isCorrect(userAnswer,correct)){
    if(!state.retryMode){ state.score++; }
    state.correctCount += state.retryMode ? 0 : 1;
    state.feedback={type:"ok"};
    buzz("ok");
    if(state.review) removeMistake(correct);
  } else {
    if(!state.retryMode && !state.review) addMistake(state.questions[state.idx]);
    const diff = diffAnswers(userAnswer,correct);
    const dg = diagnose(userAnswer,correct);
    state.feedback = (dg && dg.order)
      ? {type:"v2",diag:dg,diff}
      : {type:"err",diag:dg,diff};
    buzz("err");
    setTimeout(()=>{
      const c = document.getElementById("q-card");
      if(c){ c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"),450); }
    },10);
  }
  state.phase="revealed";
  render();
}

function doRetry(){
  state.retryUsed = true;
  state.retryMode = true;
  state.phase = "answering";
  state.feedback = null;
  state.selected = [];
  state.textVal = "";
  state.pool = makePool(state.questions[state.idx].no);
  render();
}

function advance(){
  const next=state.idx+1;
  bumpDaily();
  if(!state.review && !state.exam && !state.ai) setPartProgress(currentLessonIdx, currentPartIdx, next);
  if(!state.review && !state.ai) touchLesson(currentLessonIdx);
  if(next>=state.questions.length){state.phase="done";render();return;}
  state.idx=next;state.phase="answering";state.feedback=null;
  state.selected=[];state.textVal="";
  state.retryUsed=false;state.retryMode=false;
  state.pool=makePool(state.questions[next].no);
  render();
}

function schedRule(){
  const s = sched();
  if(s.days.length===0){ alert(t('pick_days')); return null; }
  const BY = ['MO','TU','WE','TH','FR','SA','SU'];
  const hm = (s.time||'19:00').split(':');
  const now = new Date();
  let st = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +hm[0], +hm[1]);
  while(s.days.indexOf((st.getDay()+6)%7)<0 || st < now) st = new Date(st.getTime()+864e5);
  const p = n => (n<10?'0':'')+n;
  const fmt = d => d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  return { start: fmt(st), end: fmt(new Date(st.getTime()+20*60000)), by: s.days.map(d=>BY[d]).join(',') };
}

// ─── СИНХРОНИЗАЦИЯ ТЕКСТА С АУДИО ───
let calib = false;

function dlgTimes(d, dur){
  // ручная калибровка пользователя имеет приоритет
  const saved = (meta.sync||{})[d.id];
  if(saved && saved.length === d.lines.length) return saved;
  const base = d.lines.map(function(l){ return l.t; });
  if(base.some(function(t){ return t === undefined; })) return null;
  // масштабируем разметку под реальную длительность файла
  const last = base[base.length-1];
  if(!dur || !last || dur <= last + 1) return base;
  const k = (dur - 1.5) / last;
  if(k < 1.05 && k > 0.95) return base;
  return base.map(function(t){ return t * k; });
}

function bindAudio(){
  AU = document.getElementById('au');
  if(!AU) return;
  AU.loop = !!meta.loop;
  AU.addEventListener('loadedmetadata', function(){
    const dd = document.getElementById('pl-dur');
    if(dd) dd.textContent = mmss(AU.duration);
  });
  AU.addEventListener('timeupdate', function(){
    const d = DIALOGS[curDlg];
    const cur = AU.currentTime, dur = AU.duration || 1;
    const f = document.getElementById('pl-fill'), c = document.getElementById('pl-cur');
    if(f) f.style.width = (cur/dur*100) + '%';
    if(c) c.textContent = mmss(cur);
    // подсветка текущей реплики
    const T = dlgTimes(d, AU.duration);
    let act = -1;
    if(T){ for(let i=0;i<T.length;i++){ if(cur >= T[i]) act = i; } }
    for(let i=0;i<d.lines.length;i++){
      const el = document.getElementById('dl-' + i);
      if(el) el.className = 'dl-line' + (i===act ? ' active' : '');
    }
    // учёт прослушанного
    tickAcc += 0.25;
    if(tickAcc >= 5){
      const add = Math.round(tickAcc);
      tickAcc = 0;
      addListen(add);
      const s = dlgStat(d.id);
      dlgSave(d.id, { sec: (s.sec||0) + add, max: Math.max(s.max||0, cur/dur) });
      const chip = document.getElementById('dlg-chip');
      if(chip) chip.textContent = ((s.sec||0) + add)/3600 > 0 ? (((s.sec||0)+add)/3600).toFixed(1) + ' / ' + DLG_HOURS + ' ч' : '0 / ' + DLG_HOURS + ' ч';
    }
  });
  AU.addEventListener('ended', function(){
    const d = DIALOGS[curDlg];
    dlgSave(d.id, { max: 1 });
    if(dlgDone(d.id)) buzz('win');
    const p = document.getElementById('pl-play');
    if(p) p.innerHTML = ic('sound',22);
  });
}

const AI_ERR = {
  ru:{ quota:'Дневной лимит бесплатных запросов к ИИ исчерпан. Попробуй завтра — разбор ошибок и подсказки в уроках работают без ИИ.',
       key:'Ключ доступа к ИИ не принимается. Нужно обновить его в настройках Worker.',
       model:'Модель ИИ недоступна. Нужно обновить Worker.',
       net:'Нет связи с ИИ. Проверь интернет и попробуй ещё раз.',
       other:'ИИ сейчас не отвечает. Попробуй чуть позже.' },
  en:{ quota:'The free daily AI quota is used up. Try again tomorrow — mistake analysis and lesson hints work without AI.',
       key:'The AI access key is not accepted. It needs updating in the Worker settings.',
       model:'The AI model is unavailable. The Worker needs updating.',
       net:'No connection to the AI. Check your internet and try again.',
       other:'The AI is not responding right now. Try again a bit later.' }
};
function aiErrText(reason){
  const d = (meta.lang && meta.lang!=='ru' && AI_ERR[meta.lang]) ? AI_ERR[meta.lang] : (meta.lang && meta.lang!=='ru' ? AI_ERR.en : AI_ERR.ru);
  return d[reason] || d.other;
}
async function aiAsk(prompt, json){
  let res;
  try{
    res = await fetch(AI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, json: !!json })
    });
  }catch(e){ throw new Error(aiErrText('net')); }
  if(!res.ok){
    let reason = 'other';
    try{ const j = await res.json(); if(j && j.reason) reason = j.reason; }catch(e){}
    throw new Error(aiErrText(reason));
  }
  const data = await res.json();
  const txt = (data.text || '').trim();
  if(!txt) throw new Error(aiErrText('other'));
  try{
    return json ? JSON.parse(txt.replace(/^```json|```$/g,'').trim()) : txt;
  }catch(e){ throw new Error(aiErrText('other')); }
}
