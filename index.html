<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ro! — Норвежский тренажёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#0c0c0c;--paper:#131313;--ink:#f5f5f5;--ink2:#a3a3a3;--ink3:#666;
  --r1:#ffffff;--r2:rgba(255,255,255,0.58);--r3:rgba(255,255,255,0.40);--rtrack:rgba(255,255,255,0.10);--rdone:rgba(255,255,255,0.15);--rglow:rgba(255,255,255,0.50);
  --line:#232325;--blue:#7aa2f7;--blue-light:#16213a;--green:#4ade80;
  --green-light:#0d2818;--red:#f87171;--red-light:#2d1414;
  --amber:#fbbf24;--amber-light:#2b2210;
  
  --grad:#ffffff;
  --grad-soft:rgba(255,255,255,0.06);
  --acc1:#ffffff;--acc2:#ffffff;--acc3:#FFFFFF;
  --grad:#ffffff;
  --grad-soft:rgba(255,255,255,0.06);
}
body{font-family:'Manrope',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{touch-action:manipulation}

/* ─── тур по интерфейсу ─── */
.tour-mask{position:fixed;inset:0;z-index:60}
.tour-hole{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,0.78);border:1.5px solid rgba(255,255,255,0.5);transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none}
.tour-tip{position:absolute;left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));
  background:linear-gradient(160deg,rgba(38,38,38,0.96),rgba(22,22,22,0.96));backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:1rem 1.15rem 1.1rem;
  box-shadow:0 12px 40px rgba(0,0,0,0.5);transition:top .3s cubic-bezier(.4,0,.2,1)}
.tour-step{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.tour-title{font-size:16.5px;font-weight:700;letter-spacing:-0.2px;margin-bottom:5px}
.tour-text{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.tour-nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.tour-next{flex:1;background:#fff;color:#000001;border:none;border-radius:13px;padding:11px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.tour-skip{background:none;border:none;color:var(--ink3);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:11px 4px}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.amb{position:absolute;border-radius:50%;filter:blur(120px)}
.amb.a1{width:70vw;height:70vw;min-width:420px;min-height:420px;top:-25%;right:-20%;background:radial-gradient(circle,rgba(122,162,247,0.20),transparent 70%)}
.amb.a2{width:60vw;height:60vw;min-width:360px;min-height:360px;bottom:-20%;left:-18%;background:radial-gradient(circle,rgba(248,113,113,0.14),transparent 70%)}

/* ─── матовое стекло ─── */
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,0.10);
  box-shadow:0 1px 0 rgba(255,255,255,0.09) inset, 0 8px 28px rgba(0,0,0,0.35);
}
.app{max-width:700px;margin:0 auto;padding-bottom:calc(5.5rem + max(env(safe-area-inset-bottom),var(--tg-bottom,0px)));padding-left:max(1rem,env(safe-area-inset-left),var(--tg-left,0px));padding-right:max(1rem,env(safe-area-inset-right),var(--tg-right,0px));padding-top:max(env(safe-area-inset-top),var(--tg-top,0px))}
.header{padding:1.25rem 0 0;display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem}
/* Шапка главной собрана в свою плашку, чтобы отделяться от колец.
   Она в обычном потоке: прокручивается вместе со страницей. */
.header.head-card{padding:11px 12px 11px 16px;margin:.35rem 0 1.05rem;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,0.10);
  box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35)}
.head-card .back-btn{padding:6px 12px}
.ic{vertical-align:-3px;display:inline-block;flex-shrink:0}
.logo{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;cursor:pointer}
.head-greet{font-size:17px;font-weight:700;letter-spacing:-0.3px;color:var(--ink);cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.score-chip{background:#fff;color:#000001;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
.back-btn{background:none;border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:500;font-family:inherit;padding:6px 14px;border-radius:12px;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--ink2);color:var(--ink)}

.progress-section{margin-bottom:1.25rem}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.progress-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1)}

.mode-toggle{display:flex;background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:16px;padding:3px;margin-bottom:1.25rem;width:fit-content}
.mode-btn{padding:9px 18px;font-size:13px;font-weight:500;border:none;background:none;color:var(--ink2);border-radius:12px;cursor:pointer;transition:all .2s;font-family:inherit;min-height:38px}
.mode-btn.active{background:#fff;color:#000001}

.card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:20px;padding:1.75rem;margin-bottom:1rem}
.type-badge{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--blue-light);color:var(--blue);margin-bottom:1rem}
.q-cue{color:var(--ink3);font-weight:400}
.q-ru{font-size:24px;font-weight:600;line-height:1.3;color:var(--ink);margin-bottom:1.5rem;letter-spacing:-0.3px}
.pool-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:500;margin-bottom:7px}
.builder-answer{min-height:52px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:1rem;cursor:default;transition:border-color .2s,background .2s}
.builder-answer.has-content{border-style:solid;border-color:var(--ink2)}
.builder-answer.correct-state{border-color:var(--green);background:var(--green-light)}
.builder-answer.wrong-state{border-color:var(--red);background:var(--red-light)}
.placeholder{color:var(--ink3);font-size:14px}
.word-chip{padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;border:1px solid transparent;min-height:42px;display:inline-flex;align-items:center}
.word-chip.pool{background:var(--paper);border-color:var(--line);color:var(--ink)}
.word-chip.pool:hover{border-color:var(--ink2)}
.word-chip.selected{background:#fff;color:#000001}
.word-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.word-chip[data-src]{touch-action:none}
.word-chip.dragging{opacity:.22}
.drag-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;margin:0;box-shadow:0 10px 28px rgba(0,0,0,.45);transition:none}
.drop-caret{display:inline-block;width:3px;height:30px;border-radius:2px;background:var(--ink);opacity:.8;animation:caretBlink .9s ease-in-out infinite}
@keyframes caretBlink{0%,100%{opacity:.85}50%{opacity:.3}}
.builder-answer.drop-over{border-style:solid;border-color:var(--ink)}
.word-chip.hint-bounce{animation:hintHop 1.1s ease-in-out infinite;position:relative;z-index:1}
@keyframes hintHop{0%,55%,100%{transform:translateY(0)}20%{transform:translateY(-9px)}35%{transform:translateY(0)}45%{transform:translateY(-4px)}}
.builder-answer.hint-more{animation:shake .4s ease}
.hint-note{font-size:12.5px;color:var(--ink2);margin:-6px 0 4px 2px}
.alt-note{font-size:13px;color:var(--ink2);line-height:1.6;margin:4px 0 10px}
.alt-note code{background:none;border:none;padding:0;font-family:inherit;font-weight:600;color:var(--ink)}
.gset-preview{display:flex;justify-content:center;margin:2px 0 18px}
.gset-of{font-size:11px;color:var(--ink2);line-height:1.3;margin-top:2px}
.gset-now{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.gset-preview .rings-wrap{position:relative;flex-shrink:0}
.gset{padding:14px 0;border-top:1px solid var(--line)}
.gset:first-of-type{border-top:none;padding-top:4px}
.gset-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.gset-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.gset-name{font-size:14px;font-weight:600}
.gset-hint{font-size:12px;color:var(--ink3)}
.gset-row{display:flex;align-items:center;gap:12px}
.gset-btn{width:46px;height:46px;flex-shrink:0;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:24px;font-family:inherit;line-height:1;cursor:pointer;transition:all .15s}
.gset-btn:active{transform:scale(.94)}
.gset-btn:disabled{opacity:.3;cursor:default}
.gset-val{flex:1;text-align:center;line-height:1.15}
.gset-val b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.gset-val span{font-size:12px;color:var(--ink2)}
.rings-hero{cursor:pointer}
@media (prefers-reduced-motion:reduce){.word-chip.hint-bounce{animation:none;outline:2px solid var(--ink);outline-offset:2px}}
.text-input{width:100%;padding:14px 16px;font-size:16px;font-family:inherit;background:var(--bg);border:2px solid var(--line);border-radius:14px;color:var(--ink);outline:none;transition:border-color .2s;margin-bottom:1rem;min-height:50px}
.text-input:focus{border-color:var(--ink2)}
.text-input.correct-state{border-color:var(--green);background:var(--green-light)}
.text-input.wrong-state{border-color:var(--red);background:var(--red-light)}
.submit-btn{width:100%;padding:15px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#000001;border:none;border-radius:16px;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.01em;min-height:50px}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{--dim:.35;opacity:var(--dim);cursor:not-allowed}
.submit-btn.next{background:var(--green);color:#04150b}
.btn-row{display:flex;gap:10px}
.btn-row .submit-btn{flex:1}
.retry-btn{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.retry-btn:hover{border-color:var(--ink2)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}

.feedback{border-radius:16px;padding:1rem 1.25rem;margin-bottom:1rem;font-size:14px;line-height:1.6;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.feedback.ok{background:var(--green-light);border:1px solid #1d5c34;color:var(--green)}
.feedback.err{background:var(--red-light);border:1px solid #6b2525;color:var(--red)}
.feedback.v2{background:var(--amber-light);border:1px solid #6b5a10;color:var(--amber)}
.fb-title{font-weight:600;margin-bottom:5px}
.diff-view{font-size:15px;line-height:2;margin-top:8px}
.dw{padding:2px 4px;border-radius:6px;margin:0 1px}
.dw.correct{color:var(--green)}
.dw.missing{background:var(--red-light);color:var(--red);text-decoration:underline;text-decoration-style:wavy}
.dw.extra{background:#3a3010;color:#d9b64a;text-decoration:line-through}
.diff-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;opacity:.7}
.rule-box{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:13px;color:var(--ink2);line-height:1.65}
.rule-box b{color:var(--ink)}
.rule-box code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:12.5px;color:var(--blue)}
.why-list{margin:6px 0 0;padding-left:18px}
.why-list li{margin:4px 0}
.why-also{margin-top:8px}
.why-cmp{margin-top:9px;font-size:12.5px;line-height:1.8}
.why-cmp span{opacity:.6;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.why-rule{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
/* ─── появление экранов ───────────────────────────────
   Движение тут не украшение, а подсказка о направлении: глубже по иерархии —
   экран приходит справа, назад — уходит влево, на том же уровне просто
   поднимается. Внутри экрана (нажал слово, проверил ответ) не анимируем. */
@keyframes scFwd{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:var(--dim,1);transform:none}}
@keyframes scBack{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:var(--dim,1);transform:none}}
@keyframes scRise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:var(--dim,1);transform:none}}
@keyframes scFade{from{opacity:0}to{opacity:var(--dim,1)}}
/* Класс висит на самих объектах, а не на контейнере: перерисовка внутри экрана
   создаёт элементы уже без него — и ничего заново не дёргается. */
.sc-a{animation:scRise .36s cubic-bezier(.22,.78,.3,1) both;animation-delay:var(--sd,0s)}
.sc-a.sc-f{animation-name:scFwd}
.sc-a.sc-b{animation-name:scBack}
/* шапка не ездит вместе с содержимым — иначе прыгает логотип */
.sc-a.sc-h{animation:scFade .2s ease both;animation-delay:0s}
.pop-in{animation:scRise .3s cubic-bezier(.22,.78,.3,1) both}
/* Карточки, до которых человек ещё не долистал, ждут чуть уменьшенными и
   разворачиваются до полного размера, когда входят в кадр. Прозрачность
   возвращается к var(--dim), иначе «скоро» перестало бы быть приглушённым. */
.rv{opacity:0;transform:scale(.92) translate3d(0,10px,0);
  transition:opacity .4s cubic-bezier(.22,.78,.3,1),transform .52s cubic-bezier(.22,.78,.3,1)}
.rv.rv-in{opacity:var(--dim,1);transform:none}
@media (prefers-reduced-motion:reduce){
  .sc-a,.sc-a.sc-h,.pop-in{animation:none}
  .rv{opacity:var(--dim,1);transform:none;transition:none}
}
#chat-screen{display:flex;flex-direction:column;min-height:calc(100vh - 90px)}
.ch-in{animation:chOpen .34s cubic-bezier(.2,.8,.3,1) both;transform-origin:calc(100% - 46px) calc(100% - 46px)}
@keyframes chOpen{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}
.ch-in .ch-hero > *{animation:chRise .42s cubic-bezier(.2,.8,.3,1) both}
.ch-in .ch-hero-mark{animation-delay:.10s}
.ch-in .ch-hero-t{animation-delay:.16s}
.ch-in .ch-hero-d{animation-delay:.21s}
.ch-in .ch-tips{animation-delay:.26s}
@keyframes chRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ch-in,.ch-in .ch-hero > *{animation:none}}
.ch-fab{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right),var(--tg-right,0px));bottom:calc(18px + max(env(safe-area-inset-bottom),var(--tg-bottom,0px)));width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);background:rgba(255,255,255,0.10);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,0.16);box-shadow:0 6px 24px rgba(0,0,0,0.40);transition:transform .15s,opacity .2s}
.ch-fab:active{transform:scale(.93)}
.ch-fab.off{opacity:0;pointer-events:none;transform:scale(.8)}
body.light .ch-fab{background:rgba(255,255,255,0.94);border-color:rgba(0,0,0,0.14);box-shadow:0 2px 6px rgba(0,0,0,0.10),0 10px 28px rgba(0,0,0,0.18)}
.ch-switch{margin-bottom:8px;display:flex;width:100%}
.ch-switch .mode-btn{flex:1;gap:6px;white-space:nowrap}
.ch-sub{font-size:12.5px;color:var(--ink3);margin:0 0 16px 2px;min-height:17px}
/* приветствие — приглашение спросить, а не абзац текста */
.ch-hero{padding:22px 2px 6px;max-width:34em}
.ch-hero-mark{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  color:var(--ink);background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);margin-bottom:16px}
.ch-hero-t{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.25;margin-bottom:8px}
.ch-hero-d{font-size:14px;color:var(--ink2);line-height:1.65}
.ch-tips{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:20px}
.ch-tip{max-width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--ink);
  font-family:inherit;font-size:13.5px;line-height:1.45;padding:10px 14px;border-radius:14px;cursor:pointer;
  transition:border-color .18s,background .18s}
.ch-tip:hover{border-color:var(--ink2)}
.ch-tip:active{background:rgba(255,255,255,0.06)}
body.light .ch-hero-mark{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.10)}
body.light .ch-tip:active{background:rgba(0,0,0,0.04)}
.ch-body{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.ch-body.empty{justify-content:center;padding-bottom:30px}
.ch-msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.ch-msg.ai{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid var(--line);border-bottom-left-radius:5px}
.ch-msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
.ch-msg.me code{color:inherit}
.ch-msg code{background:none;border:none;padding:0;font-family:inherit;font-size:inherit;font-weight:600;color:var(--ink)}
.ch-msg.ai{color:var(--ink2)}
.ch-wait{display:flex;gap:5px;align-items:center;padding:15px 16px}
.ch-wait i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:chDot 1.1s ease-in-out infinite}
.ch-wait i:nth-child(2){animation-delay:.16s}
.ch-wait i:nth-child(3){animation-delay:.32s}
@keyframes chDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.ch-fix{display:inline-block;color:var(--green);font-weight:500}
.ch-say{display:block;margin-top:7px;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:9px;padding:3px 9px;cursor:pointer;line-height:0}
.ch-bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px 0 14px;background:var(--bg)}
.ch-inp{flex:1;resize:none;background:var(--card-bg,rgba(255,255,255,0.05));border:1px solid var(--line);border-radius:16px;color:var(--ink);font-family:inherit;font-size:15px;line-height:1.5;padding:12px 14px;max-height:140px;outline:none}
.ch-inp:focus{border-color:var(--ink2)}
.ch-inp::placeholder{color:var(--ink3)}
.ch-send{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:50%;background:var(--ink);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .15s}
.ch-send:active{transform:scale(.92)}
.ch-send:disabled,.ch-inp:disabled{opacity:.45;cursor:default}
body.light .ch-msg.ai{background:rgba(0,0,0,0.04)}
.play-big{display:block;margin:6px auto 10px;background:#fff;color:#000001;font-size:16px;font-weight:600;font-family:inherit;border:none;border-radius:16px;padding:16px 30px;cursor:pointer;min-height:54px;transition:transform .1s,opacity .2s}
.play-big:hover{opacity:.9}
.play-big:active{transform:scale(.97)}
.listen-hint{text-align:center;font-size:13px;color:var(--ink3);margin-bottom:1.25rem}
.listen-hint .again{display:block;margin-top:4px;opacity:.72;font-size:12px}
.voice-note{position:relative;margin:0 0 1.25rem;padding:12px 34px 12px 14px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;line-height:1.55;color:var(--ink2);background:var(--paper)}
.voice-note b{color:var(--ink);font-weight:600}
.voice-x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--ink3);font-size:18px;line-height:1;font-family:inherit;cursor:pointer;padding:4px 6px}
.voice-x:hover{color:var(--ink)}
.pron-res{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.listen-btn{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;font-family:inherit;padding:9px 16px;border-radius:12px;cursor:pointer;transition:all .2s;margin-top:10px}
.listen-btn:hover{border-color:var(--ink2)}
.listen-btn:active{transform:scale(.97)}

.complete{text-align:center;padding:3rem 1.5rem}
.complete-icon{margin-bottom:1rem;color:var(--ink)}
.complete-title{font-size:28px;font-weight:700;margin-bottom:.5rem;letter-spacing:-0.5px}
.complete-sub{color:var(--ink2);font-size:15px;margin-bottom:2rem;line-height:1.6}
.stats{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:1rem 1.5rem;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--ink)}
.stat-label{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.restart-btn{padding:14px 32px;font-size:15px;font-weight:600;font-family:inherit;background:#fff;color:#000001;border:none;border-radius:16px;cursor:pointer;min-height:50px}

/* ─── LESSON SELECTOR ─── */
.lessons-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin:0.5rem 0 0.25rem}
.lessons-sub{font-size:14px;color:var(--ink2);margin-bottom:1.5rem}
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson-card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:16px;padding:1.05rem 1.15rem;cursor:pointer;transition:border-color .2s,transform .1s;display:flex;align-items:center;gap:13px}
.lesson-card:hover{border-color:rgba(255,255,255,0.22)}
.lesson-card:active{transform:scale(.99)}
.lesson-card.done{border-color:rgba(74,222,128,0.35);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35),0 0 0 1px rgba(74,222,128,0.10)}
.lesson-num{width:38px;height:38px;line-height:0;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2);flex-shrink:0}
.lesson-card.done .lesson-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.lesson-info{flex:1;min-width:0}
.lesson-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
.lesson-sub{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.lesson-arrow{color:var(--ink3);font-size:16px;flex-shrink:0}

.modal-back{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1.25rem}
.modal-box{width:min(360px,100%);background:linear-gradient(160deg,rgba(38,38,38,0.98),rgba(22,22,22,0.98));border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:1.25rem;box-shadow:0 16px 48px rgba(0,0,0,0.55)}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-0.2px;margin-bottom:12px}
.modal-text{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-bottom:14px}
.modal-row{display:flex;gap:10px;margin-top:12px}
.modal-row .submit-btn{flex:1}
.modal-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.set-row{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.set-chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;color:var(--ink2);font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;cursor:pointer;min-height:36px;transition:all .15s}
.set-chip:hover{border-color:var(--ink2)}
.set-chip.on{background:#fff;color:#000001;border-color:#fff}
.set-chip.add{color:var(--ink3);border-style:dashed}
.imp-area{min-height:140px;resize:vertical;font-family:inherit;line-height:1.5;padding:12px 14px}
.imp-hint{font-size:12.5px;color:var(--ink3);line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.imp-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.imp-sum b{color:var(--ink);font-size:15px}
.my-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,0.06)}
.my-row:last-child{border-bottom:none}
.my-txt{flex:1;min-width:0}
.my-row .my-no{font-size:14.5px;font-weight:600;color:var(--ink)}
.my-row .my-ru{font-size:12.5px;color:var(--ink3);margin-top:2px}
.my-when{font-size:11px;color:var(--ink3);white-space:nowrap}
.my-del{background:none;border:none;color:var(--ink3);cursor:pointer;padding:6px;line-height:0}
.pl-time{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:7px}
.pl-track{height:6px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;cursor:pointer;margin-bottom:14px}
.pl-fill{height:100%;width:0;background:#fff;border-radius:3px}
.pl-row{display:flex;align-items:center;justify-content:center;gap:12px}
.pl-btn{min-width:52px;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.pl-btn:hover{border-color:var(--ink2)}
.pl-btn.on{background:#fff;color:#000001;border-color:#fff}
.pl-btn.on svg{color:#000001}
.pl-play{width:60px;height:60px;border-radius:50%;background:#fff;color:#000001;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pl-play:active{transform:scale(.96)}
.pl-pause{display:inline-block;width:16px;height:18px;border-left:5px solid #000001;border-right:5px solid #000001}
.dl-box{display:flex;flex-direction:column;gap:2px;padding:1rem .9rem}
.dl-line{padding:9px 11px;border-radius:12px}
.dl-no{font-size:15.5px;font-weight:600;line-height:1.45}
.dl-ru{font-size:13.5px;color:var(--ink3);margin-top:3px;line-height:1.4;display:none}
.dl-box.ru .dl-ru{display:block}
.cover{width:calc(100% + 2.5rem);margin:-1.15rem -1.25rem 14px;border-radius:18px 18px 0 0;overflow:hidden;line-height:0;background:var(--bg)}
.cover img{width:100%;height:auto;display:block;opacity:.92}
body.light .cover img{opacity:1;filter:invert(1) hue-rotate(180deg) brightness(1.05)}
.course-card{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.10);box-shadow:0 1px 0 rgba(255,255,255,0.09) inset,0 8px 28px rgba(0,0,0,0.35);border-radius:18px;padding:1.15rem 1.25rem;cursor:pointer;transition:border-color .2s,transform .1s}
.course-card:hover{border-color:rgba(255,255,255,0.22)}
.course-card:active{transform:scale(.99)}
.course-card.soon{--dim:.45;opacity:var(--dim);cursor:default}
.course-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.course-title{font-size:17px;font-weight:700;letter-spacing:-0.2px}
.course-pct{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.course-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.course-sub{font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.4}
.course-meta{font-size:12px;color:var(--ink3);margin-top:7px}
/* compact right-side progress on lesson cards */
.lesson-card.locked{--dim:.5;opacity:var(--dim)}
.block-card.locked{--dim:.5;opacity:var(--dim)}
.lesson-card.locked .lesson-num{background:var(--bg);border-color:var(--line);color:var(--ink3)}
.lesson-card.expired{border-color:rgba(251,191,36,0.38)}
.lesson-card.expired .lesson-num{background:var(--amber-light);border-color:#6b5a10;color:var(--amber)}
.lock-note{font-size:11.5px;color:var(--ink3);margin-top:3px}
.expire-note{font-size:11.5px;color:var(--amber);margin-top:3px}
.lesson-mini{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:64px}
.lesson-mini-bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.lesson-mini-fill{height:100%;background:#fff;border-radius:2px;transition:width .4s ease}
.lesson-card.done .lesson-mini-fill{background:var(--green)}
.lesson-mini-pct{font-size:11px;font-weight:600;color:var(--ink3)}
.lesson-card.done .lesson-mini-pct{color:var(--green)}
.fjord-banner{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;line-height:0}
.fjord-banner svg{width:100%;height:auto;display:block}
.footer{text-align:center;font-size:12px;color:var(--ink3);margin-top:2.25rem;line-height:1.7}
.foot-dot{margin:0 8px;opacity:.4}
.tour-link{display:inline-block;margin-bottom:10px;cursor:pointer}
.footer a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);transition:color .2s}
.footer a:hover{color:var(--ink)}
.daily{display:flex;flex-direction:column;gap:8px}
.daily-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2)}
.daily-streak{display:inline-flex;align-items:center;gap:6px}
.daily-streak.lit{color:var(--amber)}
.daily-goal{font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.daily-goal.hit{color:var(--green)}
.daily-bar{height:4px;background:rgba(255,255,255,0.10);border-radius:2px;overflow:hidden}
.daily-fill{height:100%;background:#fff;border-radius:2px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.daily-fill.hit{background:var(--green)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sg{background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.015));border:1px solid rgba(255,255,255,0.10);border-radius:14px;padding:12px 8px;text-align:center}
.sg-v{font-size:20px;font-weight:700;letter-spacing:-0.5px;font-variant-numeric:tabular-nums}
.sg-l{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.3}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.ht{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,0.06)}
.ht.l1{background:rgba(74,222,128,0.25)}
.ht.l2{background:rgba(74,222,128,0.45)}
.ht.l3{background:rgba(74,222,128,0.7)}
.ht.l4{background:var(--green)}
.heat-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:12px;font-size:10.5px;color:var(--ink3)}
.heat-legend .ht{width:12px;aspect-ratio:1}
.year-row{display:flex;gap:5px;align-items:flex-end}
.yr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.yr-bar-bg{width:100%;height:90px;display:flex;align-items:flex-end;background:rgba(255,255,255,0.05);border-radius:5px;overflow:hidden}
.yr-bar{width:100%;background:var(--ink2);border-radius:5px}
body.light .sg{background:linear-gradient(160deg,rgba(255,255,255,0.96),rgba(255,255,255,0.86));border-color:rgba(15,22,40,0.08)}
body.light .ht{background:rgba(15,22,40,0.07)}
body.light .yr-bar-bg{background:rgba(15,22,40,0.07)}

/* ─── градиент только как редкий акцент ─── */
/* главная кнопка экрана — единственное градиентное пятно в интерфейсе */
.submit-btn,.continue-btn,.restart-btn,.welcome-btn,.tour-next{
  background:var(--grad)!important;color:#fff!important;border:none!important;
  box-shadow:0 6px 22px rgba(114,60,235,0.28);
}
.submit-btn.retry-btn{background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none}
.submit-btn.next{background:var(--grad)!important}
.submit-btn:disabled{--dim:.35;opacity:var(--dim);box-shadow:none}
/* активные состояния — ровный фиолетовый */
.mode-btn.active{background:rgba(255,255,255,0.12)!important;color:var(--ink)!important;border-color:transparent!important}
.wd-chip.on,.set-chip.on,.goal-btn.on,.lang-btn.on,.pl-btn.on,.word-chip.selected{
  background:#ffffff!important;color:#fff!important;border-color:#ffffff!important;
}
.pl-play{background:#ffffff!important;color:#fff!important}
.score-chip{background:rgba(255,255,255,0.07)!important;color:var(--ink2)!important;border:1px solid var(--line)!important;font-weight:600}
/* плитки иконок — всегда нейтральные */
.lesson-num,.block-num{border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--ink2)}
.lesson-card.done .lesson-num,.block-card.full .block-num{background:var(--green-light);border-color:#1d5c34;color:var(--green)}
.lesson-card.locked .lesson-num,.block-card.locked .block-num{background:rgba(255,255,255,0.03);border-color:var(--line);color:var(--ink3)}
.exam-card .block-num{background:rgba(255,239,99,0.12);border-color:rgba(255,239,99,0.3);color:var(--ink2)}
/* полосы — ровный фиолетовый, зелёный при выполнении */
.progress-fill,.daily-fill,.lesson-mini-fill,.pl-fill,.part-bar-fill{background:#ffffff}
.daily-fill.hit,.lesson-card.done .lesson-mini-fill{background:var(--green)}
.wk-bar{background:rgba(255,255,255,0.14)}
.wk-bar.today{background:#ffffff}
.wk-bar.hit{background:var(--green)}
.yr-bar{background:#ffffff;opacity:.8}
/* тепловая карта — одна фиолетовая шкала */
.ht.l1{background:rgba(114,60,235,0.25)}
.ht.l2{background:rgba(114,60,235,0.45)}
.ht.l3{background:rgba(114,60,235,0.7)}
.ht.l4{background:#ffffff}
/* жёлтый — внимание */
.daily-streak.lit{color:var(--ink2)}
.plan-banner{background:rgba(255,239,99,0.10);border-color:rgba(255,239,99,0.28);color:var(--ink2)}
.lesson-card.expired{border-color:rgba(255,239,99,0.35)}
.expire-note{color:var(--ink2)}
.exam-card{border-color:rgba(255,239,99,0.22)}
body.light .score-chip{background:rgba(15,22,40,0.06);color:var(--ink)}
body.light .lesson-num,body.light .block-num{background:rgba(15,22,40,0.05);border-color:rgba(15,22,40,0.10)}
body.light .wk-bar{background:rgba(15,22,40,0.14)}
.ring-arc{transition:stroke-dashoffset 1.15s cubic-bezier(.22,.68,.32,1)}
.ring-arc.done{animation:ringPop .55s ease-out forwards}
@keyframes numIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes ringPop{
  0%{filter:none}
  45%{filter:drop-shadow(0 0 7px rgba(255,255,255,0.75))}
  100%{filter:none}
}
@media (prefers-reduced-motion: reduce){
  .ring-arc{transition:none}
  .ring-arc.done{animation:none}
}
.toast-ring{position:relative;width:40px;height:40px;flex-shrink:0}
.toast-chk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);opacity:0;animation:chkIn .34s .75s forwards ease-out}
@keyframes chkIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.toast{position:fixed;left:50%;top:calc(14px + max(env(safe-area-inset-top),var(--tg-top,0px)));transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:11px;min-width:270px;max-width:calc(100vw - 32px);
  background:linear-gradient(160deg,rgba(38,38,38,0.97),rgba(20,20,20,0.97));backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:12px 15px;
  box-shadow:0 12px 34px rgba(0,0,0,0.5);animation:toastIn .38s cubic-bezier(.2,.9,.3,1)}
.toast.out{animation:toastOut .42s ease-in forwards}
.toast-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-t{font-size:14px;font-weight:700;letter-spacing:-0.2px}
.toast-d{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.35}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.95)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-18px)}}
.allwin{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:awIn .3s ease-out}
.allwin canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.aw-box{position:relative;text-align:center;max-width:340px;width:100%}
.aw-rings{position:relative;width:150px;height:150px;margin:0 auto 20px}
.aw-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);animation:numIn .5s .5s both ease-out}
.aw-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:8px}
.aw-sub{font-size:14.5px;color:var(--ink2);line-height:1.55;margin-bottom:22px}
@keyframes awIn{from{opacity:0}to{opacity:1}}
body.light .toast{background:linear-gradient(160deg,#fff,#f4f5f7);border-color:rgba(15,22,40,0.12);box-shadow:0 12px 34px rgba(15,22,40,0.18)}
body.light .toast-ic{background:rgba(15,22,40,0.07)}
body.light .allwin{background:rgba(244,245,247,0.94)}
/* ─── дневные кольца ─── */
/* Кольца вынесены из карточки: внутри их всё равно резал бы backdrop-filter.
   Нижним краем они уходят за стекло, а при прокрутке липнут к верху экрана —
   карточка наезжает снизу и постепенно забирает их себе. */
/* В покое кольца видны целиком и ничем не закрыты, а плашки с цифрами стоят

.ring-rail{height:var(--ring);pointer-events:none}
/* Кольцо не липнет к верху экрана — оно просто отстаёт от страницы на 30%,
   и карточка снизу его догоняет. Так ничего не «замирает» в шапке. */
.rings-hero{position:relative;z-index:0;display:flex;justify-content:center;
  height:var(--ring);cursor:pointer;pointer-events:auto;
  transform:translateY(calc(var(--par,0) * 1px));
  /* Срез по верхней кромке карточки: ниже него кольцо плавно растворяется.
     Стекло полупрозрачное, и без среза кольцо читалось бы сквозь подписи. */
  --cut:100%;   /* до первого пересчёта кольцо видно целиком */
  -webkit-mask-image:linear-gradient(to bottom,#000 var(--cut),transparent calc(var(--cut) + 38px));
  mask-image:linear-gradient(to bottom,#000 var(--cut),transparent calc(var(--cut) + 38px))}

.rings-wrap{position:relative;width:var(--ring,200px);aspect-ratio:1;flex-shrink:0}
.rings-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.rings-big.long{font-size:clamp(30px,10vw,40px);letter-spacing:-1.2px}
.ring-lap{filter:drop-shadow(0 0 2px var(--bg)) drop-shadow(0 0 2px var(--bg)) drop-shadow(0 0 1px var(--bg))}
.lg-lap{margin-left:5px;font-size:11px;font-weight:700;opacity:.55;vertical-align:1px}
.rings-small{font-size:14.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* Свечение идёт от самой линии прогресса. Дорожка под дугой остаётся матовой,
   иначе кольцо превращается в пятно. */

/* Ореол — вторая копия дуги под основной, размытая двойной тенью. Дышит только

/* Подпись над значением: так три цели встают в строку даже на узком экране,
   а длинное «0 / 60 мин» не ломает плашку. */
.lg{position:absolute;display:grid;grid-template-columns:auto auto;
  grid-template-areas:"dot name" "val val";justify-content:center;align-content:center;
  align-items:center;column-gap:6px;row-gap:3px;white-space:nowrap;height:var(--chip,46px);
  font-size:clamp(11.5px,3.2vw,12.5px);padding:0 10px;
  /* Плашка почти непрозрачна: под ней проходит светящаяся дуга, и сквозь
     стекло цифры на ней не прочитались бы. */
  background:linear-gradient(165deg,rgba(28,28,31,0.95),rgba(17,17,19,0.93));
  border:1px solid rgba(255,255,255,0.13);border-radius:15px;
  box-shadow:0 8px 22px rgba(0,0,0,0.42);
  animation:chipIn .52s var(--d,0s) both cubic-bezier(.2,.8,.3,1)}
/* На дугу садится сама точка, а не плашка целиком: якорь смещён в центр точки
   (10px поля + половина кружка; по вертикали — середина строки с подписью).
   Доли радиуса те же, по которым рисуются дуги, поэтому точка всегда попадает

.lg:nth-child(2){--d:.09s;--dx:0.305;--dy:-0.2005} /* среднее, 33° */
.lg:nth-child(3){--d:.18s;--dx:-0.236;--dy:0.165}  /* внутреннее, 215° */
@keyframes chipIn{
  from{opacity:0;transform:translate(calc(0px - var(--ax)),calc(12px - var(--ay))) scale(.95)}

 hour we leave"},{"ru":"Поезд опаздывает на десять минут","no":"Toget er ti minutter forsinket","type":"present","en":"The train is ten minutes late"},{"ru":"Встреча длилась час","no":"Møtet varte i en time","type":"past","en":"The meeting lasted an hour"},{"ru":"Обычно я ложусь спать в одиннадцать","no":"Vanligvis legger jeg meg klokka elleve","type":"clock","en":"I usually go to bed at eleven"},{"ru":"В десять вечера я устал","no":"Klokka ti om kvelden er jeg sliten","type":"clock","en":"At ten in the evening I am tired"},{"ru":"Сколько сейчас времени в Норвегии?","no":"Hva er klokka i Norge nå?","type":"clock","en":"What time is it in Norway now?"},{"ru":"В сутках двадцать четыре часа","no":"Et døgn har tjuefire timer","type":"present","en":"A day has twenty-four hours"},{"ru":"В неделе семь дней","no":"Ei uke har sju dager","type":"present","en":"A week has seven days"},{"ru":"В году двенадцать месяцев","no":"Et år har tolv måneder","type":"present","en":"A year has twelve months"},{"ru":"Праздник был в прошлое воскресенье","no":"Festen var forrige søndag","type":"date","en":"The party was last Sunday"}],"t_en":"Klokka — telling the time"},{"t":"Дни · месяцы · сезоны","q":[{"ru":"Сегодня понедельник","no":"Det er mandag i dag","type":"date","en":"It is Monday today"},{"ru":"Завтра будет вторник","no":"I morgen er det tirsdag","type":"date","en":"Tomorrow is Tuesday"},{"ru":"Вчера была пятница","no":"I går var det fredag","type":"date","en":"Yesterday was Friday"},{"ru":"Мы отдыхаем в выходные","no":"Vi hviler i helga","type":"present","en":"We rest at the weekend"},{"ru":"Летом мы купаемся в море","no":"Om sommeren bader vi i havet","type":"date","en":"In summer we swim in the sea"},{"ru":"Зимой здесь темно","no":"Om vinteren er det mørkt her","type":"date","en":"In winter it is dark here"},{"ru":"Осенью идёт много дождя","no":"Om høsten regner det mye","type":"date","en":"In autumn it rains a lot"},{"ru":"Весной цветут цветы","no":"Om våren blomstrer blomstene" ru":"Я работаю над проектом (в процессе)","no":"Jeg holder på med et prosjekt","type":"progressive","en":"I am (busy) working on a project"},{"ru":"Он спит сейчас","no":"Han sover nå","type":"present","en":"He is sleeping now"},{"ru":"Мы сейчас выбираем подарок (в процессе)","no":"Vi holder på med å velge en gave","type":"progressive","en":"We are (busy) choosing a gift"},{"ru":"Она сейчас разговаривает по телефону","no":"Hun snakker i telefonen nå","type":"present","en":"She is talking on the phone now"},{"ru":"Дети сейчас рисуют (в процессе)","no":"Barna holder på med å tegne","type":"progressive","en":"The children are (busy) drawing"},{"ru":"Он сейчас бреется (в процессе)","no":"Han holder på med å barbere seg","type":"progressive","en":"He is (busy) shaving"},{"ru":"Мы сейчас завтракаем","no":"Vi spiser frokost nå","type":"present","en":"We are having breakfast now"},{"ru":"Она сейчас собирается на работу (в процессе)","no":"Hun holder på med å gjøre seg klar til jobb","type":"progressive","en":"She is (busy) getting ready for work"},{"ru":"Они сейчас переезжают (в процессе)","no":"De holder på med å flytte","type":"progressive","en":"They are (busy) moving"},{"ru":"Мы сейчас готовимся к экзамену (в процессе)","no":"Vi holder på med å forberede oss til eksamen","type":"progressive","en":"We are (busy) preparing for the exam"}],"t_en":"Work and study — holder på"},{"t":"Прошлое и вопросы","q":[{"ru":"Что ты сейчас делаешь? (в процессе)","no":"Hva holder du på med?","type":"progressive_q","en":"What are you (busy) doing?"},{"ru":"Я писал письмо, когда ты позвонил","no":"Jeg holdt på med å skrive et brev da du ringte","type":"progressive_past","en":"I was writing a letter when you called"},{"ru":"Он мыл посуду весь вечер","no":"Han holdt på med å vaske opp hele kvelden","type":"progressive_past","en":"He was doing the dishes all evening"},{"ru":"Что она сейчас делает? (в процессе)","no":"Hva holder hun på med?","type":"progressive_q","en":"What is she (busy) doing?"},{"ru":"Ты сейчас работаешь? (в процессе)","no":"Holder du på med å jobbe?","type":"progressive_q","en":"Are you (busy) working?"},{"ru":"Она мыла окна (те самые), когда я пришёл","no":"Hun holdt på med å vaske vinduene da jeg kom","type":"progressive_past","en":"She was washing the windows when I arrived"},{"ru":"Мы ели, когда они пришли","no":"Vi holdt på med å spise da de kom","type":"progressive_past","en":"We were eating when they arrived"},{"ru":"Что вы сейчас делаете? (в процессе)","no":"Hva holder dere på med?","type":"progressive_q","en":"What are you (busy) doing?"},{"ru":"Я учил норвежский, когда ты пришёл","no":"Jeg holdt på med å lære norsk da du kom","type":"progressive_past","en":"I was learning Norwegian when you arrived"},{"ru":"Ты чем занимался вчера? (в процессе)","no":"Hva holdt du på med i går?","type":"progressive_past","en":"What were you (busy) doing yesterday?"},{"ru":"Она готовила ужин, когда позвонил телефон","no":"Hun holdt på med å lage middag da telefonen ringte","type":"progressive_past","en":"She was making dinner when the phone rang"},{"ru":"Я делал уроки, когда она пришла","no":"Jeg holdt på med leksene da hun kom","type":"progressive_past","en":"I was doing my homework when she arrived"},{"ru":"Что ты делал, когда я позвонил? (в процессе)","no":"Hva holdt du på med da jeg ringte?","type":"progressive_past","en":"What were you (busy) doing when I called?"},{"ru":"Он читал газету, когда я вошёл","no":"Han holdt på med å lese avisa da jeg kom inn","type":"progressive_past","en":"He was reading the newspaper when I came in"},{"ru":"Ты сейчас готовишь? (в процессе)","no":"Holder du på med å lage mat?","type":"progressive_q","en":"Are you (busy) cooking?"},{"ru":"Мы смотрели телевизор, когда погас свет","no":"Vi holdt på med å se på TV da lyset gikk","type":"progressive_past","en":"We were watching TV when the lights went out"},{"ru":"Она училась, когда пришли гости","no":"Hun holdt på med å studere da gjestene kom","type":"progressiv rdi","en":"He stayed home because he didn't want to go out"},{"ru":"Она грустит, потому что её друг уехал","no":"Hun er trist fordi vennen hennes dro","type":"sub_fordi","en":"She is sad because her friend left"},{"ru":"Я ем сейчас, потому что я не ел утром","no":"Jeg spiser nå fordi jeg ikke spiste i morges","type":"sub_fordi","en":"I am eating now because I didn't eat this morning"},{"ru":"Она не пришла, потому что она забыла","no":"Hun kom ikke fordi hun glemte det","type":"sub_fordi","en":"She didn't come because she forgot"},{"ru":"Он устал, потому что он не спал ночью","no":"Han er sliten fordi han ikke sov i natt","type":"sub_fordi","en":"He is tired because he didn't sleep last night"},{"ru":"Мы дома, потому что дети больны","no":"Vi er hjemme fordi barna er syke","type":"sub_fordi","en":"We are home because the children are sick"},{"ru":"Она осталась, потому что она хотела помочь","no":"Hun ble fordi hun ville hjelpe","type":"sub_fordi","en":"She stayed because she wanted to help"},{"ru":"Я не иду, потому что у меня нет времени","no":"Jeg går ikke fordi jeg ikke har tid","type":"sub_fordi","en":"I am not going because I don't have time"},{"ru":"Я счастлив, потому что светит солнце","no":"Jeg er glad fordi sola skinner","type":"sub_fordi","en":"I am happy because the sun is shining"},{"ru":"Он не ест мясо, потому что он вегетарианец","no":"Han spiser ikke kjøtt fordi han er vegetarianer","type":"sub_fordi","en":"He doesn't eat meat because he is a vegetarian"},{"ru":"Я остался дома, потому что я не хотел идти","no":"Jeg ble hjemme fordi jeg ikke ville gå","type":"sub_fordi","en":"I stayed home because I didn't want to go"},{"ru":"Она не отвечает, потому что она занята","no":"Hun svarer ikke fordi hun er opptatt","type":"sub_fordi","en":"She is not answering because she is busy"},{"ru":"Мы ждём, потому что поезд не пришёл","no":"Vi venter fordi toget ikke kom","type":"sub_fordi","en":"We are waiting because the train didn't come"},{"ru":"Она дома, потому что школа закрыта","no":"Hun er hjemme fordi skolen er stengt","type":"sub_fordi","en":"She is home because the school is closed"},{"ru":"Он не пьёт кофе, потому что он не любит его","no":"Han drikker ikke kaffe fordi han ikke liker det","type":"sub_fordi","en":"He doesn't drink coffee because he doesn't like it"},{"ru":"Она улыбается, потому что она счастлива","no":"Hun smiler fordi hun er lykkelig","type":"sub_fordi","en":"She smiles because she is happy"},{"ru":"Мы не выходим, потому что очень холодно","no":"Vi går ikke ut fordi det er veldig kaldt","type":"sub_fordi","en":"We are not going out because it is very cold"},{"ru":"Мы рады, потому что вы пришли","no":"Vi er glade fordi dere kom","type":"sub_fordi","en":"We are glad because you came"},{"ru":"Он не спит, потому что он думает о работе","no":"Han sover ikke fordi han tenker på jobben","type":"sub_fordi","en":"He is not sleeping because he is thinking about work"},{"ru":"Она поёт, потому что она рада","no":"Hun synger fordi hun er glad","type":"sub_fordi","en":"She sings because she is happy"}],"t_en":"Fordi — because"},{"t":"At — что","q":[{"ru":"Она говорит, что она устала","no":"Hun sier at hun er sliten","type":"sub_at","en":"She says that she is tired"},{"ru":"Я знаю, что ты не спишь","no":"Jeg vet at du ikke sover","type":"sub_at","en":"I know that you are not sleeping"},{"ru":"Он сказал, что он не придёт","no":"Han sa at han ikke kommer","type":"sub_at","en":"He said that he is not coming"},{"ru":"Я думаю, что это хорошая идея","no":"Jeg tror at det er en god idé","type":"sub_at","en":"I think that it is a good idea"},{"ru":"Она знает, что я не говорю по-норвежски хорошо","no":"Hun vet at jeg ikke snakker norsk så bra","type":"sub_at","en":"She knows that I don't speak Norwegian very well"},{"ru":"Я говорю, что я не понимаю","no":"Jeg sier at jeg ikke forstår","type":"sub_at","en":"I say that I don't understand"},{"ru":"Ты знаешь, что она не живёт здесь?","no":"Vet du at hun ikke bor her?","type":"sub_at","en":"Do you know that she doesn't live here?"},{"ru":"Я думаю, что они не придут","no":"Jeg tror at de ikke kommer","type":"sub_at","en":"I think that they are not coming"},{"ru":"Мы знаем, что это не просто","no":"Vi vet at det ikke er enkelt","type":"sub_at","en":"We know that it is not easy"},{"ru":"Он говорит, что он не может прийти","no":"Han sier at han ikke kan komme","type":"sub_at","en":"He says that he cannot come"},{"ru":"Я рад, что ты здесь","no":"Jeg er glad for at du er her","type":"sub_at","en":"I am glad that you are here"},{"ru":"Я вижу, что ты не слушаешь","no":"Jeg ser at du ikke hører etter","type":"sub_at","en":"I see that you are not listening"},{"ru":"Она сказала, что она не любит рыбу","no":"Hun sa at hun ikke liker fisk","type":"sub_at","en":"She said that she doesn't like fish"},{"ru":"Я знаю, что он не работает по субботам","no":"Jeg vet at han ikke jobber på lørdager","type":"sub_at","en":"I know that he doesn't work on Saturdays"},{"ru":"Он думает, что это не важно","no":"Han tror at det ikke er viktig","type":"sub_at","en":"He thinks that it is not important"},{"ru":"Мы слышали, что вы переезжаете","no":"Vi hørte at dere flytter","type":"sub_at","en":"We heard that you are moving"},{"ru":"Он написал, что он не может встретиться","no":"Han skrev at han ikke kan møtes","type":"sub_at","en":"He wrote that he cannot meet"},{"ru":"Я надеюсь, что завтра не будет дождя","no":"Jeg håper at det ikke regner i morgen","type":"sub_at","en":"I hope that it doesn't rain tomorrow"},{"ru":"Она рада, что экзамен закончился","no":"Hun er glad for at eksamen er over","type":"sub_at","en":"She is glad that the exam is over"},{"ru":"Мы видим, что вы не готовы","no":"Vi ser at dere ikke er klare","type":"sub_at","en":"We see that you are not ready"},{"ru":"Он говорит, что он не знает её","no":"Han sier at han ikke kjenner henne","type":"sub_at","en":"He says that he doesn't know her"},{"ru":"Я понимаю, что это не легко","no":"Jeg forstår at det ikke er lett","type":"sub_at","en":"I understand that it is not easy"},{"ru":"Я знал, что ты не забудешь","no":"Jeg visste at du ikke ville glemme","type":"sub_at","en":"I knew that you would not forget"},{"ru":"Мы думаем, что это не проблема","no":"Vi tror at det ikke er et problem","type":"sub_at","en":"We think that it is not a problem"},{"ru":"Я слышал, что вы не едете","no":"Jeg hørte at dere ikke drar","type":"sub_at","en":"I heard that you are not leaving"},{"ru":"Он надеется, что она не сердится","no":"Han håper at hun ikke er sint","type":"sub_at","en":"He hopes that she is not angry"},{"ru":"Я вижу, что автобус не идёт","no":"Jeg ser at bussen ikke kommer","type":"sub_at","en":"I see that the bus is not coming"},{"ru":"Она сказала, что она не была там раньше","no":"Hun sa at hun ikke hadde vært der før","type":"perfect_neg","en":"She said that she had not been there before"},{"ru":"Я знаю, что ты сегодня работаешь","no":"Jeg vet at du jobber i dag","type":"sub_at","en":"I know that you are working today"},{"ru":"Он говорит, что правда важна","no":"Han sier at sannheten er viktig","type":"sub_at","en":"He says that the truth is important"}],"t_en":"At — that"},{"t":"Hvis — если","q":[{"ru":"Если будет дождь, мы останемся дома","no":"Hvis det regner, blir vi hjemme","type":"sub_hvis","en":"If it rains, we stay home"},{"ru":"Я останусь дома, если будет холодно","no":"Jeg blir hjemme hvis det er kaldt","type":"sub_hvis","en":"I stay home if it is cold"},{"ru":"Если ты не ешь, ты будешь голодным","no":"Hvis du ikke spiser, blir du sulten","type":"sub_hvis","en":"If you don't eat, you get hungry"},{"ru":"Если он не позвонит, я буду волноваться","no":"Hvis han ikke ringer, blir jeg bekymret","type":"sub_hvis","en":"If he doesn't call, I get worried"},{"ru":"Если погода будет хорошей, мы поедем в горы","no":"Hvis været er bra, drar vi til fjells","type":"sub_hvis","en":"If the weather is good, we go to the mountains"},{"ru":"Если ты не понимаешь, спроси меня","no":"Hvis du ikke forstår, spør meg","type":"sub_hvis","en":"If you don't understand, ask me"},{"ru":"Мы останемся, если вы хотите","no":"Vi blir hvis dere vil","type":"sub_hvis","en":"We will stay if you want"},{"ru":"Если автобус не придёт, мы пойдём пешком","no":"Hvis bussen ikke kommer, går vi til fots","type":"sub_hvis","en":"If the bus doesn't come, we walk"},{"ru":"Если я не приду, начинайте без меня","no":"Hvis jeg ikke kommer, begynn uten meg","type":"sub_hvis","en":"If I don't come, start without me"},{"ru":"Если она не спит, приведи её","no":"Hvis hun ikke sover, hent henne","type":"sub_hvis","en":"If she is not sleeping, bring her"},{"ru":"Она спрашивает, знаешь ли ты ответ (тот самый)","no":"Hun spør om du vet svaret","type":"sub_at","en":"She asks if you know the answer"},{"ru":"Мы поедем на автобусе, если пойдёт снег","no":"Vi tar bussen hvis det snør","type":"sub_hvis","en":"We take the bus if it snows"},{"ru":"Если ты не позвонишь, я буду ждать","no":"Hvis du ikke ringer, venter jeg","type":"sub_hvis","en":"If you don't call, I will wait"},{"ru":"Если будет солнечно, мы пойдём на пляж","no":"Hvis det er sol, går vi til stranda","type":"sub_hvis","en":"If it is sunny, we go to the beach"},{"ru":"Он спросил, не хочу ли я кофе","no":"Han spurte om jeg ikke ville ha kaffe","type":"sub_at","en":"He asked if I didn't want coffee"},{"ru":"Если ребёнок не спит, он плачет","no":"Hvis barnet ikke sover, gråter det","type":"sub_hvis","en":"If the child doesn't sleep, it cries"},{"ru":"Если я не ошибаюсь, сегодня среда","no":"Hvis jeg ikke tar feil, er det onsdag i dag","type":"sub_hvis","en":"If I am not mistaken, it is Wednesday today"},{"ru":"Если ты не спешишь, останься на ужин","no":"Hvis du ikke har det travelt, bli til middag","type":"sub_hvis","en":"If you are not in a hurry, stay for dinner"},{"ru":"Если она не знает, я объясню","no":"Hvis hun ikke vet, forklarer jeg","type":"sub_hvis","en":"If she doesn't know, I will explain"},{"ru":"Мы знаем, что зима не вечна","no":"Vi vet at vinteren ikke varer evig","type":"sub_at","en":"We know that winter does not last forever"},{"ru":"Я думаю, что мы не опоздаем","no":"Jeg tror at vi ikke kommer for sent","type":"sub_at","en":"I think that we will not be late"}],"t_en":"Hvis — if"},{"t":"Og · Men · Eller — соединяем","t_en":"Og · Men · Eller — joining","q":[{"ru":"Я ем и пью","no":"Jeg spiser og drikker","type":"conj_og","en":"I eat and drink"},{"ru":"Она работает и учится","no":"Hun jobber og studerer","type":"conj_og","en":"She works and studies"},{"ru":"Я встаю и готовлю завтрак","no":"Jeg står opp og lager frokost","type":"conj_og","en":"I get up and make breakfast"},{"ru":"Он открыл дверь и вошёл","no":"Han åpnet døra og gikk inn","type":"conj_og","en":"He opened the door and went in"},{"ru":"Вчера я купил книгу и прочитал её","no":"I går kjøpte jeg ei bok og leste den","type":"conj_og","en":"Yesterday I bought a book and read it"},{"ru":"Мы пьём кофе и говорим о работе","no":"Vi drikker kaffe og snakker om jobben","type":"conj_og","en":"We drink coffee and talk about work"},{"ru":"Я готовлю ужин, а ты убираешь","no":"Jeg lager middag, og du rydder","type":"conj_og","en":"I make dinner, and you tidy up"},{"ru":"Вчера шёл дождь, и мы остались дома","no":"Det regnet i går, og vi ble hjemme","type":"conj_og","en":"It rained yesterday, and we stayed home"},{"ru":"Дети играют и купаются","no":"Barna leker og bader","type":"conj_og","en":"The children are playing and swimming"},{"ru":"Она едет на автобусе и приезжает домой в пять","no":"Hun tar bussen og kommer hjem klokka fem","type":"conj_og","en":"She takes the bus and comes home at five"},{"ru":"Я устал, но мне надо работать","no":"Jeg er sliten, men jeg må jobbe","type":"conj_men","en":"I am tired, but I have to work"},{"ru":"Она больна, но хочет идти в школу","no":"Hun er syk, men hun vil gå på skolen","type":"conj_men","en":"She is sick, but she wants to go to school"},{"ru":"Мы долго ждали, но автобус не пришёл","no":"Vi vent   negative_past_v2: "<b>Отрицание + V2 (прош.):</b> <code>I går så vi deg ikke</code> — " +

  negative_future: "<b>Отрицание будущего:</b> <code>ikke</code> ставится между <code>skal</code> и смысловым глаголом: " +

  future: "<b>Будущее время:</b> <code>skal</code> + инфинитив без å: " +

  future_v2: "<b>Будущее + V2:</b> обстоятельство → <code>skal</code> → подлежащее: " +

  question: "<b>Вопрос без вопросительного слова:</b> глагол на 1-м месте: " +
    "<code>Snakker du norsk?</code> — «Говоришь ты по-норвежски?»",
  question_present: "<b>Вопрос:</b> вопросительное слово → глагол → подлежащее: " +
    "<code>Hvor bor du?</code> Или глагол первым: <code>Bor dere i Norge?</code>",
  question_past: "<b>Вопрос в прошедшем:</b> та же схема, глагол в preteritum: " +
    "<code>Kjøpte du det?</code>, <code>Hvor var du i går?</code>",
  question_future: "<b>Вопрос о будущем:</b> <code>skal</code> перед подлежащим: " +
    "<code>Skal du spise?</code>, <code>Når skal du spise?</code>",
  question_present_negative: "<b>Вопрос с отрицанием:</b> вопросительное слово → глагол → подлежащее → <code>ikke</code>: " +
    "<code>Hvorfor spiser du ikke fisk?</code>",
  question_past_negative: "<b>Вопрос-отрицание (прош.):</b> <code>Hvorfor ringte du meg ikke?</code> — " +
    "ikke идёт после объекта-местоимения.",
  imperative: "<b>Повелительное наклонение:</b> берём инфинитив и отбрасываем окончание: <code>å høre → Hør!</code>, <code>å komme → Kom!</code> Никакого <code>-r</code>, глагол стоит первым, подлежащее не нужно.",
  imperative_neg: "<b>Запрет:</b> <code>ikke</code> ставится <b>перед</b> глаголом: <code>Ikke åpne døra!</code> Это тот редкий случай, когда <code>ikke</code> идёт впереди, а не после глагола.",
  polite: "<b>Вежливая просьба:</b> <code>Kan du …?</code> мягче приказа, <code>Kunne du …?</code> — ещё мягче. После модального глагола инфинитив без <code>å</code>: <code>Kan du hjelpe meg?</code>",
  perfect: "<b>Перфект:</b> <code>har</code> + причастие: <code>Jeg har spist</code>. Говорит о результате, который важен сейчас. Сравни с preteritum: <code>Jeg spiste i går</code> — просто факт в прошлом.",
  perfect_q: "<b>Вопрос в перфекте:</b> <code>har</code> выходит на 1-е место, причастие остаётся в конце: <code>Har du spist?</code>",
  perfect_neg: "<b>Отрицание в перфекте:</b> <code>ikke</code> встаёт между <code>har</code> и причастием: <code>Jeg har ikke spist</code>. Так же ведёт себя <code>aldri</code>: <code>Jeg har aldri vært i Bergen</code>.",
  modal: "<b>Модальный глагол</b> + инфинитив <b>без</b> <code>å</code>: <code>Jeg kan svømme</code>, <code>Han må jobbe</code>. Сам модальный не получает <code>-r</code>.",
  modal_q: "<b>Вопрос с модальным:</b> модальный глагол на 1-м месте, смысловой — в инфинитиве: <code>Kan du hjelpe meg?</code>, <code>Må vi gå nå?</code>",
  modal_neg: "<b>Отрицание с модальным:</b> <code>ikke</code> сразу после модального, перед инфинитивом: <code>Jeg kan ikke sove</code>.",
  modal_past: "<b>Модальные в прошедшем:</b> <code>kan → kunne</code>, <code>vil → ville</code>, <code>må → måtte</code>, <code>skal → skulle</code>. Дальше всё так же — инфинитив без <code>å</code>.",
  sub_fordi: "<b>Fordi — «потому что»:</b> вводит придаточное. Главное отличие: <code>ikke</code> встаёт <b>перед</b> глаголом — <code>… fordi jeg ikke jobber</code>, а не после, как в обычном предложении.",
  sub_at: "<b>At — «что»:</b> <code>Hun sier at hun er sliten</code>. Порядок прямой: подлежащее → глагол. В отличие от русского «что», <code>at</code> выбрасывать нельзя.",
  sub_hvis: "<b>Hvis — «если»:</b> когда условие стоит первым, главное предложение начинается с глагола: <code>Hvis det regner, blir vi hjemme</code> — работает правило V2.",
  progressive: "<b>Процесс:</b> <code>holder på med å</code> + инфинитив — «сейчас занят тем, что…»: <code>Jeg holder på med å lage middag</code>. Отдельной формы «делаю прямо сейчас» в норвежском нет, её заменяет эта конструкция.",
  progressive_past: "<b>Процесс в прошлом:</b> <code>holdt på med å</code>: <code>Jeg holdt på med å skrive da du ringte</code> — одно действие длилось, другое его прервало.",
  progressive_q: "<b>Вопрос о процессе:</b> <code>Hva holder du på med?</code> — «чем ты занят?». <code>med</code> остаётся в конце.",
  comparative: "<b>Сравнительная степень:</b> окончание <code>-ere</code> и <code>enn</code> перед тем, с чем сравниваем: <code>finere enn</code>. Частые исключения: <code>god → bedre</code>, <code>stor → større</code>, <code>liten → mindre</code>.",
  superlative: "<b>Превосходная степень:</b> окончание <code>-est</code>: <code>finest</code>, <code>størst</code>, <code>best</code>. После <code>er</code> артикль не нужен: <code>Han er størst</code>.",
  comparative_q: "<b>Вопрос-сравнение:</b> <code>Hvem er størst?</code>, <code>Er dette bedre enn det?</code> Схема обычная: в вопросе без вопросительного слова глагол идёт первым.",
  det_er: "<b>Det er — «есть, имеется»:</b> <code>det</code> здесь пустое и не переводится: <code>Det er en bil her</code> — «здесь есть машина». После <code>det er</code> существительное обычно в неопределённой форме.",
  det_er_q: "<b>Вопрос с det er:</b> глагол первым, <code>det</code> за ним: <code>Er det en butikk her?</code>",
  det_er_neg: "<b>Отрицание:</b> <code>Det er ikke …</code>. Вместо <code>ikke en</code> чаще говорят <code>ingen</code>: <code>Det er ingen buss her</code>.",
  det_var: "<b>Det var — «было»:</b> та же пустая конструкция в прошедшем: <code>Det var et stort hus der</code>.",
  finnes: "<b>Finnes — «существует»:</b> о наличии вообще, тогда как <code>det er</code> — о наличии здесь: <code>Det finnes en gammel tradisjon</code>. Форма одна для всех лиц.",
  gender_en: "<b>Общий род (en):</b> неопределённая форма — <code>en bil</code>, определённая — окончание <code>-en</code>: <code>bilen</code>. Отдельного слова «the» в норвежском нет, определённость уходит в окончание.",
  gender_et: "<b>Средний род (et):</b> <code>et hus → huset</code>. Прилагательное тоже меняется: <code>et stort hus</code>, <code>huset er stort</code>.",
  gender_ei: "<b>Женский род (ei):</b> <code>ei bok → boka</code>. Почти всегда допустим и общий род (<code>en bok → boken</code>), но форма на <code>-a</code> звучит обиходнее.",
  poss: "<b>Притяжательное:</b> в живой речи стоит <b>после</b> существительного, а само существительное — в определённой форме: <code>huset mitt</code>. Форма зависит от рода: <code>bilen min</code>, <code>huset mitt</code>, <code>bøkene mine</code>.",
  poss_hans: "<b>Hans и hennes</b> — «его» и «её», когда владелец <b>не</b> подлежащее: <code>hunden hans</code> — собака того мужчины, о котором речь.",
  poss_sin: "<b>Sin / sitt / sine</b> — «свой», когда владелец и есть подлежащее: <code>Han snakker med faren sin</code> — со своим отцом. А <code>faren hans</code> — с чужим.",
  prep_place: "<b>I или på:</b> <code>i</code> — внутри (<code>i huset</code>, <code>i Norge</code>), <code>på</code> — на поверхности и в заведениях (<code>på bordet</code>, <code>på skolen</code>, <code>på jobb</code>). Место после предлога обычно в определённой форме.",
  prep_til: "<b>Til — направление «куда»:</b> <code>Jeg går til butikken</code>. С городами и странами тоже <code>til</code>: <code>til Bergen</code>, <code>til Norge</code>.",
  prep_fra: "<b>Fra — «откуда»:</b> <code>Han kom fra Bergen</code>. Пара к <code>til</code>: <code>fra … til …</code>.",
  quantity: "<b>Mange или mye:</b> <code>mange</code> — со счётными во множественном (<code>mange venner</code>), <code>mye</code> — с несчётным (<code>mye vann</code>). Так же <code>få</code> — мало счётных, <code>litt</code> — немного несчётного.",
  quantity_q: "<b>Сколько:</b> <code>Hvor mange?</code> — о счётном, <code>Hvor mye?</code> — о несчётном: <code>Hvor mye koster det?</code>",
  clock: "<b>Который час:</b> <code>Klokka er åtte</code>. Половина считается <b>к следующему</b> часу: <code>halv åtte</code> — это 7:30, а не 8:30.",
  date: "<b>Дни и месяцы</b> пишутся с маленькой буквы: <code>mandag</code>, <code>mai</code>. «В понедельник» — <code>på mandag</code>, «летом» — <code>om sommeren</code>.",
  num: "<b>Числа:</b> начиная с 21 сначала называют единицы: <code>tjueen</code>, <code>trettifem</code>. После числа существительное идёт во множественном и без артикля: <code>to søstre</code>.",
  price: "<b>Цена:</b> <code>Det koster tjue kroner</code>, вопрос — <code>Hvor mye koster det?</code> Валюта всегда во множественном: <code>kroner</code>.",
  phrasal: "<b>Фразовый глагол:</b> частица меняет смысл и уходит в конец: <code>se ut</code> — выглядеть, <code>stå opp</code> — вставать, <code>passe på</code> — присматривать. По частям такие глаголы не переводятся.",
  conj_og: "<b>Og — «и»:</b> соединяет два действия. При одном подлежащем второе подлежащее не повторяют: <code>Jeg spiser og drikker</code>. После модального глагола второй глагол остаётся в инфинитиве без <code>å</code>: <code>Jeg skal dra til Oslo og gå tur</code>. Если у второй части своё подлежащее, перед <code>og</code> ставится запятая: <code>Jeg lager middag, og du rydder</code>.",
  conj_men: "<b>Men — «но»:</b> соединяет две равноправные части, и в каждой обычный порядок слов — подлежащее, потом глагол: <code>Jeg er sliten, men jeg må jobbe</code>. В отличие от <code>fordi</code>, <code>men</code> ничего не переставляет и не двигает <code>ikke</code>. Перед <code>men</code> — запятая.",
  conj_eller: "<b>Eller — «или»:</b> даёт выбор. Между однородными словами запятая не нужна: <code>te eller kaffe</code>. В вопросе выбор идёт в конце, после глагола и подлежащего: <code>Skal vi gå eller ta bussen?</code>",
  plan: "<b>Планы:</b> <code>skal</code> + инфинитив без <code>å</code>. «В выходные» — <code>i helga</code>, «в субботу» — <code>på lørdag</code>, «на следующей неделе» — <code>neste uke</code>. Когда время стоит в начале, глагол идёт сразу за ним: <code>I helga skal jeg hvile</code>.",
};

  quantity: "<b>Mange or mye:</b> <code>mange</code> with countable plurals, <code>mye</code> with uncountables. Likewise <code>få</code> and <code>litt</code>.",

function isDefOf(ind,def){
  if(NOUN_IRR[ind] && NOUN_IRR[ind].d===def) return true;
  if(def===ind+"en"||def===ind+"et"||def===ind+"a") return true;
  if(ind.slice(-1)==="e" && (def===ind+"n"||def===ind+"t"||def===ind.slice(0,-1)+"a")) return true;
  return false;
}
function isPlurOf(sg,pl){
  if(NOUN_IRR[sg] && NOUN_IRR[sg].p===pl && pl!==sg) return true;
  return pl===sg+"er" || (sg.slice(-1)==="e" && pl===sg+"r");
}
function isPlurDefOf(sg,pd){
  if(NOUN_IRR[sg] && NOUN_IRR[sg].pd===pd) return true;
  return pd===sg+"ene" || (sg.slice(-1)==="e" && pd===sg+"ne");
}
function nounRel(uw,cw){
  if(isDefOf(uw,cw)) return "noun_def";
  if(isDefOf(cw,uw)) return "noun_indef";
  if(isPlurOf(uw,cw)) return "noun_plur";
  if(isPlurOf(cw,uw)) return "noun_sing";
  if(isPlurDefOf(uw,cw)) return "noun_plurdef";
  if(isPlurDefOf(cw,uw)) return "noun_plurindef";
  return null;
}
function lev(a,b){
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9;
  let prev=Array.from({length:n+1},function(_,j){return j;});
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
function deAccent(s){ return s.replace(/æ/g,"a").replace(/ø/g,"o").replace(/å/g,"a"); }
function pairRelated(a,b){
  if(PRON_CASE[a]===b) return true;
  const va=VERB_FORM[a],vb=VERB_FORM[b]; if(va&&vb&&va[0]===vb[0]) return true;
  if(nounRel(a,b)) return true;
  const aa=ADJ_FORM[a],ab=ADJ_FORM[b]; if(aa&&ab&&aa[0]===ab[0]) return true;
  const da=DEG_FORM[a],db=DEG_FORM[b]; if(da&&db&&da[0]===db[0]) return true;
  if(ART.has(a)&&ART.has(b)) return true;
  if(lev(a,b)<=1 && Math.max(a.length,b.length)>3) return true;
  return false;
}

function alignOps(a,b){
  const m=a.length,n=b.length;
  const cost=function(i,j){ return a[i]===b[j] ? 0 : (pairRelated(a[i],b[j]) ? 0.55 : 1.05); };
  const d=[]; for(let i=0;i<=m;i++){ d.push(new Array(n+1).fill(0)); d[i][0]=i; }
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost(i-1,j-1));
  const ops=[]; let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&Math.abs(d[i][j]-(d[i-1][j-1]+cost(i-1,j-1)))<1e-9){
      ops.unshift(a[i-1]===b[j-1] ? {op:"eq",u:a[i-1],c:b[j-1]} : {op:"sub",u:a[i-1],c:b[j-1]});
      i--; j--; continue;
    }
    if(i>0&&Math.abs(d[i][j]-(d[i-1][j]+1))<1e-9){ ops.unshift({op:"extra",u:a[i-1]}); i--; continue; }
    ops.unshift({op:"miss",c:b[j-1]}); j--;
  }
  return ops;
}

function finiteIdx(w){
  for(let i=0;i<w.length;i++){
    if(i>0 && w[i-1]==="i" && (w[i]==="går"||w[i]==="fjor")) continue; // «i går» — не глагол
    if(FINITE.has(w[i])) return i;
    const v=VERB_FORM[w[i]];
    if(v&&(v[1]===1||v[1]===2)) return i;
  }
  return -1;
}
